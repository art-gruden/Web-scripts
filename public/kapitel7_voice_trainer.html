<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Kapitel 7 — Голосовий словник</title>
<style>
  :root{
    --bg:#12141a;
    --panel:#1b1e27;
    --panel2:#20242f;
    --accent:#5fb8a8;
    --accent2:#e0a860;
    --text:#e8e6e0;
    --muted:#8890a0;
    --border:#2c2f3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    padding:24px 20px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
  }
  h1{
    font-size:1.3rem;
    margin:0 0 4px;
    letter-spacing:0.3px;
  }
  .sub{
    color:var(--muted);
    font-size:0.85rem;
  }
  .controls{
    display:flex;
    gap:8px;
    padding:14px 20px;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
  }
  .catbtn{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    font-size:0.85rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .catbtn.active{
    background:var(--accent);
    color:#0d0f13;
    border-color:var(--accent);
    font-weight:600;
  }
  .settings{
    display:flex;
    gap:14px;
    padding:10px 20px;
    font-size:0.8rem;
    color:var(--muted);
    align-items:center;
    flex-wrap:wrap;
  }
  .settings label{display:flex;align-items:center;gap:6px;}
  .playall{
    margin:16px 20px;
    display:flex;
    gap:10px;
  }
  .playall button{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
  }
  #startAll{background:var(--accent);color:#0d0f13;}
  #stopAll{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .list{
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:background 0.2s, border-color 0.2s;
  }
  .card.playing{
    border-color:var(--accent);
    background:var(--panel2);
  }
  .word-de{
    font-size:1.05rem;
    font-weight:600;
  }
  .word-uk{
    font-size:0.85rem;
    color:var(--muted);
    margin-top:3px;
  }
  .tag{
    font-size:0.65rem;
    color:var(--bg);
    background:var(--accent2);
    padding:2px 7px;
    border-radius:8px;
    font-weight:700;
    margin-right:6px;
  }
  .playbtn{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--accent);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .playbtn:active{
    background:var(--accent);
    color:#0d0f13;
  }
  .progress{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:10px 20px;
    font-size:0.8rem;
    color:var(--muted);
    text-align:center;
    display:none;
  }
  .progress.show{display:block;}
</style>
</head>
<body>

  <h1>🗣️ Kapitel 7 — Голосовий словник</h1>
  <div class="sub">Wichtige Wörter · синтез мовлення для тренування вимови</div>
</header>

<div class="controls" id="catControls"></div>

  </label>
  <label><input type="checkbox" id="withUk" checked> озвучувати переклад</label>
</div>

<div class="playall">
  <button id="startAll">▶ Слухати всі по черзі</button>
  <button id="stopAll">■ Стоп</button>
</div>

<div class="list" id="list"></div>

<div class="progress" id="progress"></div>

", "uk": "здатність до співпраці"}, {"category": "C", "de": "Kritik üben", "uk": "критикувати"}, {"category": "C", "de": "die Kundenorientierung", "uk": "орієнтація на клієнта"}, {"category": "C", "de": "locker", "uk": "невимушений"}, {"category": "C", "de": "offen", "uk": "відкритий"}, {"category": "C", "de": "Protokoll führen", "uk": "вести протокол"}, {"category": "C", "de": "die Rückmeldung", "uk": "зворотний зв'язок"}, {"category": "C", "de": "Vereinbarungen treffen", "uk": "досягати домовленостей"}, {"category": "C", "de": "das Verhalten", "uk": "поведінка"}, {"category": "C", "de": "vertraulich", "uk": "конфіденційний"}, {"category": "C", "de": "das Zielvereinbarungsgespräch", "uk": "розмова про постановку цілей"}, {"category": "C", "de": "zur Sprache kommen", "uk": "бути порушеним, обговорюваним"}, {"category": "D", "de": "die stationäre Altenpflege", "uk": "стаціонарний догляд за літніми"}, {"category": "D", "de": "die Arbeitsbelastung", "uk": "робоче навантаження"}, {"category": "D", "de": "etwas ausgleichen", "uk": "компенсувати, вирівнювати"}, {"category": "D", "de": "etwas aushandeln", "uk": "узгоджувати шляхом переговорів"}, {"category": "D", "de": "belastend", "uk": "обтяжливий"}, {"category": "D", "de": "berechtigt", "uk": "обґрунтований, правомірний"}, {"category": "D", "de": "die Betriebsvereinbarung", "uk": "виробнича угода"}, {"category": "D", "de": "etwas bewilligen", "uk": "схвалювати, дозволяти"}, {"category": "D", "de": "destruktiv", "uk": "деструктивний"}, {"category": "D", "de": "die Einschätzung", "uk": "оцінка"}, {"category": "D", "de": "sich einschleichen", "uk": "прокрадатися, про помилку"}, {"category": "D", "de": "die Entlastung", "uk": "розвантаження"}, {"category": "D", "de": "die Fachkraft", "uk": "фахівець"}, {"category": "D", "de": "jemandem sind die Hände gebunden", "uk": "у когось зв'язані руки"}, {"category": "D", "de": "gehetzt", "uk": "заквапленний, під тиском"}, {"category": "D", "de": "der Gesundheitsschutz", "uk": "охорон самітнюватися, відсторонюватися від"}];

const categoryNames = {
  A: "A · Проблеми",
  B: "B · Гігієна",
  C: "C · Розмови",
  D: "D · Критика",
  E: "E · Конфлікти"
};

let currentFilter = "ALL";
let playQueue = [];
let playIndex = 0;
let isPlayingAll = false;

const catControls = document.getElementById('catControls');
const listEl = document.getElementById('list');
const progressEl = document.getElementById('progress');
const rateInput = document.getElementById('rate');
const withUkInput = document.getElementById('withUk');

function buildCategoryButtons(){
  const cats = ["ALL", ...Object.keys(categoryNames)];
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'catbtn' + (c === currentFilter ? ' active' : '');
    btn.textContent = c === "ALL" ? "Усі" : categoryNames[c];
    btn.onclick = () => {
      currentFilter = c;
      document.querySelectorAll('.catbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    };
    catControls.appendChild(btn);
  });
}

function speak(text, lang, onEnd){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = parseFloat(rateInput.value);
  u.onend = onEnd || null;
  window.speechSynthesis.speak(u);
}

function renderList(){
  listEl.innerHTML = '';
  const filtered = currentFilter === "ALL" ? data : data.filter(d => d.category === currentFilter);
  filtered.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item._id;
    card.innerHTML = `
      <div>
        <span class="tag">${item.category}</span>
        <div class="word-de">${item.de}</div>
        <div class="word-uk">${item.uk}</div>
      </div>
      <button class="playbtn" aria-label="Слухати">▶</button>
    `;
    card.querySelector('.playbtn').onclick = () => playOne(item, card);
    listEl.appendChild(card);
  });
}

function playOne(item, card){
  window.speechSynthesis.cancel();
  card.classList.add('playing');
  speak(item.de, 'de-DE', () => {
    if(withUkInput.checked){
      speak(item.uk, 'uk-UA', () => card.classList.remove('playing'));
    } else {
      card.classList.remove('playing');
    }
  });
}

function startAll(){
  window.speechSynthesis.cancel();
  playQueue = currentFilter === "ALL" ? data : data.filter(d => d.category === currentFilter);
  playIndex = 0;
  isPlayingAll = true;
  progressEl.classList.add('show');
  playNext();
}

function playNext(){
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
  if(!isPlayingAll || playIndex >= playQueue.length){
    isPlayingAll = false;
    progressEl.classList.remove('show');
    return;
  }
  const item = playQueue[playIndex];
  const card = document.getElementById('card-' + item._id);
  if(card){
    card.classList.add('playing');
    card.scrollIntoView({behavior:'smooth', block:'center'});
  }
  progressEl.textContent = `${playIndex + 1} / ${playQueue.length} · ${item.de}`;

  speak(item.de, 'de-DE', () => {
    if(withUkInput.checked){
      speak(item.uk, 'uk-UA', () => {
        playIndex++;
        playNext();
      });
    } else {
      playIndex++;
      playNext();
    }
  });
}

function stopAll(){
  isPlayingAll = false;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
  progressEl.classList.remove('show');
}

document.getElementById('startAll').onclick = startAll;
document.getElementById('stopAll').onclick = stopAll;

data.forEach((d, i) => d._id = i);
buildCategoryButtons();
renderList();
</script>
