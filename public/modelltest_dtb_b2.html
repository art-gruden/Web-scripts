<script>
const DATA = {"sections": [{"id": "lesen", "title": "Lesen", "minutes": 45, "parts": [{"id": "l1", "title": "Lesen Teil 1", "instruction": "Sie lesen online in einer Wirtschaftszeitung und möchten Ihren Freunden einige Artikel schicken. Entscheiden Sie, welcher Artikel a–h zu welcher Person 1–5 passt.", "choices": ["a", "b", "c", "d", "e", "f", "g", "h"], "texts": ["<p><b>a · Eine neue Stelle</b><br>Bevor man eine neue Stelle annimmt, gibt es vieles zu beachten. Welche Regelungen gelten bei der Kündigung der jetzigen Stelle? Wie verhält es sich mit den Kündigungsfristen? Hier finden Sie alle Informationen.</p>", "<p><b>b · Aus- und Weiterbildung im Handwerk</b><br>Handwerksberufe haben Zukunft. Voraussetzung ist, dass man sich regelmäßig weiterqualifiziert. Eine Übersicht über die 130 Ausbildungsberufe und Weiterbildungsmöglichkeiten gibt es hier. Auch in Ihrer Region.</p>", "<p><b>c · Anerkennung von ausländischen Zeugnissen und Qualifikationen</b><br>Für viele ausländische Hochschulabschlüsse braucht man keine Anerkennung. Eine Bewertung des Abschlusses kann aber die Erfolgschancen bei der Jobfindung verbessern. Alle Informationen hierzu findet man auf www.beispiel.de/anerkennung-in-Deutschland.</p>", "<p><b>d · Lernen zu Hause besser strukturieren</b><br>Die meisten Prüfungsvorbereitungen finden in den eigenen vier Wänden statt. Aber wie funktioniert gutes Zeitmanagement? Wie achtet man auf regelmäßige Pausen? Wie kann man sich über seinen Lernerfolg mit anderen austauschen? Erfahrungen und mehr im Blog.</p>", "<p><b>e · Tipps für Existenzgründungen im Handwerk</b><br>Der neue Ratgeber für Qualifikationen und Zugangsvoraussetzungen zur Gründung eines Handwerkbetriebs hilft: Welche Berufe sind meisterpflichtig, welche nicht? Wird sich das in Zukunft ändern? Welche ausländischen Diplome werden anerkannt?</p>", "<p><b>f · Entlassungen in Zeitarbeitsfirmen rechtmäßig?</b><br>Hat das Unternehmen, bei dem man als Zeitarbeiter beschäftigt ist, keine Arbeit mehr für einen, ist das in der Regel kein Kündigungsgrund, da es einen Arbeitsvertrag mit dem Zeitarbeitsunternehmen gibt. Hat der Arbeitgeber aber mit einem erheblichen Auftragsrückgang zu kämpfen, kann es komplizierter werden. Unsere Anwaltshotline kann helfen.</p>", "<p><b>g · Handwerksbetriebe stellen sich vor</b><br>Möbel Bauer – ein Handwerksbetrieb mit Tradition. Wir bieten Möbel nach Maß und echte Designermöbel, die man sich auch leisten kann. Keine Lust auf Massenproduktion? Hier geht es zu unserem Angebot.</p>", "<p><b>h · Neue Formen der Arbeit</b><br>In einem Viertel der Unternehmen haben die Mitarbeiter heute die Möglichkeit, von zu Hause zu arbeiten. Was sind die Vorteile, was die Nachteile? Wie wird die Arbeitszeit von der Firma kontrolliert? Wie sieht es mit der rechtlichen Situation des Heimarbeiters aus?</p>"], "questions": [{"n": 1, "type": "pick", "prompt": "Johanna arbeitet in einem Handwerksbetrieb. Sie möchte sich selbstständig machen.", "answer": "e"}, {"n": 2, "type": "pick", "prompt": "Gernot möchte den Job wechseln und weiß nicht, wie er seine jetzige Arbeit kündigen kann.", "answer": "a"}, {"n": 3, "type": "pick", "prompt": "Timo hat eine feste Anstellung und interessiert sich für die Arbeit im Homeoffice.", "answer": "h"}, {"n": 4, "type": "pick", "prompt": "Markus sucht Informationen über den Kündigungsschutz bei Zeitarbeit.", "answer": "f"}, {"n": 5, "type": "pick", "prompt": "Martina fragt sich, was ihr akademischer Abschluss in Deutschland wert ist.", "answer": "c"}]}, {"id": "l2", "title": "Lesen Teil 2", "instruction": "Lesen Sie die Texte und die Aufgaben 6–9. Ist die Aussage dazu richtig oder falsch und welche Antwort (a, b oder c) passt am besten?", "texts": ["<h4>Text 1 · Wichtige Informationen für unsere neuen Mitarbeiter*innen</h4><p><b>Urlaubsanträge</b><br>Die Erfahrung der letzten Jahre hat gezeigt, dass es sinnvoll ist, wenn jede Abteilung für die Planung der Urlaubszeiten eine Liste aushängt, in der die Mitarbeiter*innen vor Beantragung ihre Urlaubswünsche eintragen. So können Sie im Vorfeld bereits sehen, ob Sie und Ihre Kolleg*innen im selben Zeitraum in den Urlaub fahren möchten und zusammen eine Lösung suchen. Beachten Sie unsere bekannten sozialen Standards: So werden die Urlaubswünsche von Mitarbeiter*innen mit Kindern während der Schulferien bevorzugt behandelt.</p><p>Wenn Sie sich innerhalb Ihrer Abteilung bei der Planung einig geworden sind, müssen Sie Ihren Urlaub individuell beantragen. Schreiben Sie hierzu Ihrem/Ihrer jeweiligen Abteilungsleiter*in eine formlose E-Mail mit Ihren Urlaubswünschen. Es ist nicht nötig, dass Sie die E-Mail an die Geschäftsleitung schicken. Die Personalabteilung wird Ihren Antrag bearbeiten und Sie werden zeitnah eine schriftliche Bestätigung erhalten.</p><p>Für das laufende Jahr müssen wir Sie jetzt schon darauf hinweisen, dass es aus betrieblichen Gründen in den vier Wochen vor Weihnachten eine Urlaubssperre geben wird, da wir in diesem Zeitraum nicht auf unser Personal verzichten können. Wir bitten Sie, dies bei Ihrer Planung zu berücksichtigen.</p><p><b>Arbeitszeiten</b><br>In unserem Betrieb gilt eine Kernarbeitszeit von 8.00 bis 15.00 Uhr. Während dieser Zeit müssen alle Mitarbeiter*innen an ihren … <i>(im Original abgeschnitten)</i></p>"], "questions": [{"n": 6, "type": "tf", "prompt": "In den Abteilungen des Unternehmens sollen ab diesem Jahr Urlaubslisten ausgehängt werden.", "answer": "falsch"}, {"n": 7, "type": "mc", "prompt": "Um den Urlaub genehmigt zu bekommen,", "options": [["a", "ist es ausreichend, die Urlaubsliste der/dem Vorgesetzten zu geben."], ["b", "müssen Fristen beachtet werden."], ["c", "bedarf es eines schriftlichen Antrags."]], "answer": "c"}]}, {"id": "l2b", "title": "Lesen Teil 2 · Text 2", "texts": ["<h4>Text 2 · Wichtige Informationen für unsere neuen Mitarbeiter*innen</h4><p><b>Betriebssport</b><br>Ihre Gesundheit ist uns wichtig. Aus diesem Grund fördert unser Unternehmen die sportlichen Aktivitäten seiner Mitarbeiter*innen. Die Teilnahme am Betriebssport ist freiwillig, aber wir würden uns freuen, wenn Sie unsere Angebote nutzen.</p><p>Der Betriebssport findet in der Regel außerhalb der Arbeitszeit statt, aber auch direkt am Arbeitsplatz bieten wir ab sofort Gymnastikübungen und Büro-Yoga an. Außerdem stehen im Keller Tischtennisplatten, die Sie jederzeit für ein Spiel nutzen können. Damit es nicht zu Missverständnissen kommt, gilt: Die Teilnahme am Betriebssport zählt nicht als Arbeitszeit.</p><p>Die Turngemeinde Nord hat die Turnhalle und den Fitnessraum dienstagabends von 18–22 Uhr für unser Unternehmen reserviert. Während dieser Zeit können Sie die Räume kostenlos nutzen und trainieren. An den anderen Tagen der Woche erhalten Sie verbilligte Eintrittskarten. Es besteht auch die Möglichkeit einer finanziellen Beteiligung unseres Unternehmens an einer Mitgliedschaft im Fitnessclub Nord, allerdings gibt es steuerrechtliche Obergrenzen bei den finanziellen Zuschüssen für unsere Mitarbeiter*innen.</p><p>Alle Informationen hierzu und zu unserem vielseitigen sportlichen Angebot erhalten Sie von Frau Dörr, Zimmer 122, Durchwahl 45.</p><p><b>Gemeinschaftsveranstaltungen</b><br>Unser Unternehmen bietet jedes Jahr zwei Gemeinschaftsveranstaltungen an. Im Juni … <i>(im Original abgeschnitten)</i></p>"], "questions": [{"n": 8, "type": "tf", "prompt": "Um die Gesundheit der Beschäftigten zu fördern, möchte das Unternehmen gerne alle Beschäftigten verpflichten, am Betriebssport teilzunehmen.", "answer": "falsch"}, {"n": 9, "type": "mc", "prompt": "Veranstaltungen des Betriebssports", "options": [["a", "finden sowohl in als auch außerhalb der Firma statt."], ["b", "können die Mitarbeiter und Mitarbeiterinnen steuerlich geltend machen."], ["c", "können zum Teil als Überstunden abgerechnet werden."]], "answer": "a"}]}, {"id": "l3", "title": "Lesen Teil 3", "instruction": "Lesen Sie die Fragen 10–13 und die Tipps a–f aus dem Pausen-Blog. Welche Frage passt zu welchem Tipp? Für eine Frage gibt es keinen passenden Tipp – wählen Sie dann x.", "choices": ["a", "b", "c", "d", "e", "f", "x"], "texts": ["<p><b>a · Alexandra</b><br>Es gibt auch Pausen, die bezahlt werden. Zum Beispiel, wenn man den ganzen Tag am Bildschirm sitzt und hier eine Ruhezeit benötigt. Diese Ruhezeit heißt aber, dass man andere Arbeiten im Betrieb machen muss, die nichts mit Bildschirmarbeit zu tun haben.</p>", "<p><b>b · Uta</b><br>Pausen sollte man nicht überziehen. Einmal zehn Minuten länger Mittagspause zu machen, ist wohl nicht so dramatisch. Ich habe aber von Fällen gehört, in denen sich so etwas wiederholt hat und es dann zu einer Abmahnung kam.</p>", "<p><b>c · Antonia</b><br>Leider ist das nicht möglich. Das Gesetz sieht vor, dass nach spätestens sechs Stunden Arbeit eine Pause von mindestens 30 Minuten gemacht werden muss. Der Grund dafür ist, dass das Gesetz die Angestellten vor Arbeitsüberlastung schützen muss. Früher in den Feierabend gehen, ist nicht möglich. Du kannst da leider nichts machen.</p>", "<p><b>d · Sebastian</b><br>Der Chef kann wirklich selbst entscheiden, wie lange die Pause ist. Ich arbeite in einer Arztpraxis und wenn die Praxis mittags zwei Stunden geschlossen ist, habe ich natürlich eine längere Pause als die 30 Minuten, die das Gesetz vorschreibt. Ich wusste aber vorher, dass der Arbeitstag lang ist. Das stand in meinem Arbeitsvertrag. Schau doch mal in deinen Vertrag. Vielleicht kannst du ja einen Ausgleich bekommen.</p>", "<p><b>e · Lena</b><br>Wir hatten einen ähnlichen Fall. Es kam zu einer Klage und das Gericht hat festgestellt, dass der Arbeitgeber nachweisen muss, dass eine Pause auch wirklich genommen wurde. Und das ist mit einer exakten Zeiterfassung ja auch kein Problem. Setz dich doch mal mit deinem Betriebsrat in Verbindung.</p>", "<p><b>f · Peter</b><br>Die Pausenzeit, die man nehmen muss, muss nicht am Stück genommen werden. Man kann sie über den Arbeitstag verteilen. Eine Pause darf aber nie kürzer als 15 Minuten sein. Wenn es mehrere kleine Pausen an einem Arbeitstag geben soll, muss der Betriebsrat dem allerdings zustimmen.</p>"], "questions": [{"n": 10, "type": "pick", "prompt": "<b>Thomas:</b> Eine Frage an alle. Wie verhält es sich mit den Pausen während der Arbeitszeit? Kann ich wirklich gezwungen werden, sie zu nehmen? Es ist doch meine Sache, ob ich Pause machen möchte oder nicht. Ich arbeite 7,5 Stunden am Tag und würde lieber auf meine Pausen verzichten, damit ich früher Feierabend machen kann.", "answer": "c"}, {"n": 11, "type": "pick", "prompt": "<b>Paolo:</b> Ich arbeite sechs Stunden täglich. Letzte Woche bin ich einmal zehn Minuten länger geblieben und dann wurden mir automatisch 30 Minuten Pause als unbezahlte Arbeit abgezogen. Und damit bin ich wirklich nicht einverstanden. Was kann ich tun?", "answer": "e"}, {"n": 12, "type": "pick", "prompt": "<b>Laurette:</b> Ein Freund von mir, der im Krankenhaus arbeitet, hat mir gesagt, dass dort die Pausen bezahlt werden. Wir bekommen in den Pausen kein Gehalt. Kann man da was machen? Ich bin doch während meiner Pause auch am Arbeitsplatz und wenn mich jemand etwas fragt, kann ich nicht so tun, als würde mich das nicht interessieren. Auch während der Pause stehe ich also irgendwie zur Verfügung.", "answer": "x"}, {"n": 13, "type": "pick", "prompt": "<b>Amina:</b> Hallo Leute. Unser Chef möchte, dass wir diesen Monat eine ganze Stunde Mittagspause machen, weil es so heiß ist. Normalerweise machen wir 30 Minuten Pause. Er meint, in der Mittagshitze kommen zu wenig Kunden. Das bedeutet aber, dass wir eine Stunde länger unbezahlt bleiben müssen. Ich denke nicht, dass wir so etwas vereinbart hatten. Können wir dagegen etwas machen?", "answer": "d"}]}, {"id": "l4", "title": "Lesen Teil 4", "instruction": "Lesen Sie das Protokoll und die Aufgaben 14–18. Welche Antwort (a, b oder c) passt am besten?", "texts": ["<h4>Protokoll der Mitarbeiterbesprechung</h4><p><b>Ort:</b> Raum 122 · <b>Datum:</b> 12. März 20XX · <b>Uhrzeit:</b> 9.00–10.30 Uhr<br><b>Anwesende:</b> Jan Hegner (JH, Kaufmännische Abteilung), Dagmar Groß (DG, Produktion), Thomas Stein (TS, Einkauf), Franziska Meißner (FM, Marketing/Vertrieb), Ute Mossmann (UM, Personalabteilung), Martina Höll (MH, Forschung und Entwicklung), Lutz Kowalski (LK, Sicherheitsbeauftragter)<br><b>für den Betriebsrat:</b> Eva Plötz<br><b>für die Geschäftsführung:</b> Lukas Schäfer<br><b>Protokollantin:</b> Loretta Gonzales</p><p><b>TOP 1 · Begrüßung</b><br>LS begrüßt im Auftrag der Geschäftsführung alle Anwesenden. Frau Kästner, Verantwortliche für Sicherheitsfragen, kann heute wegen Krankheit nicht anwesend sein. Sie wird vertreten durch LK. Eingeladen für den Betriebsrat wurde Frau Plötz.</p><p><b>TOP 2 · Berichte über den erfolgten Sicherheitscheck</b><br>Bei der Prüfung der aktuellen Sicherheitsmaßnahmen hat sich Folgendes ergeben: Die Schutzmaßnahmen für die Arbeit mit chemischen Substanzen werden im Betrieb befolgt. Auch der Gebrauch von Schutzbrillen wird weitgehend eingehalten. Es wurde aber festgestellt, dass die Flucht- und Rettungswege nicht durchgehend freigehalten werden. So lassen sich die Türen im Gefahrenfall nicht an jeder Stelle schnell und einfach öffnen. Oft werden sie von gelagerten Gegenständen versperrt. Das gilt nicht für Feuermelder und Feuerlöscheinrichtungen. Diese sind gut erkennbar und zugängig. Die Ergebnisse der Überprüfung möglicher Schwachstellen im IT-Bereich lässt noch etwas auf sich warten. LK wird auf der nächsten Sitzung am 15. Mai einen vorläufigen Bericht vorlegen.</p><p><b>TOP 3 · Gewinnung neuer Geschäftspartner</b><br>Um unseren Bekanntheitsgrad bei der Herstellung und Anwendung technischer Gase für Bau, Handwerk und Metallverarbeitungen weiter zu steigern, sollen die Kundenbesuche und die aktuell schon sehr erfolgreichen Beratungsgespräche weiter ausgebaut werden. Nicht zuletzt muss der Auftritt auf der internationalen Fachmesse Analytica in München im Herbst vorbereitet werden, damit die Verkaufszahlen vor allem im europäischen Ausland zunehmen. Frau Meißner führt an, dass Marketing bereits an einem Konzept hierzu arbeitet, das auf der nächsten Sitzung vorgelegt werden soll.</p><p><b>TOP 4 · Mitarbeiterfortbildungen</b><br>Die Mitarbeiterfortbildungen sollen alle Bereiche des Unternehmens umfassen. Zusammen mit dem Betriebsrat werden Schulungsprogramme entwickelt, die darauf zielen, die Mitarbeiter*innen bei der fortschreitenden Digitalisierung aller Arbeitsprozesse zu qualifizieren. Das Unternehmen errichtet dazu am Stammsitz der Firma ein eigenes Schulungszentrum in den Räumen der ehemaligen Kantine. Im September wird dieses bezugsfertig sein und ab diesem Zeitpunkt für Schulungen zu Verfügung stehen. Mit dem Betriebsrat wurde vereinbart, dass die Fortbildungen nach Möglichkeit während der Arbeitszeit stattfinden. Die Versammlung beschließt, dass alle Abteilungen bis spätestens Ende Mai für ihre Bereiche Fortbildungspläne erstellen. Danach bilden Vertreter*innen der Abteilungen einen Ausschuss, der auf dieser Grundlage ein Gesamtschulungskonzept entwickelt.</p><p><b>TOP 5 · Sommerfest und Infotag</b><br>Mit der Vorbereitung des diesjährigen Sommerfestes soll sofort begonnen werden. Nachdem das Fest im letzten Jahr aufgrund des schlechten Wetters buchstäblich ins Wasser gefallen ist, schlägt UM die Gartenanlage im Südgarten als Treffpunkt vor. Neben einem großen Gartengelände befindet sich dort ein überdachtes Vereinsheim, das bei Regen benutzt werden kann. Beim Sommerfest sind alle Mitarbeiter*innen und Familienangehörige willkommen, aber nur eine begrenzte Zahl von Kund*innen und Lieferanten soll eingeladen werden. Für Interessenten an unserem Unternehmen von außerhalb soll es außerdem am 1. Juni einen Tag der Offenen Tür geben. An Infoständen wird das Unternehmen vorgestellt. An diesem Tag können sich auch Schulabgänger*innen mit ihren Eltern über die Ausbildungsmöglichkeiten in unserem Unternehmen informieren. Aus Sicherheitsgründen dürfen Kinder unter zehn Jahren an Werksbesichtigungen nicht teilnehmen.</p>"], "questions": [{"n": 14, "type": "mc", "prompt": "Auf der Sitzung", "options": [["a", "ist der Bereich Sicherheit nicht vertreten."], ["b", "werden verhinderte Mitarbeiter und Mitarbeiterinnen durch die Geschäftsführung vertreten."], ["c", "nimmt auch eine Vertreterin der Beschäftigten teil."]], "answer": "c"}, {"n": 15, "type": "mc", "prompt": "Die Sicherheitsprüfung hat ergeben,", "options": [["a", "dass es auf dem IT-Gebiet noch große Probleme gibt."], ["b", "dass bis auf wenige Probleme die Bestimmungen befolgt werden."], ["c", "dass einige Ein- und Ausgänge nicht hinreichend gegen Brand geschützt sind."]], "answer": "b"}, {"n": 16, "type": "mc", "prompt": "Die Firma setzt sich als Ziel,", "options": [["a", "im Ausland einen größeren Umsatz zu erzielen."], ["b", "bis zum Herbst neue Produkte zu entwickeln."], ["c", "durch bessere Beratung neue Kunden zu gewinnen."]], "answer": "a"}, {"n": 17, "type": "mc", "prompt": "Die Mitarbeiterfortbildungen", "options": [["a", "sollen im Herbst beginnen."], ["b", "sind hauptsächlich für den IT-Bereich vorgesehen."], ["c", "sollen während der Mittagspause stattfinden."]], "answer": "a"}, {"n": 18, "type": "mc", "prompt": "Am 1. Juni", "options": [["a", "soll ein Sommerfest wie im vergangenen Jahr stattfinden."], ["b", "können betriebsfremde Personen das Unternehmen besichtigen."], ["c", "dürfen Kinder nur in Begleitung ihrer Eltern die Werkshallen besuchen."]], "answer": "b"}]}]}, {"id": "ls", "title": "Lesen + Schreiben", "minutes": 20, "parts": [{"id": "ls1", "title": "Lesen und Schreiben", "instruction": "Ihre Teamleitung leitet Ihnen diese E-Mail von einem Kunden weiter und bittet Sie zu antworten.", "texts": ["<div class='mail'><p class='mhead'><b>Von:</b> Ruth Hülstra<br><b>Betreff:</b> FW: Beschwerde Lieferung Schneidemaschinen</p><p>Guten Morgen,</p><p>gerade habe ich untenstehende E-Mail bekommen, die ich Ihnen zur Bearbeitung weiterleite.</p><p>Die Firma Groß ist einer unserer treuesten Kunden und es ist dringend notwendig, dass wir ihre Reklamation umgehend bearbeiten. Bitte teilen Sie dem Kunden mit, wie es zu dem Problem bei der Lieferung kommen konnte und wie wir unsere Lieferprobleme in Zukunft beheben werden.</p><p>Ruth Hülstra<br><i>Teamleiterin Heißenburg GmbH</i></p><hr><p class='mhead'><b>Von:</b> G. Groß · <b>An:</b> Ruth Hülstra<br><b>Betreff:</b> Beschwerde Lieferung Schneidemaschinen</p><p>Sehr geehrte Frau Hülstra,</p><p>am 18. Mai haben wir bei Ihnen zwei Schneidemaschinen (FERGO Allesschneider, Bestellnummer XS 342222 zum Preis von je 267,00 €) bestellt. Sie haben uns telefonisch die schnellstmögliche Zustellung zugesichert. Jetzt haben wir Anfang Juni und die Maschinen wurden immer noch nicht geliefert.</p><p>Wir möchten Sie daran erinnern, dass es im vergangenen April schon einmal eine Reklamation unsererseits gab. Damals mussten wir falsche Liefermengen reklamieren. Sie teilten uns diesbezüglich mit, dass Sie einen neuen Spediteur hätten, der noch eingearbeitet werden müsste.</p><p>Wir erwarten eine schnellstmögliche Lieferung der beiden Schneidemaschinen. Wenn die Maschinen bis kommenden Montag nicht bei uns eintreffen, müssen wir leider vom Kauf zurücktreten und uns für die Zukunft nach einem neuen Lieferanten umsehen.</p><p>Ich bitte Sie um eine umgehende Antwort.<br>Mit freundlichen Grüßen</p><p>Georg Groß<br><i>Groß KG Fleischerei- und Wurstwaren</i></p></div>"], "questions": [{"n": 19, "type": "mc", "prompt": "Herr Groß", "options": [["a", "beschwert sich über einen Spediteur."], ["b", "reklamiert eine nicht erhaltene Lieferung."], ["c", "möchte seine Bestellung rückgängig machen."]], "answer": "b"}, {"n": 20, "type": "mc", "prompt": "In der Vergangenheit", "options": [["a", "wurden fehlerhafte Maschinen geschickt."], ["b", "wurden immer wieder andere Spediteure für die Lieferungen eingesetzt."], ["c", "gab es bereits Lieferprobleme mit der Firma Heißenburg."]], "answer": "c"}, {"n": 21, "type": "email", "prompt": "Schreiben Sie eine E-Mail an den Kunden. Setzen Sie dabei alle Punkte Ihrer Teamleitung um (Grund für das Lieferproblem, Lösung für die Zukunft). Achten Sie auf angemessene Sprache (Anrede, Höflichkeit, formelle Sprache)."}]}]}, {"id": "hoeren", "title": "Hören", "minutes": 20, "intro_audio": "9783061224745_401.mp3", "parts": [{"id": "h1", "title": "Hören Teil 1", "audio": "9783061224745_402.mp3", "track": "4.2", "instruction": "Sie hören drei Gespräche. Zu jedem Gespräch gibt es zwei Aufgaben. Richtig oder falsch – und welche Antwort (a, b oder c) passt am besten? Sie hören die Gespräche einmal.", "transcript": [{"title": "Nummer 22 und 23", "lines": [["Chef", "Hallo Jonathan, schön dass du heute kommen konntest. Wie du weißt, ist unser Lagerleiter schon länger krank und wir möchten, dass du schnellstmöglich vertretungsweise seine Aufgaben übernimmst. Du arbeitest ja schon lange als Lagerist in unserer Niederlassung in Unterrode und deshalb kannst du sicherlich auch hier Leitungsaufgaben übernehmen."], ["Mitarbeiter", "Das heißt, ich soll hier als Lagerleiter tätig werden?"], ["Chef", "Genau. In den letzten Wochen wurde nicht genau erfasst, welche gelagerten Waren aktuelle Bestellungen sind und bei welchen Produkten es sich um Lagerware handelt. Das muss dringend nachgeholt werden."], ["Mitarbeiter", "Müssen dann alle Bestände noch einmal überprüft werden?"], ["Chef", "Genau. Sind diese Waren mit einem Kundennamen beschriftet? Gibt es einen klaren Bestellvorgang? Handelt es sich um Rücksendungen? Das alles muss genau erfasst werden. Ansonsten habe ich hier für die Überwachung aller Lagerprozesse eine Dokumentation, in der alles genau aufgeführt ist."], ["Mitarbeiter", "Finde ich da auch die Sicherheitsregeln?"], ["Chef", "Natürlich. Die Mitarbeiter kennen die Sicherheitsbestimmungen, aber überprüfe bitte trotzdem, ob alle Produkte standfest gelagert wurden, ob sie richtig verpackt wurden usw. Und du musst auch die Ergebnisse dieser Kontrolle in unserem System erfassen."], ["Mitarbeiter", "Okay. Und ich soll schnellstmöglich beginnen? Was heißt das konkret?"], ["Chef", "Gerne sofort. Ich habe schon mit dem Niederlassungsleiter in Unterrode gesprochen und er hat bestätigt, dass deine Kollegen aufgrund der Auftragslage deine jetzigen Aufgaben mit übernehmen können."], ["Mitarbeiter", "Das stimmt, wir haben im Augenblick nicht so viel zu tun."], ["Chef", "Wärst du dann einverstanden, einige Zeit bei uns in der Zentrale zu arbeiten? Über die genauen Konditionen, höheres Gehalt, Aufwandszuschlag für Fahrtkosten usw. können wir dann gleich noch reden."], ["Mitarbeiter", "Ja, gerne. Ich freue mich, dass Sie mir diese Aufgabe zutrauen. Das gibt mir auch die Möglichkeit, mich in unserer Firma weiterzuentwickeln."]]}, {"title": "Nummer 24 und 25", "lines": [["Chef", "Wir müssen die Kalkulation für den Messestand der Firma Lohmann fertig machen. Der Kunde wartet darauf. Erst dann bekommen wir die Zusage für den Auftrag."], ["Mitarbeiterin", "Das meiste haben wir bereits berechnet. Es fehlen aber noch die Angaben des Elektrikers. Er konnte uns noch nicht mitteilen, wie teuer die Elektroanlagen und Lichtinstallationen werden. Ich habe heute Morgen noch mal angerufen, aber er hat so viel zu tun, dass er noch nicht dazu gekommen ist."], ["Chef", "Wir warten jetzt aber schon seit drei Wochen auf den Kostenvoranschlag. Rufen Sie doch bitte nochmal an. Mir ist es auch unangenehm, immer wieder Druck machen zu müssen, aber wir müssen uns auch an die Termine halten."], ["Mitarbeiterin", "Im Notfall müssen wir halt einen anderen Elektriker suchen."], ["Chef", "Das möchte ich vermeiden. Wir haben ja bisher immer sehr gute Erfahrungen mit ihm gemacht. Es hat noch nie Probleme oder Reklamationen gegeben. Und mit den Preisen waren die Kunden auch immer sehr zufrieden."], ["Mitarbeiterin", "Und wenn wir einfach als Grundlage für die Kalkulation die Kosten der Elektroinstallation aus dem letzten Jahr nehmen? Das müsste doch vergleichbar sein."], ["Chef", "Ja, vielleicht. Aber der Kunde möchte dieses Jahr viele Extras: Der Firmenname soll in großer Neonschrift stehen und aufwändige Lichteffekte wünscht er sich auch."], ["Mitarbeiterin", "Vielleicht könnten wir mit einem Aufschlag von 30 Prozent arbeiten?"], ["Chef", "Ich weiß nicht. Ob der Kunde wirklich mit einem solchen Aufschlag einverstanden wäre, glaube ich nicht. Nein, machen Sie weiter Druck beim Elektriker!"]]}, {"title": "Nummer 26 und 27", "lines": [["Frau Weiss", "Bürotechnik Lohmann, Sie sprechen mit Frau Weiss."], ["Herr Kuhnert", "Guten Tag, hier Kuhnert von der Firma Schmidt & Söhne. Wir möchten gerne mehrere Tischrechner bestellen und haben in Ihrem Prospekt viele verschiedene gesehen. Welche würden Sie denn empfehlen?"], ["Frau Weiss", "Benötigen Sie einfache Rechner oder Rechner, die selbst drucken können, also auch eine Papierrolle haben?"], ["Herr Kuhnert", "Rechner mit Druckfunktion finde ich sinnvoller, da wir unsere Berechnungen auch dokumentieren müssen. Wichtig ist natürlich, dass die Geräte im Verbrauch sehr günstig sind."], ["Frau Weiss", "Nun, der XS 422 zum Beispiel schaltet sich nach vier Sekunden Nichtbenutzung automatisch ab. Er wird mit vier AA-Batterien geliefert und Sie erhalten außerdem ein Netzteil. Er verfügt über ein besonders großes 12-stelliges Display und ist sehr schnell. Er druckt zwei Zeilen pro Sekunde."], ["Herr Kuhnert", "Das klingt schon gut, aber haben Sie noch schnellere Geräte?"], ["Frau Weiss", "Moment, ja dann empfehle ich Ihnen den XS 455. Er druckt sogar vier Zeilen pro Sekunde. Und er hat einen sehr geringen Stromverbrauch. Das Display schaltet sich automatisch nach drei Sekunden Nichtbenutzung ab."], ["Herr Kuhnert", "Kann man die Druckfunktion auch ausschalten?"], ["Frau Weiss", "Das können Sie bei den meisten Rechnern, ja."], ["Herr Kuhnert", "Gut, danke für die Informationen, dann werde ich mir die einzelnen Geräte in Ihrem Katalog noch einmal anschauen. Wenn ich bestelle, wie sieht es dann mit den Versandkosten aus und wie lange würde es dauern, bis die Bestellung hier ankommt?"], ["Frau Weiss", "Wenn der Warenwert Ihrer Bestellung höher als 50 Euro ist, versenden wir kostenlos. Bitte beachten Sie noch, dass alle unsere Preise netto sind, also ohne Mehrwertsteuer. Nach Eingang Ihrer Bestellung liefern wir innerhalb von 24 Stunden."]]}], "questions": [{"n": 22, "type": "tf", "prompt": "Jonathan sucht eine Stelle als Lagerleiter.", "answer": "falsch", "hint": "„…wir möchten, dass du schnellstmöglich vertretungsweise seine Aufgaben übernimmst.“ – Er sucht nichts, der Chef bittet ihn um Vertretung."}, {"n": 23, "type": "mc", "prompt": "Jonathan", "options": [["a", "ist verantwortlich für die Kundenbetreuung."], ["b", "hat auch die Aufgabe, Mitarbeiter zu schulen."], ["c", "muss eine genaue Dokumentation über die Lageraktivitäten erstellen."]], "answer": "c", "hint": "„Das alles muss genau erfasst werden.“ / „…du musst auch die Ergebnisse dieser Kontrolle in unserem System erfassen.“"}, {"n": 24, "type": "tf", "prompt": "Die Messebaufirma möchte keinen neuen Elektriker beauftragen.", "answer": "richtig", "hint": "„Im Notfall müssen wir halt einen anderen Elektriker suchen.“ – „Das möchte ich vermeiden.“"}, {"n": 25, "type": "mc", "prompt": "Die Kosten für die Lichtinstallation", "options": [["a", "werden dieses Jahr um 30 Prozent steigen."], ["b", "soll der Elektriker schnellstmöglich bekannt geben."], ["c", "will der Kunde nicht akzeptieren."]], "answer": "b", "hint": "Die 30 % sind nur ein Vorschlag. Entscheidend: „Nein, machen Sie weiter Druck beim Elektriker!“"}, {"n": 26, "type": "tf", "prompt": "Herr Kuhnert von der Firma Schmidt & Söhne sucht einen neuen Drucker.", "answer": "falsch", "hint": "„Wir möchten gerne mehrere Tischrechner bestellen…“ – Rechner mit Druckfunktion, kein Drucker."}, {"n": 27, "type": "mc", "prompt": "Herr Kuhnert möchte ein Gerät kaufen,", "options": [["a", "das sowohl schnell arbeitet als auch energiesparend ist."], ["b", "das unter einem Einkaufspreis vom 50 Euro liegt."], ["c", "das im Katalog der Firma Bürotechnik Lohmann nicht aufgeführt ist."]], "answer": "a", "hint": "„…dass die Geräte im Verbrauch sehr günstig sind.“ + „…haben Sie noch schnellere Geräte?“ (50 € = Grenze für kostenlosen Versand)"}]}, {"id": "h2", "title": "Hören Teil 2", "audio": "9783061224745_403.mp3", "track": "4.3", "instruction": "Sie hören vier Gespräche. Welcher der Sätze a–f passt am besten zu welchem Gespräch? Lesen Sie zuerst die Sätze (1 Minute). Sie hören die Gespräche einmal.", "choices": ["a", "b", "c", "d", "e", "f"], "texts": ["<ol type='a' class='stmts'><li>Wenn man Familie hat, sollte man nicht zu Hause arbeiten.</li><li>Trotz aller Probleme bei selbstständiger Tätigkeit sollte man die Vorteile genießen.</li><li>Man muss darauf achten, klare Grenzen zwischen Arbeit und Privatleben zu ziehen.</li><li>Auch Selbstständige sind nicht immer ihr eigener Chef.</li><li>Existenzängste haben heute nicht nur Selbstständige.</li><li>Wenn man älter ist, sollte man sich den Schritt in die Selbstständigkeit gut überlegen.</li></ol>"], "transcript": [{"title": "Nummer 28", "lines": [["Anja", "Hallo Agnes, wie läuft’s mit deinem Friseursalon?"], ["Agnes", "Gut, danke. Endlich kann ich mal richtig Geld verdienen. Und ich habe auch keinen Chef, der mir immer reinredet, was ich tun und lassen soll."], ["Anja", "Aber ist das nicht alles zu unsicher? Was, wenn mal keine Kunden kommen? Es gibt doch so viel Konkurrenz."], ["Agnes", "Weißt du, diese Diskussion über später, klar macht mir das Sorgen. Aber darüber denke ich nicht mehr viel nach. Wenn ich angestellt bin, kann ich meinen Job genauso verlieren. Kein Arbeitsplatz ist hundertprozentig sicher."], ["Anja", "Da hast du schon recht, aber für mich wäre das nichts. Aber ich muss mir mal wieder die Haare schneiden lassen."], ["Agnes", "Kein Problem, dann komm morgen Vormittag. Da habe ich noch einen Termin frei."]]}, {"title": "Nummer 29", "lines": [["Erik", "Guten Morgen, Jens. Ich habe Brötchen mitgebracht."], ["Jens", "Hallo, Erik. Lecker, warte mal, ich muss mir noch die Haare föhnen."], ["Erik", "Hast du jetzt erst geduscht? Ich dachte, du hast so viel zu tun."], ["Jens", "Habe ich auch. Aber seit ich selbstständig bin, kann ich mir meine Zeit einteilen, wie ich will. Und dazu gehört halt auch, schön lange zu schlafen."], ["Erik", "Dann arbeitest du wahrscheinlich immer bis spät in die Nacht."], ["Jens", "Genau. Ich bin ein Nachtmensch, mir kommt das sehr entgegen."], ["Erik", "Zu Hause arbeiten fände ich schwierig. Da muss man sehr diszipliniert sein."], ["Jens", "Klar, es ist anstrengend, auch, weil man nie weiß, wann der nächste Auftrag kommt. Die Unsicherheit ist nicht einfach, aber ich finde es toll, über meine Zeit frei bestimmen zu können."]]}, {"title": "Nummer 30", "lines": [["Denis", "Hallo, Maja."], ["Maja", "Grüß dich, Denis. Komm rein. Wir haben uns ja lange nicht gesehen. Geht’s dir gut?"], ["Denis", "Ja, danke. Du Maja, du hast mir doch gesagt, dass es in dem Gebäude, in dem du arbeitest, freie Büroräume gibt. Ich überlege, ob ich mir nicht etwas mieten soll."], ["Maja", "Hast du zu Hause zu wenig Ruhe?"], ["Denis", "Nein, das geht eigentlich, aber ich brauche eine feste Arbeitsstruktur. Wenn ich zu Hause arbeite, finde ich oft kein Ende. Manchmal bekomme ich spät in der Nacht oder am Wochenende Anrufe, weil jemand ganz dringend eine Übersetzung braucht. Ich kann nie abschalten. Das geht auf die Gesundheit."], ["Maja", "Das stimmt. Und in einem eigenen Büro kannst du die Tür zumachen, wenn du mit der Arbeit fertig bist und dann zu Hause nicht mehr daran denken."], ["Denis", "Genau, dann kann ich versuchen, wieder zu festen Zeiten zu arbeiten. Obwohl es auch schade wäre, nicht mehr so viel zu Hause zu sein."]]}, {"title": "Nummer 31", "lines": [["Leo", "Hallo, Karsten, ich habe gehört, dass CompuData nicht mehr existiert."], ["Karsten", "Ja, stimmt, meine Firma gibt es nicht mehr. Sie haben nur noch Verluste gemacht und ich habe meine Arbeit verloren."], ["Leo", "Und jetzt bist du beim Jobcenter?"], ["Karsten", "Nein, ich dachte mir, mit meinen Qualifikationen kann ich doch versuchen, mich als IT- und EDV-Berater selbstständig zu machen. Weißt du, in meinem Alter, ich bin ja auch schon über 50, hätte ich wahrscheinlich sowieso keine feste Stelle mehr gefunden. Und die Selbstständigkeit ist ja auch ganz attraktiv: mehr Geld, selbstbestimmtes Arbeiten. Das habe ich zumindest gedacht."], ["Leo", "Zumindest? Das heißt …"], ["Karsten", "Ja, weißt du, im Moment habe ich wirklich viel Arbeit. Ich arbeite für verschiedene Kunden, bei denen ich laufend sehr komplizierte EDV-Probleme lösen muss. Letztendlich bestimmen sie meine Arbeit und meine Arbeitszeit. Aber ich bin natürlich froh, dass ich überhaupt Aufträge habe."]]}], "questions": [{"n": 28, "type": "pick", "prompt": "Gespräch 1 (Anja & Agnes)", "answer": "e", "hint": "Agnes: „Wenn ich angestellt bin, kann ich meinen Job genauso verlieren. Kein Arbeitsplatz ist hundertprozentig sicher.“"}, {"n": 29, "type": "pick", "prompt": "Gespräch 2 (Erik & Jens)", "answer": "b", "hint": "Jens: „Die Unsicherheit ist nicht einfach, aber ich finde es toll, über meine Zeit frei bestimmen zu können.“"}, {"n": 30, "type": "pick", "prompt": "Gespräch 3 (Denis & Maja)", "answer": "c", "hint": "Denis: „Ich kann nie abschalten.“ – eigenes Büro, Tür zumachen, feste Zeiten."}, {"n": 31, "type": "pick", "prompt": "Gespräch 4 (Leo & Karsten)", "answer": "d", "hint": "Karsten: „Letztendlich bestimmen sie [die Kunden] meine Arbeit und meine Arbeitszeit.“ (Alter wird erwähnt, aber nicht als Warnung → nicht f)"}]}, {"id": "h3", "title": "Hören Teil 3", "audio": "9783061224745_404.mp3", "track": "4.4", "instruction": "Sie hören eine Präsentation (Folien: Neues Kassensystem · Vorteile · Sicherheit · Kosten · Bedienung). Welche Lösung passt jeweils am besten? Lesen Sie zuerst die Aufgaben (1 Minute). Sie hören die Präsentation einmal.<br><i>Beispiel: Wer hält die Präsentation bei der Firma Hauser? → c) Ein Kundenberater von außerhalb.</i>", "transcript": [{"title": "Präsentation: Cloud-Kassensystem", "lines": [["Referent", "Guten Morgen, liebe Mitarbeiterinnen und Mitarbeiter der Firma Hauser. Ich freue mich, dass ich Ihnen heute unser neues Cloud-Kassensystem für den Einzelhandel vorstellen darf. Mein Name ist Jens Humbold von der Firma AEX. Das Kassensystem wurde von uns in Zusammenarbeit mit zahlreichen Einzelhandelsbetrieben entwickelt. Bei AEX bin ich verantwortlich für Vertrieb und Marketing und auch Ihre Kontaktperson für alle Fragen und Anmerkungen."], ["", "Kommen wir zu unserem Cloud-Kassensystem: Zuerst einmal, was ist eine Cloud? Sie kennen die Cloud wahrscheinlich alle von Streamingdiensten, die Sie privat nutzen. Auf einem externen Server liegen Daten, die Sie abrufen können. Erforderlich ist dazu eine Internetverbindung. Auch in Ihrem Unternehmen nutzen Sie schon lange Kassensysteme – also mehrere Kassen, die elektronisch miteinander verbunden sind. Die klassische Kasse, die Preise addiert und dann ausgerechnet hat, wieviel Rückgeld ausgezahlt werden muss, wurde durch das Scansystem erweitert. Die Barcodes auf den Waren haben den Mitarbeiterinnen und Mitarbeitern die aufwändige Eintipparbeit abgenommen und zugleich die verkauften Waren mit dem Warenbestand abgeglichen, sodass Sie automatisch sehen konnten, welche Produkte nachbestellt werden müssen. Unser Cloud System geht jetzt einen entscheidenden Schritt weiter. Alle Ihre Filialen sind an dieses System, welches sämtliche Warenbestände registriert, angeschlossen. Wenn Sie es wünschen, können automatisch fehlende Produkte nachbestellt und notwendige Bestellungen durchgeführt werden. Und das spart Kosten. Auch Ihre Onlineplattform ist mit dem Handel in Ihren Filialen verbunden. Produkte, die in Ihren Filialen verkauft wurden, sind erst dann wieder im Onlineshop erhältlich, wenn der Warenbestand aufgefüllt worden ist. Und ohne dass Sie das extra veranlassen müssen, wird eine Kundendatenbank erstellt."], ["Zwischenfrage Frau", "Eine Frage hierzu. Was machen wir, wenn das Netz ausfällt?"], ["Zwischenbemerkung Mann", "Das habe ich vor Kurzem in einem Supermarkt erlebt. Nichts ging mehr. Man konnte nicht mehr zahlen, auch wenn man wollte, weil alle Kassen gestreikt haben."], ["Referent", "Ich verstehe die Sorge, aber da haben wir vorgesorgt. Zur Sicherheit Ihres Geschäftsablaufs haben wir für den Notfall eine Offline-Funktion eingebaut. Bevor Ihre Daten in der Cloud gespeichert werden, werden sie lokal gespeichert, sodass Sie auf jeden Fall weiterarbeiten können. Was bei Störungen offline nicht funktionieren wird, sind automatische Bestellvorgänge, aber Ihr lokaler Verkauf kann ungestört weitergehen."], ["Zwischenfrage Frau", "Und die Datensicherheit im Allgemeinen?"], ["Referent", "Wir als Cloudanbieter haben weitgehende Maßnahmen getroffen, um die Datensicherheit zu gewährleisten. Aber natürlich sind Sie als Kunde auch gefordert. Wie immer, wenn Sie online sind, brauchen Sie neben ihrem Benutzernamen ein starkes Passwort, das Sie regelmäßig ändern sollten. Wir verschlüsseln Ihre Daten in der Cloud, sodass sie von anderen nicht gelesen werden können. Wenn Sie möchten, können Sie Ihre Daten zusätzlich mit einer eigenen Verschlüsselungssoftware verschlüsseln. Außerdem werden alle Daten auch lokal abgesichert. So liegen Ihre Daten nicht nur in einer Datenbank, sondern an verschiedenen Orten. Wir verstehen die Sorge, wenn die eigenen Daten anonym an anderen Stellen liegen, aber eigentlich ist das viel sicherer, als wenn sie zu Hause auf Ihrem Rechner gespeichert sind."], ["Zwischenbemerkung Frau", "Das stimmt schon, da muss man vielleicht umdenken."], ["Zwischenfrage Mann", "Wie sieht es denn mit den Kosten aus?"], ["Referent", "Wir bieten die erforderliche Software an, Sie zahlen dafür eine monatliche Nutzungsgebühr. Sie müssen also keine teure Software anschaffen. Die Wartung und die Updates übernehmen wir ebenfalls für Sie in regelmäßigen Abständen. Die konkreten Preise entnehmen Sie bitte unserer Broschüre, die wir Ihnen am Schluss unserer Präsentation gern aushändigen. Sie hängen auch davon ab, wie viele Kassen an unser System angeschlossen werden. Und wir können Ihnen hier bestimmt noch entgegenkommen. Für Sie als neuen Kunden haben wir aber ein besonderes Angebot: Sie können unser System vier Wochen lang kostenlos testen, um kein Risiko eingehen zu müssen."], ["", "Damit komme ich auch langsam zum Ende. Zum Schluss möchte ich noch auf Folgendes hinweisen: Auch wenn sich alles etwas kompliziert anhören sollte, werden Sie von der einfachen Bedienung unseres Systems überzeugt sein. Vergessen Sie auch nicht, dass Sie durch die Automatisierung viel weniger bürokratische Arbeit in Ihrem Betrieb haben. Fehler, zum Beispiel bei den Bestellungen, können reduziert werden, der Arbeitsaufwand für Ihre Mitarbeiter wird wesentlich kleiner. Schauen Sie dazu doch auch in unser Handbuch. Den Link zum Download finden Sie ebenfalls in der Broschüre, die Sie jetzt gleich bekommen werden. Und Sie bekommen über unsere Hotline jederzeit Unterstützung bei möglichen Fragen."]]}], "questions": [{"n": 32, "type": "mc", "prompt": "Das neue Kassensystem (Vorteile)", "options": [["a", "führt zu Preisnachlässen bei den Kunden."], ["b", "übernimmt Aufgaben der Buchhaltung."], ["c", "funktioniert nur bei eingescannten Waren."]], "answer": "b", "hint": "„…können automatisch fehlende Produkte nachbestellt und notwendige Bestellungen durchgeführt werden.“ + automatische Kundendatenbank."}, {"n": 33, "type": "mc", "prompt": "Um die Daten zu sichern, (Sicherheit)", "options": [["a", "sollte man am besten im Offline-Modus arbeiten."], ["b", "müssen sowohl der Cloud-Anbieter als auch die Firma Hauser aktiv werden."], ["c", "speichert der Cloud-Anbieter die Daten auch bei anderen Anbietern."]], "answer": "b", "hint": "„Wir als Cloudanbieter haben weitgehende Maßnahmen getroffen… Aber natürlich sind Sie als Kunde auch gefordert.“"}, {"n": 34, "type": "mc", "prompt": "Die Kosten, die die Firma Hauser zahlen müsste, (Kosten)", "options": [["a", "stehen noch nicht fest."], ["b", "sind im ersten Monat niedrig."], ["c", "werden regelmäßig überprüft."]], "answer": "a", "hint": "„Sie hängen auch davon ab, wie viele Kassen … angeschlossen werden. Und wir können Ihnen hier bestimmt noch entgegenkommen.“ (4 Wochen gratis ≠ „niedrig im ersten Monat“)"}, {"n": 35, "type": "mc", "prompt": "Die Arbeit mit dem Cloud-System (Bedienung)", "options": [["a", "kann am Anfang etwas bürokratisch sein."], ["b", "wird noch weiter automatisiert."], ["c", "ist nicht kompliziert."]], "answer": "c", "hint": "„Auch wenn sich alles etwas kompliziert anhören sollte, werden Sie von der einfachen Bedienung unseres Systems überzeugt sein.“"}]}, {"id": "h4", "title": "Hören Teil 4", "audio": "9783061224745_405.mp3", "track": "4.5", "instruction": "Sie hören fünf telefonische Mitteilungen. Zu jeder Mitteilung gibt es eine Aufgabe. Welche Lösung passt am besten? Sie hören jede Mitteilung einmal.", "transcript": [{"title": "Nummer 36", "lines": [["", "Guten Tag, Winkelmann hier aus der Kaiserstraße 12. Es geht um die Gastherme Phoenix SX123. Ich hatte Ihnen ja mitgeteilt, dass es nicht mehr gelingt, die Therme mit Wasser zu füllen. Der Füllschlauch ist kaputt und wir haben bald kein heißes Wasser mehr und die Heizung funktioniert auch nicht mehr. Der Ersatzschlauch, der uns letzte Woche von Ihnen geliefert worden ist, hilft auch nicht weiter. Als wir versucht haben, ihn auszutauschen, mussten wir feststellen, dass bei dem neuen Schlauch das Gewinde nicht passt. Bitte schicken Sie schnellstmöglich einen Monteur."]]}, {"title": "Nummer 37", "lines": [["", "Guten Morgen, liebe Kollegen. Ich wollte nur bestätigen, dass ich für den 9. und 10. September im Hotel Hanauer Hof vier Einzelzimmer mit Frühstücksbuffet gebucht habe. Der Tagungsraum steht uns am Wochenende zur Verfügung. Ich habe mich für den Tagungsraum Taunus entschieden, ich denke, der passt am besten. Catering habe ich noch nicht bestellt, da wir noch nicht darüber geredet haben, ob wir mittags im Hotel essen wollen. Wir könnten auch in eines der Restaurants in der Nähe des Hotels gehen, hier würde es sich aber empfehlen, bald zu reservieren, da die Stadt am Wochenende sehr voll ist. Sagt mir Bescheid, dann übernehme ich das."]]}, {"title": "Nummer 38", "lines": [["", "Guten Tag, hier Tanja Schmidt von der Firma Lauke. Wir wollten Ihnen nur mitteilen, dass die Lieferung, auf die wir sehr lange gewartet haben, heute Morgen bei uns eingegangen ist. Leider müssen wir aber reklamieren, dass anstelle der bestellten Druckerpatronen für den Laserdrucker GA-3380 Tintenpatronen für den Inkjet-Drucker XS-2424 geliefert wurden. Der Lieferung lag auch kein Bestellschein bei. Können Sie das bitte schnellstmöglich korrigieren und uns heute noch die richtigen Patronen schicken? Wir brauchen sie spätestens bis 16 Uhr."]]}, {"title": "Nummer 39", "lines": [["", "Hallo Bodo, hier Marek. Könntest du bitte den Wartungsauftrag morgen 10 Uhr für die Firma Gonzalez übernehmen? Ich bin mit der Arbeit auf der Baustelle am Zoo noch nicht fertig. Ich denke, ich brauche morgen noch den ganzen Tag. Falls es mit 10 Uhr nicht klappt, sag ihnen doch bitte telefonisch Bescheid. Es wäre aber wichtig, dass morgen jemand bei ihnen vorbeikommt. Sie haben laufend Internetausfälle und die Leitungen müssten überprüft werden. Danke für deine Hilfe."]]}, {"title": "Nummer 40", "lines": [["", "Julia, hier Eva. Du, wir müssten noch über unsere Urlaubsplanung sprechen. Also, ich habe mir Folgendes überlegt. Wenn du in der 3. und 4. Septemberwoche deinen Urlaub beantragst, könnte ich meinen Urlaub in den ersten beiden Septemberwochen nehmen. In der 3. und 4. Septemberwoche habe ich nämlich eine Fortbildung, daran will und muss ich teilnehmen. Wäre dir Ende September zu spät? Ich weiß, du wolltest auch gern Anfang September weg. Aber du wolltest doch nach Griechenland. Da ist das Wetter den ganzen September schön. Wäre schön, wenn das klappt. Wenn nicht, dann muss ich mir noch etwas anderes überlegen."]]}], "questions": [{"n": 36, "type": "mc", "prompt": "Herr Winkelmann", "options": [["a", "braucht professionelle Hilfe beim Anbringen eines Schlauchs."], ["b", "beschwert sich über eine verspätete Lieferung."], ["c", "möchte ein Gerät austauschen."]], "answer": "a", "hint": "„…dass bei dem neuen Schlauch das Gewinde nicht passt. Bitte schicken Sie schnellstmöglich einen Monteur.“"}, {"n": 37, "type": "mc", "prompt": "Der Anrufer", "options": [["a", "möchte, dass die Kollegen ihre Wünsche für das Catering mitteilen."], ["b", "schlägt vor, mittags in einem Restaurant zu essen."], ["c", "will noch klären, welcher Konferenzraum der geeignetste ist."]], "answer": "b", "hint": "„Wir könnten auch in eines der Restaurants in der Nähe des Hotels gehen…“ (Raum Taunus ist schon entschieden)"}, {"n": 38, "type": "mc", "prompt": "Frau Schmidt beschwert sich über", "options": [["a", "eine zu späte Bestellung."], ["b", "eine fehlerhafte Lieferung."], ["c", "eine nicht ausgeführte Korrektur."]], "answer": "b", "hint": "„…dass anstelle der bestellten Druckerpatronen … Tintenpatronen … geliefert wurden.“"}, {"n": 39, "type": "mc", "prompt": "Marek bittet Bodo darum,", "options": [["a", "ihm auf einer Baustelle zu helfen."], ["b", "einen Termin zu verschieben."], ["c", "ihn zu vertreten."]], "answer": "c", "hint": "„Könntest du bitte den Wartungsauftrag morgen 10 Uhr für die Firma Gonzalez übernehmen?“"}, {"n": 40, "type": "mc", "prompt": "Eva würde gern", "options": [["a", "ihren Urlaubstermin ändern."], ["b", "den Septemberurlaub mit Julia absprechen."], ["c", "ihre Fortbildung nicht im September machen."]], "answer": "b", "hint": "„…wir müssten noch über unsere Urlaubsplanung sprechen.“ – „Wäre dir Ende September zu spät?“"}]}]}, {"id": "hs", "title": "Hören + Schreiben", "minutes": 5, "parts": [{"id": "hs1", "title": "Hören und Schreiben", "audio": "9783061224745_406.mp3", "track": "4.6", "instruction": "Sie hören eine telefonische Mitteilung. Informieren Sie Ihre Kollegin. Notieren Sie die Informationen in der Telefonnotiz. Sie hören die Mitteilung einmal.", "transcript": [{"title": "Telefonische Mitteilung", "lines": [["", "Guten Tag, Herr Hallberger, hier Schmidtbauer von der Firma Böttcher. Wir haben heute Ihr Angebot per E-Mail bekommen. Vielen Dank dafür. Wir haben uns entsprechend Ihres Angebotes für den Kaffeeautomaten S 120 entschieden. Wir würden dann gerne dieses Modell zweimal bei Ihnen kaufen. Zum Stückpreis von 399 € – wie angeboten. Danke für eine kurze Bestätigung und Angabe des Liefertermins. Am besten per E-Mail oder telefonisch. Meine Durchwahl ist die 089-25 34 52 22. Ich wünsche Ihnen noch ein schönes Wochenende."]]}], "questions": [{"n": 41, "type": "mc", "prompt": "Grund für den Anruf", "options": [["a", "Angebot"], ["b", "Bestellung/Buchung"], ["c", "Beschwerde"]], "answer": "b", "hint": "„Wir würden dann gerne dieses Modell zweimal bei Ihnen kaufen.“"}, {"n": 42, "type": "notes", "fields": [["name", "42 · Name (Herr/Frau)"], ["tel", "43 · Kontakt/Telefon"], ["info", "44 · Weitere Informationen"], ["todo", "45 · Zu erledigen"]], "model": {"name": "Herr Schmidtbauer (Firma Böttcher)", "tel": "089-25 34 52 22 (Durchwahl)", "info": "Angebot per E-Mail erhalten · Kaffeeautomat S 120 · 2 Stück · Stückpreis 399 € (wie angeboten)", "todo": "Bestellung kurz bestätigen und Liefertermin mitteilen – per E-Mail oder telefonisch"}}]}]}, {"id": "sb", "title": "Sprachbausteine", "minutes": 35, "parts": [{"id": "sb1", "title": "Sprachbausteine Teil 1", "instruction": "Welche Wörter a–j passen am besten in die Lücken 46–51? Jedes Wort nur einmal. Nicht alle Wörter passen.", "choices": ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j"], "texts": ["<div class='wordbox'><span><b>a</b> SEITDEM</span><span><b>b</b> BEI</span><span><b>c</b> DAZU</span><span><b>d</b> DA</span><span><b>e</b> INDEM</span><span><b>f</b> DASS</span><span><b>g</b> DESHALB</span><span><b>h</b> OB</span><span><b>i</b> WEGEN</span><span><b>j</b> WENN</span></div><div class='mail'><p class='mhead'><b>Betreff:</b> Meine Bewerbung vom 14.05.</p><p>Sehr geehrte Damen und Herren,</p><p>am 14.05. habe ich mich in Bezug auf Ihr Stellenangebot vom 12.05. in der Erlanger Zeitung auf die Stelle als Maschinenbauingenieur in Ihrem Werk in Nürnberg beworben. <span class='gap' data-n='46'>(46)</span> ich bis heute noch keine Antwort auf mein Schreiben erhalten habe, wende ich mich auf diesem Weg mit der Frage an Sie, <span class='gap' data-n='47'>(47)</span> die Unterlagen bei Ihnen eingegangen sind. Sollten Sie noch weitere Informationen zu meiner Ausbildung oder zu meinem beruflichen Werdegang benötigen, würde ich mich freuen, <span class='gap' data-n='48'>(48)</span> Sie mir dies mitteilen könnten. Ich würde sie Ihnen dann umgehend zukommen lassen.</p><p>Gerne möchte ich noch einmal betonen, <span class='gap' data-n='49'>(49)</span> ich ein großes Interesse daran habe, in Ihrem Unternehmen tätig zu werden. Eine baldige Antwort wäre für mich auch <span class='gap' data-n='50'>(50)</span> wichtig, weil ich ein Wohnungsangebot in Nürnberg bekommen habe, das ich <span class='gap' data-n='51'>(51)</span> einer positiven Nachricht von Ihnen sofort annehmen würde. Über eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.</p><p>Vielen Dank im Voraus für Ihre Bemühungen.</p><p>Mit freundlichen Grüßen<br>Pjotr Ivanowitsch</p></div>"], "questions": [{"n": 46, "type": "pick", "prompt": "Lücke 46", "answer": "d", "words": true}, {"n": 47, "type": "pick", "prompt": "Lücke 47", "answer": "h", "words": true}, {"n": 48, "type": "pick", "prompt": "Lücke 48", "answer": "j", "words": true}, {"n": 49, "type": "pick", "prompt": "Lücke 49", "answer": "f", "words": true}, {"n": 50, "type": "pick", "prompt": "Lücke 50", "answer": "g", "words": true}, {"n": 51, "type": "pick", "prompt": "Lücke 51", "answer": "b", "words": true}] d": "m3", "title": "Teil 3 · Lösungswege diskutieren (ca. 4 Min.)", "instruction": "Lösungsorientiertes Gespräch: auf die Vorschläge des Partners eingehen, konkret besprechen, was zu tun ist und wer was übernimmt.", "texts": ["<p><b>Situation:</b> Sie sind Geschäftsführerin bzw. Geschäftsführer in einem Elektromarkt. Immer wieder beschweren sich Kunden bei Ihnen über die schlechte Beratung einer Angestellten. Die Kollegin arbeitet erst seit kurzem bei Ihnen.</p><p><b>Aufgabe:</b> Überlegen Sie zusammen, wie Sie in dieser Situation angemessen reagieren.</p><ul><li>Beschwerden: Welche genau?</li><li>Kunden: kontaktieren?</li><li>Kollegin: was tun? Hilfestellungen?</li><li>Kollegin: Konsequenzen?</li></ul>"]}]}]};
const state = { sec: DATA.sections[0].id, ans: {}, notes: {}, checked: {}, reveal: {}, audio: {}, timers: {}, open: new Set() };
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allQ = () => DATA.sections.flatMap(s => s.parts.flatMap(p => (p.questions||[]).map(q => ({q, p}))));
const graded = allQ().filter(x => x.q.answer);

function tabs(){
  $('#tabs').innerHTML = DATA.sections.map(s =>
    `<button role="tab" aria-selected="${s.id===state.sec}" data-sec="${s.id}">${s.title}</button>`).join('');
}
function score(){
  let ok = 0, done = 0;
  graded.forEach(({q,p}) => { if (state.checked[p.id]) { done++; if (state.ans[q.n]===q.answer) ok++; } });
  $('#score').textContent = done ? `${ok}/${done} richtig` : `${graded.length} Aufgaben`;
}

/* ---------- timer ---------- */
let tick = null;
function timerObj(){ const s = DATA.sections.find(x=>x.id===state.sec);
  return state.timers[s.id] ||= { left: s.minutes*60, run: false }; }
function drawTimer(){
  const t = timerObj(), b = $('#timer'), m = Math.floor(Math.abs(t.left)/60), s = Math.abs(t.left)%60;
  b.textContent = (t.left<0?'−':'') + m + ':' + String(s).padStart(2,'0');
  b.className = 'timer' + (t.run?' run':'') + (t.left<0?' over':'');
}
$('#timer').onclick = () => { const t = timerObj(); t.run = !t.run;
  clearInterval(tick); if (t.run) tick = setInterval(()=>{ t.left--; drawTimer(); }, 1000); drawTimer(); };

/* ---------- rendering ---------- */
function audioBlock(file, track){
  const src = state.audio[file] || file;
  return `<div class="audio" data-file="${file}">
    <div class="meta">${track?`Track ${track} · `:''}${file}</div>
    <audio controls preload="none" src="${src}"></audio>
    <p class="err" hidden>Datei nicht gefunden. Lege die MP3 in denselben Ordner wie diese HTML-Datei oder wähle sie hier aus.</p>
    <label class="filebtn">MP3 auswählen<input type="file" accept="audio/*,.mp3"></label>
  </div>`;
}
function optClass(p, q, key){
  const sel = state.ans[q.n]===key, chk = state.checked[p.id], rev = state.reveal[p.id];
  let c = sel ? ' sel' : '';
  if (chk && sel) c += key===q.answer ? ' ok' : ' bad';
  if (key===q.answer && !(chk && sel) && (rev || chk)) c += ' miss';
  return c;
}
function wordOf(p, key){
  const m = (p.texts||[]).join('').match(new RegExp(`<b>${key}</b> ([A-ZÄÖÜ]+)`));
  return m ? m[1] : key;
}
function question(p, q){
  let h = `<div class="q" id="q${q.n}"><div class="qhead"><span class="qn">${q.n}</span><div class="qp">${q.prompt||''}</div></div>`;
  if (q.type==='mc' || q.type==='tf'){
    const opts = q.type==='tf' ? [['richtig','richtig'],['falsch','falsch']] : q.options;
    h += `<div class="opts" role="radiogroup">` + opts.map(([k,t]) =>
      `<button class="opt${optClass(p,q,k)}" role="radio" aria-checked="${state.ans[q.n]===k}" data-q="${q.n}" data-k="${k}" data-p="${p.id}">
        <span class="oval">${q.type==='tf'?'':k}</span><span>${q.type==='tf'?t:esc(t)}</span></button>`).join('') + `</div>`;
  } else if (q.type==='pick'){
    h += `<div class="row" role="radiogroup">` + p.choices.map(k =>
      `<button class="opt${optClass(p,q,k)}" role="radio" aria-checked="${state.ans[q.n]===k}" aria-label="${k}" data-q="${q.n}" data-k="${k}" data-p="${p.id}">
        <span class="oval"></span><span class="lab">${q.words ? k+' '+wordOf(p,k).toLowerCase() : k}</span></button>`).join('') + `</div>`;
  } else if (q.type==='email'){
    const v = state.notes[q.n] || {};
    h += `<div class="mailform">
      <label>An<input type="text" data-note="${q.n}" data-f="an" value="${esc(v.an||'')}"></label>
      <label>CC<input type="text" data-note="${q.n}" data-f="cc" value="${esc(v.cc||'')}"></label>
      <label>Betreff<input type="text" data-note="${q.n}" data-f="betreff" value="${esc(v.betreff||'')}"></label>
      <textarea data-note="${q.n}" data-f="text" placeholder="Sehr geehrter Herr Groß, …">${esc(v.text||'')}</textarea>
      <div class="wc" data-wc="${q.n}"></div></div>`;
  } else if (q.type==='text'){
    const v = state.notes[q.n] || {};
    h += `<div class="mailform"><textarea data-note="${q.n}" data-f="text" placeholder="Hallo zusammen, …">${esc(v.text||'')}</textarea><div class="wc" data-wc="${q.n}"></div></div>`;
  } else if (q.type==='notes'){
    const v = state.notes[q.n] || {}, rev = state.reveal[p.id];
    h = `<div class="q" id="q${q.n}"><div class="qhead"><span class="qn">42–45</span><div class="qp">Telefonnotiz · Firma: Musterfirma GmbH</div></div><div class="notes">` +
      q.fields.map(([f,l]) => `<label>${l}<input type="text" data-note="${q.n}" data-f="${f}" value="${esc(v[f]||'')}"></label>` +
        (rev ? `<div class="model">${esc(q.model[f])}</div>` : '')).join('') + `</div>`;
  }
  if (q.hint) h += `<details class="hint" data-d="h${q.n}"${state.open.has('h'+q.n)?' open':''}><summary>Tipp aus dem Hörtext</summary><p>${q.hint}</p></details>`;
  return h + `</div>`;
}
function transcript(t, id){
  return `<details class="script" data-d="s${id}"${state.open.has('s'+id)?' open':''}><summary>Hörtext anzeigen</summary>` + t.map(b =>
    `<div class="blk"><h5>${b.title}</h5>` + b.lines.map(([s,x]) => `<p>${s?`<i>${s}:</i> `:''}${x}</p>`).join('') + `</div>`).join('') + `</details>`;
}
function part(p){
  const qs = p.questions || [], gradable = qs.some(q => q.answer), hasNotes = qs.some(q => q.type==='notes');
  let h = `<section class="part" id="${p.id}"><h2>${p.title}</h2>`;
  if (p.instruction) h += `<p class="instr">${p.instruction}</p>`;
  if (p.audio) h += audioBlock(p.audio, p.track);
  if (p.texts) h += `<div class="text">${p.texts.join('')}</div>`;
  h += qs.map(q => question(p,q)).join('');
  if (p.transcript) h += transcript(p.transcript, p.id);
  if (gradable || hasNotes){
    let res = '';
    if (state.checked[p.id]){ const g = qs.filter(q=>q.answer), ok = g.filter(q=>state.ans[q.n]===q.answer).length;
      res = `<span class="result${ok===g.length?' full':''}">${ok} von ${g.length} richtig</span>`; }
    h += `<div class="bar">
      ${gradable?`<button class="btn" data-act="check" data-p="${p.id}">Antworten prüfen</button>`:''}
      <button class="btn ghost" data-act="reveal" data-p="${p.id}">${state.reveal[p.id]?'Lösung ausblenden':'Lösung zeigen'}</button>
      <button class="btn ghost" data-act="reset" data-p="${p.id}">Zurücksetzen</button>${res}</div>`;
  }
  return h + `</section>`;
}
function fillGaps(){
  document.querySelectorAll('.gap').forEach(g => {
    const n = +g.dataset.n, found = allQ().find(x => x.q.n===n); if (!found) return;
    const {q,p} = found, a = state.ans[n];
    let label = `(${n})`;
    if (a) label = `(${n}) ` + (q.options ? q.options.find(o=>o[0]===a)[1] : wordOf(p,a).toLowerCase());
    g.textContent = label;
    g.className = 'gap' + (a && state.checked[p.id] ? (a===q.answer?' ok':' bad') : '');
  });
}
function wordCounts(){
  document.querySelectorAll('[data-wc]').forEach(el => {
    const t = (state.notes[el.dataset.wc]||{}).text || '';
    const n = t.trim() ? t.trim().split(/\s+/).length : 0;
    el.textContent = `${n} Wörter` + (el.dataset.wc==='58' ? ' · Richtwert ca. 150' : '');
  });
}
function render(){
  const s = DATA.sections.find(x => x.id===state.sec);
  let h = '';
  if (s.intro_audio) h += `<div class="intro"><b>MP3 aus einem Ordner laden:</b> alle Hördateien auf einmal auswählen, sie werden automatisch den Teilen zugeordnet.<br>
    <label class="filebtn">Dateien auswählen<input type="file" accept="audio/*,.mp3" multiple id="bulk"></label>
    <div style="margin-top:10px">${audioBlock(s.intro_audio,'4.1 · Einleitung')}</div></div>`;
  h += s.parts.map(part).join('');
  $('#main').innerHTML = h;
  tabs(); score(); fillGaps(); wordCounts(); drawTimer(); bindAudio();
}
function bindAudio(){
  document.querySelectorAll('.audio').forEach(box => {
    const a = $('audio', box), err = $('.err', box);
    a.addEventListener('error', () => { err.hidden = false; });
    $('input[type=file]', box).addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      state.audio[box.dataset.file] = URL.createObjectURL(f); a.src = state.audio[box.dataset.file]; err.hidden = true;
    });
  });
  const bulk = $('#bulk');
  if (bulk) bulk.addEventListener('change', e => {
    [...e.target.files].forEach(f => { const m = f.name.match(/_(40\d)\.mp3$/i); if (m) state.audio[`9783061224745_${m[1]}.mp3`] = URL.createObjectURL(f); });
    render();
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-sec]');
  if (tab){ const t = timerObj(); t.run = false; clearInterval(tick);
    state.sec = tab.dataset.sec; render(); window.scrollTo(0,0); return; }
  const o = e.target.closest('.opt');
  if (o){ const pid = o.dataset.p; state.ans[o.dataset.q] = o.dataset.k;
    if (state.checked[pid]) delete state.checked[pid];
    const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  const b = e.target.closest('[data-act]');
  if (b){ const pid = b.dataset.p, p = DATA.sections.flatMap(s=>s.parts).find(x=>x.id===pid);
    if (b.dataset.act==='check') state.checked[pid] = true;
    if (b.dataset.act==='reveal') state.reveal[pid] = !state.reveal[pid];
    if (b.dataset.act==='reset'){ (p.questions||[]).forEach(q => { delete state.ans[q.n]; delete state.notes[q.n]; });
      delete state.checked[pid]; delete state.reveal[pid]; }
    const y = window.scrollY; render(); window.scrollTo(0,y); }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.note) return;
  (state.notes[el.dataset.note] ||= {})[el.dataset.f] = el.value; wordCounts();
});
document.addEventListener('toggle', e => {
  const d = e.target.dataset && e.target.dataset.d; if (!d) return;
  e.target.open ? state.open.add(d) : state.open.delete(d);
}, true);
render();
</script>
