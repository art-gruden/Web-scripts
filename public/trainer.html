", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Agentur sagt, dass sie", "options": [{"k": "a", "text": "Änderungen nur gegen Aufpreis macht ."}, {"k": "b", "text": "keine Fehler gemacht hat."}, {"k": "c", "text": "keine Vorgaben von Herrn Stiller hatte."}], "answer": "a", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo Frau Holsten,", "ich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die verbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das fünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele Korrekturen waren nicht vereinbart!", "Wenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra. Bitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben."], "close": "Danke und viele Grüße", "sign": ["Jutta Spindler"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Spindler,", "vielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:", "Zum einen hatten wir besprochen, dass das Farbschema grau orange (grün blau) sein sollte. Da statt Grau Blau (Grün Grau) gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett."], "close": "Mit freundlichen Grüßen", "sign": ["Franz Stiller"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Stiller,", "vielen Dank für Ihre Rückmeldung von heute. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Außerdem möchte ich Ihnen versichern, dass wir den Fehler im Nahmen bis Ende dieser Woche korrigieren werden. Bitte beachten Sie, dass das blau orange (grau blau) Farbschema in unserem Vertrag vereinbart ist. Zudem ist das schon die fünfte Bitte um Korrektur. So viele Korrekturen waren nicht vereinbart. Deswegen kostet jede weitere Korrektur 200 (300) €. Wenn Sie mit dieser Lösung einverstanden sind, geben Sie mir bitte Bescheid.", "Vielen Dank für Ihr Verständnis."], "close": "Mit freundlichen Grüßen", "sign": ["Monika Holsten"]}], "extra": [], "check": ["Vertauschte Namen: unser Fehler, wird korrigiert", "Farbschema entspricht den Vorgaben / Vertrag", "Schon die fünfte Korrektur: weitere nur gegen Aufpreis (200 / 300 €)", "Um Zustimmung (Okay) des Kunden bitten"], "num": "3", "ver": "", "test": "", "theme": "Webseite"}, {"id": "b-70-4", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 4) – 100%", "sub": ["Spülmaschine"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Der Kunde", "options": [{"k": "a", "text": "fordert eine neue Spülmaschine."}, {"k": "b", "text": "hat einen Wasserschaden in der Küche."}, {"k": "c", "text": "beschwert sich über die Reparaturarbeiten."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Firma Küchenbedarf soll", "options": [{"k": "a", "text": "die Reparatur der Spülmaschine in Rechnung stellen."}, {"k": "b", "text": "innerhalb von zwei Tagen die Spülmaschine reparieren."}, {"k": "c", "text": "das Parkett in der Teeküche umgehend ersetzen."}], "answer": "b", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo Frau Retterstein,", "ich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat. Organisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und schreiben Sie Herrn Krüger.", "Entschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, dass wir seine Forderungen in seiner E-Mail prüfen werden.", "Teilen Sie Herrn Krüger aber bitte vorsorglich mit, dass die Reparatur eventuell nicht sofort durchgeführt werden kann, falls wir Ersatzteile bestellen müssen."], "close": "Danke und viele Grüße", "sign": ["Dorothee Sturm"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Sturm,", "vor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.", "Ich bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.", "Außerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.", "Bitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank!"], "close": "Mit freundlichen Grüßen", "sign": ["Claudio Krüger"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Krüger,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Unserer Techniker könnte am kommenden Montag 27.05.2024 um 8:00 Uhr kommen, um die Spülmaschine und das beschädigten Parkett zu überprüfen. Bitte teilen Sie uns mit, ob der Termin stattfinden kann. Beachten Sie, dass falls wir Ersatzteile für die Reparatur bestellen müssen, keine umgehende Reparatur möglich ist. Detaillierte Information können wir Ihnen nach der Überprüfung geben. Wir danken Ihnen für Ihr Verständnis."], "close": "Mit freundlichen Grüßen", "sign": ["Anika Retterstein"]}], "extra": [], "check": ["Für die Unannehmlichkeiten entschuldigen", "Termin für einen Techniker vorschlagen", "Forderungen (Parkett) werden geprüft", "Hinweis: Reparatur evtl. nicht sofort, falls Ersatzteile bestellt werden müssen"], "num": "4", "ver": "", "test": "", "theme": "Spülmaschine"}, {"id": "b-71-5", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 5)", "sub": ["Umzug"], "sets": [{"label": "Варіант питань 1", "questions": [{"n": 19, "type": "mc", "prompt": "Herr Zaun beschwert sich über", "options": [{"k": "a", "text": "die Mitarbeiter der Firma."}, {"k": "b", "text": "die Qualität von Produkten."}, {"k": "c", "text": "eine ausbleibende Lieferung."}], "answer": "a", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Herr Zaun", "options": [{"k": "a", "text": "ist nach Hanau gezogen."}, {"k": "b", "text": "musste seinen Umzug verschieben."}, {"k": "c", "text": "verlangt Schadensersatz."}], "answer": "c", "src": "claude"}]}, {"label": "Варіант питань 2", "questions": [{"n": 19, "type": "mc", "prompt": "Beim Umzug", "options": [{"k": "a", "text": "haben vier Möbelpacker gearbeitet."}, {"k": "b", "text": "kam es zu Verzögerungen."}, {"k": "c", "text": "wurden nicht alle Möbel transportiert."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Herr Lozano", "options": [{"k": "a", "text": "musste seinen Umzug verschieben."}, {"k": "b", "text": "verlangt Schadensersatz."}, {"k": "c", "text": "ist nach Hanau gezogen."}], "answer": "b", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo Frau Kühne,", "bitte schauen Sie sich mal die unten stehende E-Mail an.", "Da ist wohl was schiefgegangen. Bitte schreiben Sie Herrn Zaun / Lozano und erklären Sie ihm, warum es zu den Fehlern gekommen ist. Sagen Sie ihm zu, dass am Mittwochmorgen pünktlich zwei Männer da sein werden, die alles fertig machen.", "Natürlich übernehmen wir auch die Verantwortung für die entstandenen Schäden.", "Die Firma hat uns das erste Mal gebucht und ich würde ungern einen negativen Eindruck hinterlassen. Ich verlasse mich auf Sie."], "close": "Danke und viele Grüße", "sign": ["Frieda Börne / Sophia Prince"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Börne, / Prince", "am Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.", "Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.", "Bitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt."], "close": "Mit freundlichen Grüßen", "sign": ["Thomas Zaun / Matteo Lozano"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Zaun, / Lozano", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Der Grund dafür war, dass unsere Mitarbeiter auf dem Weg zu Ihnen eine kleine Autopanne hatten. Außerdem hatten sich einige Mitarbeiter in der letzten Woche krank gemeldet, was zu Personalmangel führte. Wir möchten Ihnen versichern, dass diese Situation sich nicht wiederholen wird. Zudem werden zwei unserer Mitarbeiter am Mittwochmorgen pünktlich bei Ihnen sein. Natürlich möchten wir Sie als Kunden zufriedenstellen, deswegen übernehmen wir die Kosten für die beschädigten Möbel.", "Wir freuen uns weiterhin auf eine Zusammenarbeit."], "close": "Mit freundlichen Grüßen", "sign": ["Monika Kühne"]}], "extra": [], "check": ["Erklären, warum es zu den Fehlern gekommen ist", "Mittwochmorgen kommen pünktlich zwei Männer für den Aufbau", "Verantwortung für die Schäden übernehmen", "Positiven Eindruck hinterlassen (Kunde bucht zum ersten Mal)"], "num": "5", "ver": "", "test": "", "theme": "Umzug"}, {"id": "b-72-6", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 6) – 100%", "sub": ["(тест №150321, 150301)", "Der Drucker"], "sets": [{"label": "Варіант питань 1", "questions": [{"n": 19, "type": "mc", "prompt": "Das Gerät", "options": [{"k": "a", "text": "ist erst seit Kurzem im Einsatz."}, {"k": "b", "text": "muss noch mal überprüft werden."}, {"k": "c", "text": "wurde immer richtig bedient."}], "answer": "a", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Firma Copyprofi", "options": [{"k": "a", "text": "besteht auf der Bezahlung der Rechnungen."}, {"k": "b", "text": "repariert den Kopierer noch einmal kostenfrei."}, {"k": "c", "text": "tauscht das Gerät schnellstmöglich aus."}], "answer": "a", "src": "claude"}]}, {"label": "Варіант питань 2", "questions": [{"n": 19, "type": "mc", "prompt": "Beim Gerät", "options": [{"k": "a", "text": "handelt sich um ein älteres Modell."}, {"k": "b", "text": "kommt es häufig zu Papierstaus."}, {"k": "c", "text": "wurde es nur einmal überprüft."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Herr Schmidt", "options": [{"k": "a", "text": "verlangt die Lieferung eines neuen Geräts."}, {"k": "b", "text": "möchte weitere Technikertermine vereinbaren."}, {"k": "c", "text": "akzeptiert die bisherigen Rechnungen."}], "answer": "a", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "schau dir mal die Mail von der Firma Mova an. Laut unserem Techniker lag der Fehler erneut an der falschen Bedienung des Geräts. Antworte Herrn Schmidt bitte und weise ihn höflich daraufhin, dass die Lösung des Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter* innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben die Angelegenheit der Mova GmbH."], "close": "Viele Grüße", "sign": ["Sibyl Aichele"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Aichele,", "vorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.", "Ich erwarte Ihre umgehende Rückmeldung."], "close": "Mit freundlichen Grüßen", "sign": ["Benno Schmidt"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Schmidt,", "bezugnehmend auf Ihre Beschwerde entschuldigen wir uns für die Unannehmlichkeiten. Es tut uns leid, dass ein Fehler im Drucker aufgetreten ist. Nach Rücksprache mit unserem Techniker wurde festgestellt, dass die Fehler auf eine fehlerhafte Bedienung des Geräts zurückzuführen sind. Wir möchten Sie daher höflich darauf hinweisen, dass die Lösung dieses Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter*innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben bei Ihnen.", "Wir hoffen, dass Sie trotz des Vorfalls auch weiterhin unser treuer Kunde bleiben."], "close": "Mit freundlichen Grüßen", "sign": []}, {"role": "answer", "lines": ["Sehr geehrte/r Frau/Herr …,", "vielen Dank für Ihre E-Mail. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten, die Ihnen entstanden sind. Wir möchten Ihnen mitteilen, dass unsere Firma nur dann Verantwortung übernimmt, wenn die Drucker technische Probleme mit internen Teilen haben. Bei den letzten drei Einsätzen unseres Tec  Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit, was wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten."], "close": "Vielen Dank und viele Grüße", "sign": ["Michael Herrmann", "Teamleiter"]}, {"role": "complaint", "lines": ["Sehr geehrter Herr Herrmann,", "leider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung."], "close": "Mit freundlichen Grüßen", "sign": ["Gabi Talheim"]}, {"role": "answer", "lines": ["Sehr geehrte Frau Talheim,", "wir bedanken uns für Ihre E-Mail sowie für den Hinweis auf unser Versehen beziehungsweise darauf, dass Sie statt der bestellten regionalen Blumen Orchideen erhalten haben. Im Namen des ganzen Teams entschuldigen wir uns für die entstandenen Unannehmlichkeiten. Der Grund der falschen Lieferung liegt darin, dass die Artikelnummern während des Bestellprozesses verwechselt wurden. Dadurch haben wir exotische Blumen zukommen lassen, die nicht für das Thema Ihrer Ausstellung geeignet waren. Bezüglich der Situation, dass Sie umgehend eine Ersatzlösung über einen anderen Lieferanten finden mussten, werden wir selbstverständlich die dadurch entstandenen Kosten übernehmen. Darüber hinaus gewähren wir Ihnen einen Preisnachlass von 15% auf die nächste Bestellung. Alternativ kann ein Gutschein für zusätzliche Leistungen angeboten werden. Bitte lassen Sie uns wissen, welche Lösung Sie bevorzugen. Wir würden uns freuen, Sie weiterhin zu unseren zufriedenen Kunden zählen zu dürfen."], "close": "Mit freundlichen Grüßen", "sign": []}], "extra": ["Ссылка на другой вариант ответа https://t.me/B2_C2_Deutsch/65534/225932"], "check": ["Höflich antworten und Grund der falschen Lieferung erklären", "Vorschläge für die weitere Zusammenarbeit machen", "Entschädigung anbieten (z. B. Kosten übernehmen, Rabatt)"], "num": "9", "ver": "", "test": "", "theme": "Pflanzenlieferung"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('dtbL:'+k); return v==null? d : JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem('dtbL:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const TABS = [
  {id:'t1', label:'Teil 1', pts:'1–5', key:'teil1', info:'Zuordnung: Welche Anzeige passt zu welcher Person? 5 × 3 Punkte. Jede Anzeige nur einmal, drei bleiben übrig.'},
  {id:'t2', label:'Teil 2', pts:'6–9', key:'teil2', info:'Willkommensmappe: Richtig/Falsch und Multiple Choice (Text 1: Aufgaben 6–7, Text 2: Aufgaben 8–9). 4 × 3 Punkte.'},
  {id:'t3', label:'Teil 3', pts:'10–13', key:'teil3', info:'Forum: Welche Antwort passt zu welchem Beitrag? Wenn keine passt: X. 4 × 3 Punkte.'},
  {id:'t4', label:'Teil 4', pts:'14–18', key:'teil4', info:'Protokoll: Multiple Choice zu den Tagesordnungspunkten. 5 × 3 Punkte.'},
  {id:'b', label:'Beschwerde', pts:'19–21', key:'beschwerde', info:'Lesen und Schreiben: zwei Fragen zu den E-Mails (2 × 3 Punkte), dann Aufgabe 21 — Antwort an den Kunden schreiben (20 Minuten zusammen).'},
  {id:'exam', label:'Пробний тест', pts:'60', key:null, info:''}
];

let state = { tab: store.get('tab','t1'), sel: store.get('sel', {}), set: {} };

function renderTabs(){
  const nav = document.getElementById('tabs'); nav.innerHTML='';
  TABS.forEach(t => {
    const b = el(`<button role="tab" aria-selected="${state.tab===t.id}">${esc(t.label)}<span class="pts">${esc(t.pts)}</span></button>`);
    b.onclick = () => { state.tab=t.id; store.set('tab',t.id); render(); window.scrollTo({top:0}); };
    nav.appendChild(b);
  });
}

function chipLabel(v, tabId){
  let main = 'В' + v.num;
  let sub = [];
  if (tabId==='t2') sub.push(v.topic);
  if (tabId==='t4' || tabId==='b') sub.push(v.theme);
  if (v.ver) sub.push(v.ver);
  if (v.test) sub.push('тест ' + v.test);
  return {main, sub: sub.filter(Boolean).join(' · ')};
}

// ---------- question model: each "unit" = list of items {qid, kind, answer, src, unsure, ...}
function bestKey(v, si){ return 'best:'+v.id+':'+(si||0); }

function render(){
  renderTabs();
  const app = document.getElementById('app'); app.innerHTML='';
  const tab = TABS.find(t=>t.id===state.tab);
  if (tab.id==='exam'){ renderExam(app); return; }
  const list = D[tab.key];
  app.appendChild(el(`<p class="intro">${esc(tab.info)}</p>`));
  const vs = el('<div class="variants"></div>');
  let lastGroup = null;
  list.forEach((v,i) => {
    if (tab.id==='t2' && v.text!==lastGroup){ lastGroup=v.text; vs.appendChild(el(`<div class="groupLabel">${v.text==='Text 1'?'Text 1 · Aufgaben 6–7':'Text 2 · Aufgaben 8–9'}</div>`)); }
    const {main, sub} = chipLabel(v, tab.id);
    const best = store.get(bestKey(v,0), null);
    const c = el(`<button class="chip" aria-pressed="${(state.sel[tab.id]??0)===i}"><b>${esc(main)}</b>${sub?`<span class="v">${esc(sub)}</span>`:''}${best?`<span class="best">${best.r}/${best.n}</span>`:''}</button>`);
    c.onclick = () => { state.sel[tab.id]=i; store.set('sel',state.sel); render(); };
    vs.appendChild(c);
  });
  app.appendChild(vs);
  const v = list[state.sel[tab.id]??0] || list[0];
  app.appendChild(renderTask(tab.id, v, {}));
}

// ---------- reading renderers
function readingT1(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>Welche Anzeige passt?</h2>`;
  if (v.note) h += `<p class="meta">${esc(v.note)}</p>`;
  v.options.forEach(o => { h += `<div class="opt"><span class="k">${o.k})</span><span class="t">${esc(o.title)}</span><p>${esc(o.body)}</p></div>`; });
  return h;
}
function readingT3(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>Forumsbeiträge</h2>`;
  if (v.note) h += `<p class="meta">${esc(v.note)}</p>`;
  v.persons.forEach(p => { h += `<div class="persona"><p><b>${p.n}.</b> <strong>${esc(p.name)}</strong></p><p>${esc(p.body)}</p></div>`; });
  h += `<h3>Antworten</h3>`;
  v.options.forEach(o => { h += `<div class="opt"><span class="k">${o.k})</span><span class="t">${esc(o.title)}</span><p>${esc(o.body)}</p>${o.old_body?`<div class="old">Старий варіант: ${esc(o.old_body)}</div>`:''}</div>`; });
  return h;
}
function paraHTML(p){
  if (/^TOP\s*\d+/.test(p) && p.length < 90) return `<h3>${esc(p)}</h3>`;
  if (/^TOP\s*\d+/.test(p)) { const m = p.match(/^(TOP\s*\d+\s+(?:[A-ZÄÖÜ„"][^\s]*\s?){1,6}?)(?=[A-ZÄÖÜ]{1,3}\s|Unser|Die |Der |Da |Seit |Wie |Mit |Im |Aufgrund|Zu den|Unsere)/); if (m) return `<h3>${esc(m[1].trim())}</h3><p>${esc(p.slice(m[1].length))}</p>`; return `<p><strong>${esc(p)}</strong></p>`; }
  if (/^(Teilnehmende|Anwesende|Sitzungsleitung|Protokoll|Entschuldigt|Extern|Gast|Nicht Anwesende|Besprechungsraum|Sitzungsraum|Tagungsraum|Konferenzraum|Zentrale|Abteilung \d|Ort:)/.test(p)) return `<p class="meta">${esc(p)}</p>`;
  return `<p>${esc(p)}</p>`;
}
function readingText(v, kind){
  let h = `<div class="kicker">${kind==='t2'?'Lesen Teil 2 · ':''}${esc(v.title)}</div>`;
  if (kind==='t2') h += `<p class="meta">Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter</p>`;
  h += `<h2>${esc(v.topic || (kind==='t4'?'Protokoll':''))}</h2>`;
  let agenda = [];
  const flush = () => { if (agenda.length){ h += `<ol class="agenda">${agenda.map(a=>`<li>${esc(a.replace(/^\d\.\s*/,''))}</li>`).join('')}</ol>`; agenda=[]; } };
  v.paras.forEach(p => {
    if (kind==='t4' && /^\d\.\s/.test(p)) { agenda.push(p); return; }
    flush();
    if (/^Tagesordnungspunkte/.test(p)) { h += `<h3>Tagesordnungspunkte</h3>`; return; }
    h += paraHTML(p);
  });
  flush();
  return h;
}
const ROLE = {boss:'Interne E-Mail · Auftrag', complaint:'E-Mail des Kunden · Beschwerde', answer:'Musterantwort'};
function mailHTML(m){
  return `<div class="mail"><div class="mh"><span>${ROLE[m.role]}</span></div><div class="mb">${m.lines.map(l=>`<p>${esc(l)}</p>`).join('')}${m.close?`<p class="sig">${esc(m.close)}${m.sign.length?'<br>'+m.sign.map(esc).join('<br>'):''}</p>`:''}</div></div>`;
}
function readingB(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>${esc(v.theme || 'Beschwerde')}</h2>`;
  v.sub.filter(s=>s!==v.theme).forEach(s=> h += `<p class="meta">${esc(s)}</p>`);
  v.mails.filter(m=>m.role!=='answer').forEach(m => h += mailHTML(m));
  if (!v.mails.some(m=>m.role!=='answer')) h += `<p class="meta">Для цього варіанта в джерелі є лише тема та зразок відповіді.</p>`;
  return h;
}

// ---------- answer sheet
function itemsOf(tabId, v, si){
  if (tabId==='t1') return v.persons.map(p => ({n:p.n, kind:'match', prompt:p.text, keys:v.options.map(o=>o.k), answer:p.answer, src:'src'}));
  if (tabId==='t3') return v.persons.map(p => ({n:p.n, kind:'match', prompt:p.name, keys:[...v.options.map(o=>o.k),'x'], answer:p.answer, src:'src'}));
  const set = v.sets[si] || {questions:[]};
  return set.questions.map(q => ({n:q.n, kind:q.type==='rf'?'rf':'mc', prompt:q.prompt, options:q.options, answer:q.answer, src:q.src, unsure:q.unsure}));
}

function renderTask(tabId, v, opts){
  const box = el('<section class="task"></section>');
  const reading = el('<article class="reading"></article>');
  reading.innerHTML = tabId==='t1'?readingT1(v): tabId==='t3'?readingT3(v): tabId==='b'?readingB(v): readingText(v, tabId);
  box.appendChild(reading);
  const sheet = el('<aside class="sheet" aria-label="Antwortbogen"></aside>');
  box.appendChild(sheet);
  const sets = (tabId==='t1'||tabId==='t3') ? [{label:''}] : v.sets;
  const sk = v.id;
  let si = Math.min(state.set[sk]??0, Math.max(0, sets.length-1));
  const draw = () => {
    sheet.innerHTML = '';
    sheet.appendChild(el(`<h3>Antwortbogen</h3>`));
    if (sets.length>1){
      const st = el('<div class="setTabs"></div>');
      sets.forEach((s,i)=>{ const b = el(`<button aria-pressed="${i===si}">${esc(setLabel(s,i))}</button>`); b.onclick=()=>{si=i; state.set[sk]=i; draw();}; st.appendChild(b); });
      sheet.appendChild(st);
    }
    if (!sets.length){ sheet.appendChild(el('<p class="fb" style="padding:0">Для цього варіанта питань 19–20 немає — тренуйте письмо (Aufgabe 21) нижче.</p>')); }
    else {
      const items = itemsOf(tabId, v, si);
      sheet.appendChild(quiz(items, v, si, tabId));
    }
  };
  draw();
  if (tabId==='b') box.appendChild(writing(v));
  return box;
}
function setLabel(s,i){
  const l = (s.label||'').replace(/[-–]\s*100%/,'').trim();
  return l ? l : (i===0?'Основна версія':'Версія '+(i+1));
}

function quiz(items, v, si, tabId, examHook){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
  const picks = {};
  let checked = false;
  const rows = items.map(it => {
    const q = el(`<div class="q"><div class="qh"><span class="qn">${it.n}</span><span class="qp">${esc(it.prompt)}</span></div></div>`);
    let ctrls = [];
    if (it.kind==='match' || it.kind==='rf'){
      const keys = it.kind==='rf' ? [['r','richtig'],['f','falsch']] : it.keys.map(k=>[k, k==='x'?'X':k]);
      const bubs = el('<div class="bubs"></div>');
      keys.forEach(([k,lab]) => {
        const b = el(`<button class="bub ${it.kind==='rf'?'wide':''}" aria-pressed="false" aria-label="${it.n}: ${lab}">${esc(lab)}</button>`);
        b.onclick = () => { if (checked) return; picks[it.n]=k; ctrls.forEach(c=>c.b.setAttribute('aria-pressed', c.k===k)); if (examHook) examHook(); };
        bubs.appendChild(b); ctrls.push({k,b});
      });
      q.appendChild(bubs);
    } else {
      const list = el('<div class="mcopts"></div>');
      it.options.forEach(o => {
        const b = el(`<button class="mcopt" aria-pressed="false"><span class="dot">${esc(o.k)}</span><span>${esc(o.text)}</span></button>`);
        b.onclick = () => { if (checked) return; picks[it.n]=o.k; ctrls.forEach(c=>c.b.setAttribute('aria-pressed', c.k===o.k)); if (examHook) examHook(); };
        list.appendChild(b); ctrls.push({k:o.k,b});
      });
      q.appendChild(list);
    }
    const fb = el('<div class="fb" hidden></div>'); q.appendChild(fb);
    wrap.appendChild(q);
    return {it, ctrls, fb};
  });
  const scoreBox = el('<div class="score" hidden></div>');
  const act = el('<div class="actions"></div>');
  const bCheck = el('<button class="btn">Перевірити</button>');
  const bShow = el('<button class="btn ghost">Показати відповіді</button>');
  const bReset = el('<button class="btn quiet">Скинути</button>');
  const grade = (reveal) => {
    checked = true; let r = 0;
    rows.forEach(({it,ctrls,fb}) => {
      const p = picks[it.n];
      if (p===it.answer) r++;
      ctrls.forEach(c => {
        c.b.classList.remove('right','wrongpick','solution');
        if (c.k===it.answer && p===it.answer) c.b.classList.add('right');
        else if (c.k===p) c.b.classList.add('wrongpick');
        if (c.k===it.answer && p!==it.answer) c.b.classList.add('solution');
      });
      const lab = it.kind==='rf' ? (it.answer==='r'?'richtig':'falsch') : (it.answer==='x'?'X':it.answer);
      fb.hidden = false;
      fb.innerHTML = (p===it.answer ? '✓ правильно' : (p? '✗ правильна відповідь: <b>'+esc(lab)+'</b>' : 'без відповіді · правильна: <b>'+esc(lab)+'</b>'))
        + (it.src==='claude' ? '<span class="tag" title="У джерелі відповідь не позначена — визначено за текстом">ключ за текстом</span>' : '')
        + (it.unsure ? '<span class="tag warn">неоднозначно</span>' : '');
    });
    const n = rows.length;
    scoreBox.hidden = false;
    scoreBox.innerHTML = `<span class="big">${r}/${n}</span><span class="pts">${r*3} з ${n*3} балів</span>`;
    if (!reveal && !examHook){
      const k = bestKey(v, si); const prev = store.get(k, null);
      if (!prev || r > prev.r) store.set(k, {r, n});
    }
    return r;
  };
  bCheck.onclick = () => grade(false);
  bShow.onclick = () => grade(true);
  bReset.onclick = () => {
    checked = false; Object.keys(picks).forEach(k=>delete picks[k]);
    rows.forEach(({ctrls,fb}) => { fb.hidden = true; ctrls.forEach(c => { c.b.setAttribute('aria-pressed','false'); c.b.classList.remove('right','wrongpick','solution'); }); });
    scoreBox.hidden = true;
  };
  if (!examHook){ act.append(bCheck, bShow, bReset); wrap.append(scoreBox, act); }
  if (tabId!=='t1' && tabId!=='t3' && !examHook) wrap.appendChild(el('<p class="legend">«ключ за текстом» — у джерелі відповідь не була позначена, її визначено за змістом тексту.</p>'));
  wrap._grade = grade; wrap._count = () => rows.length; wrap._answered = () => Object.keys(picks).length;
  return wrap;
}

const PHRASES = [
  'Vielen Dank für Ihre E-Mail, in der Sie uns auf … hinweisen.',
  'Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung.',
  'Der Grund dafür ist, dass … / Lassen Sie mich kurz erklären, was passiert ist.',
  'Wir möchten Ihnen versichern, dass sich diese Situation nicht wiederholen wird.',
  'Als Entschädigung bieten wir Ihnen … an. / Wir möchten Ihnen Folgendes vorschlagen: …',
  'Bitte teilen Sie uns mit, ob Sie mit dieser Lösung einverstanden sind.',
  'Wir freuen uns auf die weitere Zusammenarbeit. Mit freundlichen Grüßen'
];
function writing(v){
  const box = el('<article class="reading write" style="grid-column:1/-1"></article>');
  box.appendChild(el(`<div><div class="kicker">Aufgabe 21 · 7 Punkte</div><h2>Schreiben Sie eine E-Mail an den Kunden</h2><p class="meta">Відповідайте від імені співробітника, якому адресовано внутрішній лист. Зверніться до клієнта, виконайте всі пункти доручення, пишіть ввічливо (ca. 80–100 Wörter).</p></div>`));
  const ta = el(`<textarea id="w-${v.id}" placeholder="Sehr geehrte/r …,&#10;&#10;vielen Dank für Ihre E-Mail …"></textarea>`);
  ta.value = store.get('draft:'+v.id, '');
  const wc = el('<div class="wc"></div>');
  const upd = () => { const n = (ta.value.trim().match(/\S+/g)||[]).length; wc.textContent = n + ' Wörter'; store.set('draft:'+v.id, ta.value); };
  ta.addEventListener('input', upd); upd();
  const grid = el('<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:20px;align-items:start"></div>');
  const left = el('<div style="display:flex;flex-direction:column;gap:6px;min-width:0"></div>'); left.append(ta, wc);
  const right = el('<div style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>');
  if (v.check && v.check.length){
    const cl = el('<div><h3 style="margin:0 0 6px">Що має бути в листі</h3><ul class="check"></ul></div>');
    const done = store.get('chk:'+v.id, {});
    v.check.forEach((c,i) => {
      const li = el(`<li><label><input type="checkbox" id="c-${v.id}-${i}" ${done[i]?'checked':''}><span>${esc(c)}</span></label></li>`);
      li.querySelector('input').onchange = (e) => { done[i]=e.target.checked; store.set('chk:'+v.id, done); };
      cl.querySelector('ul').appendChild(li);
    });
    right.appendChild(cl);
  }
  right.appendChild(el(`<div class="phr"><h3 style="margin:0">Redemittel</h3><ul>${PHRASES.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`));
  grid.append(left, right);
  if (window.matchMedia('(max-width:700px)').matches) grid.style.gridTemplateColumns = 'minmax(0,1fr)';
  box.appendChild(grid);
  const answers = v.mails.filter(m=>m.role==='answer');
  answers.forEach((m,i) => {
    const d = el(`<details class="model"><summary>Показати зразок відповіді${answers.length>1?' '+(i+1):''}</summary></details>`);
    d.appendChild(el(mailHTML(m)));
    box.appendChild(d);
  });
  (v.extra||[]).forEach(x => { const m = x.match(/https?:\/\/\S+/); if (m) box.appendChild(el(`<p class="meta">Ще один варіант відповіді: <a href="${esc(m[0])}" target="_blank" rel="noopener">${esc(m[0])}</a></p>`)); });
  return box;
}

// ---------- mock exam
let exam = null, timerId = null;
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function newExam(){
  const t2a = D.teil2.filter(v=>v.text==='Text 1'), t2b = D.teil2.filter(v=>v.text==='Text 2');
  const bq = D.beschwerde.filter(v=>v.sets.length);
  const pickSet = v => Math.floor(Math.random()*v.sets.length);
  const t2av = pick(t2a), t2bv = pick(t2b), t4v = pick(D.teil4), bv = pick(bq);
  exam = { parts: [
    {tab:'t1', v:pick(D.teil1), si:0, title:'Teil 1 · Aufgaben 1–5'},
    {tab:'t2', v:t2av, si:pickFull(t2av,[6,7]), title:'Teil 2 · Text 1 · Aufgaben 6–7'},
    {tab:'t2', v:t2bv, si:pickFull(t2bv,[8,9]), title:'Teil 2 · Text 2 · Aufgaben 8–9'},
    {tab:'t3', v:pick(D.teil3), si:0, title:'Teil 3 · Aufgaben 10–13'},
    {tab:'t4', v:t4v, si:0, title:'Teil 4 · Aufgaben 14–18'},
    {tab:'b', v:bv, si:pickSet(bv), title:'Lesen und Schreiben · Aufgaben 19–20'}
  ], end: Date.now() + 65*60*1000, done:false };
}
function pickFull(v, need){
  const ok = v.sets.map((s,i)=>[i, need.every(n=>s.questions.some(q=>q.n===n))]).filter(x=>x[1]).map(x=>x[0]);
  return ok.length ? pick(ok) : 0;
}
function renderExam(app){
  if (timerId) { clearInterval(timerId); timerId=null; }
  app.appendChild(el(`<p class="intro">Випадкова збірка: по одному варіанту з кожної частини — 20 завдань × 3 бали = 60 балів. На іспиті: Lesen 45 хв + Lesen und Schreiben 20 хв (разом із листом). Таймер — 65 хвилин.</p>`));
  if (!exam){
    const start = el('<div class="exam-head"><div><b>Готові?</b><div class="phr">Відповіді перевіряються наприкінці.</div></div><button class="btn">Почати пробний тест</button></div>');
    start.querySelector('button').onclick = () => { newExam(); render(); };
    app.appendChild(start); return;
  }
  const head = el(`<div class="exam-head"><div><div class="phr">Залишилось часу</div><div class="timer" id="timer">65:00</div></div><div class="phr" id="progress"></div><div class="actions"><button class="btn" id="finish">Завершити й перевірити</button><button class="btn quiet" id="restart">Нова збірка</button></div></div>`);
  app.appendChild(head);
  const quizzes = [];
  const updProg = () => { const a = quizzes.reduce((s,q)=>s+q._answered(),0), n = quizzes.reduce((s,q)=>s+q._count(),0); document.getElementById('progress').textContent = `Відповіді: ${a} / ${n}`; };
  exam.parts.forEach(p => {
    const sec = el(`<section class="exam-part"><h2>${esc(p.title)}</h2><p class="hint">${esc(p.v.title)}</p></section>`);
    const task = el('<div class="task"></div>');
    const reading = el('<article class="reading"></article>');
    reading.innerHTML = p.tab==='t1'?readingT1(p.v): p.tab==='t3'?readingT3(p.v): p.tab==='b'?readingB(p.v): readingText(p.v, p.tab);
    const sheet = el('<aside class="sheet"><h3>Antwortbogen</h3></aside>');
    let items = itemsOf(p.tab, p.v, p.si);
    if (p.tab==='t2'){ const need = p.v.text==='Text 1'?[6,7]:[8,9]; items = items.filter(i=>need.includes(i.n)); }
    const qz = quiz(items, p.v, p.si, p.tab, updProg);
    quizzes.push(qz); sheet.appendChild(qz);
    task.append(reading, sheet); sec.appendChild(task);
    if (p.tab==='b') sec.appendChild(writing(p.v));
    app.appendChild(sec);
  });
  updProg();
  const result = el('<div class="exam-head" hidden id="result"></div>');
  app.appendChild(result);
  const finish = () => {
    if (exam.done) return; exam.done = true;
    let r = 0, n = 0; quizzes.forEach(q => { r += q._grade(false); n += q._count(); });
    result.hidden = false;
    result.innerHTML = `<div><div class="phr">Результат (без листа, Aufgabe 21 оцінюється окремо)</div><div class="timer">${r}/${n} · ${r*3} балів</div></div>`;
    head.querySelector('#finish').disabled = true;
    clearInterval(timerId); timerId=null;
    result.scrollIntoView({behavior:'smooth', block:'center'});
  };
  head.querySelector('#finish').onclick = finish;
  head.querySelector('#restart').onclick = () => { exam = null; render(); };
  const tick = () => {
    const t = document.getElementById('timer'); if (!t) { clearInterval(timerId); return; }
    const left = Math.max(0, exam.end - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    t.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    t.classList.toggle('low', left < 5*60000);
    if (left===0) finish();
  };
  if (exam.done){ head.querySelector('#finish').disabled = true; }
  else { tick(); timerId = setInterval(tick, 1000); }
}

render();
</script>
