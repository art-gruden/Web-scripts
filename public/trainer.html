um lohnt es sich, bei einem Autobauer oder Zulieferer zu arbeiten? Welche Berufe sind am meisten gefragt?": "Особливо на південному заході Німеччини люди й надалі можуть розраховувати на надійні та добре оплачувані робочі місця в автомобільній промисловості. Чому варто працювати в автовиробника чи постачальника? Які професії найзатребуваніші?", "Firmen setzen auf flexible Arbeitsbedingungen.": "Фірми роблять ставку на гнучкі умови праці.", "In vielen Branchen sind Fachkräfte gefragt wie nie zuvor. Dabei haben immer mehr Firmen Schwierigkeiten, ihre Angestellten langfristig zu halten. Wer kann, wechselt schnell zu einem Arbeitgeber mit besseren Bedingungen. Viele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita oder Homeoffice.": "У багатьох галузях фахівці затребувані як ніколи. Водночас дедалі більше фірм мають труднощі з тим, щоб надовго втримати своїх працівників. Хто може, швидко переходить до роботодавця з кращими умовами. Багато великих підприємств тепер більше роблять ставку на гнучкість і сімейно-орієнтовані пільги, як-от корпоративний дитсадок чи хоумофіс.", "Förderung von Selbstständigen.": "Підтримка самозайнятих.", "In den letzten Jahren ist die Zahl der Selbstständigen stetig gestiegen. Das liegt unter anderem auch an neuen staatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten.": "За останні роки кількість самозайнятих постійно зростала. Це пов'язано, зокрема, з новими державними можливостями підтримки молодих підприємців, які хочуть відкрити власну справу.", "Sein eigener Chef sein!": "Будь сам собі начальником!", "Du willst keine starren Arbeitszeiten, weiten Anfahrtswege und keinen nervigen Umgang mit Kollegen und Chefs? Dann ist der Weg in die Existenzgründung eine echte Alternative. Ob als Übersetzer, Programmierer oder Steuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene Rechnung zu arbeiten.": "Не хочеш жорсткого робочого графіка, далеких поїздок на роботу і набридливого спілкування з колегами та начальством? Тоді заснування власної справи — справжня альтернатива. Перекладач, програміст чи податковий консультант — Тео Гертц порадить, як використати свої фахові знання, щоб працювати вдома і на себе.", "Ungelernte Arbeitskräfte weiterhin benachteiligt.": "Некваліфіковані працівники й надалі в невигідному становищі.", "Je höher die Qualifikation, desto besser die Chancen auf dem Arbeitsmarkt. Wer keine Berufsausbildung hat, läuft Gefahr, in die Langzeitarbeitslosigkeit abzustürzen. Wer Arbeit hat, muss als Ungelernter mit geringerem Gehalt und schlechteren Aufstiegschancen rechnen.": "Що вища кваліфікація, то кращі шанси на ринку праці. Хто не має професійної освіти, ризикує опинитися в тривалому безробітті. Хто має роботу, як некваліфікований працівник мусить розраховувати на нижчу зарплату і гірші шанси на кар'єрне зростання.", "Möglichkeiten, mit einer Kündigung umzugehen.": "Як упоратися зі звільненням.", "Du fühlst dich nach einer Kündigung gedemütigt und alleine gelassen und weißt nicht, wie es weitergehen soll? Das kann auch eine Chance sein, sich neu zu orientieren und vielleicht sogar die eigene Berufung zu finden.": "Після звільнення почуваєшся приниженим і покинутим і не знаєш, як жити далі? Це може бути й шансом по-новому зорієнтуватися і, можливо, навіть знайти своє покликання.", "Wege und Chancen.": "Шляхи та можливості.", "Das Bundesministerium für Bildung und Forschung unterstützt bei der beruflichen Qualifizierung Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren.": "Федеральне міністерство освіти й науки підтримує професійну кваліфікацію. Воно створило портал, щоб інформувати насамперед некваліфікованих і малокваліфікованих людей, а також працівників у батьківській відпустці про відповідні можливості професійної освіти та підвищення кваліфікації.", "Lamia überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.": "Ламія думає, чи мусить вона на співбесіді згадувати про свою вагітність.", "Raymond möchte im Internet einen Job finden.": "Реймонд хоче знайти роботу через інтернет.", "Karl will sich in der Gastronomie selbstständig machen.": "Карл хоче відкрити власну справу в ресторанному бізнесі.", "Sean ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.": "Шон не впевнений, чи можна взяти хворого сина з собою в офіс.", "Ramona interessiert sich für Jobchancen als Reiseverkehrskauffrau.": "Рамона цікавиться можливостями працевлаштування як менеджерка з туризму.", "Pflegefreistellung für Mütter und Väter.": "Звільнення від роботи для догляду — для матерів і батьків.", "Arbeitnehmerinnen und Arbeitnehmer haben das Recht auf Freistellung am Arbeitsplatz, wenn ein im Haushalt lebendes Kind erkrankt und keine Betreuungsmöglichkeit vorhanden ist. Die Freistellung ist pro Arbeitsjahr begrenzt. In der Probezeit sollte man damit vorsichtig sein, da hier andere Kündigungsfristen gelten.": "Працівниці та працівники мають право на звільнення від роботи, якщо дитина, що живе в їхньому домогосподарстві, захворіла і немає можливості забезпечити догляд. Таке звільнення від роботи обмежене на кожен робочий рік. Під час випробувального терміну з цим варто бути обережним, бо тут діють інші строки звільнення.", "Tipps für Frauen im Beruf.": "Поради для жінок у професії.", "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen.": "Жінки часто недооцінюють себе. Особливо важливо, щоб ви були достатньо поінформовані про свої права у професійному житті. Наша експертка з трудового права дає поради щодо переговорів про зарплату і впевненої поведінки. Крім того, вона розповідає, про що вам не обов'язково говорити на співбесіді.", "Damit sich der Aufwand lohnt.": "Щоб зусилля окупилися.", "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Nicht nur die Bekanntheit der Webseite ist dafür entscheidend, sondern auch die regionale Reichweite und der Grad der Spezialisierung.": "Розміщення вакансій онлайн може швидко стати для підприємств дуже дорогим. Вирішальною тут є не лише відомість вебсайту, а й регіональне охоплення та ступінь спеціалізації.", "Der Bundesverband der Tourismusbranche informiert.": "Інформує Федеральна спілка туристичної галузі.", "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Offene Stellen werden demzufolge zügig besetzt.": "Попри незмінно високий попит з боку роботодавців, кількість заявок зменшується. І на ринку професійного навчання бракує молодих людей, які цікавляться цією сферою діяльності. Тому вільні вакансії заповнюються швидко.", "Informationen rund um den Mutterschutz.": "Інформація про захист материнства.", "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste.": "Відповідно до Закону про захист материнства жінок не можна звільняти під час вагітності та протягом чотирьох місяців після пологів. Однак умовою є те, що на момент звільнення роботодавець знав про вагітність.", "Rechte berufstätiger Eltern.": "Права працюючих батьків.", "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers und viele sind damit einverstanden, wenn sich so vermeiden lässt, dass sich die Eltern krankschreiben lassen. Arbeitsplätze, bei denen die Sicherheit des Kindes gefährdet ist, sind von dieser Regelung ausgeschlossen.": "Батьки не мають законного права доглядати своїх дітей на робочому місці. Рішення залежить від згоди роботодавця, і багато хто погоджується, якщо так можна уникнути того, що батьки беруть лікарняний. Робочі місця, де під загрозою безпека дитини, на це правило не поширюються.", "Vom Traum zur Realität.": "Від мрії до реальності.", "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu.": "Як майбутньому засновнику вам потрібні не лише знання галузі, а й знання про економічні процеси на підприємстві. Від бізнес-плану й правильного фінансування через розумне планування персоналу до отримання необхідних ліцензій — на вас тепер чекає багато справ.", "Die richtige Wahl spart Zeit und Frust.": "Правильний вибір економить час і нерви.", "Je Suche nach einer neuen Stelle ist extrem zeitaufwendig. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolge oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.": "Пошук нової роботи забирає надзвичайно багато часу. В інтернеті пропозиція вакансій здається величезною, проте успіху часто немає. Тож одна з найважливіших передумов — правильно фільтрувати пропозиції роботи, щоб без великих витрат часу знайти потрібне оголошення.", "Yuan Javier möchte im Internet einen Job finden": "Юань Хав'єр хоче знайти роботу через інтернет.", "Paul will sich in der Gastronomie selbstständig machen.": "Пауль хоче відкрити власну справу в ресторанному бізнесі.", "Avio ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.": "Авіо не впевнений, чи можна взяти хворого сина з собою в офіс.", "Nora interessiert sich für Jobchancen als Reiseverkehrskauffrau.": "Нора цікавиться можливостями працевлаштування як менеджерка з туризму.", "Anna Maria überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.": "Анна Марія думає, чи мусить вона на співбесіді згадувати про свою вагітність.", "Familienmitglieder betreuen.": "Догляд за членами сім'ї.", "Eltern haben einen Rechtsanspruch darauf, ihre kranken Kinder zu pflegen. Dafür haben sie eine bestimmte Anzahl an Tagen zur Verfügung, an denen sie freinehmen können. Aber generell gilt kranke Personen müssen zu Hause bleiben.": "Батьки мають законне право доглядати своїх хворих дітей. Для цього в них є певна кількість днів, у які вони можуть узяти вихідний. Але загалом діє правило: хворі люди мають залишатися вдома.", "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Für den Erfolg muss unbedingt das richtige Stelleportal gewählt werden. Das gilt insbesondere für neu gegründete Unternehmen, die sich mehrfache Anzeigen finanziell nicht leisten können.": "Розміщення вакансій онлайн може швидко стати для підприємств дуже дорогим. Для успіху обов'язково треба обрати правильний портал вакансій. Особливо це стосується новостворених підприємств, які не можуть фінансово дозволити собі кілька оголошень.", "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen.": "Попри незмінно високий попит з боку роботодавців, кількість заявок зменшується. І на ринку професійного навчання бракує молодих людей, які цікавляться цією сферою діяльності. Тому зараз є низка вільних вакансій.", "Kinder am Arbeitsplatz.": "Діти на робочому місці.", "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden. Diese Möglichkeit besteht nicht, wenn die Sicherheit des Kindes am Arbeitsplatz gefährdet ist.": "Роботодавці часто погоджуються на прохання батьків привести дітей на роботу, якщо догляд за ними раптово зривається. Так можна уникнути пропусків роботи. Такої можливості немає, якщо на робочому місці під загрозою безпека дитини.", "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolge oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden.": "Ринок вакансій сьогодні майже повністю перемістився в онлайн. В інтернеті пропозиція вакансій здається величезною, проте успіху часто немає. Тож одна з найважливіших передумов — правильно фільтрувати пропозиції роботи, щоб без великих витрат часу знайти потрібне оголошення.", "Laura möchte während des Studiums Berufserfahrung sammeln.": "Лаура хоче під час навчання в університеті набути професійного досвіду.", "Igor hat Familie und möchte im europäischen Ausland arbeiten.": "Ігор має сім'ю і хоче працювати в іншій європейській країні.", "Jens interessiert sich für das Thema Umweltschutz in Unternehmen.": "Єнс цікавиться темою захисту довкілля на підприємствах.", "Jasmin hat Probleme mit ihren Kollegen und braucht Hilfe.": "У Ясмін проблеми з колегами, і їй потрібна допомога.", "Somayeh ist Architektin und möchte ihr eigenes Architekturbüro eröffnen.": "Сомає — архітекторка і хоче відкрити власне архітектурне бюро.", "Erfolgreich neue Wege gehen.": "Успішно йти новими шляхами.", "Das Buch „Mit Erfolg durchstarten\" von Dr. Vera Baumgart richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen.": "Книжка «Mit Erfolg durchstarten» («Успішний старт») д-ра Віри Баумгарт адресована насамперед жінкам з вищою освітою, які хочуть успішно побудувати власне підприємство. Байдуже, чи відкриваєте ви власну справу в нерухомості, будівництві чи охороні здоров'я, — авторка має відповіді на всі важливі питання.", "Ein grüner Arbeitsplatz.": "Зелене робоче місце.", "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\". Aber geht das bei einer Transportund Logistikfirma überhaupt? Die Antwort ist ein klares „Ja\". Alle Details heute um 19:30 Uhr bei Neo TV.": "Фірма Heller з Ростока хоче подавати добрий приклад і стверджує: «Кліматично дружня енергія та уникнення відходів у нас понад усе». Але чи можливо це взагалі для транспортно-логістичної компанії? Відповідь — однозначне «так». Усі подробиці — сьогодні о 19:30 на Neo TV.", "Verändertes Kaufverhalten.": "Змінена купівельна поведінка.", "Neuesten Statistiken zufolge greifen Verbraucher in vielen Ländern der Europäischen Union immer mehr zu regionalen und ökologisch angebauten Lebensmitteln. Auch in deutschen Haushalten wird viel Wert auf gesunde Ernährung gelegt. Die Nachfrage nach Bioprodukten ist in den letzten Jahren stetig angestiegen.": "За найновішою статистикою, споживачі в багатьох країнах Європейського Союзу дедалі частіше обирають регіональні та органічно вирощені продукти. І в німецьких домогосподарствах велику увагу приділяють здоровому харчуванню. Попит на біопродукти за останні роки постійно зростав.", "Jetzt im Buchhandel.": "Уже в книгарнях.", "In seinem neuen Bestseller beschreibt Georg Könitz auf eindrucksvolle Weise, wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen. Von seinen Erfahrungen können alle, die Ähnliches erleben, profitieren.": "У своєму новому бестселері Георг Кеніц вражаюче описує, як його постійно похмурий начальник і двоє колег у команді цькували, ізолювали й висміювали — і як йому врешті вдалося розірвати це зачароване коло. Його досвід стане в пригоді всім, хто переживає щось подібне.", "Der richtige Praktikumsplatz.": "Правильне місце для практики.", "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen. Viele Praktikanten sind aber enttäuscht, dass sie nur Hilfsarbeiten verrichten dürfen und dafür schlecht oder gar nicht bezahlt werden. Auf dem Portaldein- praktikum.de findest du jetzt aktuelle Infos und interessante Praktikumsstellen in ganz Deutschland.": "Практика дає чудові можливості познайомитися з професійними буднями. Але багато практикантів розчаровані тим, що їм доручають лише допоміжну роботу і платять за неї погано або взагалі не платять. На порталі dein-praktikum.de ти знайдеш актуальну інформацію та цікаві місця для практики по всій Німеччині.", "Eine Erfolgsgeschichte.": "Історія успіху.", "Die Bilanz von Rita Jäger (34): Zwei abgebrochene Lehren und zahllose Hilfsjobs. Dann kam Tochter Samantha und Rita musste Verantwortung übernehmen. Im Interview erzählt sie, wie sie in einem Friseursalon die Chance bekam, ein Praktikum und anschließend eine Ausbildung zu machen. Nun hat sie ihren eigenen Salon eröffnet.": "Підсумок Ріти Єгер (34): два кинуті професійні навчання і безліч підробітків. Потім народилася донька Саманта, і Рита мусила взяти на себе відповідальність. В інтерв'ю вона розповідає, як отримала в перукарні шанс пройти практику, а потім і професійне навчання. Тепер вона відкрила власний салон.", "Immobilienunternehmen expandiert.": "Компанія з нерухомості розширюється.", "Die Frankfurter Immobilienfirma ImmoInvest expandiert nach Süd- und Osteuropa. In den letzten Jahren hat das Unternehmen hohe Gewinne erwirtschaftet und plant nun, außerhalb Deutschlands mehrere Niederlassungen zu gründen. Über die Erfolgsgeschichte des Unternehmens berichtet der Geschäftsführer Herbert Grünberg in unserem Interview.": "Франкфуртська компанія з нерухомості ImmoInvest розширюється в Південну та Східну Європу. За останні роки підприємство отримало високі прибутки і тепер планує відкрити кілька філій за межами Німеччини. Про історію успіху підприємства в нашому інтерв'ю розповідає директор Герберт Грюнберг.", "Neue Broschüre.": "Нова брошура.", "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder. Unsere neue Broschüre bietet ausführliche Informationen und Hilfestellungen zum Leben und Arbeiten in der EU.": "Думаєте перенести центр свого життя в іншу країну? Новий початок — це великий шанс, але завжди й виклик, особливо для партнера чи партнерки та дітей. Наша нова брошура містить докладну інформацію та допомогу щодо життя й роботи в ЄС.", "Yasmina sucht nach dem Realschulabschluss einen Beruf mit guten Perspektiven.": "Ясміна після закінчення реальної школи шукає професію з добрими перспективами.", "Jason überlegt, ob er bei einem neu gegründeten Unternehmen arbeiten soll.": "Джейсон думає, чи варто йому працювати в щойно заснованому підприємстві.", "Hannah wird von ihren Kollegen schlecht behandelt und sucht Hilfe.": "Колеги погано ставляться до Ганни, і вона шукає допомоги.", "Gacer fragt sich, ob sie Fortbildungen besuchen muss.": "Гачер запитує себе, чи мусить вона відвідувати курси підвищення кваліфікації.", "Assem braucht Informationen zur Meisterprüfung.": "Ассему потрібна інформація про іспит на звання майстра.", "Hilfe für Betroffene.": "Допомога для постраждалих.", "Beleidigungen, Ausgrenzung, versteckte Drohungen - am Arbeitsplatz ist Mobbing leider weit verbreitet. Für viele Angestellte ist der Arbeitsalltag oft mit Angst verbunden. Das führt schnell zu gesundheitlichen und psychischen Problemen. Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann.": "Образи, ізоляція, приховані погрози — мобінг на робочому місці, на жаль, дуже поширений. Для багатьох працівників робочі будні часто пов'язані зі страхом. Це швидко призводить до проблем зі здоров'ям і психікою. Тепер існує безліч коучинг-програм для працівників, які показують стратегії, як краще справлятися з такими ситуаціями.", "Ein starkes Team.": "Сильна команда.", "Pünktlich zum Start der Weltmeisterschaft präsentiert der Handballbund seine neue Vertragspartnerin, die deutsche Handwerkskammer. Wie passt das zusammen? „Ganz einfach\", so der Sprecher des Handballbundes. „Was für den Handballer die Weltmeisterschaft ist, ist für den Handwerker die Meisterprüfung.\"": "Точно до старту чемпіонату світу Гандбольна федерація представляє свого нового партнера — Німецьку ремісничу палату. Як це пов'язано? «Дуже просто», — каже речник Гандбольної федерації. «Що для гандболіста чемпіонат світу, те для ремісника іспит на звання майстра».", "Deutsche sind risikoscheu.": "Німці уникають ризику.", "In Deutschland ist die Zahl der Unternehmensgründungen stark rückläufig, obwohl insbesondere viele jüngere Menschen angeben, dass sie sich gerne selbständig machen würden. Warum der Sprung in die Selbstständigkeit oft doch nicht klappt, hat vielerlei Gründe. Während Frauen häufig das finanzielle Risiko scheuen, fürchten Männer den Karriereknick.": "У Німеччині кількість нових підприємств різко зменшується, хоча особливо багато молодих людей кажуть, що охоче відкрили б власну справу. Чому стрибок у самозайнятість часто все ж не вдається — причин багато. Жінки часто бояться фінансового ризику, а чоловіки — зламу кар'єри.", "Handwerk und Karriere - passt das?": "Ремесло і кар'єра — чи це сумісно?", "Fleischer, Klempner, Tischler - laut der Bundesagentur für Arbeit werden bei uns ca.150.000 Handwerker gesucht. Doch viele Stellen bleiben unbesetzt. Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen.": "М'ясники, сантехніки, столяри — за даними Федерального агентства зайнятості, у нас шукають близько 150 000 ремісників. Проте багато вакансій залишаються незаповненими. А саме ремісничі професії дають молодим людям найкращі шанси на успішну кар'єру. Фахівцям не треба турбуватися про своє майбутнє.", "Stressfrei zum Ziel.": "До мети без стресу.", "Auch Fortbildungen können für eine Meisterprüfung im Handwerk anerkannt werden. Wenn Sie z B. als Kfz-Servicetechniker einen Kurs in Elektronik erfolgreich absolviert haben, wird dieser Teil nicht noch einmal gesondert geprüft. Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst.": "Курси підвищення кваліфікації теж можуть зараховуватися для іспиту на звання майстра в ремеслі. Якщо ви, наприклад, як автотехнік успішно пройшли курс з електроніки, цю частину не перевірятимуть ще раз окремо. Спільнота «Das Handwerk» («Ремесло») узагальнила найважливіші умови допуску до іспиту на звання майстра.", "Nie wieder Opfer.": "Більше ніколи не жертва.", "Sie wurde in ihrer Firma gemobbt und konnte es ihrem Chef nicht nachweisen. Aber die Atmosphäre verschlechterte sich zusehends. Die Arbeit wurde jeden Tag mehr zur Qual. Die Autorin Stephanie Hauser verarbeitet in ihrem Roman „Nie wieder Opfer\" auf eindrucksvolle Weise ihre eigenen Erfahrungen zum Thema „Mobbing\".": "Її цькували на фірмі, і вона не змогла довести цього начальнику. Але атмосфера помітно погіршувалася. Робота щодня дедалі більше перетворювалася на муку. Авторка Штефані Гаузер у своєму романі «Більше ніколи не жертва» вражаюче осмислює власний досвід мобінгу.", "Verpflichtend oder freiwillig.": "Обов'язково чи добровільно.", "Die Anforderungen der Berufswelt ändern sich rasant und somit entsteht auch die Notwendigkeit für die Belegschaft, sich kontinuierlich weiterzubilden. Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden.": "Вимоги професійного світу стрімко змінюються, і тому в працівників виникає потреба постійно підвищувати кваліфікацію. Принципово діє правило: працівники зобов'язані брати участь у семінарах, якщо вони потрібні для виконання їхньої роботи і проходять у звичайний робочий час.", "Karriereplan für eine vielversprechende Laufbahn.": "Кар'єрний план для перспективного професійного шляху.", "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten. Dennoch setzen die meisten Uniabsolventen nach wie vor auf große Konzerne, von denen sie sich eher Sicherheit und vielversprechende Karrierechancen erhoffen. Doch das können sie auch bei jungen Start-upUnternehmen finden.": "Особливо у великих містах дедалі більше молодих підприємств пропонують цікаві можливості працевлаштування. Проте більшість випускників університетів і далі роблять ставку на великі концерни, від яких радше сподіваються на стабільність і перспективні кар'єрні шанси. Але це вони можуть знайти й у молодих стартапах.", "Silvie ist gelernte Verkäuferin und möchte in ihrem Job aufsteigen.": "Сільві — кваліфікована продавчиня і хоче просунутися по службі.", "Brian sucht Computerkurse, die er von zu Hause aus machen kann.": "Браян шукає комп'ютерні курси, які можна проходити вдома.", "Carl ist Umwelttechniker und möchte seine eigene Beratungsagentur gründen.": "Карл — інженер-еколог і хоче заснувати власне консалтингове агентство.", "Mira ist unsicher, wie es nach ihrem Arbeitsplatzverlust weitergehen soll.": "Міра не знає, як жити далі після втрати роботи.", "Karim sucht einen Ausbildungsplatz in einer sicheren Branche.": "Карім шукає місце для професійного навчання в стабільній галузі.", "Die Lebensmittelbranche boomt.": "Харчова галузь процвітає.", "Der Einzelhandel ist einer der größten und umsatzstärksten Wirtschaftszweige national und international. Es werden dort ständig qualifizierte Mitarbeiter gesucht. Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer.": "Роздрібна торгівля — одна з найбільших і найприбутковіших галузей економіки в країні та у світі. Там постійно шукають кваліфікованих працівників. Лише в Гессені щороку навчаються професії 160 000 молодих людей. Крім того, роздрібна торгівля стійка до криз, адже їсти люди будуть завжди.", "Aus Fehlern anderer lernen.": "Вчитися на чужих помилках.", "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler. Heute weiß man, dass ein durchdachter Businessplan und eine genaue Konkurrenzanalyse unverzichtbar sind. Worauf es noch ankommt, erfährst du in den Tipps des Erfolgscoachs Gregor Daub.": "Багато підприємців на початку самостійної діяльності роблять схожі помилки. Сьогодні відомо, що продуманий бізнес-план і точний аналіз конкурентів незамінні. Що ще важливо, ти дізнаєшся з порад коуча успіху Грегора Дауба.", "Chancen im Einzelhandel.": "Шанси в роздрібній торгівлі.", "Die FOOD Unternehmensgruppe betreibt Supermärkte in zehn Ländern Europas. Der Branchenriese möchte weiter expandieren und hat gerade die Filialen der Jennings GmbH übernommen. Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung.": "Група компаній FOOD керує супермаркетами в десяти країнах Європи. Гігант галузі хоче й далі розширюватися і щойно перейняв філії компанії Jennings GmbH. Досвідчені працівники знайдуть там цікаві можливості для професійного розвитку.", "Gute Nachrichten für gekündigte Mitarbeiter.": "Добрі новини для звільнених працівників.", "Die Tankstellenkette Fairtank hat Bankrott angekündigt und schließt zum 31. März ihre 25 Filialen in Brandenburg. Rund 100 Mitarbeiter sind betroffen und suchen nun einen neuen Job. Für einige von ihnen gibt es eine Lösung: Tankstellen in der Umgebung haben ihre Unterstützung zugesagt und versprochen, Mitarbeiter von Fairtank zu übernehmen.": "Мережа автозаправок Fairtank оголосила про банкрутство і до 31 березня закриває свої 25 філій у Бранденбурзі. Це стосується близько 100 працівників, які тепер шукають нову роботу. Для деяких із них є рішення: автозаправки в окрузі пообіцяли підтримку і взяти на роботу працівників Fairtank.", "Was nun?": "Що тепер?", "Egal, ob die ganze Firma pleitegeht, eine Abteilung dichtmacht oder nur der eigene Job weg ist, eine Entlassung ist immer ein Schock. Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen.": "Байдуже, чи банкрутує вся фірма, закривається відділ чи зникає лише твоє робоче місце, — звільнення завжди шок. Експертка з ринку праці Кароліна Каупер пояснює, що треба робити працівникові, щоб якомога швидше знайти нову роботу.", "Neue Kursreihe bei Arcadio.": "Нова серія курсів в Arcadio.", "Ab sofort bietet das Institut Arcadio neben seinen Computerkursen für Senioren auch Weiterbildungen für Teilnehmer mit geringen Deutschkenntnissen an. Das Besondere daran: Die Dozenten verwenden eine einfache Sprache. Was hinter diesem innovativen Konzept steht, erzählt der Institutsgründer Benjamin von Adler im Interview.": "Відтепер інститут Arcadio, крім комп'ютерних курсів для людей похилого віку, пропонує також навчання для учасників зі слабкими знаннями німецької. Особливість: викладачі використовують просту мову. Що стоїть за цією інноваційною концепцією, в інтерв'ю розповідає засновник інституту Бенджамін фон Адлер.", "Wenn die Mitarbeiter kündigen.": "Коли працівники звільняються.", "Immer mehr Mitarbeiter kündigen und verlassen ihre Firma. Und zwar selbst dann, wenn sie mehr Gehalt bekommen als bei der Konkurrenz. Die Unternehmensberatung Schindler hat die häufigsten Gründe analysiert, warum sich Angestellte entscheiden, ihren Job zu wechseln.": "Дедалі більше працівників звільняються і залишають свою фірму. І навіть тоді, коли отримують більшу зарплату, ніж у конкурентів. Консалтингова компанія Schindler проаналізувала найпоширеніші причини, чому працівники вирішують змінити роботу.", "Bildung im neuen Zeitalter.": "Освіта в нову епоху.", "Schneller technologischer Fortschritt, Globalisierung und Veränderungen auf dem Arbeitsmarkt haben dazu geführt, dass Fortbildungen im Beruf eine immer wichtigere Rolle spielen. Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen. Wo findet man passende Fortbildungen ?": "Швидкий технологічний прогрес, глобалізація та зміни на ринку праці призвели до того, що підвищення кваліфікації в професії відіграє дедалі важливішу роль. Дедалі частіше пропонують онлайн-курси та вебінари за комп'ютером, які обіцяють учасникам максимальну гнучкість. Де знайти відповідні курси підвищення кваліфікації?", "Kurt sucht еіnen Job und braucht Anregungen für seine Unterlagen.": "Курт шукає роботу, і йому потрібні ідеї для документів для подання заявки.", "Juliette arbeitet gerne, fühlt sich aber oft erschöpft.": "Жюльєтт охоче працює, але часто почувається виснаженою.", "Peter ist vor seinem Start im neuen Unternehmen nervös.": "Петер нервує перед початком роботи на новому підприємстві.", "Katharina ist wegen des niedrigen Verdienstes in ihrer Branche frustriert.": "Катаріна розчарована через низький заробіток у своїй галузі.", "Carlos braucht Tipps für seine Tätigkeit im Homeoffice.": "Карлосу потрібні поради щодо роботи в хоумофісі.", "Den Arbeitsplatz produktiv gestalten.": "Облаштувати робоче місце продуктивно.", "Die richtige Atmosphäre am Arbeitsplatz ist für die effektive Erledigung der Aufgaben unerlässlich. Gerlinde Strauß beschreibt, wie man mit den richtigen Möbeln, Dekoartikeln, Licht, Ordnung am Arbeitsplatz und vielem mehr die eigene Umgebung so gestaltet, dass man die Zeit am Arbeitsplatz gerne und erfolgreich verbringt.": "Правильна атмосфера на робочому місці необхідна для ефективного виконання завдань. Герлінде Штраус описує, як за допомогою правильних меблів, декору, освітлення, порядку на робочому місці та багато іншого облаштувати своє оточення так, щоб охоче й успішно проводити час на роботі.", "Ohne Selbstdisziplin geht es nicht.": "Без самодисципліни не обійтися.", "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements. Privates und Arbeit sollten strikt getrennt werden. Doch wie funktioniert das am besten? Helga Brinkmann hat einen Ratgeber für Arbeitskräfte herausgegeben, deren Unternehmen diese Form der Arbeit anbieten.": "Робота з дому вимагає високого рівня самодисципліни та вміння організовувати себе. Особисте і робоче слід суворо розділяти. Але як це найкраще зробити? Гельга Брінкман видала посібник для працівників, чиї підприємства пропонують таку форму роботи.", "Hobbys im Lebenslauf richtig einsetzen.": "Правильно вказувати хобі в резюме.", "Ausbildung und Qualifikation sind in erster Linie wichtig, wenn man den Lebenslauf eines Bewerbers liest. Doch auch, welche Hobbys eine Person hat, kann Auskunft darüber geben, ob sie zum Unternehmen passt oder nicht. Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung.": "Освіта й кваліфікація насамперед важливі, коли читаєш резюме кандидата. Але й те, які хобі має людина, може показати, чи підходить вона підприємству. Тут ви знайдете важливі поради й хитрощі для переконливої заявки.", "Was unsere Körpersprache über uns verrät.": "Що про нас видає мова тіла.", "Ob beim Vorstellungsgespräch, bei wichtigen Verhandlungen mit Kunden oder am ersten Arbeitstag – unsere Körpersprache gibt immer Auskunft darüber, wie wir uns gerade fühlen, z. B. angespannt oder selbstsicher. Lernen Sie in unserem Seminar, wie Sie Körpersprache wirksam einsetzen und wie Sie Ihr Gegenüber einschätzen können.": "На співбесіді, на важливих переговорах із клієнтами чи в перший робочий день — мова тіла завжди показує, як ми почуваємося саме зараз, наприклад, напружено чи впевнено. На нашому семінарі ви навчитеся ефективно використовувати мову тіла й оцінювати співрозмовника.", "Der erste Arbeitstag in der neuen Firma.": "Перший робочий день на новій фірмі.", "So klappt es mit den Kolleginnen. Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein. Im folgenden Artikel von Irene Miller finden Sie eine Checkliste mit den wichtigsten Punkten, die Sie beachten sollten, damit der Einstieg gelingt.": "Так усе вийде з колегами. Хвилюватися — цілком нормально: на старті нової роботи важливо бути добре підготовленим. У наступній статті Ірене Міллер ви знайдете чекліст найважливіших пунктів, на які варто звернути увагу, щоб початок вдався.", "Angemessene Bezahlung?": "Справедлива оплата?", "Jeder möchte für seine Leistung fair bezahlt werden. Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat. Lesen Sie hier, wie Sie erfolgreich Gehaltsverhandlungen führen.": "Кожен хоче отримувати справедливу оплату за свою роботу. Але в багатьох професійних сферах працівники відчувають, що їм недоплачують. Наслідок — втрата мотивації та сумніви, чи справді обрано правильну професію. Тут ви прочитаєте, як успішно вести переговори про зарплату.", "Körperliche Folgen von Stress.": "Фізичні наслідки стресу.", "Nicht jeder Stress macht krank. Es gibt auch positiven Stress, der die Leistungsfähigkeit eines Menschen erhöht. Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck. Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern. Wie, das erfahren Sie im neusten Buch von Harald Erhard.": "Не кожен стрес шкодить здоров'ю. Буває й позитивний стрес, який підвищує працездатність людини. Але хто перебуває в постійній напрузі й відчуває фізичні симптоми, як-от високий тиск, проблеми зі шлунком чи тривале внутрішнє напруження, мусить щось змінити. Як саме — дізнаєтеся з найновішої книжки Гаральда Ергарда.", "Frauen verdienen immer noch zu wenig.": "Жінки досі заробляють замало.", "Europaweit ist das Ziel der Gleichstellung noch längst nicht erreicht. Man denke hier nur an die nach wie vor ungleiche Bezahlung von Männern und Frauen und an die Besetzung von Stellen in der Führungsetage. Deutschland liegt bei diesem Vergleich noch immer auf einem der letzten Plätze.": "У Європі мети рівноправності ще далеко не досягнуто. Згадайте хоча б досі нерівну оплату праці чоловіків і жінок та розподіл посад у керівництві. У цьому порівнянні Німеччина досі посідає одне з останніх місць.", "Barbara braucht beruflich Grundkenntnisse in Spanisch.": "Барбарі для роботи потрібні базові знання іспанської.", "Frank denkt, dass sein Gehalt nicht branchenüblich ist.": "Франк вважає, що його зарплата не відповідає рівню в галузі.", "Petra fühlt sich am Arbeitsplatz gemobbt.": "Петра відчуває, що її цькують на роботі.", "Sandra möchte im Ausland berufliche Erfahrungen sammeln.": "Сандра хоче набути професійного досвіду за кордоном.", "Felix möchte sich beruflich verändern.": "Фелікс хоче змінити щось у професійному житті.", "Internationale Fachkräfte gesucht": "Шукаємо міжнародних фахівців", "Im Ausland zu arbeiten, kann eine hervorragende Chance für Menschen in aller Welt sein. Erfahren Sie als Arbeitgeber, mit welchen Strategien Sie dringend benötigte Arbeitskräfte aus dem Ausland für sich gewinnen, um Ihr Unternehmen wettbewerbsfähiger zu machen.": "Робота за кордоном може бути чудовим шансом для людей з усього світу. Дізнайтеся як роботодавець, за допомогою яких стратегій залучити вкрай потрібних працівників з-за кордону, щоб зробити своє підприємство конкурентоспроможнішим.", "Auf zu neuen Ufern!": "До нових берегів!", "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln. Manchmal fehlen nur ein bisschen Mut und Unterstützung. Oder man weiß erst gar nicht, welche Möglichkeiten es gibt. Eine gute Beratung ist darum wichtig. Wo Sie die bekommen, erfahren Sie hier.": "У роботі ніколи не пізно почати щось нове, щоб розвиватися далі. Іноді бракує лише трохи сміливості й підтримки. Або людина взагалі не знає, які є можливості. Тому важлива добра консультація. Де її отримати, ви дізнаєтеся тут.", "Zufriedene Mitarbeiter": "Задоволені працівники", "Viele Firmen überlegen, wie sie ihren Angestellten das Arbeitsleben abwechslungsreicher gestalten können. Manche schicken ihre Mitarbeitenden auf Dienstreisen ins Ausland, andere finanzieren ihnen Sprachkurse oder verteilen großzügig Prämien. Was noch möglich ist und wie sich das steuerlich auswirkt, erklärt der Steuerberater Michael Hahne.": "Багато фірм думають, як зробити робоче життя своїх працівників різноманітнішим. Одні відправляють працівників у відрядження за кордон, інші оплачують їм мовні курси або щедро роздають премії. Що ще можливо і як це впливає на податки, пояснює податковий консультант Міхаель Гане.", "Dschungel in der Arbeitswelt": "Джунглі робочого світу", "Wie viel Urlaub steht einem zu? Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst.": "Скільки відпустки належить? Скільки варто заробляти у своїй професії? Скільки годин зазвичай працюють? Чи дають доплату на мовні курси? Коли працюєш, треба розбиратися в багатьох правових питаннях. Найважливіша інформація зібрана тут.", "Chefsache": "Справа шефа", "Ein erfolgreiches Unternehmen gibt es nur mit einem motivierten Team. Aber wie motiviert man seine Mitarbeiter? Hören Sie ihnen aufmerksam zu! Kontrollieren Sie nicht jeden Arbeitsschritt, sondern delegieren Sie! Nehmen Sie Mobbing ernst! Zahlen Sie faire Gehälter! Diese und noch viele andere Ratschläge lesen Sie hier.": "Успішне підприємство можливе лише з мотивованою командою. Але як мотивувати своїх працівників? Уважно їх вислуховуйте! Не контролюйте кожен робочий крок, а делегуйте! Ставтеся до мобінгу серйозно! Платіть справедливі зарплати! Ці та багато інших порад читайте тут.", "Vielseitig qualifiziert!": "Різнобічна кваліфікація!", "Von Arbeitnehmer*innen wird immer mehr verlangt. Nicht nur die aktuellen fachlichen Kenntnisse und die souveräne Arbeit mit dem PC sind eine Selbstverständlichkeit, sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli.": "Від працівниць і працівників вимагають дедалі більше. Не лише актуальні фахові знання і впевнена робота з ПК є само собою зрозумілими — дедалі важливішими стають і мовні компетенції. Тут кожен знайде для себе відповідний курс — від англійської через японську до суахілі.", "Lassen Sie sich von Kolleg*innen den Arbeitsalltag nicht schwermachen": "Не дозволяйте колегам ускладнювати вам робочі будні", "Sie erfahren von der Sitzung zuletzt? In der Kantine sitzen Sie allein? Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können.": "Ви дізнаєтеся про нараду останніми? У їдальні сидите самі? У німецьких підприємствах дедалі частіше трапляється, що одні колеги з незрозумілих причин ускладнюють життя іншим. У цьому посібнику прочитайте, де можна отримати допомогу.", "Den Horizont erweitern": "Розширити горизонт", "Manche zieht die Liebe in ein anderes Land. Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können": "Когось кохання приводить в іншу країну. Інші бачать там цікавіші професійні можливості. Іноді це чиста жага пригод. Перебування за кордоном можуть…", "Zugangskontrolle und Zeiterfassung": "Контроль доступу та облік робочого часу", "Als Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.": "Як працівниці та працівники ви на початку трудових відносин отримуєте службове посвідчення з чип-карткою. Воно дає право доступу до будівлі підприємства і водночас слугує для обліку робочого часу. Крім того, службовим посвідченням можна розраховуватися в їдальні та в автоматі з напоями і користуватися власним фітнес-залом підприємства.", "Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.": "Біля ліфтів на першому поверсі ви знайдете цифровий пристрій обліку часу. Будь ласка, під час входу до будівлі й виходу з неї прикладайте службове посвідчення до позначеної синім поверхні та переконуйтеся, що час початку й кінця роботи зафіксовано правильно. Це видно на дисплеї пристрою, який показує ваш місячний робочий час.", "Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.": "Система обліку автоматично розраховує звичайний робочий час, а також можливі понаднормові години й недопрацювання. Відділ кадрів відкриє вам доступ до нашої системи робочих рахунків PersoTime. Так ви будь-коли зможете переглянути свій рахунок робочого часу в інтранеті.", "Der Firmenausweis hat neben der Arbeitszeiterfassung auch andere Funktionen.": "Службове посвідчення, крім обліку робочого часу, має й інші функції.", "Überstunden": "Понаднормові години", "können online eingesehen werden.": "можна переглянути онлайн.", "sind in der Firma grundsätzlich nicht erlaubt.": "на фірмі в принципі заборонені.", "werden von der Zeiterfassung nicht registriert.": "система обліку часу не реєструє.", "Ein Firmenausweis kann innerhalb des Firmengebäudes als Zahlungsmittel verwendet werden. / Der Firmenausweis dient als firmeninternes Zahlungsmittel.": "Службовим посвідченням можна розраховуватися в будівлі фірми. / Службове посвідчення слугує внутрішнім платіжним засобом фірми.", "Das persönliche Arbeitszeitkonto": "Особистий рахунок робочого часу", "ist nur über die Personalabteilung einsehbar./ kann in der Personalabteilung eingesehen werden.": "можна переглянути лише через відділ кадрів. / можна переглянути у відділі кадрів.", "buchen die Mitarbeiter ihre Stunden selbst. / müssen die Mitarbeiter selbst anlegen.": "працівники самі вносять свої години. / працівники мусять створити самі.", "wird täglich aktualisiert.": "щодня оновлюється.", "Arbeitszeit": "Робочий час", "In unserem Unternehmen arbeiten wir nach dem Gleitzeitsystem. Die Kernarbeitszeit ist Montag bis Freitag zwischen 9.00 Uhr und 15.30 Uhr. In dieser Zeit müssen alle Mitarbeitenden anwesend sein. Jede Abwesenheit während dieser Zeit muss genehmigt sein.": "На нашому підприємстві ми працюємо за системою гнучкого робочого часу. Основний (обов'язковий) робочий час — з понеділка по п'ятницю з 9:00 до 15:30. У цей час усі працівники мають бути на місці. Будь-яка відсутність у цей час має бути погоджена.", "Die tägliche Rahmenarbeitszeit ist von 6.00 Uhr bis 19.30 Uhr. Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.": "Щоденні рамки робочого часу — з 6:00 до 19:30. Зверніть увагу, що в цих рамках можна працювати щонайбільше вісім, у виняткових випадках десять годин на день.", "Alle Mitarbeitenden müssen beim Betreten und Verlassen des Gebäudes mit der Zeiterfassungskarte am Lesegerät ein- und ausstechen. So wird die tägliche Arbeitszeit auf dem Zeitkonto festgehalten. Dieses kann jederzeit am Lesegerät eingesehen werden.": "Усі працівники під час входу до будівлі й виходу з неї мають відмічатися карткою обліку часу на зчитувачі. Так щоденний робочий час фіксується на рахунку часу. Його можна будь-коли переглянути на зчитувачі.", "Bei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden. Zu berücksichtigen ist, dass ein Minuskontostand im Folgemonat auszugleichen ist. Zusätzlich können im Monat Dezember bis zu vier Arbeitstage als Gleitzeittage genommen werden, um sie zwischen Weihnachten und Neujahr zu nutzen, wenn das Arbeitszeitkonto ein ausreichendes Guthaben aufweist.": "За наявності відповідного залишку раз на місяць можна взяти цілий робочий день (вісім годин) як вихідний за гнучким графіком. Слід врахувати, що мінусовий залишок треба компенсувати наступного місяця. Крім того, у грудні можна взяти до чотирьох робочих днів як вихідні за гнучким графіком, щоб використати їх між Різдвом і Новим роком, якщо на рахунку робочого часу є достатній залишок.", "Bei Gleitzeit können Mitarbeitende täglich beliebig viele Stunden arbeiten.": "За гнучкого графіка працівники можуть щодня працювати скільки завгодно годин.", "Durch Gleitzeit ist es den Mitarbeitenden möglich,": "Завдяки гнучкому графіку працівники можуть", "ein Stundenguthaben aufzubauen.": "накопичувати запас годин.", "jeden Monat einige Tage freizunehmen.": "щомісяця брати кілька вихідних днів.", "täglich mehr als acht Stunden zu arbeiten.": "щодня працювати більше восьми годин.", "Die wöchentliche Arbeitszeit beträgt 40 Stunden - bei einem Arbeitstag von acht Stunden, wobei die Pausen nicht mitgerechnet werden. Es gilt die Fünf-Tage-Woche. Betriebsbedingt ist es möglich, dass Sie bis zu zehn Stunden pro Tag arbeiten. Diese Mehrarbeit ist aber nur in Ausnahmefällen erlaubt und muss innerhalb von sechs Monaten durch entsprechend kürzerer Arbeitstage ausgeglichen werden.": "Робочий тиждень становить 40 годин — при робочому дні вісім годин, перерви не враховуються. Діє п'ятиденний робочий тиждень. З виробничих причин можливо, що ви працюватимете до десяти годин на день. Але така додаткова робота дозволена лише у виняткових випадках і має бути компенсована протягом шести місяців відповідно коротшими робочими днями.", "Wir haben flexible Arbeitszeiten. Sie können selbst bestimmen, wann Sie morgens anfangen zu arbeiten und wann Sie aufhören. Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr. Innerhalb dieser Zeiten können Sie anfangen bzw. aufhören zu arbeiten. Aus betrieblichen Gründen kann der Arbeitgeber die Gleitzeit für eine gewisse Zeit aussetzen.": "У нас гнучкий робочий час. Ви можете самі визначати, коли вранці починати роботу і коли закінчувати. Проте з 10 до 15 години, в так званий основний час, ви маєте бути на місці. Гнучкий час — з 8 до 10 і з 15 до 17 години. У ці проміжки ви можете починати або закінчувати роботу. З виробничих причин роботодавець може на певний час призупинити гнучкий графік.", "Unser elektronisches Zeiterfassungssystem registriert täglich die Zahl der von Ihnen geleisteten Arbeitsstunden auf Ihrem persönlichen Arbeitszeitkonto. Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen.": "Наша електронна система обліку щодня реєструє кількість відпрацьованих вами годин на вашому особистому рахунку робочого часу. Якщо за тиждень ви відпрацювали понад 40 годин, понаднормові години слід скоротити ще до кінця місяця, працюючи менше. Якщо скоротити їх неможливо, з керівництвом обговорюють швидке рішення.", "Die Beschäftigten dürfen mit der Arbeit anfangen, wann sie wollen.": "Працівники можуть починати роботу, коли захочуть.", "Ergibt sich auf einem Arbeitszeitkonto ein Plus,": "Якщо на рахунку робочого часу утворився плюс,", "kann der Betrieb den Acht-Stunden-Tag verlängern oder verkürzen.": "підприємство може подовжити або скоротити восьмигодинний робочий день.", "ist schnellstmöglich ein Ausgleich zu finden.": "треба якнайшвидше знайти компенсацію.", "kann der Betrieb die Gleitzeitregelungen ändern.": "підприємство може змінити правила гнучкого графіка.", "Urlaub": "Відпустка", "Jedem Mitarbeiter und jeder Mitarbeiterin in unserem Unternehmen stehen je nach Betriebszugehörigkeit bis zu 26 Tage Urlaub zu. Der Urlaub sollte nach Möglichkeit innerhalb des laufenden Kalenderjahres genommen werden. In Ausnahmefällen kann diese Frist bis zum 31.3. des Folgejahres verlängert werden.": "Кожному працівнику й кожній працівниці нашого підприємства залежно від стажу на підприємстві належить до 26 днів відпустки. Відпустку бажано використати протягом поточного календарного року. У виняткових випадках цей строк можна продовжити до 31 березня наступного року.", "Grundsätzlich besteht der volle Urlaubsanspruch erst nach Ablauf der sechsmonatigen Probezeit. Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.": "У принципі право на повну відпустку виникає лише після закінчення шестимісячного випробувального терміну. Однак пропорційна відпустка за погодженням можлива вже в цей період.", "Urlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen. Den Urlaubswünschen der einzelnen Mitarbeiter wird entsprochen, sofern diese mit den Betriebsabläufen vereinbar sind. Sollten sich die beantragten Urlaubszeiten einzelner Kollegen und Kolleginnen überschneiden, wird nach sozialen Aspekten entschieden.": "Заяви на відпустку на наступний календарний рік треба подати щонайпізніше до 15 листопада на спеціальному бланку керівнику відділу або його заступнику. Побажання окремих працівників щодо відпустки задовольняють, якщо вони сумісні з робочими процесами. Якщо запитані періоди відпустки окремих колег збігаються, рішення ухвалюють з урахуванням соціальних аспектів.", "Der Abteilungsleiter prüft alle Urlaubsanträge unverzüglich. Sollten die Wünsche der Mitarbeiter unvereinbar sein, wird der Betriebsrat mit dem Ziel der Einigung hinzugezogen.": "Керівник відділу негайно перевіряє всі заяви на відпустку. Якщо побажання працівників несумісні, для досягнення згоди залучають виробничу раду.", "Im ersten halben Jahr nach Neueinstellung ist kein Urlaub möglich.": "У перші пів року після прийняття на роботу відпустка неможлива.", "Urlaubsanträge müssen": "Заяви на відпустку мають бути", "durch den Betriebsrat genehmigt werden.": "затверджені виробничою радою.", "in jedem Fall bewilligt werden.": "задоволені в будь-якому разі.", "rechtzeitig im Vorjahr gestellt werden.": "подані вчасно, ще в попередньому році.", "Regelungen am Arbeitsplatz": "Правила на робочому місці", "Es ist wichtig, dass auf dem Betriebsgelände der AKO.KG alle Maßnahmen eingehalten werden, damit Sie sich selbst und andere nicht gefährden. Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres. Die Sicherheitsbestimmungen finden Sie in der Anlage zu dieser Willkommensmappe und zusammengefasst auch auf Informationsblättern an den Maschinen.": "Важливо, щоб на території підприємства AKO.KG дотримувалися всіх заходів, аби ви не наражали на небезпеку себе та інших. Під час роботи з машинами треба дотримуватися відповідних правил безпеки, адаптованих до нових настанов згідно із Законом про охорону праці від січня цього року. Правила безпеки ви знайдете в додатку до цієї вітальної папки, а також коротко — на інформаційних листках біля машин.", "Sollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen. In diesen Fällen kontaktieren Sie bitte auch immer den Empfang, Durchwahl -100.": "Якщо у вас є питання щодо цього, зверніться, будь ласка, до нашої уповноваженої з безпеки пані Шольц, кімната 122, внутрішній номер 308. Вона ж — контактна особа в разі будь-яких несправностей, нещасних випадків, пожежі чи незрозумілих для вас ситуацій. У таких випадках, будь ласка, завжди повідомляйте й рецепцію, внутрішній номер 100.", "Nach Verlassen der Werkstätten sind diese immer ordnungsgemäß abzuschließen, damit sich kein Unbefugter den Anlagen und Maschinen nähern kann. Der Arbeitsplatz muss sauber gehalten werden, damit umherliegender Unrat nicht zu einer Gefahrenquelle werden kann. Achten Sie dabei bitte auch auf die vorgeschriebene Trennung der Abfälle in die hierfür vorgesehenen Container im Hof.": "Залишаючи майстерні, їх завжди треба належно замикати, щоб жодна стороння особа не могла наблизитися до установок і машин. Робоче місце треба тримати в чистоті, щоб розкиданий мотлох не став джерелом небезпеки. Зважайте також на обов'язкове сортування відходів у призначені для цього контейнери у дворі.", "Auf dem gesamten Betriebsgelände ist Filmen und Fotografieren sowie der Konsum von Alkohol und Zigarettenkonsum nicht gestattet.": "На всій території підприємства заборонено знімати відео й фотографувати, а також вживати алкоголь і курити.", "Die Regelungen am Arbeitsplatz wurden aktualisiert.": "Правила на робочому місці було оновлено.", "Auf dem Firmengelände": "На території фірми", "darf kein Abfall entsorgt werden.": "заборонено викидати відходи.", "ist bei Gefahr Frau Scholz zu informieren.": "у разі небезпеки треба повідомити пані Шольц.", "ist es nicht erlaubt, Nahrungsmittel zu sich zu nehmen.": "заборонено вживати їжу.", "Betriebssport": "Корпоративний спорт", "Sportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im Untergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z B. zwei Indoor- Fahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.": "Спортивна активність у нас дуже цінується. Так, у цокольному поверсі ми пропонуємо нашим працівникам фітнес-зал з килимками та кількома тренажерами, наприклад, двома велотренажерами. Він відкритий для всіх цілий день безкоштовно, і ним, звісно, можна користуватися й під час перерв.", "Außerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die Tradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem wöchentlichen Lauftreff auf dieses Event vorbereiten.": "Крім того, наше підприємство щороку бере участь у міському корпоративному забігу. Склалася традиція, що колеги-учасники разом готуються до цієї події на щотижневих бігових зустрічах.", "Dieser findet jeden Mittwoch um 17:30 Uhr statt.": "Вони відбуваються щосереди о 17:30.", "Abwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch während der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle Schreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.": "Різноманітно облаштовані робочі місця в офісах сприяють більшій активності навіть під час роботи і протидіють негативним наслідкам тривалого сидіння. Усі письмові столи регульовані за висотою, тож працювати можна й стоячи.", "Zusätzlich bieten wir das sogenannte „Deskbike\" an - eine Art Büro-Fahrrad, das sich einfach unter einen höhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre Gesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß.": "Додатково ми пропонуємо так званий «Deskbike» — своєрідний офісний велотренажер, який легко підкотити під стіл з регульованою висотою. Так ми хочемо дати вам можливість зміцнювати здоров'я. І не в останню чергу рух — це просто приємно.", "Der Fitnessraum ist während der Arbeitszeit geöffnet.": "Фітнес-зал відкритий у робочий час.", "Die Mitarbeiter": "Працівники", "erhalten einen Zuschuss für ein Deskbike.": "отримують доплату на Deskbike.", "haben teilweise spezielle Schreibtischen Stehhöhe.": "частково мають спеціальні столи для роботи стоячи.", "können das hausinterne Fitnessstudio gratis nutzen.": "можуть безкоштовно користуватися фітнес-залом підприємства.", "haben teilweise spezielle Schreibtische in Stehhöhe.": "частково мають спеціальні столи для роботи стоячи.", "Einführungstag": "День адаптації", "Unsere Personalreferentin führt mehrmals jährlich einen Einführungstag für unsere neuen Mitarbeiterinnen und Mitarbeiter durch, an dem diese mit unterschiedlichen Arbeitsbereichen sowie den rechtlichen und organisatorischen Prozessen vertraut gemacht werden. Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist. Am Einführungstag besteht außerdem die Möglichkeit, Kolleginnen und Kollegen aus anderen Abteilungen kennenzulernen. Die Abteilungsleiter werden bei dieser Gelegenheit in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben.": "Наша менеджерка з персоналу кілька разів на рік проводить для нових працівниць і працівників день адаптації, на якому їх знайомлять з різними сферами роботи, а також із правовими та організаційними процесами. Звертаємо увагу, що участь у такому інформаційному заході обов'язкова. Крім того, в день адаптації є можливість познайомитися з колегами з інших відділів. Керівники відділів при цьому коротко розкажуть про сферу діяльності своїх команд.", "Da unser Unternehmen in einem hochsensiblen Bereich arbeitet, haben wir für unser gesamtes Gebäude ein komplexes Sicherheitssystem. Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor. Weitere Einzelheiten zu diesem Tag, wie den Treffpunkt und den Ablauf, finden Sie in dieser Mappe. Eine gesonderte Anmeldung ist nicht erforderlich.": "Оскільки наше підприємство працює в дуже чутливій сфері, у нас для всієї будівлі є складна система безпеки. Її ми також докладно представимо вам у межах дня орієнтації. Інші подробиці цього дня, як-от місце зустрічі та програму, ви знайдете в цій папці. Окрема реєстрація не потрібна.", "Für Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung.": "З питаннями щодо дня адаптації охоче допоможе відділ кадрів.", "Alle Mitarbeiter ( Mitarbeitende) müssen ein paar Mal pro Jahr am Einführungstag (einer Informationsveranstaltung) teilnehmen.": "Усі працівники мусять кілька разів на рік брати участь у дні адаптації (інформаційному заході).", "Neue Mitarbeiter sollten sich in der Personalabteilung zum Einführungstag anmelden.": "Нові працівники мають зареєструватися на день адаптації у відділі кадрів.", "Am Einführungstag": "У день адаптації", "müssen sich die Teilnehmenden in der Personalabteilung melden.": "учасники мають з'явитися до відділу кадрів.", "stellt ein Abteilungsleiter alle Kolleginnen und Kollegen vor.": "керівник відділу представляє всіх колег.", "werden neue Mitarbeitende in die Sicherheitsregeln im Unternehmen eingeführt.": "нових працівників знайомлять із правилами безпеки на підприємстві.", "Die neuen Mitarbeiter": "Нові працівники", "bekommen vom Abteilungsleiter eine Führung durch das Unternehmen.": "отримують від керівника відділу екскурсію підприємством.", "können an einem Einführungstag im Betrieb teilnehmen.": "можуть узяти участь у дні адаптації на підприємстві.", "werden mit den Funktionen des Sicherheitssystems vertraut gemacht.": "ознайомлюються з функціями системи безпеки.", "Essen in der Kantine": "Харчування в їдальні", "Unser Unternehmen arbeitet an sieben Tagen rund um die Uhr im Drei-Schicht-System. Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung. Um unnötige Wartezeiten in der Mittagszeit zu vermeiden, wurden in Abstimmung mit dem Betriebsrat aber folgende Essenszeiten für die einzelnen Abteilungen festgelegt : Während das Personal aus der Produktion und dem Lager in der ersten Gruppe von 12.00 bis 13.00 Uhr eine warme Mahlzeit zu sich nehmen kann, folgen die Mitarbeiterinnen und Mitarbeiter der Verwaltung in der zweiten Gruppe von 13.00 bis 14.00 Uhr.": "Наше підприємство працює сім днів на тиждень цілодобово в три зміни. Тому і наша їдальня, яка забезпечує харчування працівників, працює щодня 24 години. Щоб уникнути зайвого очікування в обідній час, за погодженням із виробничою радою для окремих відділів визначено такий час прийому їжі: персонал виробництва і складу в першій групі може пообідати гарячим з 12:00 до 13:00, а працівниці й працівники адміністрації — у другій групі з 13:00 до 14:00.", "Außerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen. Darüber hinaus befindet sich dort eine Mikrowelle, in der Sie mitgebrachte Speisen erwärmen können. Zusätzliche Automaten für kalte und warme Getränke befinden sich auf jeder Etage in unserem Firmengebäude.": "Крім того, працівники будь-коли можуть узяти свіжоприготовані снеки або невеликі страви, як-от супи чи страви з макаронів, з автоматів, встановлених у їдальні. Також там є мікрохвильовка, в якій можна розігріти принесену їжу. Додаткові автомати з холодними й гарячими напоями є на кожному поверсі будівлі фірми.", "Die Kantine ist immer geöffnet.": "Їдальня завжди відкрита.", "Die Mitarbeiterinnen und Mitarbeiter": "Працівниці та працівники", "bekommen in der Kantine keine Getränke.": "не отримують у їдальні напоїв.", "können nachts in der Kantine essen.": "можуть їсти в їдальні вночі.", "müssen mittags oft sehr lange anstehen.": "в обід часто мусять дуже довго стояти в черзі.", "Firmenorganigramm": "Організаційна схема фірми", "Für Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können. Dafür wollen wir Ihnen im Folgenden Orientierung geben und hoffen, Ihnen den Einstieg in unser Unternehmen mit diesem Organigramm zu erleichtern.": "Вам як новій працівниці / новому працівнику нашого підприємства з традиціями важливо знати, як влаштоване підприємство, тобто які є відділи, хто за що відповідає і до кого звертатися з питаннями. Для цього ми хочемо далі дати вам орієнтир і сподіваємося полегшити вам початок роботи за допомогою цієї оргсхеми.", "Das Dach unseres Unternehmens bildet die Geschäftsleitung. Hier laufen alle Fäden zusammen. Die nächste Ebene umfasst unsere Bereiche Produktion, Vertrieb und Personalwesen. In der Personalabteilung wenden Sie sich an Ihrem ersten Arbeitstag an Frau Müller. Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung. Für Urlaubsangelegenheiten steht Ihnen Herr Scholz zur Verfügung. Gehaltsfragen können Sie mit Herr Kleinschmidt besprechen. Sollten Sie eine Dienstreise unternommen haben, rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab.": "Дах нашого підприємства — це керівництво. Тут сходяться всі нитки. Наступний рівень охоплює наші підрозділи: виробництво, збут і кадри. У відділі кадрів у перший робочий день зверніться до пані Мюллер. Вона видасть вам посвідчення працівника, потрібні ключі та робочий одяг. З питань відпустки до вас до послуг пан Шольц. Питання зарплати можна обговорити з паном Кляйншмідтом. Якщо ви були у відрядженні, витрати розраховуйте з паном Фрідріхом.", "Den neuen Mitarbeitenden wird die Organisationsstruktur des Unternehmens vorgestellt.": "Новим працівникам представляють організаційну структуру підприємства.", "In der Personalabteilung": "У відділі кадрів", "bekommen die Mitarbeitenden ihre Ausstattung.": "працівники отримують своє спорядження.", "bezahlt man die Arbeitskleidung.": "оплачують робочий одяг.", "bucht man Dienstreisen.": "бронюють відрядження.", "Arbeitsunfälle": "Нещасні випадки на роботі", "Arbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen.": "Нещасні випадки на роботі — це нещасні випадки, яких працівники зазнають під час виконання роботи або у відрядженні. Тобто має бути причинний зв'язок із професійною діяльністю.", "Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.": "Після нещасного випадку на роботі працівники мають негайно повідомити про нього роботодавця і за потреби звернутися по лікування. Крім того, щойно стан здоров'я потерпілого дозволить, треба скласти докладний звіт про нещасний випадок і подати його до відділу кадрів.", "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.": "У разі непрацездатності після нещасного випадку на роботі працівники шість тижнів отримують від роботодавця збережену зарплату, після цього виплати бере на себе професійна страхова спілка (BG): вона виплачує, зокрема, допомогу потерпілим у розмірі 80 відсотків від зарплати брутто і за потреби покриває інші витрати.", "Zu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.": "До нещасних випадків на роботі належать і нещасні випадки дорогою, тобто ті, що стаються на прямому шляху між житлом і місцем роботи. Цей шлях починається біля дверей власного дому і закінчується, щойно працівник дістався підприємства. При цьому застраховані й певні необхідні об'їзди, наприклад, дорога до дитсадка, об'їзди через ремонт доріг чи спільні поїздки, незалежно від виду транспорту.", "Der Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation.": "Страховий захист охоплює виключно шкоду здоров'ю; матеріальна шкода, наприклад пошкодження автомобіля, не застрахована. У такому разі BG покриває, наприклад, витрати на лікування, а також за потреби догляд чи медичну реабілітацію.", "Ein Fahrradunfall auf dem Weg zur Arbeit zählt nicht als Arbeitsunfall.": "Аварія на велосипеді дорогою на роботу не вважається нещасним випадком на роботі.", "Nach einem Arbeitsunfall": "Після нещасного випадку на роботі", "bezahlt die Berufsgenossenschaft sofort Verletztengeld.": "професійна страхова спілка одразу виплачує допомогу потерпілим.", "erhalten Arbeitnehmer sechs Wochen volles Gehalt.": "працівники шість тижнів отримують повну зарплату.", "muss ein Bericht vom Arzt beim Arbeitgeber abgegeben werden.": "треба подати роботодавцю довідку від лікаря.", "Im Falle eines Arbeitsunfalls muss man sofort einen Bericht beim Arbeitgeber einreichen.": "У разі нещасного випадку на роботі треба одразу подати роботодавцю звіт.", "trägt der Arbeitgeber die Kosten für die medizinische Versorgung.": "роботодавець оплачує медичну допомогу.", "Wichtige Hinweise zum Datenschutz": "Важливі вказівки щодо захисту даних", "Unser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben. Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden. Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei. Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein. Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.": "Наше підприємство зобов'язане захищати дані відповідно до Загального регламенту ЄС про захист даних (GDPR / DSGVO). У принципі дані наших працівниць і працівників можна збирати лише тоді, коли вони заздалегідь чітко на це погодилися. Разом із трудовим договором ви вже отримали бланк, підписавши який, підтвердили згоду на зберігання ваших персональних даних. Якщо надалі у вас виникнуть питання щодо захисту даних, можете звернутися до нашого внутрішнього уповноваженого з захисту даних пана Кольяка (внутрішній номер 814) або його заступниці пані Домбровскі (внутрішній номер 485). Ми очікуємо від наших працівниць і працівників, що вони завжди будуть в курсі актуального щодо регламенту про захист даних, і тому щороку пропонуємо навчання з цією метою. Їх проводить наш зовнішній партнер з навчання WissMax, і вони відбуваються в різні дати, щоразу на вихідних, у нас на підприємстві. Відвідування семінару зараховується як робочий час і для наших працівників безкоштовне. Брати участь у такому тренінгу треба щонайменше раз на три роки і підтверджувати це сертифікатом. Будь ласка, подавайте його до відділу кадрів без нагадувань. Як альтернативу ви можете відвідати подібне навчання в іншого провайдера. Але в такому разі просимо заздалегідь погодити таку участь із відділом кадрів, щоб вам схвалили семінар і гарантували оплату витрат.", "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.": "Працівники мусять раз на рік проходити семінар із захисту даних.", "Die Teilnahme am Seminar": "Участь у семінарі", "gilt als Arbeitszeit.": "вважається робочим часом.", "ist kostenpflichtig.": "платна.", "muss bei WissMax erfolgen.": "має відбуватися у WissMax.", "Unser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben.": "Наше підприємство зобов'язане захищати дані відповідно до Загального регламенту ЄС про захист даних (GDPR / DSGVO). У принципі дан
