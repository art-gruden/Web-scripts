. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern. Sie kann sich vor Aufträgen gar nicht retten."}, {"k": "d", "title": "Jochen, vor 5 Stunden", "body": "Also ich würde noch warten, bis dein Kind etwas größer ist, und mich jetzt noch nicht um einen Ausbildungsplatz bewerben. Wenn es etwas selbstständiger ist, wird vieles leichter. Eine Ausbildung kannst du auch in drei oder vier Jahren noch machen. Dein Kind braucht dich jetzt."}, {"k": "e", "title": "Achim, vor 6 Stunden", "body": "Schutz von Leben und Gesundheit ist das oberste Gebot. Um dich und dein Kind zu schützen, darfst du während der Schwangerschaft keine körperlich anstrengenden Arbeiten verrichten und auch Tätigkeiten, bei denen du Lärm, Schmutz, Kälte usw. ausgesetzt bist, sind tabu."}, {"k": "f", "title": "Peter, vor 12 Stunden", "body": "Warum das denn? Es gibt doch heutzutage Möglichkeiten, das Kind unterzubringen, während man arbeitet. Können dich deine Eltern vielleicht unterstützen? Sprich mal mit deinem Chef! Wenn der sieht, dass dir die Ausbildung wichtig ist, wird sich eine Lösung finden. Aber versuch auf jeden Fall, die Ausbildung durchzuziehen."}], "num": "2", "ver": "", "test": ""}, {"id": "t3-36", "title": "Lesen Teil 3 (вариант №3) - 100%", "note": "", "persons": [{"n": 10, "name": "Som", "answer": "e", "body": "Meine Kinder sind unter der Woche ganztags in der Kita, damit ich Vollzeit arbeiten kann. Jetzt soll ich in den nächsten Wochen samstags ins Büro kommen. Ich habe aber niemanden, der da auf meine Kinder aufpassen kann. Kann der Arbeitgeber das verlangen?"}, {"n": 11, "name": "Reinhold", "answer": "d", "body": "Ich arbeite seit zwölf Jahren 20 Stunden die Woche und würde jetzt gerne, weil die Kinder aus dem Haus sind, meine Arbeitszeit aufstocken und wieder Vollzeit arbeiten. Habe ich ein Recht darauf ?"}, {"n": 12, "name": "Mandy", "answer": "x", "body": "Seit zwei Jahren arbeite ich Vollzeit in einem Unternehmen und dieser Job macht mir auch viel Spaß. Aus familiären Gründen würde ich gerne eine dreijährige Auszeit nehmen. Ich überlege, ob ich mir das finanziell leisten kann."}, {"n": 13, "name": "Nici", "answer": "a", "body": "Ich bekomme jetzt das zweite Kind und werde danach wahrscheinlich erst mal Teilzeit arbeiten. Jetzt habe ich ziemlich große Angst, dass ich in meiner Karriere den Anschluss verpasse. Soll ich vielleicht doch so schnell wie möglich wieder Vollzeit arbeiten?"}], "options": [{"k": "a", "title": "Thilo, vor 45 Minuten", "body": "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden."}, {"k": "b", "title": "Henny, vor 1 Stunde", "body": "Also ich finde es nicht gut, wenn Geschäfte und Supermärkte an Samstagen so lange geöffnet sind. Ihr müsst doch bedenken, dass dort auch Menschen arbeiten müssen. Sie wollen doch ebenfalls Wochenende haben und zu ihren Familien. Ich bin ganz klar gegen längere Ladenöffnungszeiten."}, {"k": "c", "title": "Angela, vor 6 Stunden", "body": "Jeder Arbeitnehmer hat einen Rechtsanspruch auf Teilzeitarbeit. Allerdings musst du länger als sechs Monate bei dem Unternehmen beschäftigt sein. Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat. Schau doch mal im Internet, wie viel das ausmacht."}, {"k": "d", "title": "Ratna, vor 2 Stunden", "body": "Seit Kurzem haben Arbeitnehmer das Recht, eine befristete Zeit weniger zu arbeiten, aber das gilt bestimmt nicht rückwirkend. Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef."}, {"k": "e", "title": "Alex, vor 30 Minuten", "body": "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht. Oft ist es aber auch so, dass du dann an einem anderen Tag in der Woche frei bekommst."}, {"k": "f", "title": "Gerhard, vor 3 Stunden", "body": "Also ich würde mir das gut überlegen. Wenn du bisher gut über die Runden gekommen bist, könntest du dir doch etwas mehr Freizeit gönnen. Meines Erachtens geht es hier auch um mehr Lebensqualität. Das Leben ist zu kurz, um nur zu arbeiten."}], "num": "3", "ver": "", "test": ""}, {"id": "t3-37", "title": "Lesen Teil 3 (вариант №4) – 100%", "note": "", "persons": [{"n": 10, "name": "Thia", "answer": "a", "body": "Voll gemein, ich habe nur 25 Urlaubstage! Mein Freund hat hingegen 30 Tage im Jahr. Ich frage mich, ob mir nicht auch mehr Tage zustehen. Kennt sich von euch da jemand aus?"}, {"n": 11, "name": "Marilena", "answer": "b", "body": "Ich arbeite im Einzelhandel und bei uns gilt jede Woche ein anderer Dienstplan. Wir bekommen den Plan immer erst am Ende der Vorwoche und deshalb können wir unsere Freizeit natürlich auch nicht richtig planen. Ist das erlaubt?"}, {"n": 12, "name": "Hans", "answer": "f", "body": "Ich habe nach der Genehmigung meines Urlaubs diesen gebucht und jetzt hat mein Chef gemerkt, dass ein anderer Kollege schon vorher zur selben Zeit Urlaub eingereicht hat. Jetzt will er mir meinen wieder streichen. Darf er das?"}, {"n": 13, "name": "Lisa", "answer": "x", "body": "Ich mache zurzeit ein Pflichtpraktikum in einem Unternehmen und arbeite von Montag bis Freitag acht Stunden täglich. Jetzt soll ich nächsten Samstag auch noch kommen. Bin ich dazu verpflichtet? Ich fühle mich ein bisschen ausgenutzt!"}], "options": [{"k": "a", "title": "Cécile, vor 3 Stunden", "body": "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast. Bei manchen Arbeitgebern erhöht sich der Urlaubsanspruch mit längerer Firmenzugehörigkeit."}, {"k": "b", "title": "Limit, vor 5 Stunden", "body": "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst und wann du frei hast."}, {"k": "c", "title": "Susanne, vor 3 Stunden", "body": "Urlaub muss immer rechtzeitig beantragt werden, aber der Arbeitgeber ist nicht unbedingt verpflichtet, ihn zu gewähren. Wann Urlaub genommen werden darf, entscheidet der Chef. Aufgrund dringender betrieblicher Gründe kann ein Urlaubsantrag auch abgelehnt werden."}, {"k": "d", "title": "Nico, vor 30 Minuten", "body": "Schau doch mal in deinen Arbeitsvertrag, da ist das sicher geregelt. Soviel ich wie, gibt es keine gesetzlichen Einschränkungen für angestellte Arbeitnehmer. Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag."}, {"k": "e", "title": "Greta, vor 2 Stunden", "body": "Ich arbeite auch im Einzelhandel und bei uns ist es so geregelt, dass man einen festen Wochentag freibekommt, wenn man immer samstags arbeitet. Das kommt mir entgegen. So kann ich entspannt unter der Woche einkaufen oder ins Schwimmbad gehen."}, {"k": "f", "title": "Michele, vor 6 Stunden", "body": "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus. Wenn du deinen Urlaub tatsächlich nicht antrittst, muss der Arbeitgeber alle Kosten tragen, die dir durch die Urlaubsverschiebung entstehen."}], "num": "4", "ver": "", "test": ""}, {"id": "t3-38", "title": "Lesen Teil 3 (вариант №5) - 100%", "note": "", "persons": [{"n": 10, "name": "Mikke", "answer": "x", "body": "Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen."}, {"n": 11, "name": "Ludmilla", "answer": "a", "body": "Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeiter Parkplatz stellen?"}, {"n": 12, "name": "Peter", "answer": "f", "body": "Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen, da ich kein Auto habe. Hätte ich ein Taxi nehmen müssen?"}, {"n": 13, "name": "Ingo", "answer": "d", "body": "Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer ein früheren Bus zu nehmen, damit ich pünktlich bin?"}], "options": [{"k": "a", "title": "Hans, vor 2 Stunden", "body": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten."}, {"k": "b", "title": "Mallory, vor 45 Minuten", "body": "Wenn ein Zug seine Reise nicht fortsetzen kann und in einem Bahnhof stehen bleiben muss, bezahlt die Deutsche Bahn den Fahrgästen in bestimmten Fällen eine Weiterfahrt im Taxi. Oder sie übernimmt die Kosten für eine Hotelübernachtung. Nähere Infos findest du auf der Webseite der Deutschen Bahn.", "old_body": "Thilo, vor 45 Minuten — Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt."}, {"k": "c", "title": "Johannes, vor 3 Stunden", "body": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt."}, {"k": "d", "title": "Jacqueline, vor 30 Minuten", "body": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst."}, {"k": "e", "title": "Andreij vor 4 Stunden", "body": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht."}, {"k": "f", "title": "Alex, vor 45 Minuten", "body": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen muss, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen. Wenn ja, sind diese Kosten für dich nicht zumutbar."}], "num": "5", "ver": "", "test": ""}, {"id": "t3-39", "title": "Lesen Teil 3 (вариант №5)(новые имена и очередь) - 100%", "note": "", "persons": [{"n": 10, "name": "Natalie", "answer": "a", "body": "Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit .Muss der Arbeitgeber nicht eigentlich seinen Mitarbeiter Parkplatz stellen?"}, {"n": 11, "name": "Batiste", "answer": "f", "body": "Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit ins Büro zu kommen. Da ich kein Auto habe, hätte ich ein Taxi nehmen müssen?"}, {"n": 12, "name": "Alfons", "answer": "d", "body": "Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer ein früherer Bus zu nehmen, damit ich pünktlich bin?"}, {"n": 13, "name": "Karel", "answer": "x", "body": "Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über der Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen."}], "options": [{"k": "a", "title": "Enric, vor 2 Stunden", "body": "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten."}, {"k": "b", "title": "Mallory, vor 45 Minuten", "body": "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt."}, {"k": "c", "title": "Mao, vor 3 Stunden", "body": "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt."}, {"k": "d", "title": "Nastasia, vor 30 Minuten", "body": "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts mit deiner Verspätung kannst."}, {"k": "e", "title": "Bartomeu, vor 4 Stunden", "body": "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht."}, {"k": "f", "title": "Sterre, vor 45 Minuten", "body": "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen muss, achte darauf an, ob die Kosten dafür über deinem Arbeitslohn fair einen Tag sind und diese Kosten für dich nicht zumutbar sind."}], "num": "5", "ver": "нова", "test": ""}, {"id": "t3-40", "title": "Lesen Teil 3 (вариант №6)(тест №150321, 150301) - 100%", "note": "", "persons": [{"n": 10, "name": "Claudia", "answer": "x", "body": "Ich muss während der Arbeit eine Uniform tragen. Mir ist es unangenehm, die schon morgens in der Bahn anzuhaben, und ich möchte mich lieber im Hotel umziehen. Muss ich dafür früher kommen oder gilt die Umkleidezeit als Arbeitszeit?"}, {"n": 11, "name": "Maisel", "answer": "f", "body": "Gestern war ich für einen Tag bei einem Kunden in Norddeutschland. Ich bin mit dem Zug gefahren und habe während der Fahrt gelesen. Insgesamt war ich elf Stunden unterwegs und habe Überstunden geltend gemacht. Die will mein Arbeitgeber nicht anerkennen."}, {"n": 12, "name": "Cristof", "answer": "e", "body": "Ich war am Wochenende auf einer Fortbildung, die für meine Arbeit relevant war. Ich wollte mir jetzt einen Urlaubstag gutschreiben lassen, aber meine Chefin sagt, das sei meine private Angelegenheit, da sie die Fortbildung nicht angeordnet hat. Stimmt das?"}, {"n": 13, "name": "Samira", "answer": "a", "body": "Ich fahre morgens mit dem Fahrrad in die Firma, bin immer pünktlich um 9.00 Uhr da und mache mich dann fertig. Ab sofort soll ich früher kommen und darf mich nicht mehr während der Arbeitszeit umziehen. Ist das korrekt?"}], "options": [{"k": "a", "title": "Andres, vor 8 Minuten", "body": "Wenn du in Sportkleidung in die Firma kommst und dich dort noch umziehst, ist das Privatsache. Du musst dafür sorgen, dass du pünktlich mit deiner Arbeit beginnen kannst. In diesem Fall ist die Umkleidezeit keine Arbeitszeit."}, {"k": "b", "title": "Paula, vor 3 Stunden", "body": "Der Weg zur Arbeit ist private Zeit. Du trägst die Verantwortung dafür, pünktlich vor Ort zu sein, egal wie weit dein Weg ist. Wenn du z.B. im Stau stehst oder die- S-Bahn streikt und du deshalb zu spät kommst, musst du die Zeit nacharbeiten."}, {"k": "c", "title": "Raimund, vor 6 Stunden", "body": "Arbeitnehmer/innen haben in der Regel alle zwei Jahre Anspruch auf fünf Tage Bildungsurlaub. Die Gesetze sind aber nicht in jedem Bundesland gleich. So variiert zum Beispiel die Anzahl der Tage für Bildungsurlaub je nachdem, ob du Voll- oder Teilzeit tätig bist."}, {"k": "d", "title": "Hubert, vor 38 Minuten", "body": "Ich finde das Tragen von Dienstkleidung absolut veraltet. Warum müssen alle im Unternehmen gleich gekleidet sein? Jeder Mensch hat doch seinen eigenen Stil, mit dem er sich wohlfühlt. Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest."}, {"k": "e", "title": "Yvonne, vor 7 Stunden", "body": "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen. Schickt dein Chef dich allerdings seinerseits auf ein Seminar , handelt es sich um Arbeitszeit."}, {"k": "f", "title": "Winfried, vor 25 Minuten", "body": "Das ist ein schwieriges Thema. Wenn du während der Reise zum Beispiel deinen Termin vorbereitest oder mit dem Laptop ein Protokoll schreibst, ist das Arbeitszeit. Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit."}], "num": "6", "ver": "", "test": "150321"}, {"id": "t3-41", "title": "Lesen Teil 3 (вариант №7)(тест №140321, 140301)", "note": "", "persons": [{"n": 10, "name": "Torsten", "answer": "e", "body": "Wir hatten neulich im Büro eine Diskussion darüber, ab wann man in Rente gehen kann. Ich dachte immer, man muss bis 67 arbeiten. Aber meine Kollegin meinte, dass sie zwei Jahre früher in Rente gehen wird. Geht das überhaupt?"}, {"n": 11, "name": "Hella", "answer": "x", "body": "Meine Rente wird ja nicht so berauschend sein, vor allem, weil ich wegen meiner zwei Kinder einige Jahre nicht oder nur Teilzeit gearbeitet habe. Es ist ja wohl schon so, dass ich dafür jetzt irgendwie bestraft werde, oder?"}, {"n": 12, "name": "Petra", "answer": "d", "body": "Mein Mann geht in zwei Jahren in Rente. Ich müsste noch vier Jahre arbeiten. Wir haben uns überlegt, dass wir zusammen in Rente gehen und noch viele gemeinsame Jahre mit verschiedenen Aktivitäten erleben wollen. Welche Folgen hätte das?"}, {"n": 13, "name": "Leni", "answer": "b", "body": "Ich bin ja noch jung und denke überhaupt noch nicht an die Rente. Aber es wird ja immer wieder gesagt, dass die normale Rente irgendwann nicht mehr ausreichen wird. Was kann ich denn jetzt schon für später tun?"}], "options": [{"k": "a", "title": "Stefan, vor 4 Stunden", "body": "Kaum jemandem gelingt es, 45 Jahre durchgehend so ein hohes Gehalt zu verdienen, dass er später die Höchstrente bekommt Das liegt schon allein daran, dass man während der Ausbildung und in den ersten Berufsjahren weniger verdient."}, {"k": "b", "title": "Jana, vor 34 Minuten", "body": "Auch Firmen helfen, für die Zukunft vorzusorgen, denn man kann gar nicht früh genug damit anfangen. Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente."}, {"k": "c", "title": "Antje, vor 7 Stunden", "body": "Wenn man mindestens fünf Jahre versicherungspflichtig beschäftigt war, hat man Anspruch auf die gesetzliche Rente. Dabei spielt es keine Rolle, ob man Teiltzeit oder Vollzeit gearbeitet hat. Es gibt aber noch Unterschiede zwischen Ost und West."}, {"k": "d", "title": "Jonas, vor 2 Stunden", "body": "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger. Man muss sich das genau ausrechnen, ob man sich das leisten kann."}, {"k": "e", "title": "Jörg, vor 5 Stunden", "body": "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann, also Jahre, in denen man in die Rentenversicherung eingezahlt hat."}, {"k": "f", "title": "Lia, vor 12 Stunden Wenn man jung ist, sollte man sein Leben doch erst einmal genießen. Über Alter", "body": "und Krankheit kann man sich immer noch Gedanken machen. Wer weiß, ob es später, wenn wir so weit sind, überhaupt noch eine Rente geben wird."}], "num": "7", "ver": "", "test": "140321"}, {"id": "t3-42", "title": "Lesen Teil 3 (вариант №8)(тест №160201, 160221) – 100%", "note": "", "persons": [{"n": 10, "name": "Natalja", "answer": "b", "body": "Wir werden Eltern und wollen beide die bezahlte Elternzeit nehmen. Eine Freundin meinte, dass wir insgesamt ein Jahr zu Hause bleiben können. Ein anderer Bekannter sagte, man könne sein Kind bis zu drei Jahre zu Hause betreuen. Was stimmt?"}, {"n": 11, "name": "Katrin", "answer": "f", "body": "Ich bin im vierten Monat schwanger. Mein Chef will, dass ich notfalls auch mal eine Spätschicht übernehme. Die geht bis 21:00 Uhr. Soviel ich weiß, ist das gar nicht erlaubt, oder? Außerdem bin ich abends immer sehr müde."}, {"n": 12, "name": "Giovanni", "answer": "x", "body": "Wir sind Auszubildende und bekommen bald ein Kind. Erst nach der Ausbildung wollen wir in Elternzeit gehen. Bis dahin könnte die Oma auf unser Kind aufpassen. Unser Betrieb wäre einverstanden. Weiß jemand, ob man die Elternzeit später beginnen darf?"}, {"n": 13, "name": "Sandra", "answer": "d", "body": "Nach der Geburt bekomme ich Elterngeld. Finanziell mache ich mir keine Sorgen. Aber ich will beruflich den Anschluss nicht verlieren. Nur mit dem Kind zu Hause zu bleiben, ist nicht mein Ding. Kann man Elterngeld bekommen und gleichzeitig arbeiten?"}], "options": [{"k": "a", "title": "Mario, vor 10 Stunden", "body": "Warte erst einmal ab, wie sich alles mit dem Kind entwickelt. Ich würde die Zeit nach der Geburt nicht mit Arbeit verplanen. Es ist nämlich eine große Umstellung. Wenn du dann später „Langeweile“ haben solltest, kannst du immer noch überlegen, arbeiten zu gehen."}, {"k": "b", "title": "Johann, vor 20 Minuten", "body": "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld. Sowohl die bezahlte als auch die nicht bezahlte Zeit der Betreuung können die Eltern frei untereinander aufteilen."}, {"k": "c", "title": "Hanna, vor 30 Minuten", "body": "Elterngeld erhält man von der Elterngeldstelle. Die Höhe hängt davon ab, wie viel man vorher verdient hat. Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt. Allerdings ist die Frau die ersten acht Wochen im Mutterschutz."}, {"k": "d", "title": "Angela, vor 8 Stunden", "body": "Wenn du schon länger als sechs Monate bei einer Firma beschäftigt bist, kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein. Der Betrieb kann den Antrag aber auch ablehnen."}, {"k": "e", "title": "Lars, vor 3 Stunden Wenn eine Frau schwanger ist, kann sie, soweit es der Gesundheitszustand zulässt, bis sechs Wochen vor der Geburt arbeiten. Dann beginnt der Mutterschutz. Dieser gilt auch noch für", "body": "acht Wochen nach der Geburt. Im Anschluss folgt die Elternzeit. Aber dafür gibt es wieder andere Regelungen."}, {"k": "f", "title": "Petra, vor 5 Stunden Während der Schwangerschaft darf ein Arbeitgeber die Mitarbeiterin nicht nach", "body": "22 Uhr beschäftigen. Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen. Insgesamt darf eine Schwangere aber eine tägliche Arbeitszeit von 8,5 Stunden nicht überschreiten."}], "num": "8", "ver": "", "test": "160201"}], "teil4": [{"id": "t4-p43-0", "title": "Lesen Teil 4 (вариант № 1) -100%", "keywords": "(Zulieferer, Fahrtenbuch)", "topic": "Protokoll 20.06.20XX, 10.00-12.00", "paras": ["Besprechungsraum: 032, Ort: Konrad-Adenauer-Straße 43, 30159 Hannover", "Teilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)", "Sitzungsleitung: Veronika Emmerich", "Protokollantin: Sibylle Marquardt", "Nicht Anwesende: Martin Stahl (MS, Geschäftsleitung)", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE", "2. Probleme mit einem Zulieferer - MΗ", "3. Zwischenstand Qualitätssicherung - JR", "4. Neue Überstundenregelung - VE", "5. Private Nutzung der Dienstwagen - SM", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte", "VE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen. Als nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.", "TOP 2 Probleme mit einem Zulieferer", "MH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung. t."}], "answer": "b", "src": "claude"}]}], "num": "1", "ver": "08.2024", "test": "", "theme": "Zulieferer, Fahrtenbuch"}, {"id": "t4-p47-2", "title": "Lesen Teil 4 (вариант № 2) - 100%", "keywords": "(neue Werbemaßnahmen, Frau Schlosser)", "topic": "Protokoll 14.02.20XX, 08:00-11:45 Uhr", "paras": ["Abteilung 4, Besprechungszimmer 2", "Teilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke", "(SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)", "Entschuldigt: Martin Hamann (MH, Qualitätssicherung) Protokollantin: Marianne Schiller (MS)", "Sitzungsleitung: Andreas Mertens (AM)", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung des letzten Protokolls", "2. Neue Marketingmaßnahmen", "3. Qualitätsmanagement", "4. Anpassung der Pausenzeiten", "5. Standorte der neuen Fahrradständer", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung des letzten Protokolls", "AM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.", "TOP 2 Neue Marketingmaßnahmen", "CM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden, Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern.", "Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.", "TOP 3 Qualitätsmanagement", "Zu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen. Da MH an der heutigen Sitzung aus gesundheitlichen Gründen nicht teilnehmen kann, ist gemeinsam beschlossen worden, die Diskussion zu diesem Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit ist die Umsetzung der geplanten Veränderungen auf das nächste Quartal verschoben.", "TOP 4 Anpassung der Pausenzeiten", "Aufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.", "TOP 5 Standorte der neuen Fahrradständer", "MR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen.", "Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "TOP 6 Sonstiges", "Die Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Für neue Werbemaßnahmen", "options": [{"k": "a", "text": "werden kreative Mitarbeiter gesucht."}, {"k": "b", "text": "wird ein Gesamtbetrag von 150.000 € bereitgestellt."}, {"k": "c", "text": "wurden Kostenvoranschläge angefragt."}], "answer": "b", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Herr Hamann", "options": [{"k": "a", "text": "hat bereits ein Konzept vorbereitet."}, {"k": "b", "text": "ist dienstlich verhindert."}, {"k": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Die Mittagspause", "options": [{"k": "a", "text": "ist 30 Minuten lang."}, {"k": "b", "text": "wird um 30 Minuten verlängert."}, {"k": "c", "text": "wird um 30 Minuten verschoben."}], "answer": "a", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"k": "a", "text": "wird an der Informationstafel bekanntgegeben."}, {"k": "b", "text": "wird dem Betriebsrat mitgeteilt."}, {"k": "c", "text": "wird zwischen Tor 2 und 3 geplant."}], "answer": "a", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Frau Schlosser", "options": [{"k": "a", "text": "macht Frau Schmidt ein Geschenk."}, {"k": "b", "text": "verlässt das Unternehmen."}, {"k": "c", "text": "wird von Frau Meier vertreten."}], "answer": "c", "src": "claude"}]}], "num": "2", "ver": "", "test": "", "t nzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern.", "Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.", "TOP 3 Qualitätsmanagement", "MH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat. Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann, wird beschlossen, diesen Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit verschiebt sich auch die Umsetzung Maßnahmen zur Qualitätssicherung. MH hat aber zugesagt, bis Anfang März noch weitere Idee erarbeiten und zu kommunizieren.", "TOP 4 Anpassung der Pausenzeiten", "Aufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.", "TOP 5 Standorte der neuen Fahrradständer", "MR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen.", "Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.", "TOP 6 Sonstiges", "Die Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Die neuen Werbemaßnahmen", "options": [{"k": "a", "text": "dürfen bis zu 150.000 Euro kosten."}, {"k": "b", "text": "sollen Online-Medien ausschließen."}, {"k": "c", "text": "werden bis zur nächsten Teamsitzung umgesetzt."}], "answer": "a", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Herr Hamann", "options": [{"k": "a", "text": "hat erste Arbeitsergebnisse versendet."}, {"k": "b", "text": "realisiert bis Marz die Maßnahmen zur Qualitätssicherung."}, {"k": "c", "text": "stellt die Resultate seiner Arbeit vor."}], "answer": "a", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Die Mittagspause", "options": [{"k": "a", "text": "wird um 30 Minuten verlängert."}, {"k": "b", "text": "wird um 30 Minuten verschoben."}, {"k": "c", "text": "ist 30 Minuten lang."}], "answer": "c", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Der Standort der neuen Fahrradständer", "options": [{"k": "a", "text": "wird dem Betriebsrat mitgeteilt."}, {"k": "b", "text": "wird zwischen Tor 2 und 3 geplant."}, {"k": "c", "text": "wird an der Informationstafel bekanntgegeben."}], "answer": "c", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Frau Schlosser", "options": [{"k": "a", "text": "verlässt das Unternehmen."}, {"k": "b", "text": "wird von Frau Meier vertreten."}, {"k": "c", "text": "macht Frau Schmidt ein Geschenk."}], "answer": "b", "src": "claude"}]}], "num": "2", "ver": "07.2024", "test": "", "theme": "neue Werbemaßnahmen, Frau Schlosser"}, {"id": "t4-p51-4", "title": "Lesen Teil 4 (вариант № 3) - 100%", "keywords": "(Personalthemen, Urlaubssperre)", "topic": "Protokoll 19.11.20XX, 08.00-11.45 Uhr", "paras": ["Zentrale, Raum 405 Sitzungsleitung: Lukas Wallner (LW)", "Teilnehmende: Jessica Müller (JM, Personalabteilung), Maximilian Berger (MB, Marketingabteilung), Rebecca Lehmann (RL, Öffentlichkeitsarbeit), Kurt Meichsner (KM, Verkauf)", "Extern: Ansgar Wolf (AW, Hausverwaltung)", "Protokollantin: Beate Richter (BR)", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung des letzten Protokolls", "2. Personal", "3. Kundenbindung, Rabattaktion", "4. Vorbereitungen der Messe", "5. Neujahrsfeier", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung des letzten Protokolls", "LW begrüßt alle Teilnehmer und eröffnet die heutige Besprechung. Herr Dr. Baumann aus der Qualitätssicherung lässt sich entschuldigen, da er in dieser Woche auf einer Dienstreise ist. Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.", "TOP 2 Personal", "Die Kundenbetreuung ist aktuell unterbesetzt, weil viele Kollegen krank sind. Auch in der Personalabteilung herrscht ein hoher Krankenstand. Krankmeldungen aus allen Abteilungen sollen deshalb vorübergehend direkt an JM gesendet werden.", "Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden. Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen, die möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten. Sollte dies aufgrund des hohen Arbeitspensums nicht möglich sein, können die Überstunden auch in das nächste Jahr übertragen werden.", "Herr Wortmann aus dem Verkauf geht am 1. Februar des nächsten Jahres in den Ruhestand. Sein Nachfolger wird KM, den Herr Wortmann ab sofort einarbeitet. Im Rahmen der Neujahrsfeier wird unser langjähriger Mitarbeiter verabschiedet. Wir möchten ihm zum Abs , bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt."], "sets": [{"label": "Актуальна версія (15 — новий варіант питання)", "questions": [{"n": 14, "type": "mc", "prompt": "Bei der Sitzung wird", "options": [{"k": "a", "text": "das Protokoll der letzten Besprechung geändert."}, {"k": "b", "text": "die Tagesordnung genehmigt."}, {"k": "c", "text": "über Personalthemen gesprochen."}], "answer": "c", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Aufgrund des hohen Krankenstands", "options": [{"k": "a", "text": "bleibt die Arbeit teilweise unerledigt."}, {"k": "b", "text": "müssen die Überstunden im kommenden Jahr abgebaut werden. / müssen die Überstunden ins kommende Jahr mitgenommen werden."}, {"k": "c", "text": "gibt es eine Urlaubssperre."}], "answer": "c", "src": "src"}, {"n": 16, "type": "mc", "prompt": "KM", "options": [{"k": "a", "text": "ist Wettbewerber der Firma."}, {"k": "b", "text": "möchte sein Konzept besprechen."}, {"k": "c", "text": "plant eine Rabattaktion im Frühling."}], "answer": "b", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Die Firma", "options": [{"k": "a", "text": "besucht die Frühjahrsmesse regelmäßig."}, {"k": "b", "text": "braucht Hilfe bei der Standgestaltung."}, {"k": "c", "text": "lässt gerade Broschüren drucken."}], "answer": "c", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Persönliche Gegenstände", "options": [{"k": "a", "text": "können nicht in der Küche bleiben."}, {"k": "b", "text": "sollen am Donnerstag mitgenommen werden."}, {"k": "c", "text": "sollen weggeworfen werden."}], "answer": "a", "src": "claude"}]}, {"label": "Старий варіант питання 15", "questions": [{"n": 15, "type": "mc", "prompt": "Einige Mitarbeiter machen Überstunden,", "options": [{"k": "a", "text": "da andere Urlaub machen."}, {"k": "b", "text": "obwohl sie krank sind."}, {"k": "c", "text": "weil viele Kollegen krank sind."}], "answer": "c", "src": "claude"}]}], "num": "3", "ver": "", "test": "", "theme": "Personalthemen, Urlaubssperre"}, {"id": "t4-p53-5", "title": "Lesen Teil 4 (вариант № 4)", "keywords": "(neue Werbestrategie, Jobticket)", "topic": "Protokoll 15.04.2003, 14:00-16:00 Uhr", "paras": ["Tagungsraum: 256, Ort: Geschwister-Scholl-Platz 12, 10738 Berlin", "Anwesende: Petra Kramer (PK, Geschäftsleitung), Yvonne Schmidt (YS, Assistenz der Geschäftsleitung) Thorsten Klein (TK, Leitung Einkauf), Sonja Kühl (SK, Leitung Finanzen), Jenny Mitschke (JM, Leitung Marketing), Ilkay Ergün (IE, Leitung Produktion), Johannes Schön (JS, Leitung Personal)", "Gast: Jonas Braun (Deutsches Rotes Kreuz) Sitzungsleitung: Johannes Schön Protokollantin: Yvonne Schmidt", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung des Protokolls der letzten Sitzung", "2. Neue Werbemaßnahmen", "3. Beschwerden über schlecht geputzte Büros", "4. Fortbildung der Ersthelfer", "5. Einführung eines Jobtickets", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung des Protokolls der letzten Sitzung", "JS begrüßt alle Anwesenden und stellt den Gast Jonas Braun vom Deutschen Roten Kreuz vor. Weiterhin bittet er um die Genehmigung des Protokolls der letzten Sitzung. SK merkt an, dass das Datum des diesjährigen Sommerfests falsch im letzten Protokoll festgehalten wurde. Dieses findet am 19.07. statt. Die Änderung wird aufgenommen, ansonsten wird das Protokoll genehmigt.", "TOP 2 Neue Werbemaßnahmen", "JM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind. Um langfristige Lösungen zu finden, wurde eine Marktanalyse in Auftrag gegeben. Bevor die Ergebnisse vorliegen, sollen aber bereits erste Maßnahmen ergriffen werden. Ein IT-Mitarbeiter erarbeitet zurzeit ein Konzept, um die Homepage der Firma etwas moderner und benutzerfreundlicher zu gestalten. Außerdem sollte man unsere Homepage möglichst auf der ersten Seite in der Suchmaschine finden können. Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar. Auch die Präsenz in den sozialen Medien soll weiter ausgebaut werden, um die jüngere Zielgruppe noch besser zu erreichen. JM schlägt in diesem Zusammenhang vor, kurze, unterhaltsame Werbevideos zu drehen. Für deren Produktion wurde ein Filmteam angefragt, das auf dem Markt sehr erfolgreich, aber auch sehr teuer ist. PK beauftragt JM, bis zur nächsten Sitzung noch andere, günstigere Filmteams über Produktion zu prüfen.", "TOP 3 Beschwerden über schlecht geputzte Büros", "Seit der Zusammenarbeit mit der neuen Reinigungsfirma beschweren sich viele Kollegen aus verschiedenen Abteilungen darüber, dass die tägliche Reinigung der Büros unzureichend ausgeführt wird. Kritikpunkte sind schmutzige Tische, unregelmäßig geleerte Mülleimer und unordentlich gesaugte Fußböden. Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten. JS soll Kontakt zur Reinigungsfirma aufnehmen, um das Problem zu besprechen. Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt.", "TOP 4 Fortbildung der Ersthelfer Unsere Ersthelfer müssen regelmäßig Fortbildungen besuchen. Dafür konnten wir Jonas Braun vom Deutschen Roten Kreuz als Kursleiter gewinnen, der zusammen mit JS aus der Personalabteilung Samstag, den 10.06. als Termin festgelegt hat. Das Training dauert neun Stunden. Es wird bei uns im Haus stattfinden und als Arbeitszeit angerechnet. Die Teamleiter sollen möglichst bald klären, ob die bisherigen Ersthelfer diese Funktion weiter übernehmen möchten oder ob es neue Interessenten gibt. Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist. Die interessierten Mitarbeiter müssen sich bis zum 15.05. in der Personalabteilung anmelden.", "TOP 5 Einführung eines Jobtickets", "PK teilt mit, dass aufgrund der schwierigen Parksituation mehr Mitarbeiter dazu animiert werden sollen, öffentliche Verkehrsmittel zu nutzen. Aus diesem Grund wird sich die Firma an den Fahrtkosten der Beschäftigten in Form von Jobtickets beteiligen. Das bedeutet, dass Mitarbeiter ab dem 01.07. zu ihrer Monatskarte einen Zuschuss von 50 Prozent, maximal aber 60 Euro erhalten.", "Antragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.", "TOP 6 Sonstiges", "TK berichtet, dass sich die Lieferzeiten unseres Zulieferers wieder normalisiert haben. Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde. JS teilt mit, dass von den vier neu eingestellten Mitarbeitern einer die Probezeit nicht beendet hat und seit dem 01.04. nicht mehr in der Firma tätig ist."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Die neue Werbestrategie", "options": [{"k": "a", "text": "beinhaltet ein Video über die Produktionsabläufe."}, {"k": "b", "text": "ist wegen der schlechten Verkaufszahlen notwendig."}, {"k": "c", "text": "lässt sich sehr schnell und kostengünstig umsetzen."}], "answer": "b", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Die Reinigungsfirma", "options": [{"k": "a", "text": "hält sich nicht an die vereinbarten Putzzeiten."}, {"k": "b", "text": "putzt die Büros der Firma nicht regelmäßig."}, {"k": "c", "text": "wird den Vertrag demnächst kündigen."}], "answer": "a", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Die Fortbildung für Ersthelfer", "options": [{"k": "a", "text": "ist nur mit begrenzter Teilnehmerzahl möglich."}, {"k": "b", "text": "müssen die Teilnehmer nur einmal absolvieren."}, {"k": "c", "text": "wird beim Deutschen Roten Kreuz veranstaltet."}], "answer": "a", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Das Jobticket", "options": [{"k": "a", "text": "soll zu 60 Prozent finanziert werden."}, {"k": "b", "text": "kann in der Personalabteilung beantragt werden."}, {"k": "c", "text": "wird ab nächsten Monat eingeführt."}], "answer": "b", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Der Streik in Litauen", "options": [{"k": "a", "text": "dauert immer noch an."}, {"k": "b", "text": "fand landesweit statt."}, {"k": "c", "text": "führte zu Lieferproblemen."}], "answer": "c", "src": "claude"}]}], "num": "4", "ver": "", "test": "", "theme": "neue Werbestrategie, Jobticket"}, {"id": "t4-p55-6", "title": "Lesen Teil 4 (вариант № 5) – 100%", "keywords": "(Frau Wagner, Kantine)", "topic": "Protokoll 05.02.20XX, 14.00 - 16.00 Uhr", "paras": ["Sitzungsraum: 239, Ort: Hauptstraße 23, 25421 Pinneberg", "Anwesende: Michael Müller (MM, Stellvertreter Geschäftsleitung), Katrin Wagner (KW, Leitung Personal), Henry Smith (HS, Leitung Produktion), Tomás Rodrgiuez (TR, Leitung Vertrieb), Manuela Hinz (MH, Leitung", "Qualitätsmanagement), Karl Lehmann (KL, Leitung Finanzen), Sabine Kurz (SK, Hausverwaltung) Sitzungsleitung: Michael Müller", "Protokollantin: Katrin Wagner", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung des letzten Protokolls", "2. Probleme bei der Warenauslieferung", "3. Berichte", "4. Sanierung der Kantine", "5. Neue Krankmeldungsregelung", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung des letzten Protokolls", "MM heißt alle Anwesenden zur heutigen Besprechung willkommen und bittet um die Genehmigung des Protokolls der letzten Sitzung. Per Handzeichen wird das Protokoll der Sitzung vom 08.01. ohne weitere Änderungen und Ergänzungen einstimmig genehmigt. Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen. Das wird einstimmig angenommen.", "TOP 2 Probleme bei der Warenauslieferung", "TR teilt mit, dass sich immer wieder Kunden über den Zustand unserer gelieferten Waren beschwert haben. Auf dem Transportweg kommt es wohl immer wieder zu Beschädigungen der Verpackungen, sodass die Ware teilweise gar nicht oder nur zu stark reduzierten Preisen an den Endkunden verkauft werden kann. Man habe mit der Spedition schon öfter über diese Problematik gesprochen. Diese sieht das Problem jedoch bei uns und ist der Ansicht, dass die Schäden durch minderwertiges Verpackungsmaterial entstehen und nicht durch den Transport. MH und HS haben das Verpackungsmaterial überprüft und weisen den Vorwurf vehement zurück. Nachdem das Problem bis heute nicht gelöst werden konnte, macht MH den Vorschlag, dass unsere Firma die Lieferungen in Zukunft selbst übernimmt. Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.", "TOP 3 Berichte", "SH berichtet, dass durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte, und dankt der Personalabteilung für die prompte und unbürokratische Lösung des Problems. Er regt an, um die Unterbesetzung in der Produktion dauerhaft zu lösen, einige Zeitarbeitskräfte festzustellen. Insbesondere Herr Ahmed Hassani und Frau Ina Zurek sind HS durch Ihre Zuverlässigkeit und schnelle Auffassungsgabe positiv aufgefallen.", "TOP 4 Sanierung der Kantine", "KS macht darauf aufmerksam, dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird. Alle Abteilungsleiter sollen ihre Teams daran erinnern, sich selbst Verpflegung mitzubringen oder alternativ das Bistro „Suppenkasper“ in der Sonnenstraße zu nutzen. Die Essensmarken der Firma gelten während der Kantinenschließung auch dort in der Mittagszeit von 12.00 bis 14.00 Uhr.", "TOP 5 Neue Krankmeldungsregelung (vorgezogener TOP)", "Die Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen. Die bisherige Regelung ab dem dritten WK berichtet, dass diese Entscheidung in der Belegschaft für großen Unmut sorgt. Sie bittet alle Abteilungsleiter ein weiteres Mal, den Sinn dieser Maßnahme zu erläutern. In der nächsten Sitzung soll das Thema noch einmal behandelt werden. Man hofft auf eine breite Akzeptanz.", "TOP 6 Sonstiges", "MM teilt mit, dass ab dem kommenden Monat für die Autofahrer mehr Parkplätze zur Verfügung stehen. Diese entstehen neben dem Eingang C. Alle Mitarbeiterinnen und Mitarbeiter sollen in einer Rundmail darüber informiert werden und wer Interesse hat, kann in der Personalabteilung einen kostenlosen Stellplatz beantragen."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Frau Wagner", "options": [{"k": "a", "text": "bittet um Änderungen des Protokolls vom 08.01."}, {"k": "b", "text": "hat heute noch einen anderen wichtigen Termin."}, {"k": "c", "text": "schlägt einen zusätzlichen Tagesordnungspunkt vor."}], "answer": "b", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Die Geschäftsleitung möchte, dass", "options": [{"k": "a", "text": "das Thema Krankmeldung nicht mehr besprochen wird."}, {"k": "b", "text": "man bei Krankheit spätestens am dritten Tag zum Arzt geht."}, {"k": "c", "text": "sich Mitarbeiter bei Krankheit sofort krankschreiben lassen."}], "answer": "c", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Karl Lehmann soll", "options": [{"k": "a", "text": "besseres Verpackungsmaterial einkaufen."}, {"k": "b", "text": "einen Finanzierungsplan erstellen."}, {"k": "c", "text": "Kontakt mit der Spedition aufnehmen."}], "answer": "b", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "In der Produktionsabteilung", "options": [{"k": "a", "text": "gibt es derzeit genügend Mitarbeiter."}, {"k": "b", "text": "will man alle Zeitarbeiter fest anstellen."}, {"k": "c", "text": "wurden zwei neue Mitarbeiter fest eingestellt."}], "answer": "a", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "In der Kantine", "options": [{"k": "a", "text": "bekommt man in den kommenden Wochen kein Essen."}, {"k": "b", "text": "kann man ab Montag von 12 bis 14 Uhr zu Mittag essen."}, {"k": "c", "text": "sollten die Essensmarken abgeschafft werden."}], "answer": "a", "src": "claude"}]}], "num": "5", "ver": "", "test": "", "theme": "Frau Wagner, Kantine"}, {"id": "t4-p57-7", "title": "Lesen Teil 4 (вариант №6) (тест №150321,150301) - 100%", "keywords": "(Frau Bruhns, Betriebsausflug)", "topic": "", "paras": ["Protokoll 27.08.20XX, 10.00 bis 11.30 Uhr bis 11.30 Uhr", "Konferenzraum Rhein-Main, Am Wegesrand 12, 63345 Frankfurt", "Anwesende: Thomas Köhler (TK, Werkstatt). Brigitte Turner (ВТ, Personal), Gerd Schneider (GS, Buchhaltung), Hilde Bruhns (HB, Buchhaltung)", "Entschuldigt: Kari Muster (KM, Lager) Sitzungsleitung: Gerd Schneider", "Protokollführung: Thomas Köhler", "Tagesordnungspunkte:", "1. Begrüßung und Eröffnung der Sitzung", "2. Erste-Hilfe-Kurs", "3. Homeoffice", "4. Personelle Engpässe Buchhaltung", "5. Betriebsausflug", "6. Sonstiges", "TOP 1 Begrüßung und Eröffnung der Sitzung", "GS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.", "TOP 2 Erste-Hilfe-Kurs", "TK berichtet, dass es vor Kurzem zu einem Unfall in der Werkstatt gekommen ist, bei dem ein Kollege am Arm verletzt wurde und stark geblutet hat. Obwohl regelmäßig Sicherheitsunterweisungen, für die Mitarbeitenden im Lager und in der Werkstatt stattfinden, reagierte nur ein Kollege ruhig und besonnen und war in der Lage, den Verletzten zu versorgen und dann Hilfe zu holen. Die anderen wussten nicht, was sie tun sollten. Auch in der Marketingabteilung gab es eine Situation, in der einer Kollegin wohl wegen der Hitze schwindlig wurde und ein Krankenwagen gerufen werden musste, da niemand von den Mitarbeiter*innen helfen konnte.", "TK schlägt deshalb vor, einen Erste-Hilfe-Kurs im Unternehmen zu organisieren, an dem alle interessierten Angestellten teilnehmen können. TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.", "TOP 3 Homeoffice", "ВТ stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten, wenn sie Aufgaben zu erledigen haben, die eine Anwesenheit im Büro nicht unbedingt erforderlich machen.", "BT steht diesem Wunsch offen gegenüber. Durch diese Möglichkeit könnten die Mitarbeiter*innen die Zeit für den Arbeitsweg sparen und sich ihre Arbeitszeit flexibler einteilen. Das würde sicher erheblich zur Mitarbeiterzufriedenheit beitragen. Den Mitarbeiter*innen, die im Homeoffice arbeiten, müssten firmeneigene Laptop, Diensthandys zur Verfügung gestellt werden. Da aber bereits einige mobile Geräte im Unternehmen vorhanden sind, würde das keine signifikanten Mehrkosten bedeuten. Sollte sich das Arbeitsmodell „Homeoffice” bewähren, könnte für die Kolleg*innen die regelmäßig von zu Hause aus arbeiten, ein VPN-Tunnel eingerichtet werden, durch den sie sicheren Zugang zu den Daten auf dem Firmenserver erhalten würden.", "ВТ bittet bis Mitte der nächsten Woche um Rückmeldungen, was die einzelnen Abteilungsleiter*innen davon halten, bevor sie den Vorschlag der Geschäftsführung vorlegt.", "TOP 4 Personelle Engpässe in der Buchhaltung", "GS teilt mit, dass die Buchhaltung zur Zeit trotz der Neueinstellung von Frau Bruhns personell unterbesetzt ist.", "Das Arbeitsaufkommen ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen. Im Moment ist auch noch eine Kollegin krank, sodass das verbleibende Kolleg*innen viele Überstunden machen müssen, um die Arbeit zu schaffen. Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.", "TOP 5 Betriebsausflug", "HB arbeitet im diesjährigen Team für die Organisation des Betriebsausflugs mit, um so gleich einige Kolleg*innen kennenzulernen. Sie berichtet, dass der Ausflug am 1. Oktober stattfindet. Alle Mitarbeiter*innen treffen sich morgens um 9.00 Uhr vor dem Haupteingang der Firma. Dort werden sie von einem Bus abgeholt und zum Kastell Saalburg gefahren.", "Vom Parkplatz am Fuße der Burg aus ist eine kleine Wanderung geplant. Am Ziel wartet eine Überraschung. Für das leibliche Wohl ist gesorgt. Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.", "TOP 6 Sonstiges", "Entfällt. Keiner der Anwesenden hat noch Punkte zu besprechen."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Frau Bruhns", "options": [{"k": "a", "text": "arbeitet seit einigen Wochen in der Buchhaltung."}, {"k": "b", "text": "bezahlt die Gehälter der Mitarbeiter*innen."}, {"k": "c", "text": "nimmt bald ihre Tätigkeit auf."}], "answer": "a", "src": "claude", "unsure": true}, {"n": 15, "type": "mc", "prompt": "Der Erste-Hilfe-Kurs", "options": [{"k": "a", "text": "findet jeden Freitag statt."}, {"k": "b", "text": "ist für alle Mitarbeiter* innen verpflichtet."}, {"k": "c", "text": "wird vom Roten Kreuz durchgeführt."}], "answer": "c", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Homeoffice", "options": [{"k": "a", "text": "erfordert die Anschaffung neuer Arbeitsgeräte."}, {"k": "b", "text": "verringert die Arbeitszeit der Mitarbeitenden."}, {"k": "c", "text": "wird von vielen Mitarbeitenden gewünscht."}], "answer": "c", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "In der Abteilung Buchhaltung", "options": [{"k": "a", "text": "gibt es zu viele Beschäftigte."}, {"k": "b", "text": "sind viele Kolleg*innen erkrankt."}, {"k": "c", "text": "soll eine Stelle ausgeschrieben werden."}], "answer": "c", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Der Betriebsausflug wird", "options": [{"k": "a", "text": "für den ganzen Tag geplant."}, {"k": "b", "text": "jedes Jahr von den gleichen Personen organisiert."}, {"k": "c", "text": "zum besseren Kennenlernen der Kolleg*innen genutzt."}], "answer": "a", "src": "claude"}]}], "num": "6", "ver": "", "test": "150321", "theme": "Frau Bruhns, Betriebsausflug"}, {"id": "t4-p59-8", "title": "Lesen Teil 4 (вариант №7) (тест №140321, 140301)", "keywords": "(Kosteneinsparnis, Lagebericht, Betriebsarzt)", "topic": "", "paras": ["Protokoll 15.01.20XX, 10.00 bis 11.30 Uhr Sitzungsraum 205, Ort: Hauptstraße 27, 99099 Erfurt", "Anwesende: Jakob Müller (JM, Geschäftsleitung), Friedrich Döring (FD, Vertrieb), Karl Altmann (KA, Buchhaltung und Finanzen), Peter Bischoff (PB, Produktion), Karsten Hinz (KH, Logistik), Jana Bartsch ( JB, Personal), Beate Fritsch (BF, Marketing), Jonas Stoll ( JS, IT-Abteilung).", "Sitzungsleitung: Jakob Müller", "Protokollant: Jonas Stoll Tagesordnungspunkte:", "1. Begrüßung und Tagesordnung 2. Kosteneinsparungen", "3. Lagebericht Produktion", "4. Kündigung des Betriebsarztes", "5. Betriebliche Altersvorsorge", "6. Sonstiges", "TOP 1 Begrüßung und Tagesordnung", "JM heißt die Kolleg*innen zur heutigen Besprechung herzlich willkommen und bestätigt die Anwesenheit aller eingeladenen Teilnehmer*innen. Danach erkundigt JM sich, ob noch zusätzliche Themen protokollarisch aufgenommen werden sollen. Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.", "TOP 2 Kosteneinsparungen", "Wie JM darstellt, hat sich der Markt im Vergleich zum Vorjahr stark verändert. In diesem Zusammenhang müssen deshalb Kostenstrukturen neu überdacht werden. Es wird vorgeschlagen, die administrativen Kosten zu senken, da es hier Einsparungspotential gibt. Im Vorfeld zu dieser Besprechung wurde JB bereits von der Geschäftsleitung beauftragt, eine exakte Kostenübersicht zu erstellen und Vorschläge zur Kostenreduzierung vorzulegen. JB legt dar, dass die in der Firmenzentrale eingehenden Anrufe auf ein externes Call- Center umgeleitet werden könnten. Verschiedene Kostenvoranschläge wurden hierfür auch schon eingeholt. Die Firma tele-info scheint unseren Ansprüchen am besten gerecht zu werden. Deshalb sollten Vertragsverhandlungen aufgenommen und zeitgleich Schulungspläne für die Call-Center-Mitarbeiter*innen ausgearbeitet werden, um ihnen die Organisationsstruktur des Unternehmens so schnell wie möglich näherzubringen, damit die Arbeit ohne Verzögerung aufgenommen werden kann. Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen. JM stimmt den Vorschlägen zu und bittet um Umsetzung der weiteren Schritte.", "TOP 3 Lagebericht Produktion PB merkt an, dass auch in seiner Abteilung eine Kostenreduzierung möglich wäre, indem unausgewogene Lagerungen von Material und Rohstoffen vermieden werden. Das Lagerungsmanagement ist optimierbar, d.h., dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen. Im Fall von Überbeständen muss neue Lagerfläche geschaffen werden und im Fall von Unterbeständen kann es zu kurzfristigen Produktionsausfällen kommen. JM beauftragt PB , sich umgehend zusammen mit KH mit dieser Thematik auseinanderzusetzen und zur nächsten Sitzung konkrete Zahlen und Vorschläge vorzulegen.", "TOP 4 Kündigung des Betriebsarztes", "Mit Bedauern teilt die Geschäftsleitung mit, dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will. Aus diesem Grund hat sich die Firma entschlossen, die Ersthelferausbildung zu forcieren, damit bei kleineren Verletzungen, die im Produktionsablauf immer wieder auftreten können, sofort eingegriffen werden kann. Ärztliche Unterstützung bekommen wir ab nächstem Jahr von der Allgemeinärztlichen Praxis Dr. Mertens. Die Kontaktdaten werden bekannt gegeben.", "TOP 5 Betriebliche Altersvorsorge", "Seit einem Jahr bietet die Firma den Mitarbeiter*innen an, in eine betriebliche Zusatzrente zu investieren. Bisher wird dieses Angebot aber nur von wenigen Kolleg*innen genutzt. Deshalb werden erneut alle Abteilungsleiter*innen darauf hingewiesen, in ihren Abteilungen über diese Möglichkeit der Altersvorsorge aufzuklären. Interessierte Mitarbeiter*innen können in der Personalabteilung genauere Informationen erhalten. Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.", "TOP 6 Sonstiges Die Mitarbeiter*innen werden gebeten, im Intranet abzustimmen, ob die Firma in diesem Jahr für alle Kolleg*innen entweder einen eintägigen Betriebsausflug oder ein Sommerfest organisieren soll. Für den Betriebsausflug könnten dann auch gleich Vorschläge unterbreitet werden. Die Abstimmung muss bis zum 31.03 erfolgen, damit für das 0rganisationskomitee noch ausreichend Zeit für die Planung bleibt."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Bei der Besprechung", "options": [{"k": "a", "text": "müssen weitere Themen besprochen werden."}, {"k": "b", "text": "sind alle Mitarbeiter*innen des Unternehmens anwesend."}, {"k": "c", "text": "wird die Tagesordnung angenommen."}], "answer": "c", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Um Kosten zu sparen,", "options": [{"k": "a", "text": "sollen einige Empfangsmitarbeiter*innen in ein Call-Center wechseln."}, {"k": "b", "text": "werden die Aufgaben der Mitarbeitenden am Empfang neu festgelegt."}, {"k": "c", "text": "wird der Empfang demnächst geschlossen."}], "answer": "b", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Der Lagerbestand muss", "options": [{"k": "a", "text": "an die Produktion angepasst werden."}, {"k": "b", "text": "dauerhaft ausgebaut werden."}, {"k": "c", "text": "kurzfristig reduziert werden."}], "answer": "a", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Der Betriebsarzt wird", "options": [{"k": "a", "text": "mit Dr. Mertens zusammenarbeiten."}, {"k": "b", "text": "zukünftig selbstständig arbeiten."}, {"k": "c", "text": "zum Jahresende entlassen."}], "answer": "b", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Die betriebliche Altersvorsorge", "options": [{"k": "a", "text": "kann bei einem vereinbarten Termin besprochen werden."}, {"k": "b", "text": "nehmen viele Mitarbeiter*innen an."}, {"k": "c", "text": "wird neu in der Fima eingeführt."}], "answer": "a", "src": "claude"}]}], "num": "7", "ver": "", "test": "140321", "theme": "Kosteneinsparnis, Lagebericht, Betriebsarzt"}, {"id": "t4-p61-9", "title": "Lesen Teil 4 (вариант №8)(тест №160201, 160221) -100%", "keywords": "(Marketingmaßnahmen, Einführung Jobticket)", "topic": "Sitzungsraum: 112, Ort: Ludwigstr. 23, 79342 Herbolzen", "paras": ["Anwesende: Jan Schneider (JS, Geschäftsleitung), Sabine Faust (SF, Leiterin Marketing), Paul Mayer (PM, Leiter Produktion), Tim Janzen (TJ, Leiter Vertrieb), Chiara Reich (CR, Leiterin IT), Simon Zitzmann (SZ, Leiter Personal), Mona Seil(MS, Leiterin Controlling)", "Sitzungsleitung: Jan Schneider, Protokollant: Simon Zitzmann", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung der Tagesordnungspunkte", "2. Marketingmaßnahmen", "3. Berichte", "4. Erweiterte Überstundenregelung", "5. Einführung Jobticket", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte", "JS begrüßt die Abteilungsleitungen zur heutigen Sitzung, die daraufhin pünktlich eröffnet wird. Anschließend bittet er um die Genehmigung der Tagesordnungspunkte. Nach Handzeichen wird die Tagesordnung ohne Ergänzungen und Änderungen einstimmig genehmigt. Als nächster Besprechungstermin wird der 25.06. vor der großen Sommerpause einstimmig festgelegt.", "TOP 2 Marketingmaßnahmen", "Nach dem im letzten Quartal von MS und TJ festgestellten Absatzrückgang wurden bereits auf der letzten Sitzung neue Verkaufsstrategien beschlossen. Hierzu wurde von der Geschäftsleitung ein Budget von 350.000 Euro freigegeben. SF berichtet, dass schon im Vorfeld neue Zielgruppen beleuchtet wurden, insbesondere die Gruppe der Berufseinsteiger und Hochschulabsolventen, also die Altersgruppe 17 bis 25 Jahre. Im Vergleich dazu lag der Fokus bisher auf Verbraucher im Alter von 30 bis 50 Jahren.", "Zunächst wurde eine Social-Media-Agenturbeauftragt, um gezielt neue Endverbraucher anzusprechen. Hierzu liegen auch schon erste Ergebnisse vor, die zeigen, dass das Interesse die Aufmerksamkeit um 38% gestiegen sind. Infolgedessen stieg der Umsatz um 18 % im Vergleich zum Vorjahr. JS zeigt sich mit dieser ersten Entwicklung zufrieden und erwartet einen weiteren positiven Trend. Für das nächste Quartal ist geplant, positive Kundenreaktionen im Internet hochzuladen. SF betont, dass gerade in diesem Bereich die Zukunft liegt und regelmäßige Neuerungen erwartet werden können. Deshalb wird sie in den kommenden Sitzungen regelmäßig neue Konzepte präsentieren.", "TOP 3 Berichte", "SZ berichtet darüber, dass die Mitarbeitenden in der Produktion seit dem Einbau der neuen Maschinen gehäuft über eine enorme Lärmbelastung klagen würden. Hier bestehe dringender Handlungsbedarf, da im anderen Fall eine Überprüfung durch die Behörden erfolgen konnte. PM wird mit der Herstellerfirma dieser Anlagen Kontakt aufnehmen, um dieses Problem zu klären. Bis zur Lösung sollten Gehörschützer benutzt werden.", "TOP 4 Erweiterte Überstundenregelung", "JS teilt einen Vorschlag der Geschäftsleitung hinsichtlich einer erweiterten Überstundenregelung mit. Aufgrund einer sich ständig ändernden Auftragslage kommt es vor, dass den Mitarbeitenden immer mehr Überstunden zugemutet werden. Die bisherige Regelung, dass bis zehn Stunden Mehrarbeit im Monat bezahlt werden, bleibt bestehen. Die Stunden darüber hinaus werden weiterhin als Freizeitausgleich gewährt. Neu kommt hinzu, dass ab dem kommenden Jahr für jeweils 100 geleistete Überstunden jährlich ein Urlaubstag zusätzlich gegeben wird. SZ wird diese Maßnahme in der nächsten Betriebsratssitzung zur Prüfung und Genehmigung vorlegen.", "TOP 5 Einführung Jobticket", "Da in der Vergangenheit die Situation auf unseren Firmenparkplätzen sehr angespannt war, nahm die Firma Kontakt zum örtlichen öffentlichen Personennahverkehr auf, um die Einführung von Jobtickets für die Mitarbeitenden möglich zu machen. Viele Mitarbeitende hatten zuvor diesen Wunsch geäußert. SZ teilt mit, dass die Verhandlungen kurz vor dem Abschluss stehen. Wer Interesse an diesem günstigen Ticket hat, sollte sich per Mail oder persönlich in der Personalabteilung dafür anmelden. Die Abteilungsleiter übernehmen es, Ihre Abteilungen zu informieren.", "TOP 6 Unser Unternehmen und das Fitnesscenter fit und fun, das sich in der unmittelbaren Nähe unserer Firma befindet, haben gemeinsam ein Angebot für unsere Mitarbeiter erarbeitet. Wenn man seine Betriebszugehörigkeit nachweist, kann man einen Vertrag zu besonders günstigen Konditionen abschließen. SZ schlägt vor, man könnte dort zu einem späteren Zeitpunkt sogar ein Sportfest für die Abteilungen durchführen. Diesen Vorschlag begrüßt JS."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Die Besprechung", "options": [{"k": "a", "text": "beginnt zur festgelegten Uhrzeit."}, {"k": "b", "text": "soll auf den 25.06. verlegt werden."}, {"k": "c", "text": "wird durch Änderungen ergänzt."}], "answer": "a", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Die Umsatzsteigerung", "options": [{"k": "a", "text": "beträgt 350.000 Euro."}, {"k": "b", "text": "liegt bei 38 %."}, {"k": "c", "text": "wird sich fortsetzen."}], "answer": "c", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Die Überstundenregelung", "options": [{"k": "a", "text": "bleibt genauso bestehen."}, {"k": "b", "text": "erhält eine Ergänzung."}, {"k": "c", "text": "gilt ab 100 Überstunden."}], "answer": "b", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Das Jobticket", "options": [{"k": "a", "text": "ist eine preislich unattraktive Variante."}, {"k": "b", "text": "können die Mitarbeiter beim ÖPNV kaufen."}, {"k": "c", "text": "soll den Arbeitsweg stressfreier machen."}], "answer": "c", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Sportliche Aktivitäten", "options": [{"k": "a", "text": "finden in dem Unternehmen statt."}, {"k": "b", "text": "sollen in den Abteilungen stattfinden."}, {"k": "c", "text": "werden von der Firma gefördert."}], "answer": "c", "src": "claude"}]}], "num": "8", "ver": "", "test": "160201", "theme": "Marketingmaßnahmen, Einführung Jobticket"}, {"id": "t4-p63-10", "title": "Lesen Teil 4 (вариант № 9)( не с экзамена)", "keywords": "(Frau Schäfer, Sommerfest)", "topic": "Protokoll 19. Februar 20XX, 10.00-11.45 Uhr", "paras": ["Konferenzraum 7, Ort: Neuburger Allee 28, 87341 Ballhausen", "Anwesende: Maria Loppinet (ML, Geschäftsführung), Lukas Meier (LM, Leitung Einkauf), Magda Nauner (MN, Leitung Personal), Gert Schrader (GS, Leitung Produktion), Peter Schuldt (PS, Leitung Verkauf), Katja Stevens (KS, Leitung Qualitätskontrolle), Volha Schäfer (VS, Leitung Finanzen)", "Gast: Wanda Lubic (WL, ITBeauftragte),", "Sitzungsleitung: Magda Nauner", "Protokollantin: Volha Schäfer", "Tagesordnungspunkte:", "1. Begrüßung und Genehmigung des letzten Protokolls", "2. Stand des Projekts ,,Fertigungsanlage\"", "3. Berichte", "4. Neue Mitarbeiterinnen und Mitarbeiter", "5. Update der Software", "6. Sonstiges", "TOP 1 Begrüßung und Genehmigung des letzten Protokolls", "MN begrüßt Frau Loppinet und alle Leiterinnen und Leiter zur heutigen Sitzung. Sie bittet um Genehmigung des Protokolls der letzten Sitzung. Nach Handzeichen wird das Protokoll der Sitzung vom 15.01. ohne weitere Änderungen und Ergänzungen.", "TOP 2 Stand des Projekts „Fertigungsanlage\"", "LM gibt einen Überblick zum Projekt „Fertigungsanlage\". Er berichtet über den Auftrag an eine Firma aus Italien, die bereits ähnliche Anlagen hergestellt und aufgebaut hat. Die italienische Firma kommt nächsten Monat, um sich vor Ort ein Bild von unseren Werkshallen II und IV zu machen, wo die Anlage stehen soll. Der genaue Termin steht noch nicht fest. Wenn Werkshalle II oder IV als geeignet erscheint, wird unmittelbar mit der Herstellung der Fertigungsanlage in Italien begonnen.", "Die Montage der Anlage ist dann einige Monate später. Wie geplant soll die neue Fertigungsanlage im folgenden Frühjahr betriebsbereit sein. Sollte keine der beiden Werkshallen für den Aufbau der Fertigungsanlage groß genug sein, müssten wir zuerst eine komplett neue Werkshalle auf dem südlichen Werksgelände errichten lassen. Dadurch könnte sich die Inbetriebnahme einer neuen Fertigungsanlage um mindestens 8 bis 9 Monate verschieben.", "TOP 3 Berichte", "GS berichtet über die ohne große Probleme laufende Produktion der Metallkästen und Metallgehäuse, die sehr nachgefragt sind. Bei noch größerer Nachfrage nach Metallgehäusen könnte jedoch die derzeitige Fertigungsanlage nicht ausreichen. GS freut sich daher über die Planung einer neuen Fertigungsanlage. PS legt neue Verkaufszahlen vor, die im letzten Quartal 20 Prozent über dem vergleichbaren Quartal des Vorjahrs liegen. Besonders die Metallgehäuse für den Hochbau zeigen sehr gute Verkaufszahlen. PS erwähnt hier einen großen Auftrag aus Kasachstan, der für das hohe Auftragsvolumen ausschlaggebend ist.", "TOP 4 Neue Mitarbeiterinnen und Mitarbeiter", "MN nennt die Namen von fünf neuen Mitarbeiterinnen und Mitarbeitern, drei Frauen und zwei Männern, die ab dem 1. des Monats im Betrieb in Vollzeit tätig sind.", "TOP 5 Update der Software", "WL spielt am kommenden Freitag ab 19 Uhr ein Software-Update auf unser Computersystem. Daher darf am Freitag ab 19 Uhr niemand am Computer arbeiten. Die leicht überarbeitete Software hat einige Neuerungen. Allen Mitarbeiterinnen und Mitarbeitern werden diese Neuerungen in einem halbtägigen InfoWorkshop demonstriert. Es wird zeitversetzte Workshops geben. Die Termine dafür werden noch bekannt gegeben.", "TOP 6 Sonstiges", "ML berichtet über den Stand der Planung eines Sommerfests, das etwas größer als in den vergangenen Jahren sein soll. Alle wichtigen Kunden und großen Lieferanten werden eingeladen. ML bittet alle Leiterinnen und Leiter, sich den 31. Juli freizuhalten. Der Ort steht auch schon fest. ML möchte ihn aber noch nicht nennen. Es soll eine Überraschung für alle sein, da der 31. Juli auch ihr 60. Geburtstag ist, den sie mit allen feiern möchte."], "sets": [{"label": "", "questions": [{"n": 14, "type": "mc", "prompt": "Das Protokoll", "options": [{"k": "a", "text": "der letzten Sitzung ist nach Überarbeitung genehmigt."}, {"k": "b", "text": "nennt die Teilnehmer der Januar-Sitzung."}, {"k": "c", "text": "wird heute von Frau Schäfer geschrieben."}], "answer": "c", "src": "claude"}, {"n": 15, "type": "mc", "prompt": "Die neue Fertigungsanlage", "options": [{"k": "a", "text": "kommt in die Werkshalle IV."}, {"k": "b", "text": "steht in einem Neubau."}, {"k": "c", "text": "wird in Italien gebaut."}], "answer": "c", "src": "claude"}, {"n": 16, "type": "mc", "prompt": "Metallkästen und Metallgehäuse", "options": [{"k": "a", "text": "lassen sich nur in Deutschland verkaufen."}, {"k": "b", "text": "sind eine Belastung für die Produktion."}, {"k": "c", "text": "zeigen steigende Verkaufszahlen."}], "answer": "c", "src": "claude"}, {"n": 17, "type": "mc", "prompt": "Das Update der Software", "options": [{"k": "a", "text": "erfordert ein neues Computersystem."}, {"k": "b", "text": "schließt einen eintägigen Workshop mit ein."}, {"k": "c", "text": "wird am Freitag installiert."}], "answer": "c", "src": "claude"}, {"n": 18, "type": "mc", "prompt": "Die Geschäftsführerin", "options": [{"k": "a", "text": "berichtet über Ort und Termin eines Sommerfests."}, {"k": "b", "text": "erwartet eine genaue Planung des Sommerfests."}, {"k": "c", "text": "möchte zum Sommerfest Kunden und Lieferanten einladen."}], "answer": "c", "src": "claude"}]}], "num": "9", "ver": "", "test": "", "theme": "Frau Schäfer, Sommerfest"}], "beschwerde": [{"id": "b-66-0", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 1) – 100%", n Ihrem Putzdienst war aber niemand zu sehen. Wie kann das sein?", "Wenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die Reinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir den Vertrag ändern.", "Ich bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden."], "close": "Mit freundlichen Grüßen", "sign": ["Theo Lassner"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Lassner,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Heute wurde mit unseren Mitarbeitern gesprochen und herausgefunden, dass der Grund dafür war, dass unser Dienstfahrzeug in Inspektion war. Deswegen mussten die Mitarbeiter 15 Minuten früher die Arbeit verlassen, um die öffentlichen Verkehrsmittel nicht zu verpassen. Wir möchten Ihnen versichern, dass sich diese Situation nicht wiederholen wird. Natürlich möchten wir Sie als treuen Kunden behalten, deswegen bieten wir Ihnen einen Rabatt auf die nächste Rechnung in Höhe von 20% an.", "Wir freuen uns weiterhin auf eine Zusammenarbeit."], "close": "Mit freundlichen Grüßen", "sign": ["Friederike Baumann"]}], "extra": [], "check": ["Grund erklären (mit den Mitarbeitern gesprochen)", "Zusichern, dass so etwas nie wieder vorkommt", "20 % Rabatt auf die nächste Rechnung anbieten", "Kunden halten: Zusammenarbeit fortsetzen"], "num": "1", "ver": "", "test": "", "theme": "Putzdienst / Reinigung"}, {"id": "b-67-1", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 2) -100%", "sub": ["Tischlampe"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Frau Berger", "options": [{"k": "a", "text": "beschwert sich über die Qualität des Produktes."}, {"k": "b", "text": "hat eine fehlerhafte Lieferung erhalten."}, {"k": "c", "text": "wartet dringend auf die Lieferung."} ,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Heute habe ich mit dem Hersteller gesprochen und ich habe herausgefunden, dass der Grund für die Verzögerung unvorhergesehene Lieferschwierigkeiten sind. Ich möchte Ihnen versichern, dass in der Vergangenheit solche Situationen in wenigen Tagen behoben waren. Deswegen bitten wir Sie noch um Geduld. Falls Ihre Bestellung bis nächste Woche Montag nicht geliefert wird, bieten wir Ihnen ein ähnliches Modell, welches wir auf Lager haben, an. Wir hoffen, dass Sie mit dieser Lösung zufrieden sind und wieder bei uns bestellen werden."], "close": "Mit freundlichen Grüßen", "sign": ["Lukas Klein"]}], "extra": [], "check": ["Lieferschwierigkeiten erklären", "Bitten, bis nächste Woche zu warten und nicht zu stornieren", "Ein ähnliches Modell anbieten, das auf Lager ist"], "num": "2", "ver": "", "test": "", "theme": "Tischlampe"}, {"id": "b-68-2", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 2) -100%", "sub": ["Новая версия от 08.2024 и от 07.02.2025", "Tischlampe"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Frau Lutz", "options": [{"k": "a", "text": "erwartet eine umgehende Rückmeldung."}, {"k": "b", "text": "möchte ein anderes Lampenmodell."}, {"k": "c", "text": "storniert den Auftrag."}], "answer": "a", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Renovierungsarbeiten", "options": [{"k": "a", "text": "stehen kurz bevor."}, {"k": "b", "text": "verzögern sich."}, {"k": "c", "text": "sollen zeitnah abgeschlossen werden."}], "answer": "c", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "ich habe schon wieder eine Beschwerde einer Kundin vorliegen. Sie hat ihre bestellten Tischlampen nicht bekommen. Bitte antworten Sie Frau Lutz und erklären Sie ihr, warum wir im Moment Lieferschwierigkeiten haben. Versuchen Sie auch, sie davon zu überzeugen, noch bis nächste Woche zu warten
