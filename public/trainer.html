nsson. mehr ..."}], "num": "1", "ver": "07.02.2025", "test": ""}, {"id": "t1-11", "title": "Lesen Teil 1 (вариант №2) - 100%", "note": "( тоже №140321, 140301)", "persons": [{"n": 1, "text": "Junis ist gelernter KIZ-Mechatroniker und möchte eine eigene Werkstatt gründen.", "answer": "d"}, {"n": 2, "text": "Maria arbeitet als Hilfsarbeiterin und möchte nun eine Berufsausbildung machen.", "answer": "h"}, {"n": 3, "text": "Nikolett möchte sich nicht zwischen Familie und Arbeit entscheiden müssen.", "answer": "c"}, {"n": 4, "text": "Amin studiert Fremdsprachen und möchte nach seinem Abschluss freiberuflich arbeiten.", "answer": "e"}, {"n": 5, "text": "Samita soll aus betriebsbedingten Gründen gekündigt werden und sie möchte dagegen vorgehen.", "answer": "a"}], "options": [{"k": "a", "title": "Achtung Kündigung.", "body": "Das Arbeitsrecht unterscheidet zwischen personenbedingter, betriebsbedingter und verhaltensbedingter Beendigung des Arbeitsverhältnisses. Lesen Sie hier alle Informationen darüber, aus welchen Gründen der Arbeitgeber berechtigt ist zu kündigen."}, {"k": "b", "title": "Automobilbranche boomt nach wie vor.", "body": "Vor allem im Südwesten Deutschlands können sich die Menschen weiterhin auf sichere und gut bezahlte Anstellungen in der Automobilindustrie verlassen. Warum lohnt es sich, bei einem Autobauer oder Zulieferer zu arbeiten? Welche Berufe sind am meisten gefragt?"}, {"k": "c", "title": "Firmen setzen auf flexible Arbeitsbedingungen.", "body": "In vielen Branchen sind Fachkräfte gefragt wie nie zuvor. Dabei haben immer mehr Firmen Schwierigkeiten, ihre Angestellten langfristig zu halten. Wer kann, wechselt schnell zu einem Arbeitgeber mit besseren Bedingungen. Viele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita oder Homeoffice."}, {"k": "d", "title": "Förderung von Selbstständigen.", "body": "In den letzten Jahren ist die Zahl der Selbstständigen stetig gestiegen. Das liegt unter anderem auch an neuen staatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten."}, {"k": "e", "title": "Sein eigener Chef sein!", "body": "Du willst keine starren Arbeitszeiten, weiten Anfahrtswege und keinen nervigen Umgang mit Kollegen und Chefs? Dann ist der Weg in die Existenzgründung eine echte Alternative. Ob als Übersetzer, Programmierer oder Steuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene Rechnung zu arbeiten."}, {"k": "f", "title": "Ungelernte Arbeitskräfte weiterhin benachteiligt.", "body": "Je höher die Qualifikation, desto besser die Chancen auf dem Arbeitsmarkt. Wer keine Berufsausbildung hat, läuft Gefahr, in die Langzeitarbeitslosigkeit abzustürzen. Wer Arbeit hat, muss als Ungelernter mit geringerem Gehalt und schlechteren Aufstiegschancen rechnen."}, {"k": "g", "title": "Möglichkeiten, mit einer Kündigung umzugehen.", "body": "Du fühlst dich nach einer Kündigung gedemütigt und alleine gelassen und weißt nicht, wie es weitergehen soll? Das kann auch eine Chance sein, sich neu zu orientieren und vielleicht sogar die eigene Berufung zu finden."}, {"k": "h", "title": "Wege und Chancen.", "body": "Das Bundesministerium für Bildung und Forschung unterstützt bei der beruflichen Qualifizierung Es hat ein Portal eingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus- und Weiterbildungsmöglichkeiten zu informieren."}], "num": "2", "ver": "", "test": ""}, {"id": "t1-12", "title": "Lesen Teil 1 (вариант №3) - 100%", "note": "", "persons": [{"n": 1, "text": "Lamia überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b"}, {"n": 2, "text": "Raymond möchte im Internet einen Job finden.", "answer": "h"}, {"n": 3, "text": "Karl will sich in der Gastronomie selbstständig machen.", "answer": "g"}, {"n": 4, "text": "Sean ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "f"}, {"n": 5, "text": "Ramona interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d"}], "options": [{"k": "a", "title": "Pflegefreistellung für Mütter und Väter.", "body": "Arbeitnehmerinnen und Arbeitnehmer haben das Recht auf Freistellung am Arbeitsplatz, wenn ein im Haushalt lebendes Kind erkrankt und keine Betreuungsmöglichkeit vorhanden ist. Die Freistellung ist pro Arbeitsjahr begrenzt. In der Probezeit sollte man damit vorsichtig sein, da hier andere Kündigungsfristen gelten."}, {"k": "b", "title": "Tipps für Frauen im Beruf.", "body": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen."}, {"k": "c", "title": "Damit sich der Aufwand lohnt.", "body": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Nicht nur die Bekanntheit der Webseite ist dafür entscheidend, sondern auch die regionale Reichweite und der Grad der Spezialisierung."}, {"k": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "body": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Offene Stellen werden demzufolge zügig besetzt."}, {"k": "e", "title": "Informationen rund um den Mutterschutz.", "body": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste."}, {"k": "f", "title": "Rechte berufstätiger Eltern.", "body": "Eltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt der Zustimmung des Arbeitgebers und viele sind damit einverstanden, wenn sich so vermeiden lässt, dass sich die Eltern krankschreiben lassen. Arbeitsplätze, bei denen die Sicherheit des Kindes gefährdet ist, sind von dieser Regelung ausgeschlossen."}, {"k": "g", "title": "Vom Traum zur Realität.", "body": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu."}, {"k": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "body": "Je Suche nach einer neuen Stelle ist extrem zeitaufwendig. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolge oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden."}], "num": "3", "ver": "", "test": ""}, {"id": "t1-13", "title": "Lesen Teil 1 (вариант №3) Новая версия от 07.2024 - 100%", "note": "", "persons": [{"n": 1, "text": "Yuan Javier möchte im Internet einen Job finden", "answer": "h"}, {"n": 2, "text": "Paul will sich in der Gastronomie selbstständig machen.", "answer": "g"}, {"n": 3, "text": "Avio ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.", "answer": "a"}, {"n": 4, "text": "Nora interessiert sich für Jobchancen als Reiseverkehrskauffrau.", "answer": "d"}, {"n": 5, "text": "Anna Maria überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.", "answer": "b"}], "options": [{"k": "a", "title": "Familienmitglieder betreuen.", "body": "Eltern haben einen Rechtsanspruch darauf, ihre kranken Kinder zu pflegen. Dafür haben sie eine bestimmte Anzahl an Tagen zur Verfügung, an denen sie freinehmen können. Aber generell gilt kranke Personen müssen zu Hause bleiben."}, {"k": "b", "title": "Tipps für Frauen im Beruf.", "body": "Frauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im Berufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein selbstbewusstes Auftreten. Außerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen."}, {"k": "c", "title": "Damit sich der Aufwand lohnt.", "body": "Stellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Für den Erfolg muss unbedingt das richtige Stelleportal gewählt werden. Das gilt insbesondere für neu gegründete Unternehmen, die sich mehrfache Anzeigen finanziell nicht leisten können."}, {"k": "d", "title": "Der Bundesverband der Tourismusbranche informiert.", "body": "Trotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf dem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Demzufolge gibt es aktuell eine Reihe offener Stellen."}, {"k": "e", "title": "Informationen rund um den Mutterschutz.", "body": "Frauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der Geburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der Kündigung von der Schwangerschaft wusste."}, {"k": "f", "title": "Kinder am Arbeitsplatz.", "body": "Häufig stimmen Arbeitgeber der Bitte von Eltern zu, ihre Kinder mit zur Arbeit zu bringen, wenn deren Betreuung kurzfristig ausfällt. Damit können Fehlzeiten vermieden werden. Diese Möglichkeit besteht nicht, wenn die Sicherheit des Kindes am Arbeitsplatz gefährdet ist."}, {"k": "g", "title": "Vom Traum zur Realität.", "body": "Als angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über betriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige Personalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu."}, {"k": "h", "title": "Die richtige Wahl spart Zeit und Frust.", "body": "Der Stellemarkt spielt sich heutzutage fast ausschließlich online ab. Im Internet erscheint das Angebot an offenen Stellen riesig, dennoch bleibt der Erfolge oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu filtern, um ohne großen Zeitaufwand die richtige Anzeige zu finden."}], "num": "3", "ver": "07.2024", "test": ""}, {"id": "t1-14", "title": "Lesen Teil 1 (вариант №4)", "note": "", "persons": [{"n": 1, "text": "Laura möchte während des Studiums Berufserfahrung sammeln.", "answer": "e"}, {"n": 2, "text": "Igor hat Familie und möchte im europäischen Ausland arbeiten.", "answer": "h"}, {"n": 3, "text": "Jens interessiert sich für das Thema Umweltschutz in Unternehmen.", "answer": "b"}, {"n": 4, "text": "Jasmin hat Probleme mit ihren Kollegen und braucht Hilfe.", "answer": "d"}, {"n": 5, "text": "Somayeh ist Architektin und möchte ihr eigenes Architekturbüro eröffnen.", "answer": "a"}], "options": [{"k": "a", "title": "Erfolgreich neue Wege gehen.", "body": "Das Buch „Mit Erfolg durchstarten\" von Dr. Vera Baumgart richtet sich vor allem an Akademikerinnen, die erfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen oder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen."}, {"k": "b", "title": "Ein grüner Arbeitsplatz.", "body": "Die Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und Müllvermeidung werden bei uns ganz großgeschrieben\". Aber geht das bei einer Transportund Logistikfirma überhaupt? Die Antwort ist ein klares „Ja\". Alle Details heute um 19:30 Uhr bei Neo TV."}, {"k": "c", "title": "Verändertes Kaufverhalten.", "body": "Neuesten Statistiken zufolge greifen Verbraucher in vielen Ländern der Europäischen Union immer mehr zu regionalen und ökologisch angebauten Lebensmitteln. Auch in deutschen Haushalten wird viel Wert auf gesunde Ernährung gelegt. Die Nachfrage nach Bioprodukten ist in den letzten Jahren stetig angestiegen."}, {"k": "d", "title": "Jetzt im Buchhandel.", "body": "In seinem neuen Bestseller beschreibt Georg Könitz auf eindrucksvolle Weise, wie er von seinem ständig schlecht gelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und wie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen. Von seinen Erfahrungen können alle, die Ähnliches erleben, profitieren."}, {"k": "e", "title": "Der richtige Praktikumsplatz.", "body": "Ein Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen. Viele Praktikanten sind aber enttäuscht, dass sie nur Hilfsarbeiten verrichten dürfen und dafür schlecht oder gar nicht bezahlt werden. Auf dem Portaldein- praktikum.de findest du jetzt aktuelle Infos und interessante Praktikumsstellen in ganz Deutschland."}, {"k": "f", "title": "Eine Erfolgsgeschichte.", "body": "Die Bilanz von Rita Jäger (34): Zwei abgebrochene Lehren und zahllose Hilfsjobs. Dann kam Tochter Samantha und Rita musste Verantwortung übernehmen. Im Interview erzählt sie, wie sie in einem Friseursalon die Chance bekam, ein Praktikum und anschließend eine Ausbildung zu machen. Nun hat sie ihren eigenen Salon eröffnet."}, {"k": "g", "title": "Immobilienunternehmen expandiert.", "body": "Die Frankfurter Immobilienfirma ImmoInvest expandiert nach Süd- und Osteuropa. In den letzten Jahren hat das Unternehmen hohe Gewinne erwirtschaftet und plant nun, außerhalb Deutschlands mehrere Niederlassungen zu gründen. Über die Erfolgsgeschichte des Unternehmens berichtet der Geschäftsführer Herbert Grünberg in unserem Interview."}, {"k": "h", "title": "Neue Broschüre.", "body": "Sie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber immer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder. Unsere neue Broschüre bietet ausführliche Informationen und Hilfestellungen zum Leben und Arbeiten in der EU."}], "num": "4", "ver": "", "test": ""}, {"id": "t1-15", "title": "Lesen Teil 1 (вариант №5)", "note": "", "persons": [{"n": 1, "text": "Yasmina sucht nach dem Realschulabschluss einen Beruf mit guten Perspektiven.", "answer": "d"}, {"n": 2, "text": "Jason überlegt, ob er bei einem neu gegründeten Unternehmen arbeiten soll.", "answer": "h"}, {"n": 3, "text": "Hannah wird von ihren Kollegen schlecht behandelt und sucht Hilfe.", "answer": "a"}, {"n": 4, "text": "Gacer fragt sich, ob sie Fortbildungen besuchen muss.", "answer": "g"}, {"n": 5, "text": "Assem braucht Informationen zur Meisterprüfung.", "answer": "e"}], "options": [{"k": "a", "title": "Hilfe für Betroffene.", "body": "Beleidigungen, Ausgrenzung, versteckte Drohungen - am Arbeitsplatz ist Mobbing leider weit verbreitet. Für viele Angestellte ist der Arbeitsalltag oft mit Angst verbunden. Das führt schnell zu gesundheitlichen und psychischen Problemen. Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man mit solchen Situationen besser umgehen kann."}, {"k": "b", "title": "Ein starkes Team.", "body": "Pünktlich zum Start der Weltmeisterschaft präsentiert der Handballbund seine neue Vertragspartnerin, die deutsche Handwerkskammer. Wie passt das zusammen? „Ganz einfach\", so der Sprecher des Handballbundes. „Was für den Handballer die Weltmeisterschaft ist, ist für den Handwerker die Meisterprüfung.\""}, {"k": "c", "title": "Deutsche sind risikoscheu.", "body": "In Deutschland ist die Zahl der Unternehmensgründungen stark rückläufig, obwohl insbesondere viele jüngere Menschen angeben, dass sie sich gerne selbständig machen würden. Warum der Sprung in die Selbstständigkeit oft doch nicht klappt, hat vielerlei Gründe. Während Frauen häufig das finanzielle Risiko scheuen, fürchten Männer den Karriereknick."}, {"k": "d", "title": "Handwerk und Karriere - passt das?", "body": "Fleischer, Klempner, Tischler - laut der Bundesagentur für Arbeit werden bei uns ca.150.000 Handwerker gesucht. Doch viele Stellen bleiben unbesetzt. Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen für eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen."}, {"k": "e", "title": "Stressfrei zum Ziel.", "body": "Auch Fortbildungen können für eine Meisterprüfung im Handwerk anerkannt werden. Wenn Sie z B. als Kfz-Servicetechniker einen Kurs in Elektronik erfolgreich absolviert haben, wird dieser Teil nicht noch einmal gesondert geprüft. Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur Meisterprüfung zusammengefasst."}, {"k": "f", "title": "Nie wieder Opfer.", "body": "Sie wurde in ihrer Firma gemobbt und konnte es ihrem Chef nicht nachweisen. Aber die Atmosphäre verschlechterte sich zusehends. Die Arbeit wurde jeden Tag mehr zur Qual. Die Autorin Stephanie Hauser verarbeitet in ihrem Roman „Nie wieder Opfer\" auf eindrucksvolle Weise ihre eigenen Erfahrungen zum Thema „Mobbing\"."}, {"k": "g", "title": "Verpflichtend oder freiwillig.", "body": "Die Anforderungen der Berufswelt ändern sich rasant und somit entsteht auch die Notwendigkeit für die Belegschaft, sich kontinuierlich weiterzubilden. Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren verpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit stattfinden."}, {"k": "h", "title": "Karriereplan für eine vielversprechende Laufbahn.", "body": "Vor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten. Dennoch setzen die meisten Uniabsolventen nach wie vor auf große Konzerne, von denen sie sich eher Sicherheit und vielversprechende Karrierechancen erhoffen. Doch das können sie auch bei jungen Start-upUnternehmen finden."}], "num": "5", "ver": "", "test": ""}, {"id": "t1-16", "title": "Lesen Teil 1 (вариант №6) – 100%", "note": "", "persons": [{"n": 1, "text": "Silvie ist gelernte Verkäuferin und möchte in ihrem Job aufsteigen.", "answer": "c"}, {"n": 2, "text": "Brian sucht Computerkurse, die er von zu Hause aus machen kann.", "answer": "h"}, {"n": 3, "text": "Carl ist Umwelttechniker und möchte seine eigene Beratungsagentur gründen.", "answer": "b"}, {"n": 4, "text": "Mira ist unsicher, wie es nach ihrem Arbeitsplatzverlust weitergehen soll.", "answer": "e"}, {"n": 5, "text": "Karim sucht einen Ausbildungsplatz in einer sicheren Branche.", "answer": "a"}], "options": [{"k": "a", "title": "Die Lebensmittelbranche boomt.", "body": "Der Einzelhandel ist einer der größten und umsatzstärksten Wirtschaftszweige national und international. Es werden dort ständig qualifizierte Mitarbeiter gesucht. Allein in Hessen werden jährlich 160.000 junge Menschen ausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer."}, {"k": "b", "title": "Aus Fehlern anderer lernen.", "body": "Viele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler. Heute weiß man, dass ein durchdachter Businessplan und eine genaue Konkurrenzanalyse unverzichtbar sind. Worauf es noch ankommt, erfährst du in den Tipps des Erfolgscoachs Gregor Daub."}, {"k": "c", "title": "Chancen im Einzelhandel.", "body": "Die FOOD Unternehmensgruppe betreibt Supermärkte in zehn Ländern Europas. Der Branchenriese möchte weiter expandieren und hat gerade die Filialen der Jennings GmbH übernommen. Erfahrene Mitarbeiter finden dort interessante Möglichkeiten zur beruflichen Weiterentwicklung."}, {"k": "d", "title": "Gute Nachrichten für gekündigte Mitarbeiter.", "body": "Die Tankstellenkette Fairtank hat Bankrott angekündigt und schließt zum 31. März ihre 25 Filialen in Brandenburg. Rund 100 Mitarbeiter sind betroffen und suchen nun einen neuen Job. Für einige von ihnen gibt es eine Lösung: Tankstellen in der Umgebung haben ihre Unterstützung zugesagt und versprochen, Mitarbeiter von Fairtank zu übernehmen."}, {"k": "e", "title": "Was nun?", "body": "Egal, ob die ganze Firma pleitegeht, eine Abteilung dichtmacht oder nur der eigene Job weg ist, eine Entlassung ist immer ein Schock. Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst schnell eine neue Stelle zu bekommen."}, {"k": "f", "title": "Neue Kursreihe bei Arcadio.", "body": "Ab sofort bietet das Institut Arcadio neben seinen Computerkursen für Senioren auch Weiterbildungen für Teilnehmer mit geringen Deutschkenntnissen an. Das Besondere daran: Die Dozenten verwenden eine einfache Sprache. Was hinter diesem innovativen Konzept steht, erzählt der Institutsgründer Benjamin von Adler im Interview."}, {"k": "g", "title": "Wenn die Mitarbeiter kündigen.", "body": "Immer mehr Mitarbeiter kündigen und verlassen ihre Firma. Und zwar selbst dann, wenn sie mehr Gehalt bekommen als bei der Konkurrenz. Die Unternehmensberatung Schindler hat die häufigsten Gründe analysiert, warum sich Angestellte entscheiden, ihren Job zu wechseln."}, {"k": "h", "title": "Bildung im neuen Zeitalter.", "body": "Schneller technologischer Fortschritt, Globalisierung und Veränderungen auf dem Arbeitsmarkt haben dazu geführt, dass Fortbildungen im Beruf eine immer wichtigere Rolle spielen. Zunehmend werden Online-Kurse und Webinare am Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen. Wo findet man passende Fortbildungen ?"}], "num": "6", "ver": "", "test": ""}, {"id": "t1-17", "title": "Lesen Teil 1 (вариант №7) (тест №150321, 150301) - 100%", "note": "", "persons": [{"n": 1, "text": "Kurt sucht еіnen Job und braucht Anregungen für seine Unterlagen.", "answer": "c"}, {"n": 2, "text": "Juliette arbeitet gerne, fühlt sich aber oft erschöpft.", "answer": "g"}, {"n": 3, "text": "Peter ist vor seinem Start im neuen Unternehmen nervös.", "answer": "e"}, {"n": 4, "text": "Katharina ist wegen des niedrigen Verdienstes in ihrer Branche frustriert.", "answer": "f"}, {"n": 5, "text": "Carlos braucht Tipps für seine Tätigkeit im Homeoffice.", "answer": "b"}], "options": [{"k": "a", "title": "Den Arbeitsplatz produktiv gestalten.", "body": "Die richtige Atmosphäre am Arbeitsplatz ist für die effektive Erledigung der Aufgaben unerlässlich. Gerlinde Strauß beschreibt, wie man mit den richtigen Möbeln, Dekoartikeln, Licht, Ordnung am Arbeitsplatz und vielem mehr die eigene Umgebung so gestaltet, dass man die Zeit am Arbeitsplatz gerne und erfolgreich verbringt."}, {"k": "b", "title": "Ohne Selbstdisziplin geht es nicht.", "body": "Die Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des Selbstmanagements. Privates und Arbeit sollten strikt getrennt werden. Doch wie funktioniert das am besten? Helga Brinkmann hat einen Ratgeber für Arbeitskräfte herausgegeben, deren Unternehmen diese Form der Arbeit anbieten."}, {"k": "c", "title": "Hobbys im Lebenslauf richtig einsetzen.", "body": "Ausbildung und Qualifikation sind in erster Linie wichtig, wenn man den Lebenslauf eines Bewerbers liest. Doch auch, welche Hobbys eine Person hat, kann Auskunft darüber geben, ob sie zum Unternehmen passt oder nicht. Lesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung."}, {"k": "d", "title": "Was unsere Körpersprache über uns verrät.", "body": "Ob beim Vorstellungsgespräch, bei wichtigen Verhandlungen mit Kunden oder am ersten Arbeitstag – unsere Körpersprache gibt immer Auskunft darüber, wie wir uns gerade fühlen, z. B. angespannt oder selbstsicher. Lernen Sie in unserem Seminar, wie Sie Körpersprache wirksam einsetzen und wie Sie Ihr Gegenüber einschätzen können."}, {"k": "e", "title": "Der erste Arbeitstag in der neuen Firma.", "body": "So klappt es mit den Kolleginnen. Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut vorbereitet zu sein. Im folgenden Artikel von Irene Miller finden Sie eine Checkliste mit den wichtigsten Punkten, die Sie beachten sollten, damit der Einstieg gelingt."}, {"k": "f", "title": "Angemessene Bezahlung?", "body": "Jeder möchte für seine Leistung fair bezahlt werden. Doch in vielen Berufsfeldern haben die Arbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob man wirklich den richtigen Beruf gewählt hat. Lesen Sie hier, wie Sie erfolgreich Gehaltsverhandlungen führen."}, {"k": "g", "title": "Körperliche Folgen von Stress.", "body": "Nicht jeder Stress macht krank. Es gibt auch positiven Stress, der die Leistungsfähigkeit eines Menschen erhöht. Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck. Magenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern. Wie, das erfahren Sie im neusten Buch von Harald Erhard."}, {"k": "h", "title": "Frauen verdienen immer noch zu wenig.", "body": "Europaweit ist das Ziel der Gleichstellung noch längst nicht erreicht. Man denke hier nur an die nach wie vor ungleiche Bezahlung von Männern und Frauen und an die Besetzung von Stellen in der Führungsetage. Deutschland liegt bei diesem Vergleich noch immer auf einem der letzten Plätze."}], "num": "7", "ver": "", "test": "150321"}, {"id": "t1-18", "title": "Lesen Teil 1 (вариант №8)(тест №160201, 160221) – 100%", "note": "", "persons": [{"n": 1, "text": "Barbara braucht beruflich Grundkenntnisse in Spanisch.", "answer": "f"}, {"n": 2, "text": "Frank denkt, dass sein Gehalt nicht branchenüblich ist.", "answer": "d"}, {"n": 3, "text": "Petra fühlt sich am Arbeitsplatz gemobbt.", "answer": "g"}, {"n": 4, "text": "Sandra möchte im Ausland berufliche Erfahrungen sammeln.", "answer": "h"}, {"n": 5, "text": "Felix möchte sich beruflich verändern.", "answer": "b"}], "options": [{"k": "a", "title": "Internationale Fachkräfte gesucht", "body": "Im Ausland zu arbeiten, kann eine hervorragende Chance für Menschen in aller Welt sein. Erfahren Sie als Arbeitgeber, mit welchen Strategien Sie dringend benötigte Arbeitskräfte aus dem Ausland für sich gewinnen, um Ihr Unternehmen wettbewerbsfähiger zu machen."}, {"k": "b", "title": "Auf zu neuen Ufern!", "body": "Im Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln. Manchmal fehlen nur ein bisschen Mut und Unterstützung. Oder man weiß erst gar nicht, welche Möglichkeiten es gibt. Eine gute Beratung ist darum wichtig. Wo Sie die bekommen, erfahren Sie hier."}, {"k": "c", "title": "Zufriedene Mitarbeiter", "body": "Viele Firmen überlegen, wie sie ihren Angestellten das Arbeitsleben abwechslungsreicher gestalten können. Manche schicken ihre Mitarbeitenden auf Dienstreisen ins Ausland, andere finanzieren ihnen Sprachkurse oder verteilen großzügig Prämien. Was noch möglich ist und wie sich das steuerlich auswirkt, erklärt der Steuerberater Michael Hahne."}, {"k": "d", "title": "Dschungel in der Arbeitswelt", "body": "Wie viel Urlaub steht einem zu? Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man üblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich auskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst."}, {"k": "e", "title": "Chefsache", "body": "Ein erfolgreiches Unternehmen gibt es nur mit einem motivierten Team. Aber wie motiviert man seine Mitarbeiter? Hören Sie ihnen aufmerksam zu! Kontrollieren Sie nicht jeden Arbeitsschritt, sondern delegieren Sie! Nehmen Sie Mobbing ernst! Zahlen Sie faire Gehälter! Diese und noch viele andere Ratschläge lesen Sie hier."}, {"k": "f", "title": "Vielseitig qualifiziert!", "body": "Von Arbeitnehmer*innen wird immer mehr verlangt. Nicht nur die aktuellen fachlichen Kenntnisse und die souveräne Arbeit mit dem PC sind eine Selbstverständlichkeit, sondern auch die sprachlichen Kompetenzen werden immer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli."}, {"k": "g", "title": "Lassen Sie sich von Kolleg*innen den Arbeitsalltag nicht schwermachen", "body": "Sie erfahren von der Sitzung zuletzt? In der Kantine sitzen Sie allein? Es passiert immer häufiger in deutschen Unternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in diesem Ratgeber, wo Sie Hilfe bekommen können."}, {"k": "h", "title": "Den Horizont erweitern", "body": "Manche zieht die Liebe in ein anderes Land. Andere sehen dort interessantere berufliche Möglichkeiten. Manchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können"}], "num": "8", "ver": "", "test": "160201"}], "teil2": [{"id": "t2-p19-0", "title": "Text 1 (вариант №1)", "topic": "Zugangskontrolle und Zeiterfassung", "paras": ["Als Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit Chip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der Arbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen und das hauseigene Fitnessstudio benutzen.", "Neben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten und Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die Zeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts, die Ihnen Ihre monatliche Arbeitszeit anzeigt.", "Die Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden. Die Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskonten-System PersoTime ein. Damit können Sie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Der Firmenausweis hat neben der Arbeitszeiterfassung auch andere Funktionen.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Überstunden", "options": [{"k": "a", "text": "können online eingesehen werden."}, {"k": "b", "text": "sind in der Firma grundsätzlich nicht erlaubt."}, {"k": "c", "text": "werden von der Zeiterfassung nicht registriert."}], "answer": "a", "src": "claude"}]}, {"label": "Новый вариант - 100%", "questions": [{"n": 6, "type": "rf", "prompt": "Ein Firmenausweis kann innerhalb des Firmengebäudes als Zahlungsmittel verwendet werden. / Der Firmenausweis dient als firmeninternes Zahlungsmittel.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Das persönliche Arbeitszeitkonto", "options": [{"k": "a", "text": "ist nur über die Personalabteilung einsehbar./ kann in der Personalabteilung eingesehen werden."}, {"k": "b", "text": "buchen die Mitarbeiter ihre Stunden selbst. / müssen die Mitarbeiter selbst anlegen."}, {"k": "c", "text": "wird täglich aktualisiert."}], "answer": "c", "src": "src"}]}], "num": "1", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p20-1", "title": "Text 1 (вариант №2)", "topic": "Arbeitszeit", "paras": ["In unserem Unternehmen arbeiten wir nach dem Gleitzeitsystem. Die Kernarbeitszeit ist Montag bis Freitag zwischen 9.00 Uhr und 15.30 Uhr. In dieser Zeit müssen alle Mitarbeitenden anwesend sein. Jede Abwesenheit während dieser Zeit muss genehmigt sein.", "Die tägliche Rahmenarbeitszeit ist von 6.00 Uhr bis 19.30 Uhr. Bitte beachten Sie, dass innerhalb dieses Zeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.", "Alle Mitarbeitenden müssen beim Betreten und Verlassen des Gebäudes mit der Zeiterfassungskarte am Lesegerät ein- und ausstechen. So wird die tägliche Arbeitszeit auf dem Zeitkonto festgehalten. Dieses kann jederzeit am Lesegerät eingesehen werden.", "Bei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag genommen werden. Zu berücksichtigen ist, dass ein Minuskontostand im Folgemonat auszugleichen ist. Zusätzlich können im Monat Dezember bis zu vier Arbeitstage als Gleitzeittage genommen werden, um sie zwischen Weihnachten und Neujahr zu nutzen, wenn das Arbeitszeitkonto ein ausreichendes Guthaben aufweist."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Bei Gleitzeit können Mitarbeitende täglich beliebig viele Stunden arbeiten.", "options": [], "answer": "f", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Durch Gleitzeit ist es den Mitarbeitenden möglich,", "options": [{"k": "a", "text": "ein Stundenguthaben aufzubauen."}, {"k": "b", "text": "jeden Monat einige Tage freizunehmen."}, {"k": "c", "text": "täglich mehr als acht Stunden zu arbeiten."}], "answer": "a", "src": "claude"}]}], "num": "2", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p20-2", "title": "Text 1 (вариант №2) — Новый вариант", "topic": "Arbeitszeit", "paras": ["Die wöchentliche Arbeitszeit beträgt 40 Stunden - bei einem Arbeitstag von acht Stunden, wobei die Pausen nicht mitgerechnet werden. Es gilt die Fünf-Tage-Woche. Betriebsbedingt ist es möglich, dass Sie bis zu zehn Stunden pro Tag arbeiten. Diese Mehrarbeit ist aber nur in Ausnahmefällen erlaubt und muss innerhalb von sechs Monaten durch entsprechend kürzerer Arbeitstage ausgeglichen werden.", "Wir haben flexible Arbeitszeiten. Sie können selbst bestimmen, wann Sie morgens anfangen zu arbeiten und wann Sie aufhören. Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr. Innerhalb dieser Zeiten können Sie anfangen bzw. aufhören zu arbeiten. Aus betrieblichen Gründen kann der Arbeitgeber die Gleitzeit für eine gewisse Zeit aussetzen.", "Unser elektronisches Zeiterfassungssystem registriert täglich die Zahl der von Ihnen geleisteten Arbeitsstunden auf Ihrem persönlichen Arbeitszeitkonto. Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Die Beschäftigten dürfen mit der Arbeit anfangen, wann sie wollen.", "options": [], "answer": "f", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Ergibt sich auf einem Arbeitszeitkonto ein Plus,", "options": [{"k": "a", "text": "kann der Betrieb den Acht-Stunden-Tag verlängern oder verkürzen."}, {"k": "b", "text": "ist schnellstmöglich ein Ausgleich zu finden."}, {"k": "c", "text": "kann der Betrieb die Gleitzeitregelungen ändern."}], "answer": "b", "src": "claude"}]}], "num": "2", "ver": "новий текст", "test": "", "text": "Text 1"}, {"id": "t2-p21-3", "title": "Text 1 (вариант №3) - 100%", "topic": "Urlaub", "paras": ["Jedem Mitarbeiter und jeder Mitarbeiterin in unserem Unternehmen stehen je nach Betriebszugehörigkeit bis zu 26 Tage Urlaub zu. Der Urlaub sollte nach Möglichkeit innerhalb des laufenden Kalenderjahres genommen werden. In Ausnahmefällen kann diese Frist bis zum 31.3. des Folgejahres verlängert werden.", "Grundsätzlich besteht der volle Urlaubsanspruch erst nach Ablauf der sechsmonatigen Probezeit. Ein anteiliger Urlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.", "Urlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen Formulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen. Den Urlaubswünschen der einzelnen Mitarbeiter wird entsprochen, sofern diese mit den Betriebsabläufen vereinbar sind. Sollten sich die beantragten Urlaubszeiten einzelner Kollegen und Kolleginnen überschneiden, wird nach sozialen Aspekten entschieden.", "Der Abteilungsleiter prüft alle Urlaubsanträge unverzüglich. Sollten die Wünsche der Mitarbeiter unvereinbar sein, wird der Betriebsrat mit dem Ziel der Einigung hinzugezogen."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Im ersten halben Jahr nach Neueinstellung ist kein Urlaub möglich.", "options": [], "answer": "f", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Urlaubsanträge müssen", "options": [{"k": "a", "text": "durch den Betriebsrat genehmigt werden."}, {"k": "b", "text": "in jedem Fall bewilligt werden."}, {"k": "c", "text": "rechtzeitig im Vorjahr gestellt werden."}], "answer": "c", "src": "claude"}]}], "num": "3", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p21-4", "title": "Text 1 (вариант №4)", "topic": "Regelungen am Arbeitsplatz", "paras": ["Es ist wichtig, dass auf dem Betriebsgelände der AKO.KG alle Maßnahmen eingehalten werden, damit Sie sich selbst und andere nicht gefährden. Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres. Die Sicherheitsbestimmungen finden Sie in der Anlage zu dieser Willkommensmappe und zusammengefasst auch auf Informationsblättern an den Maschinen.", "Sollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen. In diesen Fällen kontaktieren Sie bitte auch immer den Empfang, Durchwahl -100.", "Nach Verlassen der Werkstätten sind diese immer ordnungsgemäß abzuschließen, damit sich kein Unbefugter den Anlagen und Maschinen nähern kann. Der Arbeitsplatz muss sauber gehalten werden, damit umherliegender Unrat nicht zu einer Gefahrenquelle werden kann. Achten Sie dabei bitte auch auf die vorgeschriebene Trennung der Abfälle in die hierfür vorgesehenen Container im Hof.", "Auf dem gesamten Betriebsgelände ist Filmen und Fotografieren sowie der Konsum von Alkohol und Zigarettenkonsum nicht gestattet."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Die Regelungen am Arbeitsplatz wurden aktualisiert.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Auf dem Firmengelände", "options": [{"k": "a", "text": "darf kein Abfall entsorgt werden."}, {"k": "b", "text": "ist bei Gefahr Frau Scholz zu informieren."}, {"k": "c", "text": "ist es nicht erlaubt, Nahrungsmittel zu sich zu nehmen."}], "answer": "b", "src": "claude"}]}], "num": "4", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p22-5", "title": "Text 1 (вариант №5) - 100%", "topic": "Betriebssport", "paras": ["Sportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im Untergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z B. zwei Indoor- Fahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.", "Außerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die Tradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem wöchentlichen Lauftreff auf dieses Event vorbereiten.", "Dieser findet jeden Mittwoch um 17:30 Uhr statt.", "Abwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch während der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle Schreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.", "Zusätzlich bieten wir das sogenannte „Deskbike\" an - eine Art Büro-Fahrrad, das sich einfach unter einen höhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre Gesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Der Fitnessraum ist während der Arbeitszeit geöffnet.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Die Mitarbeiter", "options": [{"k": "a", "text": "erhalten einen Zuschuss für ein Deskbike."}, {"k": "b", "text": "haben teilweise spezielle Schreibtischen Stehhöhe."}, {"k": "c", "text": "können das hausinterne Fitnessstudio gratis nutzen."}], "answer": "c", "src": "claude"}]}], "num": "5", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p22-6", "title": "Text 1 (вариант №5) (тест №150321, 150301) - 100%", "topic": "Betriebssport", "paras": ["Sportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im Untergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z B. zwei Indoor- Fahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann selbstverständlich auch in den Pausen genutzt werden.", "Außerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die Tradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem wöchentlichen Lauftreff auf dieses Event vorbereiten.", "Dieser findet jeden Mittwoch um 17:30 Uhr statt.", "Abwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch während der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle Schreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.", "Zusätzlich bieten wir das sogenannte „Deskbike\" an - eine Art Büro-Fahrrad, das sich einfach unter einen höhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre Gesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Der Fitnessraum ist während der Arbeitszeit geöffnet.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Die Mitarbeiter", "options": [{"k": "a", "text": "haben teilweise spezielle Schreibtische in Stehhöhe."}, {"k": "b", "text": "können das hausinterne Fitnessstudio gratis nutzen."}, {"k": "c", "text": "erhalten einen Zuschuss für ein Deskbike."}], "answer": "b", "src": "claude"}]}], "num": "5", "ver": "", "test": "150321", "text": "Text 1"}, {"id": "t2-p23-7", "title": "Text 1 (вариант №6) – 100%", "topic": "Einführungstag", "paras": ["Unsere Personalreferentin führt mehrmals jährlich einen Einführungstag für unsere neuen Mitarbeiterinnen und Mitarbeiter durch, an dem diese mit unterschiedlichen Arbeitsbereichen sowie den rechtlichen und organisatorischen Prozessen vertraut gemacht werden. Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen Informationsveranstaltung verpflichtend ist. Am Einführungstag besteht außerdem die Möglichkeit, Kolleginnen und Kollegen aus anderen Abteilungen kennenzulernen. Die Abteilungsleiter werden bei dieser Gelegenheit in kurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben.", "Da unser Unternehmen in einem hochsensiblen Bereich arbeitet, haben wir für unser gesamtes Gebäude ein komplexes Sicherheitssystem. Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor. Weitere Einzelheiten zu diesem Tag, wie den Treffpunkt und den Ablauf, finden Sie in dieser Mappe. Eine gesonderte Anmeldung ist nicht erforderlich.", "Für Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Alle Mitarbeiter ( Mitarbeitende) müssen ein paar Mal pro Jahr am Einführungstag (einer Informationsveranstaltung) teilnehmen.", "options": [], "answer": "f", "src": "claude"}]}, {"label": "Новый вариант", "questions": [{"n": 6, "type": "rf", "prompt": "Neue Mitarbeiter sollten sich in der Personalabteilung zum Einführungstag anmelden.", "options": [], "answer": "f", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Am Einführungstag", "options": [{"k": "a", "text": "müssen sich die Teilnehmenden in der Personalabteilung melden."}, {"k": "b", "text": "stellt ein Abteilungsleiter alle Kolleginnen und Kollegen vor."}, {"k": "c", "text": "werden neue Mitarbeitende in die Sicherheitsregeln im Unternehmen eingeführt."}], "answer": "c", "src": "src"}]}, {"label": "Новый вариант от 21.12.24", "questions": [{"n": 7, "type": "mc", "prompt": "Die neuen Mitarbeiter", "options": [{"k": "a", "text": "bekommen vom Abteilungsleiter eine Führung durch das Unternehmen."}, {"k": "b", "text": "können an einem Einführungstag im Betrieb teilnehmen."}, {"k": "c", "text": "werden mit den Funktionen des Sicherheitssystems vertraut gemacht."}], "answer": "c", "src": "claude"}]}], "num": "6", "ver": "", "test": "", "text": "Text 1"}, {"id": "t2-p24-8", "title": "Text 1 (вариант №7) (тест №140321, 140301)", "topic": "Essen in der Kantine", "paras": ["Unser Unternehmen arbeitet an sieben Tagen rund um die Uhr im Drei-Schicht-System. Deshalb steht auch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung. Um unnötige Wartezeiten in der Mittagszeit zu vermeiden, wurden in Abstimmung mit dem Betriebsrat aber folgende Essenszeiten für die einzelnen Abteilungen festgelegt : Während das Personal aus der Produktion und dem Lager in der ersten Gruppe von 12.00 bis 13.00 Uhr eine warme Mahlzeit zu sich nehmen kann, folgen die Mitarbeiterinnen und Mitarbeiter der Verwaltung in der zweiten Gruppe von 13.00 bis 14.00 Uhr.", "Außerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie Suppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen. Darüber hinaus befindet sich dort eine Mikrowelle, in der Sie mitgebrachte Speisen erwärmen können. Zusätzliche Automaten für kalte und warme Getränke befinden sich auf jeder Etage in unserem Firmengebäude."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Die Kantine ist immer geöffnet.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "Die Mitarbeiterinnen und Mitarbeiter", "options": [{"k": "a", "text": "bekommen in der Kantine keine Getränke."}, {"k": "b", "text": "können nachts in der Kantine essen."}, {"k": "c", "text": "müssen mittags oft sehr lange anstehen."}], "answer": "b", "src": "claude"}]}], "num": "7", "ver": "", "test": "140321", "text": "Text 1"}, {"id": "t2-p24-9", "title": "Text 1 (вариант №8) (тест №160201, 160221) – 100%", "topic": "Firmenorganigramm", "paras": ["Für Sie als neue Mitarbeiterin / neuer Mitarbeiter in unserem Traditionsunternehmen ist es wichtig zu wissen, wie das Unternehmen aufgebaut ist, d. h. welche Abteilungen es gibt, wer wofür verantwortlich ist und an wen Sie sich mit Ihren Fragen wenden können. Dafür wollen wir Ihnen im Folgenden Orientierung geben und hoffen, Ihnen den Einstieg in unser Unternehmen mit diesem Organigramm zu erleichtern.", "Das Dach unseres Unternehmens bildet die Geschäftsleitung. Hier laufen alle Fäden zusammen. Die nächste Ebene umfasst unsere Bereiche Produktion, Vertrieb und Personalwesen. In der Personalabteilung wenden Sie sich an Ihrem ersten Arbeitstag an Frau Müller. Von ihr erhalten Sie Ihren Mitarbeiterausweis, die für Sie notwendigen Schlüssel und die Arbeitskleidung. Für Urlaubsangelegenheiten steht Ihnen Herr Scholz zur Verfügung. Gehaltsfragen können Sie mit Herr Kleinschmidt besprechen. Sollten Sie eine Dienstreise unternommen haben, rechnen Sie die entstandenen Kosten mit Herrn Friedrich ab."], "sets": [{"label": "", "questions": [{"n": 6, "type": "rf", "prompt": "Den neuen Mitarbeitenden wird die Organisationsstruktur des Unternehmens vorgestellt.", "options": [], "answer": "r", "src": "claude"}, {"n": 7, "type": "mc", "prompt": "In der Personalabteilung", "options": [{"k": "a", "text": "bekommen die Mitarbeitenden ihre Ausstattung."}, {"k": "b", "text": "bezahlt man die Arbeitskleidung."}, {"k": "c", "text": "bucht man Dienstreisen."}], "answer": "a", "src": "claude"}]}], "num": "8", "ver": "", "test": "160201", "text": "Text 1"}, {"id": "t2-p25-10", "title": "Text 2 (вариант №1) – 100%", "topic": "Arbeitsunfälle", "paras": ["Arbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss also ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen.", "Nach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und sich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein detaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.", "Im Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine Lohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in Höhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.", "Zu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem Wohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die Arbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie etwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen Verkehrsmitteln man sich fortbewegt.", "Der Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug, sind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf. Krankenpflege oder medizinische Rehabilitation."], "sets": [{"label": "Старый вариант ответов до 08.2024.", "questions": [{"n": 8, "type": "rf", "prompt": "Ein Fahrradunfall auf dem Weg zur Arbeit zählt nicht als Arbeitsunfall.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Nach einem Arbeitsunfall", "options": [{"k": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"k": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"k": "c", "text": "muss ein Bericht vom Arzt beim Arbeitgeber abgegeben werden."}], "answer": "b", "src": "claude"}]}, {"label": "Новый вариант №160201, 160221- 100%", "questions": [{"n": 8, "type": "rf", "prompt": "Im Falle eines Arbeitsunfalls muss man sofort einen Bericht beim Arbeitgeber einreichen.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Nach einem Arbeitsunfall", "options": [{"k": "a", "text": "bezahlt die Berufsgenossenschaft sofort Verletztengeld."}, {"k": "b", "text": "erhalten Arbeitnehmer sechs Wochen volles Gehalt."}, {"k": "c", "text": "trägt der Arbeitgeber die Kosten für die medizinische Versorgung."}], "answer": "b", "src": "claude"}]}], "num": "1", "ver": "", "test": "", "text": "Text 2"}, {"id": "t2-p26-11", "title": "Text 2 (вариант №2) - 100%", "topic": "Wichtige Hinweise zum Datenschutz", "paras": ["Unser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben. Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden. Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei. Eine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein. Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Die Teilnahme am Seminar", "options": [{"k": "a", "text": "gilt als Arbeitszeit."}, {"k": "b", "text": "ist kostenpflichtig."}, {"k": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "src": "claude"}]}], "num": "2", "ver": "", "test": "", "text": "Text 2"}, {"id": "t2-p26-12", "title": "Text 2 (вариант №2) - 100% — Новый вариант", "topic": "Wichtige Hinweise zum Datenschutz", "paras": ["Unser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben.", "Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden.", "Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei.", "Eine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein.", "Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen.", "options": [], "answer": "r", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Die Teilnahme am Seminar", "options": [{"k": "a", "text": "gilt als Arbeitszeit."}, {"k": "b", "text": "ist kostenpflichtig."}, {"k": "c", "text": "muss bei WissMax erfolgen."}], "answer": "a", "src": "claude"}]}], "num": "2", "ver": "новий текст", "test": "", "text": "Text 2"}, {"id": "t2-p27-13", "title": "Text 2 (вариант №3) – 100%", "topic": "Rauchen", "paras": ["Im gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen, Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt, Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig, Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.", "Da die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.", "Daher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.", "Die Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.", "Für weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung."], "sets": [{"label": "Старая версия до 07.2024 – 100%", "questions": [{"n": 8, "type": "rf", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Raucher", "options": [{"k": "a", "text": "müssen ihre Pausenzeiten nicht dokumentieren."}, {"k": "b", "text": "sind auch in der Raucherpause bei Unfällen versichert."}, {"k": "c", "text": "sollen die Terrassentür beim Rauchen schließen"}], "answer": "c", "src": "src"}]}, {"label": "Новая версия от 07.2024 – 100%", "questions": [{"n": 8, "type": "rf", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten ein.", "options": [], "answer": "r", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Raucher", "options": [{"k": "a", "text": "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung."}, {"k": "b", "text": "müssen ihre Pausenzeiten dokumentieren."}, {"k": "c", "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "src": "claude"}]}, {"label": "Новая версия от 05.2025 – 100%", "questions": [{"n": 8, "type": "rf", "prompt": "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Raucher", "options": [{"k": "a", "text": "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung."}, {"k": "b", "text": "müssen ihre Pausenzeiten dokumentieren."}, {"k": "c", "text": "sind auch in der Raucherpause bei Unfällen versichert."}], "answer": "b", "src": "claude"}]}], "num": "3", "ver": "", "test": "", "text": "Text 2"}, {"id": "t2-p28-14", "title": "Text 2 (вариант №4) – 100%", "topic": "Lebensarbeitszeitkonto", "paras": ["In unserem Unternehmen wird die Möglichkeit angeboten, ein Lebensarbeitszeitkonto zu führen. Als Arbeitnehmer können Sie Arbeitszeit, zum Beispiel geleistete Überstunden, als Guthaben auf diesem Konto stehen lassen. Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.", "Bei Bedarf können Sie Ihre angesparten Stunden wieder einlösen. Das Lebensarbeitszeitkonto bietet die Chance, adäquat auf verschiedene Bedürfnisse zu verschiedenen Zeiten im Laufe des Arbeitslebens einzugehen. Beispielsweise könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden.", "Außerdem bietet unser Teilzeitangebot „Classic Vario\" eine Kombination von Teil- und Vollzeit bei flexibler Einteilung der Arbeitszeit. Nach rechtzeitiger Rücksprache mit dem Arbeitgeber (mindestens drei Monate vorher) kann die zu leistende Arbeitszeit auch zwischen Teil- und Vollzeit angepasst werden.", "Wenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten. Für die Arbeit von zu Hause stehen den Mitarbeitern und Mitarbeiterinnen ein firmeneigener Laptop und ein Diensthandy zur Verfügung.", "Sollten Sie eine komplette Auszeit nehmen wollen, können Sie das für einen Zeitraum von bis zu maximal zwölf Monaten vorübergehend tun. Wir sichern Ihnen einen gleichwertigen Arbeitsplatz nach Ihrer Rückkehr zu.", "Als familienfreundliche Firma bieten wir neben den oben beschriebenen flexiblen Arbeitszeitmodellen Betreuungsmöglichkeiten während der Schulferien für die Kinder unserer Mitarbeiter und Mitarbeiterinnen."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Das Unternehmen unterstützt die Mitarbeiter finanziell bei privaten Problemen.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Die Mitarbeiter können", "options": [{"k": "a", "text": "bei Bedarf von zu Hause aus arbeiten."}, {"k": "b", "text": "sich maximal ein halbes Jahr beurlauben lassen."}, {"k": "c", "text": "Geldleistungen für die Pflege von Angehörigen erhalten."}], "answer": "a", "src": "claude"}]}], "num": "4", "ver": "", "test": "", "text": "Text 2"}, {"id": "t2-p29-15", "title": "Text 2 (вариант №5) – 100%", "topic": "Berichtsheft", "paras": ["Das Berichtsheft ist der Nachweis, dass die Ausbildung ordnungsgemäß verläuft. In diesem wird alles dokumentiert, was man während der Ausbildung macht und lernt. Sie sollten nicht nur Ihre Tätigkeiten im Betrieb beschreiben, sondern auch alle Einweisungen, Schulungen und den innerbetrieblichen Unterricht vermerken. Wie Sie sehen, ist das Führen der Ausbildungsnachweise ein wichtiger Inhalt Ihrer Ausbildung, bei dem Sie lernen, Ihre Tätigkeiten zeitlich und inhaltlich zu dokumentieren. Darüber hinaus bietet es Ihnen die Möglichkeit, den Zeitaufwand für bestimmte Tätigkeiten präziser einzuschätzen und Ihre Aufgaben zu reflektieren.", "Weiterhin wird Ihr Tätigkeitsbereich für Beteiligte im Unternehmen und für die Stellen, die für die Berufsausbildung zuständig sind, nachvollziehbar dargestellt. Es ist Pflicht, das Berichtsheft jeweils vor der Zwischen- und der Abschlussprüfung vorzulegen. Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen. Wenn Sie zwischen zwei Noten stehen, können Ihre Berichte sogar Ihre Endnote beeinflussen.", "Neben den Wochenberichten, die Sie jeden Freitag an Ihren Teamleiter schicken, müssen Sie nach dem Durchlaufen einer Abteilung einen zusätzlichen Bericht verfassen. Dieser ergänzt den Wochenbericht und verschafft Ihnen einen genaueren Überblick über die Aufgaben in der jeweiligen Abteilung. Sie dürfen Ihre Berichte während der Arbeitszeit schreiben und können sie sowohl in klassischer Heftform als auch in digitaler Form auf unserer firmeninternen Plattform führen und einreichen. In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen. In Ihrem eigenen Interesse empfehlen wir Ihnen, es immer zeitnah zu vervollständigen."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Auszubildende ohne ordentlich geführtes Berichtsheft dürfen nicht an der Abschlussprüfung teilnehmen.", "options": [], "answer": "r", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Das Berichtsheft muss", "options": [{"k": "a", "text": "in der Freizeit geführt werden."}, {"k": "b", "text": "dem Ausbildungsleiter regelmäßig gezeigt werden."}, {"k": "c", "text": "jeden Tag ausgefüllt werden."}], "answer": "b", "src": "claude"}]}], "num": "5", "ver": "", "test": "", "text": "Text 2"}, {"id": "t2-p30-16", "title": "Text 2 (вариант №6) (тест №150321,150301) - 100%", "topic": "Datenschutz", "paras": ["Ihre im Unternehmen verwendeten Passwörter dürfen unter keinen Umständen weitergegeben und müssen regelmäßig alle sechs Monate geändert werden. Bitte verwenden Sie keine Passwörter, die Sie auch für private Konten nutzen, und generieren Sie sichere Passwörter mit einem Passwortgenerator. USB-Sticks und Ihnen unbekannte Geräte sind vor Inbetriebnahme in isolierter Umgebung zu prüfen. Es darf keine Software aus dem Internet heruntergeladen oder selbstständig auf dem Arbeitslaptop oder dem PC installiert werden. Außerdem ist es untersagt, Daten lokal abzuspeichern.", "Bitte achten Sie bei Dienstreisen darauf, Ihren Laptop vor Fremden zu sichern! Bedenken Sie bitte auch, dass bei der Arbeit möglicherweise vertrauliche Informationen auf Ihrem Bildschirm zu sehen sind. Schützen Sie diese vor fremden Blicken.", "Vertrauliche Telefonate dürfen nicht in der Öffentlichkeit geführt werden. Die private Nutzung von Diensthandys oder Laptops ist untersagt.", "Vertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden. Über interne Information Unternehmensangelegenheiten oder Dienstgeheimnisse ist Verschwiegenheit zu wahren. Unterlagen, Datenträg Abschriften oder Kopien dürfen nicht weitergegeben werden oder versehentlich in die Hände unbefugter Person gelangen. Vertrauliche Daten in Papierform sind in dafür bereitgestellten Schreddern zu vernichten.", "Bitte melden Sie ungewöhnliche Vorkommnisse oder Feststellungen umgehend der Geschäftsführung oder unsere Datenschutzbeauftragten, Herrn Dr. Sevici. Er ist unter der Durchwahl -33 zu erreichen und steht Ihnen auch bei Fragen bezüglich des Datenschutzes in unserem Unternehmen zur Verfügung."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Die Mitarbeitenden dürfen ihre Passwörter frühestens alle sechs Monate ändern.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Vertrauliche Daten", "options": [{"k": "a", "text": "dürfen nicht auf dem PC gespeichert werden."}, {"k": "b", "text": "müssen nach einer bestimmten Zeit gelöscht werden."}, {"k": "c", "text": "sollen ausgedruckt und abgeheftet werden."}], "answer": "a", "src": "claude"}]}], "num": "6", "ver": "", "test": "150321", "text": "Text 2"}, {"id": "t2-p31-17", "title": "Text 2 (вариант №7) (тест №140321, 140301)", "topic": "Arbeitsunfall und Berufsgenossenschaft (BG)", "paras": ["Mit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.", "Der Träger dieser Unfallversicherung ist die Berufsgenossenschaft, deren Aufgaben in erster Linie darin bestehen, Arbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren zu vermeiden. Das wird gewährleistet, indem regelmäßig Kontrollen der Arbeitssicherheit durch die Berufsgenossenschaft stattfinden. Bei diesen Kontrollen sind unsere Mitarbeiter*innen des Qualitätsmanagements mit vor Ort.", "Sollte dennoch ein Unglücksfall eintreten, übernimmt die Berufsgenossenschaft sämtliche Kosten für Heilbehandlungen und Schadensersatzzahlungen. Dafür muss von Ihnen folgendes Prozedere eingehalten werden: Nach einem Arbeitsunfall wird zunächst der Ersthelfer oder die Ersthelferin informiert. Je nach Schwere des Unfalls wird ein Rettungswagen dazu gerufen. Ob mit der ohne Krankenhausaufenthalt, müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden. Gleichzeitig sind wir als Arbeitgeber verpflichtet, den Unfall der Berufsgenossenschaft zu melden. Damit setzt der Prozess ein, dass die Berufsgenossenschaft Ihre Behandlung und deren Kosten übernimmt. Damit für Sie als Arbeitnehmer*in keine finanziellen Probleme entstehen, zahlt die Berufsgenossenschaft Ihnen den Lohn ab der siebten Woche der Arbeitsunfähigkeit weiter.", "Damit es aber gar nicht erst so weit kommt, führen wir regelmäßig Schulungen zur Arbeitssicherheit durch. Diese beinhalten auf der einen Seite Einweisungen zum korrekten Tragen der Schutzkleidung und auf der anderen Seite konkrete Anweisungen zur richtigen Bedienung der Maschinen."], "sets": [{"label": "", "questions": [{"n": 8, "type": "rf", "prompt": "Alle Mitarbeitenden müssen für eine Arbeitsunfallversicherung sorgen.", "options": [], "answer": "f", "src": "claude"}, {"n": 9, "type": "mc", "prompt": "Nach einem Arbeitsunfall", "options": [{"k": "a", "text": "muss man sich einem Durchgangsarzt vorstellen."}, {"k": "b", "text": "schickt die BG einen Arzt oder Rettungswagen."}, {"k": "c", "text": "übernimmt die BG sofort die Gehaltsfortzahlungen."}], "answer": "a", "src": "claude"}]}], "num": "7", "ver": "", "test": "140321", "text": "Text 2"}], "teil3": [{"id": "t3-32", "title": "Lesen Teil 3 (вариант №1) – 100%", "note": "", "persons": [{"n": 10, "name": "Gabi", "answer": "d", "body": "Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?"}, {"n": 11, "name": "Charlotte", "answer": "x", "body": "Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?"}, {"n": 12, "name": "Lars", "answer": "b", "body": "Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?"}, {"n": 13, "name": "Kamil", "answer": "a", "body": "Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?"}], "options": [{"k": "a", "title": "Günther, vor 9 Stunden", "body": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung\" oder „Krankheit\"."}, {"k": "b", "title": "Marion, vor 4 Stunden", "body": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung."}, {"k": "c", "title": "Karin, vor 45 Minuten", "body": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig."}, {"k": "d", "title": "Elli, vor 3 Stunden", "body": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ein ärztliches Attest. Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen."}, {"k": "e", "title": "Sabine, vor 40 Minuten", "body": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll."}, {"k": "f", "title": "Jorge, vor 2 Stunden", "body": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken."}], "num": "1", "ver": "", "test": ""}, {"id": "t3-33", "title": "Lesen Teil 3 (вариант №1) ( версия от 08.2024) – 100%", "note": "(новая формулировка ответа d )", "persons": [{"n": 10, "name": "Gabi", "answer": "d", "body": "Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?"}, {"n": 11, "name": "Charlotte", "answer": "x", "body": "Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?"}, {"n": 12, "name": "Lars", "answer": "b", "body": "Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?"}, {"n": 13, "name": "Kamil", "answer": "a", "body": "Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?"}], "options": [{"k": "a", "title": "Günther, vor 9 Stunden", "body": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung\" oder „Krankheit\"."}, {"k": "b", "title": "Marion, vor 4 Stunden", "body": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung."}, {"k": "c", "title": "Karin, vor 45 Minuten", "body": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig."}, {"k": "d", "title": "Elli, vor 3 Stunden", "body": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab den ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers."}, {"k": "e", "title": "Sabine, vor 40 Minuten", "body": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll."}, {"k": "f", "title": "Jorge, vor 2 Stunden", "body": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken."}], "num": "1", "ver": "08.2024", "test": ""}, {"id": "t3-34", "title": "Lesen Teil 3 (вариант №1) (версия от 07.02.2025) – 100%", "note": "(новые имена и очередь)", "persons": [{"n": 10, "name": "Petra", "answer": "x", "body": "Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?"}, {"n": 11, "name": "Giovanni", "answer": "b", "body": "Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?"}, {"n": 12, "name": "Leo", "answer": "a", "body": "Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?"}, {"n": 13, "name": "Ines Maria", "answer": "d", "body": "Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird? Forum: Rund um den Beruf"}], "options": [{"k": "a", "title": "Jose Cristobal, vor 9 Stunden", "body": "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung\" oder „Krankheit\"."}, {"k": "b", "title": "Gracia Maria, vor 4 Stunden", "body": "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung."}, {"k": "c", "title": "Lina, vor 45 Minuten", "body": "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig."}, {"k": "d", "title": "Lida, vor 3 Stunden", "body": "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab dem ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers."}, {"k": "e", "title": "Antonia, vor 40 Minuten", "body": "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll."}, {"k": "f", "title": "Jorge, vor. 2 Stunden", "body": "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken."}], "num": "1", "ver": "07.02.2025", "test": ""}, {"id": "t3-35", "title": "Lesen Teil 3 (вариант №2) - 100%", "note": "", "persons": [{"n": 10, "name": "Inka", "answer": "a", "body": "Ich bin Auszubildende in einem Büro und muss immer pünktlich Feierabend machen, weil ich meinen einjährigen Sohn von der Krippe abholen muss. Mein Chef sieht das gar nicht gern und droht mir jetzt sogar mit Kündigung. Was soll ich machen?"}, {"n": 11, "name": "Jacqueline", "answer": "f", "body": "Hallo Leute! Vor ein paar Monaten habe ich mit einer Ausbildung begonnen. Und jetzt bin ich schwanger... Was soll ich bloß machen? Es wird bestimmt schwierig, Kind und Arbeit zu vereinbaren. Soll ich die Ausbildung abbrechen?"}, {"n": 12, "name": "Hans-Peter", "answer": "x", "body": "Guten Abend, ich bin Ende 40 und mein Sohn ist inzwischen erwachsen. Jetzt möchte ich beruflich was ganz Neues machen und eine Ausbildung zum Steuerfachangestellten anfangen. Meint ihr, ich habe in meinem Alter noch Chancen, in diesem Beruf zu arbeiten?"}, {"n": 13, "name": "Max", "answer": "b", "body": "Hallo, ich mache momentan eine Ausbildung zum Einzelhandelskaufmann. Ich habe noch ein Jahr bis zum Abschluss und habe wirklich keine Lust mehr. Mein Vater möchte, dass ich die Ausbildung fertig mache. Ich bin noch nicht 18. Kann ich trotzdem einfach kündigen?"}], "options": [{"k": "a", "title": "Susi, vor 1 Stunde", "body": "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren. Mit einer Rechtsschutzversicherung wird das auch nicht so teuer."}, {"k": "b", "title": "Julia, vor 1 Stunde", "body": "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben. An deiner Stelle würde ich mir das aber noch mal überlegen. Ich kann deinen Vater jedenfalls gut verstehen. Er macht sich halt Sorgen um deine Zukunft. (Есть другая формулировка ответа от 07.03.25 ), Damit Minderjährigen die Ausbildung verlassen, müssen die Eltern eine Kündigung unterschreiben."}, {"k": "c", "title": "Jürgen, vor 2 Stunden", "body": "Hi, ich würde die Ausbildung auf keinen Fall abbrechen. Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld
