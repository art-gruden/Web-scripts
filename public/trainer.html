те його до відділу кадрів без нагадувань.", "Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann.": "Як альтернативу ви можете відвідати подібне навчання в іншого провайдера. Але в такому разі просимо заздалегідь погодити таку участь із відділом кадрів, щоб вам схвалили семінар і гарантували оплату витрат.", "Rauchen": "Куріння", "Im gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder gekennzeichnete Raucherzonen, Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im Umkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt, Eine Missachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung. Das Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie jeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des Gebäudes A zulässig, Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten. Zigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten. Raucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom Zeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.": "На всьому підприємстві діє сувора заборона куріння. На території підприємства є чотири зони для куріння, позначені вказівними табличками. Будь ласка, використовуйте для недопалків стоячі попільнички. Однак у радіусі щонайменше 50 метрів навколо виробничих цехів курити заборонено й на відкритому повітрі. Порушення цього правила тягне за собою письмове попередження. У разі повторного порушення загрожує звільнення без попередження. Заборона куріння поширюється на сигарети, сигари, люльки та вживання подібних речовин, а також на будь-яке використання електронних сигарет. Під час заходів курити дозволено також на даховій терасі будівлі A. Працівники, які там курять, мають тримати двері тераси зачиненими. Перерви на куріння в робочий час у принципі дозволені, при цьому слід дотримуватися таких правил. Перерви на куріння не входять до робочого часу, тому працівники мусять належним чином відмічатися в системі обліку часу на вихід, а після перерви — знову на вхід.", "Da die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die Unfallversicherung nicht.": "Оскільки перерва на куріння не належить до робочого часу, за трудовим правом страхування від нещасних випадків у цей час не діє.", "Daher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung abgedeckt.": "Тому нещасний випадок під час перерви на куріння, наприклад падіння на сходах, не покривається страхуванням від нещасних випадків.", "Die Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation mit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.": "Здоров'я наших працівниць і працівників нам не байдуже. Тому спільно з нашою корпоративною лікарняною касою ми оплачуємо курс відмови від куріння.", "Für weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.": "За додатковою інформацією сміливо звертайтеся до нашого відділу кадрів.", "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus.": "Заборона куріння на території фірми не поширюється на електронні сигарети.", "Raucher": "Курці", "müssen ihre Pausenzeiten nicht dokumentieren.": "не мусять фіксувати час своїх перерв.", "sind auch in der Raucherpause bei Unfällen versichert.": "застраховані від нещасних випадків і під час перерви на куріння.", "sollen die Terrassentür beim Rauchen schließen": "під час куріння мають зачиняти двері тераси.", "Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten ein.": "Заборона куріння на території фірми поширюється й на електронні сигарети.", "erhalten weitere Informationen zu den Raucherbestimmungen in der Personalabteilung.": "отримують додаткову інформацію про правила для курців у відділі кадрів.", "müssen ihre Pausenzeiten dokumentieren.": "мусять фіксувати час своїх перерв.", "Lebensarbeitszeitkonto": "Рахунок робочого часу на все трудове життя", "In unserem Unternehmen wird die Möglichkeit angeboten, ein Lebensarbeitszeitkonto zu führen. Als Arbeitnehmer können Sie Arbeitszeit, zum Beispiel geleistete Überstunden, als Guthaben auf diesem Konto stehen lassen. Ähnlich wie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.": "Наше підприємство пропонує можливість вести рахунок робочого часу на все трудове життя. Як працівник ви можете залишати на цьому рахунку робочий час, наприклад відпрацьовані понаднормові години, як накопичення. Подібно до банківського рахунку, з тією різницею, що приймається й «валюта» — час.", "Bei Bedarf können Sie Ihre angesparten Stunden wieder einlösen. Das Lebensarbeitszeitkonto bietet die Chance, adäquat auf verschiedene Bedürfnisse zu verschiedenen Zeiten im Laufe des Arbeitslebens einzugehen. Beispielsweise könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt werden.": "За потреби ви можете знову використати накопичені години. Такий рахунок дає змогу відповідно реагувати на різні потреби в різні періоди трудового життя. Наприклад, накопичений час можна використати для догляду за родичами, які потребують опіки.", "Außerdem bietet unser Teilzeitangebot „Classic Vario\" eine Kombination von Teil- und Vollzeit bei flexibler Einteilung der Arbeitszeit. Nach rechtzeitiger Rücksprache mit dem Arbeitgeber (mindestens drei Monate vorher) kann die zu leistende Arbeitszeit auch zwischen Teil- und Vollzeit angepasst werden.": "Крім того, наша пропозиція неповної зайнятості «Classic Vario» поєднує неповний і повний робочий день з гнучким розподілом робочого часу. Після своєчасного погодження з роботодавцем (щонайменше за три місяці) обсяг робочого часу можна також змінювати між неповною та повною зайнятістю.", "Wenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice arbeiten. Für die Arbeit von zu Hause stehen den Mitarbeitern und Mitarbeiterinnen ein firmeneigener Laptop und ein Diensthandy zur Verfügung.": "Якщо вам потрібна певна гнучкість у часі, ви можете також короткостроково за домовленістю працювати в хоумофісі. Для роботи з дому працівникам надається службовий ноутбук і службовий мобільний телефон.", "Sollten Sie eine komplette Auszeit nehmen wollen, können Sie das für einen Zeitraum von bis zu maximal zwölf Monaten vorübergehend tun. Wir sichern Ihnen einen gleichwertigen Arbeitsplatz nach Ihrer Rückkehr zu.": "Якщо ви захочете взяти повну перерву в роботі, ви можете тимчасово зробити це на строк до дванадцяти місяців. Ми гарантуємо вам рівноцінне робоче місце після повернення.", "Als familienfreundliche Firma bieten wir neben den oben beschriebenen flexiblen Arbeitszeitmodellen Betreuungsmöglichkeiten während der Schulferien für die Kinder unserer Mitarbeiter und Mitarbeiterinnen.": "Як сімейно-орієнтована фірма ми, крім описаних вище гнучких моделей робочого часу, пропонуємо можливості догляду за дітьми наших працівників під час шкільних канікул.", "Das Unternehmen unterstützt die Mitarbeiter finanziell bei privaten Problemen.": "Підприємство фінансово підтримує працівників у разі особистих проблем.", "Die Mitarbeiter können": "Працівники можуть", "bei Bedarf von zu Hause aus arbeiten.": "за потреби працювати з дому.", "sich maximal ein halbes Jahr beurlauben lassen.": "взяти відпустку щонайбільше на пів року.", "Geldleistungen für die Pflege von Angehörigen erhalten.": "отримувати грошові виплати на догляд за родичами.", "Berichtsheft": "Звітний щоденник (Berichtsheft)", "Das Berichtsheft ist der Nachweis, dass die Ausbildung ordnungsgemäß verläuft. In diesem wird alles dokumentiert, was man während der Ausbildung macht und lernt. Sie sollten nicht nur Ihre Tätigkeiten im Betrieb beschreiben, sondern auch alle Einweisungen, Schulungen und den innerbetrieblichen Unterricht vermerken. Wie Sie sehen, ist das Führen der Ausbildungsnachweise ein wichtiger Inhalt Ihrer Ausbildung, bei dem Sie lernen, Ihre Tätigkeiten zeitlich und inhaltlich zu dokumentieren. Darüber hinaus bietet es Ihnen die Möglichkeit, den Zeitaufwand für bestimmte Tätigkeiten präziser einzuschätzen und Ihre Aufgaben zu reflektieren.": "Звітний щоденник — це підтвердження того, що професійне навчання проходить належним чином. У ньому документують усе, що ви робите і чого навчаєтеся під час професійного навчання. Варто описувати не лише свою діяльність на підприємстві, а й фіксувати всі інструктажі, навчання та внутрішні заняття. Як бачите, ведення звітів про навчання — важлива частина вашої освіти, під час якої ви вчитеся документувати свою діяльність за часом і змістом. Крім того, це дає змогу точніше оцінювати витрати часу на певні завдання і осмислювати свою роботу.", "Weiterhin wird Ihr Tätigkeitsbereich für Beteiligte im Unternehmen und für die Stellen, die für die Berufsausbildung zuständig sind, nachvollziehbar dargestellt. Es ist Pflicht, das Berichtsheft jeweils vor der Zwischen- und der Abschlussprüfung vorzulegen. Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu den Prüfungen zulassen. Wenn Sie zwischen zwei Noten stehen, können Ihre Berichte sogar Ihre Endnote beeinflussen.": "Також ваша сфера діяльності зрозуміло представлена для причетних на підприємстві й для установ, відповідальних за професійну освіту. Обов'язково треба подавати звітний щоденник перед проміжним і перед випускним іспитом. Лише якщо він заповнений повністю, екзаменаційна комісія допустить вас до іспитів. Якщо ви між двома оцінками, ваші звіти можуть навіть вплинути на підсумкову оцінку.", "Neben den Wochenberichten, die Sie jeden Freitag an Ihren Teamleiter schicken, müssen Sie nach dem Durchlaufen einer Abteilung einen zusätzlichen Bericht verfassen. Dieser ergänzt den Wochenbericht und verschafft Ihnen einen genaueren Überblick über die Aufgaben in der jeweiligen Abteilung. Sie dürfen Ihre Berichte während der Arbeitszeit schreiben und können sie sowohl in klassischer Heftform als auch in digitaler Form auf unserer firmeninternen Plattform führen und einreichen. In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter zur Kenntnisnahme vorzulegen. In Ihrem eigenen Interesse empfehlen wir Ihnen, es immer zeitnah zu vervollständigen.": "Крім тижневих звітів, які ви щоп'ятниці надсилаєте керівнику команди, після проходження кожного відділу треба написати додатковий звіт. Він доповнює тижневий звіт і дає вам точніше уявлення про завдання відповідного відділу. Ви можете писати звіти в робочий час і вести та подавати їх як у класичному зошиті, так і в цифровому вигляді на внутрішній платформі фірми. Через визначені проміжки часу ви маєте подавати щоденник керівнику навчання для ознайомлення. У ваших же інтересах радимо заповнювати його завжди вчасно.", "Auszubildende ohne ordentlich geführtes Berichtsheft dürfen nicht an der Abschlussprüfung teilnehmen.": "Учні без належно заповненого звітного щоденника не допускаються до випускного іспиту.", "Das Berichtsheft muss": "Звітний щоденник треба", "in der Freizeit geführt werden.": "вести у вільний час.", "dem Ausbildungsleiter regelmäßig gezeigt werden.": "регулярно показувати керівнику навчання.", "jeden Tag ausgefüllt werden.": "заповнювати щодня.", "Datenschutz": "Захист даних", "Ihre im Unternehmen verwendeten Passwörter dürfen unter keinen Umständen weitergegeben und müssen regelmäßig alle sechs Monate geändert werden. Bitte verwenden Sie keine Passwörter, die Sie auch für private Konten nutzen, und generieren Sie sichere Passwörter mit einem Passwortgenerator. USB-Sticks und Ihnen unbekannte Geräte sind vor Inbetriebnahme in isolierter Umgebung zu prüfen. Es darf keine Software aus dem Internet heruntergeladen oder selbstständig auf dem Arbeitslaptop oder dem PC installiert werden. Außerdem ist es untersagt, Daten lokal abzuspeichern.": "Паролі, які ви використовуєте на підприємстві, за жодних обставин не можна нікому передавати, і їх треба регулярно змінювати кожні шість місяців. Будь ласка, не використовуйте паролі, які ви маєте і для особистих акаунтів, і створюйте надійні паролі за допомогою генератора паролів. USB-флешки та незнайомі вам пристрої перед використанням треба перевіряти в ізольованому середовищі. Заборонено завантажувати з інтернету програми або самостійно встановлювати їх на робочий ноутбук чи ПК. Крім того, заборонено зберігати дані локально.", "Bitte achten Sie bei Dienstreisen darauf, Ihren Laptop vor Fremden zu sichern! Bedenken Sie bitte auch, dass bei der Arbeit möglicherweise vertrauliche Informationen auf Ihrem Bildschirm zu sehen sind. Schützen Sie diese vor fremden Blicken.": "Будь ласка, у відрядженнях стежте, щоб ваш ноутбук був захищений від сторонніх! Пам'ятайте також, що під час роботи на екрані може бути видно конфіденційну інформацію. Захищайте її від чужих поглядів.", "Vertrauliche Telefonate dürfen nicht in der Öffentlichkeit geführt werden. Die private Nutzung von Diensthandys oder Laptops ist untersagt.": "Конфіденційні телефонні розмови не можна вести в громадських місцях. Особисте користування службовими телефонами чи ноутбуками заборонене.", "Vertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht länger als unbedingt erforderlich aufgehoben oder gespeichert werden. Über interne Information Unternehmensangelegenheiten oder Dienstgeheimnisse ist Verschwiegenheit zu wahren. Unterlagen, Datenträg Abschriften oder Kopien dürfen nicht weitergegeben werden oder versehentlich in die Hände unbefugter Person gelangen. Vertrauliche Daten in Papierform sind in dafür bereitgestellten Schreddern zu vernichten.": "Конфіденційні та персональні дані після закінчення робочого дня треба замикати. Крім того, їх не можна зберігати довше, ніж це абсолютно необхідно. Щодо внутрішньої інформації, справ підприємства чи службових таємниць треба зберігати мовчання. Документи, носії даних, копії чи дублікати не можна передавати іншим, і вони не повинні випадково потрапити до рук сторонніх осіб. Конфіденційні дані на папері треба знищувати в призначених для цього шредерах.", "Bitte melden Sie ungewöhnliche Vorkommnisse oder Feststellungen umgehend der Geschäftsführung oder unsere Datenschutzbeauftragten, Herrn Dr. Sevici. Er ist unter der Durchwahl -33 zu erreichen und steht Ihnen auch bei Fragen bezüglich des Datenschutzes in unserem Unternehmen zur Verfügung.": "Будь ласка, негайно повідомляйте про незвичайні події чи спостереження керівництву або нашому уповноваженому з захисту даних, д-ру Севічі. З ним можна зв'язатися за внутрішнім номером 33, і він також допоможе з питаннями щодо захисту даних на нашому підприємстві.", "Die Mitarbeitenden dürfen ihre Passwörter frühestens alle sechs Monate ändern.": "Працівники можуть змінювати свої паролі не частіше ніж раз на шість місяців.", "Vertrauliche Daten": "Конфіденційні дані", "dürfen nicht auf dem PC gespeichert werden.": "не можна зберігати на ПК.", "müssen nach einer bestimmten Zeit gelöscht werden.": "треба видаляти через певний час.", "sollen ausgedruckt und abgeheftet werden.": "треба роздруковувати й підшивати.", "Arbeitsunfall und Berufsgenossenschaft (BG)": "Нещасний випадок на роботі і професійна страхова спілка (BG)", "Mit dem Arbeitsantritt in unserem Unternehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich unfallversichert.": "З початком роботи на нашому підприємстві ви як працівник автоматично маєте державне страхування від нещасних випадків.", "Der Träger dieser Unfallversicherung ist die Berufsgenossenschaft, deren Aufgaben in erster Linie darin bestehen, Arbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren zu vermeiden. Das wird gewährleistet, indem regelmäßig Kontrollen der Arbeitssicherheit durch die Berufsgenossenschaft stattfinden. Bei diesen Kontrollen sind unsere Mitarbeiter*innen des Qualitätsmanagements mit vor Ort.": "Страховиком є професійна страхова спілка (Berufsgenossenschaft), завдання якої насамперед — запобігати нещасним випадкам на роботі й дорогою, професійним захворюванням та ризикам для здоров'я, пов'язаним із роботою. Це забезпечується тим, що професійна страхова спілка регулярно проводить перевірки безпеки праці. Під час цих перевірок на місці присутні наші працівники з управління якістю.", "Sollte dennoch ein Unglücksfall eintreten, übernimmt die Berufsgenossenschaft sämtliche Kosten für Heilbehandlungen und Schadensersatzzahlungen. Dafür muss von Ihnen folgendes Prozedere eingehalten werden: Nach einem Arbeitsunfall wird zunächst der Ersthelfer oder die Ersthelferin informiert. Je nach Schwere des Unfalls wird ein Rettungswagen dazu gerufen. Ob mit der ohne Krankenhausaufenthalt, müssen Sie aber in jedem Fall von einem Durchgangsarzt untersucht werden. Gleichzeitig sind wir als Arbeitgeber verpflichtet, den Unfall der Berufsgenossenschaft zu melden. Damit setzt der Prozess ein, dass die Berufsgenossenschaft Ihre Behandlung und deren Kosten übernimmt. Damit für Sie als Arbeitnehmer*in keine finanziellen Probleme entstehen, zahlt die Berufsgenossenschaft Ihnen den Lohn ab der siebten Woche der Arbeitsunfähigkeit weiter.": "Якщо все ж станеться нещасний випадок, професійна страхова спілка покриває всі витрати на лікування і виплати компенсації. Для цього ви маєте дотримуватися такої процедури: після нещасного випадку на роботі спершу повідомляють особу, відповідальну за першу допомогу. Залежно від тяжкості випадку викликають швидку допомогу. З госпіталізацією чи без неї — вас у будь-якому разі має оглянути спеціальний лікар страхової спілки (Durchgangsarzt). Водночас ми як роботодавець зобов'язані повідомити про нещасний випадок професійну страхову спілку. Так запускається процес, за яким професійна страхова спілка бере на себе ваше лікування та його вартість. Щоб у вас як у працівника не виникло фінансових проблем, професійна страхова спілка продовжує виплачувати вам зарплату починаючи з сьомого тижня непрацездатності.", "Damit es aber gar nicht erst so weit kommt, führen wir regelmäßig Schulungen zur Arbeitssicherheit durch. Diese beinhalten auf der einen Seite Einweisungen zum korrekten Tragen der Schutzkleidung und auf der anderen Seite konkrete Anweisungen zur richtigen Bedienung der Maschinen.": "Але щоб до цього взагалі не дійшло, ми регулярно проводимо навчання з безпеки праці. Вони містять, з одного боку, інструктажі щодо правильного носіння захисного одягу, а з іншого — конкретні вказівки щодо правильної роботи з машинами.", "Alle Mitarbeitenden müssen für eine Arbeitsunfallversicherung sorgen.": "Усі працівники мусять самі подбати про страхування від нещасних випадків на роботі.", "muss man sich einem Durchgangsarzt vorstellen.": "треба з'явитися до спеціального лікаря страхової спілки (Durchgangsarzt).", "schickt die BG einen Arzt oder Rettungswagen.": "BG надсилає лікаря або швидку допомогу.", "übernimmt die BG sofort die Gehaltsfortzahlungen.": "BG одразу бере на себе продовження виплати зарплати.", "Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird?": "Я якраз була у відпустці, і в перший же день відпустки моя маленька захворіла, і мені довелося чотири дні її доглядати. Якщо я захворію у відпустці, то можу отримати ці дні назад. А як бути, коли хворіє дитина?", "Ich konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat mein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht doch nicht, oder?": "На жаль, я знову не змогла піти на роботу, бо моя дитина хворіла. Коли я сьогодні зателефонувала, мій начальник відреагував зовсім неадекватно і пригрозив звільненням, якщо я буду відсутня більше одного дня. Так же не можна, правда?", "Ich bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich vergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich unentschuldigt gefehlt habe. Geht das so einfach?": "Минулого понеділка я прокинувся з жахливим головним болем і не міг устати. На жаль, я забув зателефонувати роботодавцю і залишився в ліжку. Тепер начальник хоче мене звільнити, бо я був відсутній без поважної причини. Хіба це так просто?", "Gestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich war immer der Meinung, die braucht man erst nach drei Tagen?": "Учора я хворів. Коли я сьогодні знову прийшов в офіс, начальник одразу захотів лікарняний. Я завжди думав, що він потрібен лише після трьох днів?", "Das kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem Arbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den Paragraphen „Arbeitsverhinderung\" oder „Krankheit\".": "Однозначно так сказати не можна. Як це врегульовано на твоєму підприємстві, написано в трудовому договорі. З якого дня потрібна довідка про непрацездатність, зазвичай вказано в пунктах «Перешкоди для роботи» або «Хвороба».", "Nein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne Bescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr findet bestimmt eine Lösung.": "Ні, спочатку ти маєш отримати письмове попередження. Але якщо потім ти знову будеш відсутній, не попередивши, доведеться розраховувати на звільнення. Спробуй ще раз поговорити з начальником. Ви напевно знайдете рішення.", "Du kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit nachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine Abmahnung vor der Kündigung nicht notwendig.": "Не можна просто приходити й іти, коли хочеш, навіть якщо ти збирався відпрацювати пропущений час. Робочий час же визначено договором. Якщо працівники його не дотримуються, письмове попередження перед звільненням не потрібне.", "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ein ärztliches Attest. Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern musst. In diesem Fall gelten die Urlaubstage als genommen.": "Як ти й сама пишеш, у разі хвороби дні відпустки можна повернути на твій рахунок відпустки. Звісно, потрібна лікарська довідка. Але це не діє, якщо тобі треба доглядати хвору дитину. У такому разі дні відпустки вважаються використаними.", "Diese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch ausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.": "Цю ситуацію ж знають усі батьки. Коли я не можу знайти, хто догляне сина, я можу у виняткових випадках узяти його з собою в офіс. Моя начальниця в цьому, на щастя, дуже розуміюча.", "Also ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden, wenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du weißt, was dir fehlt. Du willst ja niemanden anstecken.": "Я, наприклад, завжди йду до лікаря вже в перший день хвороби. Береженого Бог береже. До того ж не завадить, щоб тебе оглянув лікар, коли ти погано почуваєшся. Особливо коли маєш дітей, важливо знати, що з тобою. Ти ж не хочеш нікого заразити.", "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab den ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.": "Як ти й сама пишеш, у разі хвороби дні відпустки можна повернути на твій рахунок відпустки. Звісно, лікарська довідка потрібна з першого дня. Інша річ, якщо ти доглядаєш когось із членів сім'ї. Тоді це вже не справа твого роботодавця.", "Ich hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage lang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das Kind krank wird? Forum: Rund um den Beruf": "Я якраз була у відпустці, і в перший же день відпустки моя маленька захворіла, і мені довелося чотири дні її доглядати. Якщо я захворію у відпустці, то можу отримати ці дні назад. А як бути, коли хворіє дитина? Форум: усе про професію", "Wie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du brauchst natürlich ab dem ersten Tag ein ärztliches Attest. Anders sieht es aus, wenn du einen Familienangehörigen betreust. Das ist dann nicht Sache deines Arbeitgebers.": "Як ти й сама пишеш, у разі хвороби дні відпустки можна повернути на твій рахунок відпустки. Звісно, лікарська довідка потрібна з першого дня. Інша річ, якщо ти доглядаєш когось із членів сім'ї. Тоді це вже не справа твого роботодавця.", "Ich bin Auszubildende in einem Büro und muss immer pünktlich Feierabend machen, weil ich meinen einjährigen Sohn von der Krippe abholen muss. Mein Chef sieht das gar nicht gern und droht mir jetzt sogar mit Kündigung. Was soll ich machen?": "Я навчаюся професії в офісі й мушу завжди вчасно закінчувати роботу, бо маю забирати свого однорічного сина з ясел. Моєму начальнику це зовсім не подобається, і тепер він навіть погрожує мені звільненням. Що мені робити?", "Hallo Leute! Vor ein paar Monaten habe ich mit einer Ausbildung begonnen. Und jetzt bin ich schwanger... Was soll ich bloß machen? Es wird bestimmt schwierig, Kind und Arbeit zu vereinbaren. Soll ich die Ausbildung abbrechen?": "Привіт усім! Кілька місяців тому я почала професійне навчання. А тепер я вагітна… Що ж мені робити? Напевно буде важко поєднувати дитину й роботу. Може, кинути навчання?", "Guten Abend, ich bin Ende 40 und mein Sohn ist inzwischen erwachsen. Jetzt möchte ich beruflich was ganz Neues machen und eine Ausbildung zum Steuerfachangestellten anfangen. Meint ihr, ich habe in meinem Alter noch Chancen, in diesem Beruf zu arbeiten?": "Добрий вечір, мені під п'ятдесят, і мій син уже дорослий. Тепер я хочу зайнятися чимось зовсім новим у професії і почати навчання на податкового службовця. Як ви думаєте, чи маю я в моєму віці ще шанси працювати за цією професією?", "Hallo, ich mache momentan eine Ausbildung zum Einzelhandelskaufmann. Ich habe noch ein Jahr bis zum Abschluss und habe wirklich keine Lust mehr. Mein Vater möchte, dass ich die Ausbildung fertig mache. Ich bin noch nicht 18. Kann ich trotzdem einfach kündigen?": "Привіт, я зараз навчаюся на продавця-консультанта в роздрібній торгівлі. До закінчення мені ще рік, і в мене справді вже немає бажання. Мій тато хоче, щоб я закінчив навчання. Мені ще немає 18. Чи можу я все одно просто розірвати договір?", "Solange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein. Wenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt für Arbeitsrecht kontaktieren. Mit einer Rechtsschutzversicherung wird das auch nicht so teuer.": "Поки ти таким чином не працюєш менше, ніж передбачено договором, з юридичного погляду ти маєш бути в безпеці. Якщо хочеш знати точно, у такому разі варто звернутися до адвоката з трудового права. Зі страхуванням правового захисту це буде й не так дорого.", "Rein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar unterschreiben. An deiner Stelle würde ich mir das aber noch mal überlegen. Ich kann deinen Vater jedenfalls gut verstehen. Er macht sich halt Sorgen um deine Zukunft. (Есть другая формулировка ответа от 07.03.25 ), Damit Minderjährigen die Ausbildung verlassen, müssen die Eltern eine Kündigung unterschreiben.": "Суто юридично ти не можеш зробити цього без згоди батьків. Вони навіть мають підписати заяву про розірвання. Але на твоєму місці я б іще раз це обміркував. Я, принаймні, добре розумію твого тата. Він просто хвилюється за твоє майбутнє. (Є інше формулювання відповіді від 07.03.25.) Щоб неповнолітній міг припинити професійне навчання, батьки мають підписати заяву про розірвання.", "Hi, ich würde die Ausbildung auf keinen Fall abbrechen. Mit Berufen im Finanzbereich hast du gute Aussichten auf dem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist Steuerberaterin und sucht händeringend nach fähigen Mitarbeitern. Sie kann sich vor Aufträgen gar nicht retten.": "Привіт, я б у жодному разі не кидав навчання. З професіями у фінансовій сфері в тебе добрі перспективи на ринку праці, і згодом ти добре заробляватимеш. Не зіпсуй собі цього. Моя донька — податкова консультантка і відчайдушно шукає здібних працівників. Вона просто потопає в замовленнях.", "Also ich würde noch warten, bis dein Kind etwas größer ist, und mich jetzt noch nicht um einen Ausbildungsplatz bewerben. Wenn es etwas selbstständiger ist, wird vieles leichter. Eine Ausbildung kannst du auch in drei oder vier Jahren noch machen. Dein Kind braucht dich jetzt.": "Я б ще почекала, поки дитина трохи підросте, і поки що не подавала б заявку на місце для навчання. Коли дитина стане трохи самостійнішою, багато що стане легше. Професійне навчання ти зможеш пройти й через три-чотири роки. Зараз ти потрібна своїй дитині.", "Schutz von Leben und Gesundheit ist das oberste Gebot. Um dich und dein Kind zu schützen, darfst du während der Schwangerschaft keine körperlich anstrengenden Arbeiten verrichten und auch Tätigkeiten, bei denen du Lärm, Schmutz, Kälte usw. ausgesetzt bist, sind tabu.": "Захист життя і здоров'я — найвища заповідь. Щоб захистити себе і дитину, під час вагітності тобі не можна виконувати фізично важку роботу, а також діяльність, за якої ти піддаєшся впливу шуму, бруду, холоду тощо, — табу.", "Warum das denn? Es gibt doch heutzutage Möglichkeiten, das Kind unterzubringen, während man arbeitet. Können dich deine Eltern vielleicht unterstützen? Sprich mal mit deinem Chef! Wenn der sieht, dass dir die Ausbildung wichtig ist, wird sich eine Lösung finden. Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.": "Та чому ж? Сьогодні ж є можливості влаштувати дитину, поки ти працюєш. Може, батьки тобі допоможуть? Поговори з начальником! Якщо він побачить, що навчання для тебе важливе, рішення знайдеться. Але в будь-якому разі спробуй довести навчання до кінця.", "Meine Kinder sind unter der Woche ganztags in der Kita, damit ich Vollzeit arbeiten kann. Jetzt soll ich in den nächsten Wochen samstags ins Büro kommen. Ich habe aber niemanden, der da auf meine Kinder aufpassen kann. Kann der Arbeitgeber das verlangen?": "Мої діти в будні цілий день у дитсадку, щоб я могла працювати повний день. Тепер найближчими тижнями я маю приходити в офіс по суботах. Але в мене немає нікого, хто міг би тоді доглянути дітей. Чи може роботодавець цього вимагати?", "Ich arbeite seit zwölf Jahren 20 Stunden die Woche und würde jetzt gerne, weil die Kinder aus dem Haus sind, meine Arbeitszeit aufstocken und wieder Vollzeit arbeiten. Habe ich ein Recht darauf ?": "Я дванадцять років працюю по 20 годин на тиждень і тепер, коли діти виїхали з дому, хотіла б збільшити робочий час і знову працювати повний день. Чи маю я на це право?", "Seit zwei Jahren arbeite ich Vollzeit in einem Unternehmen und dieser Job macht mir auch viel Spaß. Aus familiären Gründen würde ich gerne eine dreijährige Auszeit nehmen. Ich überlege, ob ich mir das finanziell leisten kann.": "Уже два роки я працюю повний день на одному підприємстві, і ця робота мені дуже подобається. З сімейних причин я б хотіла взяти трирічну перерву. Я думаю, чи можу я дозволити собі це фінансово.", "Ich bekomme jetzt das zweite Kind und werde danach wahrscheinlich erst mal Teilzeit arbeiten. Jetzt habe ich ziemlich große Angst, dass ich in meiner Karriere den Anschluss verpasse. Soll ich vielleicht doch so schnell wie möglich wieder Vollzeit arbeiten?": "У мене скоро народиться друга дитина, і після цього я, мабуть, спершу працюватиму неповний день. Тепер я дуже боюся відстати в кар'єрі. Може, все-таки якнайшвидше повернутися на повний день?", "In meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit seinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.": "На мою думку, сім'я — найважливіше у світі. Це ж теж виграш, коли можна більше часу проводити з дітьми і менше перебувати в стресі. Я б у будь-якому разі обрала неповний день.", "Also ich finde es nicht gut, wenn Geschäfte und Supermärkte an Samstagen so lange geöffnet sind. Ihr müsst doch bedenken, dass dort auch Menschen arbeiten müssen. Sie wollen doch ebenfalls Wochenende haben und zu ihren Familien. Ich bin ganz klar gegen längere Ladenöffnungszeiten.": "Мені не подобається, що магазини й супермаркети по суботах так довго відкриті. Ви ж маєте зважати, що там теж мусять працювати люди. Вони ж теж хочуть мати вихідні й бути з сім'єю. Я однозначно проти подовження часу роботи магазинів.", "Jeder Arbeitnehmer hat einen Rechtsanspruch auf Teilzeitarbeit. Allerdings musst du länger als sechs Monate bei dem Unternehmen beschäftigt sein. Man muss sich das aber genau überlegen, da man nicht nur kurz- oder mittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat. Schau doch mal im Internet, wie viel das ausmacht.": "Кожен працівник має законне право на роботу з неповним робочим часом. Однак ти маєш пропрацювати на підприємстві понад шість місяців. Але це треба добре обміркувати, бо заробляєш менше не лише в коротко- чи середньостроковій перспективі, а й маєш менші пенсійні права. Подивись в інтернеті, скільки це становить.", "Seit Kurzem haben Arbeitnehmer das Recht, eine befristete Zeit weniger zu arbeiten, aber das gilt bestimmt nicht rückwirkend. Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach mal mit deinem Chef.": "Нещодавно працівники отримали право на певний строк працювати менше, але це напевно не діє заднім числом. Наскільки я знаю, права повернутися на повний день у тебе немає. Просто поговори з начальником.", "Der Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch gearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht. Oft ist es aber auch so, dass du dann an einem anderen Tag in der Woche frei bekommst.": "Субота — звичайний робочий день, тому роботодавець може розпорядитися, щоб у цей день теж працювали. При цьому не має значення, є в тебе діти чи ні. Але часто буває так, що тоді ти отримуєш вихідний в інший день тижня.", "Also ich würde mir das gut überlegen. Wenn du bisher gut über die Runden gekommen bist, könntest du dir doch etwas mehr Freizeit gönnen. Meines Erachtens geht es hier auch um mehr Lebensqualität. Das Leben ist zu kurz, um nur zu arbeiten.": "Я б це добре обміркувала. Якщо досі тобі вистачало грошей, ти могла б дозволити собі трохи більше вільного часу. На мою думку, тут ідеться й про кращу якість життя. Життя закоротке, щоб тільки працювати.", "Voll gemein, ich habe nur 25 Urlaubstage! Mein Freund hat hingegen 30 Tage im Jahr. Ich frage mich, ob mir nicht auch mehr Tage zustehen. Kennt sich von euch da jemand aus?": "Ну це просто несправедливо, у мене лише 25 днів відпустки! А мій друг має 30 днів на рік. Я питаю себе, чи не належить і мені більше днів. Хтось із вас у цьому розбирається?", "Ich arbeite im Einzelhandel und bei uns gilt jede Woche ein anderer Dienstplan. Wir bekommen den Plan immer erst am Ende der Vorwoche und deshalb können wir unsere Freizeit natürlich auch nicht richtig planen. Ist das erlaubt?": "Я працюю в роздрібній торгівлі, і в нас щотижня інший графік чергувань. Ми отримуємо графік лише наприкінці попереднього тижня, тому, звісно, не можемо як слід планувати свій вільний час. Чи це дозволено?", "Ich habe nach der Genehmigung meines Urlaubs diesen gebucht und jetzt hat mein Chef gemerkt, dass ein anderer Kollege schon vorher zur selben Zeit Urlaub eingereicht hat. Jetzt will er mir meinen wieder streichen. Darf er das?": "Після того як мені затвердили відпустку, я її забронював, а тепер начальник помітив, що інший колега ще раніше подав заяву на відпустку на той самий час. Тепер він хоче скасувати мою. Чи має він на це право?", "Ich mache zurzeit ein Pflichtpraktikum in einem Unternehmen und arbeite von Montag bis Freitag acht Stunden täglich. Jetzt soll ich nächsten Samstag auch noch kommen. Bin ich dazu verpflichtet? Ich fühle mich ein bisschen ausgenutzt!": "Зараз я проходжу обов'язкову практику на підприємстві і працюю з понеділка по п'ятницю по вісім годин щодня. А тепер я маю прийти ще й наступної суботи. Чи зобов'язаний я це робити? Почуваюся трохи використаним!", "Leider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum liegt sogar nur bei 20 Tagen. Sei froh, dass du mehr hast. Bei manchen Arbeitgebern erhöht sich der Urlaubsanspruch mit längerer Firmenzugehörigkeit.": "На жаль, мушу тебе розчарувати. Ця норма відповідає закону. Мінімум узагалі становить лише 20 днів. Радій, що в тебе більше. У деяких роботодавців право на відпустку збільшується з довшим стажем на фірмі.", "Meines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mal mit eurem Chef. Dem ist vielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen Tagen du arbeiten musst und wann du frei hast.": "Наскільки я знаю, законодавчої норми щодо цього немає, але просто поговори з вашим начальником. Можливо, він навіть не усвідомлює, що тобі не дуже подобається дізнаватися так пізно, в які дні ти маєш працювати, а коли вихідний.", "Urlaub muss immer rechtzeitig beantragt werden, aber der Arbeitgeber ist nicht unbedingt verpflichtet, ihn zu gewähren. Wann Urlaub genommen werden darf, entscheidet der Chef. Aufgrund dringender betrieblicher Gründe kann ein Urlaubsantrag auch abgelehnt werden.": "Відпустку завжди треба вчасно запитувати, але роботодавець не обов'язково мусить її надати. Коли можна брати відпустку, вирішує начальник. З нагальних виробничих причин заяву на відпустку можуть і відхилити.", "Schau doch mal in deinen Arbeitsvertrag, da ist das sicher geregelt. Soviel ich wie, gibt es keine gesetzlichen Einschränkungen für angestellte Arbeitnehmer. Allerdings darfst du keine sieben Tage am Stück arbeiten. Der Samstag gilt in Deutschland als normalen Wochentag.": "Подивися в трудовий договір, там це напевно врегульовано. Наскільки я знаю, для найманих працівників законодавчих обмежень немає. Однак тобі не можна працювати сім днів поспіль. Субота в Німеччині вважається звичайним днем тижня.", "Ich arbeite auch im Einzelhandel und bei uns ist es so geregelt, dass man einen festen Wochentag freibekommt, wenn man immer samstags arbeitet. Das kommt mir entgegen. So kann ich entspannt unter der Woche einkaufen oder ins Schwimmbad gehen.": "Я теж працюю в роздрібній торгівлі, і в нас заведено так, що якщо завжди працюєш по суботах, отримуєш фіксований вихідний день серед тижня. Мене це влаштовує. Так я можу спокійно ходити за покупками чи в басейн у будні.", "Das kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines Urlaubsantrags nicht aus. Wenn du deinen Urlaub tatsächlich nicht antrittst, muss der Arbeitgeber alle Kosten tragen, die dir durch die Urlaubsverschiebung entstehen.": "Твій начальник не може просто так це зробити. Брак персоналу — недостатня підстава для відкликання затвердженої відпустки. Якщо ти справді не підеш у відпустку, роботодавець має покрити всі витрати, що виникли в тебе через перенесення відпустки.", "Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.": "Сьогодні дорогою на роботу зі мною стався нещасний випадок. Я ще зробила гак через дитсадок, спіткнулася і зламала щиколотку. Чи я тепер застрахована? Я ж не пішла прямою дорогою на роботу.", "Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich seinen Mitarbeiter Parkplatz stellen?": "Я отримала письмове попередження, бо регулярно запізнююся на роботу. Я завжди вчасно виїжджаю з дому, а потім біля фірми не можу знайти, де припаркуватися. Хіба роботодавець, власне, не мусить надавати своїм працівникам паркомісця?", "Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit, ins Büro zu kommen, da ich kein Auto habe. Hätte ich ein Taxi nehmen müssen?": "Сьогодні вранці я хотів поїхати на роботу електричкою (S-Bahn), але її скасували через негоду. Тож я не мав змоги дістатися до офісу, бо в мене немає машини. Чи мав я взяти таксі?", "Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer ein früheren Bus zu nehmen, damit ich pünktlich bin?": "Завжди одне й те саме. Автобус запізнюється, стоїть у заторі або його скасовують. Тепер у мене проблеми з начальником, бо я часто з'являюся в офісі із запізненням. Чи я зобов'язаний завжди їздити раннішим автобусом, щоб приходити вчасно?", "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.": "Роботодавець має обов'язок піклування, і до нього належить також створення місця для транспортних засобів працівників. Але лише якщо це можливо без надто великих витрат. Якщо підприємство в центрі міста, там просто недостатньо місця для паркування.", "Wenn ein Zug seine Reise nicht fortsetzen kann und in einem Bahnhof stehen bleiben muss, bezahlt die Deutsche Bahn den Fahrgästen in bestimmten Fällen eine Weiterfahrt im Taxi. Oder sie übernimmt die Kosten für eine Hotelübernachtung. Nähere Infos findest du auf der Webseite der Deutschen Bahn.": "Якщо поїзд не може продовжити рух і мусить зупинитися на вокзалі, Deutsche Bahn у певних випадках оплачує пасажирам подальшу поїздку на таксі. Або покриває витрати на ночівлю в готелі. Докладніше — на вебсайті Deutsche Bahn.", "Thilo, vor 45 Minuten — Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.": "Тіло, 45 хвилин тому — Якщо поїзд через бурю не може їхати далі й зупиняється на вокзалі, пасажири здебільшого мають право на талон на таксі, щоб так дістатися до місця призначення. На вебсайті Deutsche Bahn можна прочитати, за яких обставин залізниця оплачує подальшу поїздку.", "Wenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden. Sachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für den Arbeitsweg benutzt.": "Якщо дорогою на роботу ти потрапив в автомобільну аварію, страхування від нещасних випадків оплачує лише шкоду здоров'ю. Матеріальна шкода сюди не входить. Але в принципі ти можеш сам вирішувати, яким транспортом їздити на роботу.", "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts für deine Verspätung kannst.": "Ти відповідаєш за те, щоб вчасно з'явитися на робоче місце. Як ти це робиш — твоя справа. Але в жодному разі не можна перекладати відповідальність на громадський транспорт і стверджувати, що ти не винен у своєму запізненні.", "Natürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes. Auf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.": "Звісно, на робочому місці ти маєш страховий захист, але він діє не в усіх частинах будівлі. У туалеті, наприклад, ти не застрахований. Чому так, я, щоправда, теж не знаю.", "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen muss, kommt darauf an, ob die Kosten dafür über deinem Arbeitslohn für einen Tag liegen. Wenn ja, sind diese Kosten für dich nicht zumutbar.": "Як працівник ти мусиш подбати про те, щоб дістатися на роботу. Але якщо це неможливо, письмового попередження тобі давати не можуть. Чи треба було брати таксі, залежить від того, чи перевищують витрати на нього твою денну зарплату. Якщо так, ці витрати для тебе неприйнятні.", "Ich habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig von zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit .Muss der Arbeitgeber nicht eigentlich seinen Mitarbeiter Parkplatz stellen?": "Я отримала письмове попередження, бо регулярно запізнююся на роботу. Я завжди вчасно виїжджаю з дому, а потім біля фірми не можу знайти, де припаркуватися. Хіба роботодавець, власне, не мусить надавати своїм працівникам паркомісця?", "Ich wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte ich keine Möglichkeit ins Büro zu kommen. Da ich kein Auto habe, hätte ich ein Taxi nehmen müssen?": "Сьогодні вранці я хотів поїхати на роботу електричкою (S-Bahn), але її скасували через негоду. Тож я не мав змоги дістатися до офісу. Оскільки в мене немає машини — чи мав я взяти таксі?", "Immer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil ich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer ein früherer Bus zu nehmen, damit ich pünktlich bin?": "Завжди одне й те саме. Автобус запізнюється, стоїть у заторі або його скасовують. Тепер у мене проблеми з начальником, бо я часто з'являюся в офісі із запізненням. Чи я зобов'язаний завжди їздити раннішим автобусом, щоб приходити вчасно?", "Heute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über der Kita gemacht, bin gestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg zur Arbeit genommen.": "Сьогодні дорогою на роботу зі мною стався нещасний випадок. Я ще зробила гак через дитсадок, спіткнулася і зламала щиколотку. Чи я тепер застрахована? Я ж не пішла прямою дорогою на роботу.", "Der Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine Unterbringungsmöglichkeit zu schaffen hat, aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein Unternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.": "Роботодавець має обов'язок піклування, і до нього належить також створення місця для транспортних засобів працівників, але лише якщо це можливо без надто великих витрат. Якщо підприємство в центрі міста, там просто недостатньо місця для паркування.", "Wenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die Fahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf der Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.": "Якщо поїзд через бурю не може їхати далі й зупиняється на вокзалі, пасажири здебільшого мають право на талон на таксі, щоб так дістатися до місця призначення. На вебсайті Deutsche Bahn можна прочитати, за яких обставин залізниця оплачує подальшу поїздку.", "Du bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache. Aber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den Standpunkt stellen, dass du nichts mit deiner Verspätung kannst.": "Ти відповідаєш за те, щоб вчасно з'явитися на робоче місце. Як ти це робиш — твоя справа. Але в жодному разі не можна перекладати відповідальність на громадський транспорт і стверджувати, що ти не винен у своєму запізненні.", "Als Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht, darfst du aber keine Abmahnung bekommen. Ob du ein Taxi nehmen muss, achte darauf an, ob die Kosten dafür über deinem Arbeitslohn fair einen Tag sind und diese Kosten für dich nicht zumutbar sind.": "Як працівник ти мусиш подбати про те, щоб дістатися на роботу. Але якщо це неможливо, письмового попередження тобі давати не можуть. Чи треба було брати таксі, залежить від того, чи перевищують витрати на нього твою денну зарплату, — тоді ці витрати для тебе неприйнятні.", "Ich muss während der Arbeit eine Uniform tragen. Mir ist es unangenehm, die schon morgens in der Bahn anzuhaben, und ich möchte mich lieber im Hotel umziehen. Muss ich dafür früher kommen oder gilt die Umkleidezeit als Arbeitszeit?": "На роботі я мушу носити уніформу. Мені неприємно вдягати її вже зранку в поїзді, і я б краще перевдягалася в готелі. Чи мушу я для цього приходити раніше, чи час на перевдягання вважається робочим?", "Gestern war ich für einen Tag bei einem Kunden in Norddeutschland. Ich bin mit dem Zug gefahren und habe während der Fahrt gelesen. Insgesamt war ich elf Stunden unterwegs und habe Überstunden geltend gemacht. Die will mein Arbeitgeber nicht anerkennen.": "Учора я на один день їздив до клієнта на півночі Німеччини. Я їхав поїздом і під час поїздки читав. Загалом я був у дорозі одинадцять годин і заявив понаднормові. Мій роботодавець не хоче їх визнавати.", "Ich war am Wochenende auf einer Fortbildung, die für meine Arbeit relevant war. Ich wollte mir jetzt einen Urlaubstag gutschreiben lassen, aber meine Chefin sagt, das sei meine private Angelegenheit, da sie die Fortbildung nicht angeordnet hat. Stimmt das?": "На вихідних я був на курсі підвищення кваліфікації, який стосувався моєї роботи. Я хотів, щоб мені зарахували день відпустки, але начальниця каже, що це моя особиста справа, бо вона цього навчання не призначала. Це правда?", "Ich fahre morgens mit dem Fahrrad in die Firma, bin immer pünktlich um 9.00 Uhr da und mache mich dann fertig. Ab sofort soll ich früher kommen und darf mich nicht mehr während der Arbeitszeit umziehen. Ist das korrekt?": "Зранку я їду на фірму велосипедом, завжди вчасно о 9:00 на місці, а потім приводжу себе до ладу. Відтепер я маю приходити раніше і вже не можу перевдягатися в робочий час. Це правильно?", "Wenn du in Sportkleidung in die Firma kommst und dich dort noch umziehst, ist das Privatsache. Du musst dafür sorgen, dass du pünktlich mit deiner Arbeit beginnen kannst. In diesem Fall ist die Umkleidezeit keine Arbeitszeit.": "Якщо ти приходиш на фірму в спортивному одязі і ще там перевдягаєшся, це твоя особиста справа. Ти мусиш подбати про те, щоб почати роботу вчасно. У цьому разі час на перевдягання — не робочий час.", "Der Weg zur Arbeit ist private Zeit. Du trägst die Verantwortung dafür, pünktlich vor Ort zu sein, egal wie weit dein Weg ist. Wenn du z.B. im Stau stehst oder die- S-Bahn streikt und du deshalb zu spät kommst, musst du die Zeit nacharbeiten.": "Дорога на роботу — це особистий час. Ти відповідаєш за те, щоб бути на місці вчасно, незалежно від того, наскільки далека дорога. Якщо ти, наприклад, стоїш у заторі або електричка страйкує і через це запізнюєшся, цей час треба відпрацювати.", "Arbeitnehmer/innen haben in der Regel alle zwei Jahre Anspruch auf fünf Tage Bildungsurlaub. Die Gesetze sind aber nicht in jedem Bundesland gleich. So variiert zum Beispiel die Anzahl der Tage für Bildungsurlaub je nachdem, ob du Voll- oder Teilzeit tätig bist.": "Працівниці й працівники, як правило, раз на два роки мають право на п'ять днів освітньої відпустки. Але закони не в кожній федеральній землі однакові. Так, наприклад, кількість днів освітньої відпустки залежить від того, працюєш ти повний чи неповний день.", "Ich finde das Tragen von Dienstkleidung absolut veraltet. Warum müssen alle im Unternehmen gleich gekleidet sein? Jeder Mensch hat doch seinen eigenen Stil, mit dem er sich wohlfühlt. Ich kann verstehen, dass du die Uniform nicht auch noch im Zug tragen möchtest.": "Як на мене, носіння службового одягу — це абсолютний пережиток. Чому всі на підприємстві мають бути вдягнені однаково? Кожна людина ж має свій стиль, у якому почувається комфортно. Я розумію, що ти не хочеш носити уніформу ще й у поїзді.", "Wenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst, ist das reines Privatvergnügen. Schickt dein Chef dich allerdings seinerseits auf ein Seminar , handelt es sich um Arbeitszeit.": "Якщо ти сам вирішуєш піти на курс і не погоджуєш цього заздалегідь із роботодавцем, це суто твоя особиста справа. Але якщо начальник сам відправляє тебе на семінар, це робочий час.", "Das ist ein schwieriges Thema. Wenn du während der Reise zum Beispiel deinen Termin vorbereitest oder mit dem Laptop ein Protokoll schreibst, ist das Arbeitszeit. Wenn du dich aber mit privaten Dingen wie einem Roman oder einem privaten Telefonat beschäftigst, gilt das als Freizeit.": "Це складна тема. Якщо під час поїздки ти, наприклад, готуєшся до зустрічі або пишеш на ноутбуці протокол, це робочий час. Але якщо займаєшся особистими справами, як-от читаєш роман чи ведеш особисту телефонну розмову, це вважається вільним часом.", "Wir hatten neulich im Büro eine Diskussion darüber, ab wann man in Rente gehen kann. Ich dachte immer, man muss bis 67 arbeiten. Aber meine Kollegin meinte, dass sie zwei Jahre früher in Rente gehen wird. Geht das überhaupt?": "Нещодавно в офісі ми обговорювали, з якого віку можна вийти на пенсію. Я завжди думав, що працювати треба до 67. Але моя колега сказала, що вийде на пенсію на два роки раніше. Хіба це взагалі можливо?", "Meine Rente wird ja nicht so berauschend sein, vor allem, weil ich wegen meiner zwei Kinder einige Jahre nicht oder nur Teilzeit gearbeitet habe. Es ist ja wohl schon so, dass ich dafür jetzt irgendwie bestraft werde, oder?": "Моя пенсія буде не дуже вражаюча, особливо тому, що через двох дітей я кілька років не працювала або працювала лише неповний день. Виходить, що мене тепер за це якось карають, чи не так?", "Mein Mann geht in zwei Jahren in Rente. Ich müsste noch vier Jahre arbeiten. Wir haben uns überlegt, dass wir zusammen in Rente gehen und noch viele gemeinsame Jahre mit verschiedenen Aktivitäten erleben wollen. Welche Folgen hätte das?": "Мій чоловік виходить на пенсію через два роки. Мені треба було б працювати ще чотири роки. Ми вирішили, що підемо на пенсію разом і хочемо прожити ще багато спільних років, займаючись різними справами. Які це матиме наслідки?", "Ich bin ja noch jung und denke überhaupt noch nicht an die Rente. Aber es wird ja immer wieder gesagt, dass die normale Rente irgendwann nicht mehr ausreichen wird. Was kann ich denn jetzt schon für später tun?": "Я ще молодий і взагалі не думаю про пенсію. Але ж постійно кажуть, що звичайної пенсії колись перестане вистачати. Що я можу вже зараз зробити на майбутнє?", "Kaum jemandem gelingt es, 45 Jahre durchgehend so ein hohes Gehalt zu verdienen, dass er später die Höchstrente bekommt Das liegt schon allein daran, dass man während der Ausbildung und in den ersten Berufsjahren weniger verdient.": "Мало кому вдається 45 років поспіль отримувати таку високу зарплату, щоб потім мати максимальну пенсію. Уже хоча б тому, що під час навчання і в перші роки роботи заробляєш менше.", "Auch Firmen helfen, für die Zukunft vorzusorgen, denn man kann gar nicht früh genug damit anfangen. Erkundige dich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner ist, bekommt man eine zusätzliche Rente.": "Фірми теж допомагають подбати про майбутнє, адже почати ніколи не рано. Дізнайся в роботодавця, чи пропонує він корпоративне пенсійне забезпечення. Коли згодом виходиш на пенсію, отримуєш додаткову пенсію.", "Wenn man mindestens fünf Jahre versicherungspflichtig beschäftigt war, hat man Anspruch auf die gesetzliche Rente. Dabei spielt es keine Rolle, ob man Teiltzeit oder Vollzeit gearbeitet hat. Es gibt aber noch Unterschiede zwischen Ost und West.": "Якщо ти щонайменше п'ять років працював з обов'язковим страхуванням, маєш право на державну пенсію. При цьому не має значення, працював ти неповний чи повний день. Але між Сходом і Заходом ще є відмінності.", "Man hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im Moment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger. Man muss sich das genau ausrechnen, ob man sich das leisten kann.": "Ти маєш право вийти на пенсію раніше 67 років, але доведеться змиритися з утриманнями. Зараз це 0,3 відсотка менше за кожен місяць, який ти не допрацював. Треба точно порахувати, чи можеш ти собі це дозволити.", "Für alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45 Beitragsjahre nachweisen kann, also Jahre, in denen man in die Rentenversicherung eingezahlt hat.": "Для всіх, хто народився після 1964 року, діє правило: працювати треба до 67 років. Хіба що в 65 років уже можна підтвердити 45 років стажу внесків, тобто років, коли сплачував внески до пенсійного страхування.", "und Krankheit kann man sich immer noch Gedanken machen. Wer weiß, ob es später, wenn wir so weit sind, überhaupt noch eine Rente geben wird.": "і хвороби ще встигнеш подумати. Хто знає, чи пізніше, коли ми до цього дійдемо, взагалі ще буде пенсія.", "Wir werden Eltern und wollen beide die bezahlte Elternzeit nehmen. Eine Freundin meinte, dass wir insgesamt ein Jahr zu Hause bleiben können. Ein anderer Bekannter sagte, man könne sein Kind bis zu drei Jahre zu Hause betreuen. Was stimmt?": "Ми станемо батьками й обоє хочемо взяти оплачувану батьківську відпустку. Одна подруга сказала, що разом ми можемо залишатися вдома рік. Інший знайомий сказав, що доглядати дитину вдома можна до трьох років. Що з цього правда?", "Ich bin im vierten Monat schwanger. Mein Chef will, dass ich notfalls auch mal eine Spätschicht übernehme. Die geht bis 21:00 Uhr. Soviel ich weiß, ist das gar nicht erlaubt, oder? Außerdem bin ich abends immer sehr müde.": "Я на четвертому місяці вагітності. Мій начальник хоче, щоб я в разі потреби інколи брала вечірню зміну. Вона триває до 21:00. Наскільки я знаю, це взагалі не дозволено, правда? До того ж увечері я завжди дуже втомлена.", "Wir sind Auszubildende und bekommen bald ein Kind. Erst nach der Ausbildung wollen wir in Elternzeit gehen. Bis dahin könnte die Oma auf unser Kind aufpassen. Unser Betrieb wäre einverstanden. Weiß jemand, ob man die Elternzeit später beginnen darf?": "Ми навчаємося професії, і в нас скоро буде дитина. Ми хочемо піти в батьківську відпустку лише після закінчення навчання. До того часу з дитиною могла б посидіти бабуся. Наше підприємство було б не проти. Хтось знає, чи можна почати батьківську відпустку пізніше?", "Nach der Geburt bekomme ich Elterngeld. Finanziell mache ich mir keine Sorgen. Aber ich will beruflich den Anschluss nicht verlieren. Nur mit dem Kind zu Hause zu bleiben, ist nicht mein Ding. Kann man Elterngeld bekommen und gleichzeitig arbeiten?": "Після народження дитини я отримуватиму батьківську допомогу. Щодо фінансів я не хвилююся. Але я не хочу відстати в професії. Просто сидіти вдома з дитиною — не моє. Чи можна отримувати батьківську допомогу і водночас працювати?", "Warte erst einmal ab, wie sich alles mit dem Kind entwickelt. Ich würde die Zeit nach der Geburt nicht mit Arbeit verplanen. Es ist nämlich eine große Umstellung. Wenn du dann später „Langeweile“ haben solltest, kannst du immer noch überlegen, arbeiten zu gehen.": "Спершу почекай, як усе складеться з дитиною. Я б не планувала роботу на час після пологів. Це ж велика зміна в житті. Якщо згодом тобі стане «нудно», ти завжди зможеш подумати про те, щоб піти працювати.", "Beides ist nicht ganz falsch - nach der Geburt des Kindes hat man bis zu drei Jahre Anspruch auf Freistellung von der Arbeit. 14 Monate erhält das Paar Elterngeld. Sowohl die bezahlte als auch die nicht bezahlte Zeit der Betreuung können die Eltern frei untereinander aufteilen.": "Обидва твердження не зовсім хибні: після народження дитини можна мати право на звільнення від роботи до трьох років. Батьківську допомогу пара отримує 14 місяців. І оплачуваний, і неоплачуваний час догляду батьки можуть вільно розподіляти між собою.", "Elterngeld erhält man von der Elterngeldstelle. Die Höhe hängt davon ab, wie viel man vorher verdient hat. Vater und Mutter können die bezahlte Elternzeit von 14 Monaten untereinander aufteilen, wie es ihnen am besten passt. Allerdings ist die Frau die ersten acht Wochen im Mutterschutz.": "Батьківську допомогу виплачує відповідна служба (Elterngeldstelle). Її розмір залежить від того, скільки людина заробляла раніше. Батько й мати можуть розподілити 14 місяців оплачуваної батьківської відпустки між собою так, як їм найзручніше. Однак перші вісім тижнів жінка перебуває в декретній відпустці (Mutterschutz).", "Wenn du schon länger als sechs Monate bei einer Firma beschäftigt bist, kannst du beantragen, auch während der Elternzeit ein bisschen zu arbeiten. Du darfst dann allerdings nicht mehr als 30 Stunden pro Woche tätig sein. Der Betrieb kann den Antrag aber auch ablehnen.": "Якщо ти вже понад шість місяців працюєш на фірмі, можеш подати заяву, щоб трохи працювати й під час батьківської відпустки. Але тоді ти можеш працювати не більше 30 годин на тиждень. Однак підприємство може й відхилити заяву.", "acht Wochen nach der Geburt. Im Anschluss folgt die Elternzeit. Aber dafür gibt es wieder andere Regelungen.": "вісім тижнів після пологів. Після цього настає батьківська відпустка. Але для неї діють інші правила.", "22 Uhr beschäftigen. Zwischen 20 und 22 Uhr kann man als Schwangere nur auf eigenen Wunsch arbeiten, der Arbeitgeber darf das nicht anordnen. Insgesamt darf eine Schwangere aber eine tägliche Arbeitszeit von 8,5 Stunden nicht überschreiten.": "22:00. З 20 до 22 години вагітна може працювати лише за власним бажанням, роботодавець не може цього наказати. Загалом вагітна не може працювати понад 8,5 години на день.", "Protokoll 20.06.20XX, 10.00-12.00": "Протокол 20.06.20XX, 10:00–12:00", "Besprechungsraum: 032, Ort: Konrad-Adenauer-Straße 43, 30159 Hannover": "Кімната для нарад: 032, місце: Konrad-Adenauer-Straße 43, 30159 Hannover", "Teilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf), Peter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquardt (SM, Leitung Personal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing), Jutta Raulin (JR, Leitung Qualitätssicherung), Joachim Meyer (JM, Leitung IT)": "Учасники: Вероніка Еммеріх (VE, заступниця керівництва), Маріта Гінце (MH, керівниця закупівель), Петер Реннер (PR, керівник виробництва), Томас Гаген (TH, керівник фінансів), Сибілле Марквардт (SM, керівниця кадрів), Крістіан Вернер (CW, керівник збуту), Джесіка Фро (JF, керівниця маркетингу), Ютта Раулін (JR, керівниця забезпечення якості), Йоахім Маєр (JM, керівник ІТ)", "Sitzungsleitung: Veronika Emmerich": "Головує: Вероніка Еммеріх", "Protokollantin: Sibylle Marquardt": "Протокол веде: Сибілле Марквардт", "Nicht Anwesende: Martin Stahl (MS, Geschäftsleitung)": "Відсутні: Мартін Шталь (MS, керівництво)", "Tagesordnungspunkte:": "Порядок денний:", "1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE": "1. Привітання і затвердження порядку денного — VE", "2. Probleme mit einem Zulieferer - MΗ": "2. Проблеми з постачальником — MH", "3. Zwischenstand Qualitätssicherung - JR": "3. Проміжні результати забезпечення якості — JR", "4. Neue Überstundenregelung - VE": "4. Нові правила щодо понаднормових — VE", "5. Private Nutzung der Dienstwagen - SM": "5. Приватне користування службовими автомобілями — SM", "6. Sonstiges": "6. Різне", "TOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte": "Пункт 1. Привітання і затвердження порядку денного", "VE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die Genehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen. Als nächster Besprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.": "VE вітає всіх присутніх, усіх керівниць і керівників відділів на сьогоднішній нараді й просить затвердити порядок денний. Його одноголосно ухвалюють підняттям рук. Дату наступної наради одноголосно призначено на 24.09.20XX, після періоду відпусток.", "TOP 2 Probleme mit einem Zulieferer": "Пункт 2. Проблеми з постачальником", "MH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte ohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies aufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde entsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung. Wir behalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür zuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über gute Erfahrungen in dieser Region. Ziel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers zurückzutreten. Gerichtliche Schritte werden dann nicht unternommen. Bis zum 20. des kommenden Monats ist darüber zu berichten.": "MH повідомляє, що наш південноамериканський постачальник Dos Caminos Exports Ltd. без жодного погодження підвищив ціни на свої напівфабрикати й виставив нам рахунок. На запит нам повідомили, що причиною стало різке зростання транспортних витрат. Ми цього не приймаємо, про що відповідно повідомили постачальника. Після інтенсивного листування дійшли згоди. Ми залишаємо за собою право до 31-го числа наступного місяця знайти вигіднішого для нас постачальника. Відповідальні за це — MH і TH. Нових партнерів з постачання можна шукати в азійському регіоні. MH розповідає про добрий досвід у цьому регіоні. Мета — розірвати договір із постачальником без подальших взаємних претензій. Тоді судових кроків не вживатимуть. Звітувати про це треба до 20-го числа наступного місяця.", "TOP 3 Zwischenstand Qualitätssicherung": "Пункт 3. Проміжні результати забезпечення якості", "Die Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der Endproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer Abweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet JR. Die Zahl der Reklamationen ist signifikant zurückgegangen.": "Відділ забезпечення якості розробив нову концепцію перевірки якості на етапі кінцевого виробництва. Концепція, впроваджена два квартали тому, під час вимірювання якості видає повідомлення про помилку вже при відхиленні на 30 відсотків. Як повідомляє JR, це вже три місяці дає вимірний успіх. Кількість рекламацій значно зменшилася.", "TOP 4 Neue Überstundenregelung": "Пункт 4. Нові правила щодо понаднормових", "VE dankt allen Mitarbeitern für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten hoher Auftragseingänge lässt sich das leider nicht immer vermeiden. Bisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20. Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.": "VE дякує всім працівникам за те, що більшість готова працювати понаднормово. Особливо в періоди великої кількості замовлень цього, на жаль, не завжди можна уникнути. Досі працівники могли компенсувати ці понаднормові вільним часом або отримати за них виплату. Через несподівано великий нині обсяг замовлень з цього моменту встановлено, що до 20 понаднормових годин на квартал можуть лише оплачуватися, бо надати вільний час зараз неможливо з кадрових причин. Якщо надходження замовлень зменшиться, цей захід згодом можна буде скасувати. Цей порядок затверджено виробничою радою протоколом від 15.06.20XX.", "TOP 5 Private Nutzung der Dienstwagen": "Пункт 5. Приватне користування службовими автомобілями", "SM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr nur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann unbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in der Finanzabteilung einzureichen.": "SM повідомляє, що всі працівники, які мають службовий автомобіль, з наступного місяця можуть користуватися ним не лише в службових, а й в особистих цілях. Але звертається увага, що тоді обов'язково треба вести журнал поїздок, у якому вказано кілометри, проїхані в особистих цілях. Його треба щомісяця подавати до фінансового відділу.", "TOP 6 Sonstiges": "Пункт 6. Різне", "TH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen geselligen Bowlingabend in der Anlage „Sport und Spaß“, Marienstraße 10-12 verbringen. Dazu laden sie alle interessierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information ins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.": "TH представляє ідею своїх працівниць і працівників: вони хочуть через два тижні в суботу провести товариський вечір боулінгу в комплексі «Sport und Spaß», Marienstraße 10–12. На нього вони запрошують усіх зацікавлених колег з інших відділів. Відділ кадрів розмістить цю інформацію в інтранеті. Хто зацікавлений, має зареєструватися там до п'ятниці наступного тижня.", "Der Termin der nächsten Sitzung": "Дата наступного засідання", "findet nach Abstimmung im Herbst statt.": "за результатами голосування — восени.", "muss verlegt werden.": "доведеться перенести.", "wird noch bekannt gegeben.": "буде повідомлена пізніше.", "Die Firma": "Фірма", "hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert.": "без заперечень прийняла під
