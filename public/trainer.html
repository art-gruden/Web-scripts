her konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund eines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bis zu 20. Überstunden pro Quartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen momentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren Zeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.": "Досі працівники могли компенсувати ці понаднормові вільним часом або отримати за них виплату. Через несподівано великий нині обсяг замовлень з цього моменту встановлено, що до 20 понаднормових годин на квартал можуть лише оплачуватися, бо надати вільний час зараз неможливо з кадрових причин. Якщо надходження замовлень зменшиться, цей захід згодом можна буде скасувати. Цей порядок затверджено виробничою радою протоколом від 15.06.20XX.", "muss noch entschieden werden.": "ще треба визначити.", "wird nach der Urlaubszeit abgestimmt.": "погодять після періоду відпусток.", "wurde während der Sitzung gesprochen.": "обговорили під час засідання.", "Protokoll 14.02.20XX, 08:00-11:45 Uhr": "Протокол 14.02.20XX, 08:00–11:45", "Abteilung 4, Besprechungszimmer 2": "Відділ 4, кімната для нарад 2", "Teilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke": "Учасники: Гольгер Маршке (HM, керівник команди), Корнелія Маркерт (CM, відділ маркетингу), Сузанне Вільке", "(SW, Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)": "(SW, відділ маркетингу), Монік Рюдігер (MR, член виробничої ради)", "Entschuldigt: Martin Hamann (MH, Qualitätssicherung) Protokollantin: Marianne Schiller (MS)": "Відсутній з поважної причини: Мартін Гаман (MH, забезпечення якості). Протокол веде: Маріанне Шиллер (MS)", "Sitzungsleitung: Andreas Mertens (AM)": "Головує: Андреас Мертенс (AM)", "1. Begrüßung und Genehmigung des letzten Protokolls": "1. Привітання і затвердження останнього протоколу", "2. Neue Marketingmaßnahmen": "2. Нові маркетингові заходи", "3. Qualitätsmanagement": "3. Управління якістю", "4. Anpassung der Pausenzeiten": "4. Зміна часу перерв", "5. Standorte der neuen Fahrradständer": "5. Місця для нових велопарковок", "TOP 1 Begrüßung und Genehmigung des letzten Protokolls": "Пункт 1. Привітання і затвердження останнього протоколу", "AM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am 10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag von MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann, wird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.": "AM вітає всіх учасників і відкриває сьогоднішнє засідання. Протокол останньої наради від 10.01.20XX одноголосно затверджено підняттям рук без змін і доповнень. На прохання MR, яка через інші зобов'язання не може бути на нараді до кінця, змінено черговість порядку денного: пункти 4 і 5 розглядають раніше, сьогодні вранці.", "TOP 2 Neue Marketingmaßnahmen": "Пункт 2. Нові маркетингові заходи", "CM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten zu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere Möglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden, Es ist geplant, neue Wege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen steht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte Werbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu professionellen Fotografen und Textern herstellen und Angebote anfordern.": "CM і SW повідомляють, що традиційні маркетингові заходи, як-от телереклама в прайм-тайм, надто дорогі. Тому слід активніше використовувати соцмережі, як-от Facebook, Instagram тощо. Інші можливості реклами відділ маркетингу ще має обговорити. Планується йти новими шляхами й на додачу до місцевих магазинів запустити інтернет-магазин. На всі ці заходи загалом виділено бюджет 150 000 €. CM доручено знайти для цього спеціалізовану рекламну агенцію і отримати від неї кошторис; SW має налагодити контакти з професійними фотографами й копірайтерами та запросити пропозиції.", "Ergebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere Vorgehen wird definiert, wenn alle nötigen Informationen vorliegen.": "Результати обох пошуків представлять на наступній нараді 10.03.20XX. Подальші дії визначать, коли буде вся необхідна інформація.", "TOP 3 Qualitätsmanagement": "Пункт 3. Управління якістю", "Zu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen Sitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in Form eines Konzeptpapiers zukommen lassen. Da MH an der heutigen Sitzung aus gesundheitlichen Gründen nicht teilnehmen kann, ist gemeinsam beschlossen worden, die Diskussion zu diesem Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit ist die Umsetzung der geplanten Veränderungen auf das nächste Quartal verschoben.": "Щодо заходів, запропонованих на нараді 11.01.20XX, MH заздалегідь надіслав усім учасникам засідання перші результати робочої групи «Оптимізація внутрішніх комунікаційних структур» у вигляді концептуального документа. Оскільки MH через стан здоров'я не може бути на сьогоднішньому засіданні, спільно вирішено перенести обговорення цього пункту на наступну нараду 10.03.20XX. Тим самим впровадження запланованих змін переноситься на наступний квартал.", "TOP 4 Anpassung der Pausenzeiten": "Пункт 4. Зміна часу перерв", "Aufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen gemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und 13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen Notwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag wird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die Änderung der Pausenzeiten zu verfassen.": "Через неодноразові запити керівників відділів MR пропонує зробити час, коли можна брати перерви, гнучкішим. Вона пропонує розширене часове вікно з 11:30 до 13:00, у межах якого можна взяти 30-хвилинну обідню перерву. Так можна краще врахувати виробничі потреби та робочі процеси різних відділів. Цю пропозицію ухвалено одноголосно; MR доручено скласти відповідне повідомлення для колективу про зміну часу перерв.", "TOP 5 Standorte der neuen Fahrradständer": "Пункт 5. Місця для нових велопарковок", "MR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden. Dabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3 installiert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr Fahrrad abzustellen.": "MR повідомляє, що на прохання колективу на території встановлять ще дві велопарковки. При цьому обрано два місця: першу велопарковку встановлять біля воріт 2, другу — біля воріт 3. Так тепер біля кожного входу на територію працівники матимуть змогу залишити велосипед.", "Dementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR formuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats aushängen.": "Відповідно буде оновлено план території й нанесено нові місця велопарковок. MR складе про це повідомлення, поширить його всередині підприємства і вивісить на дошці оголошень виробничої ради.", "Die Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende Elternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt sein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für Mutter und Kind im Namen der Kolleginnen und Kollegen kümmern.": "Асистентка керівництва, пані Шлоссер, іде в декретну відпустку, а потім у батьківську. До її повернення з цього моменту контактною особою для всіх буде пані Маєр в офісі пані Шмідт. Пані Маєр організує прощальну вечірку на 16.03.20XX і подбає про невеликі подарунки для матері й дитини від імені колег.", "Für neue Werbemaßnahmen": "На нові рекламні заходи", "werden kreative Mitarbeiter gesucht.": "шукають креативних працівників.", "wird ein Gesamtbetrag von 150.000 € bereitgestellt.": "виділяють загальну суму 150 000 €.", "wurden Kostenvoranschläge angefragt.": "запросили кошториси.", "Herr Hamann": "Пан Гаман", "hat bereits ein Konzept vorbereitet.": "уже підготував концепцію.", "ist dienstlich verhindert.": "не може бути через службові справи.", "stellt die Resultate seiner Arbeit vor.": "представляє результати своєї роботи.", "Die Mittagspause": "Обідня перерва", "ist 30 Minuten lang.": "триває 30 хвилин.", "wird um 30 Minuten verlängert.": "подовжується на 30 хвилин.", "wird um 30 Minuten verschoben.": "зсувається на 30 хвилин.", "Der Standort der neuen Fahrradständer": "Місце для нових велопарковок", "wird an der Informationstafel bekanntgegeben.": "оголосять на інформаційній дошці.", "wird dem Betriebsrat mitgeteilt.": "повідомлять виробничій раді.", "wird zwischen Tor 2 und 3 geplant.": "планують між воротами 2 і 3.", "Frau Schlosser": "Пані Шлоссер", "macht Frau Schmidt ein Geschenk.": "робить пані Шмідт подарунок.", "verlässt das Unternehmen.": "залишає підприємство.", "wird von Frau Meier vertreten.": "заміщатиме пані Маєр.", "MH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität zugeschickt, die er mit seiner Arbeitsgruppe erstellt hat. Da MH heute wegen Krankheit nicht an dem Meeting teilnehmen kann, wird beschlossen, diesen Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit verschiebt sich auch die Umsetzung Maßnahmen zur Qualitätssicherung. MH hat aber zugesagt, bis Anfang März noch weitere Idee erarbeiten und zu kommunizieren.": "Ще до сьогоднішнього засідання MH надіслав усім присутнім перші пропозиції щодо покращення якості продукції, які він підготував зі своєю робочою групою. Оскільки MH сьогодні через хворобу не може бути на нараді, вирішено перенести цей пункт на наступну нараду 10.03.20XX. Тим самим переноситься і впровадження заходів із забезпечення якості. Але MH пообіцяв до початку березня напрацювати й повідомити ще інші ідеї.", "Die neuen Werbemaßnahmen": "Нові рекламні заходи", "dürfen bis zu 150.000 Euro kosten.": "можуть коштувати до 150 000 євро.", "sollen Online-Medien ausschließen.": "мають виключати онлайн-медіа.", "werden bis zur nächsten Teamsitzung umgesetzt.": "будуть впроваджені до наступного засідання команди.", "hat erste Arbeitsergebnisse versendet.": "надіслав перші результати роботи.", "realisiert bis Marz die Maßnahmen zur Qualitätssicherung.": "до березня впровадить заходи із забезпечення якості.", "Protokoll 19.11.20XX, 08.00-11.45 Uhr": "Протокол 19.11.20XX, 08:00–11:45", "Zentrale, Raum 405 Sitzungsleitung: Lukas Wallner (LW)": "Головний офіс, кімната 405. Головує: Лукас Валльнер (LW)", "Teilnehmende: Jessica Müller (JM, Personalabteilung), Maximilian Berger (MB, Marketingabteilung), Rebecca Lehmann (RL, Öffentlichkeitsarbeit), Kurt Meichsner (KM, Verkauf)": "Учасники: Джесіка Мюллер (JM, відділ кадрів), Максиміліан Бергер (MB, відділ маркетингу), Ребекка Леман (RL, зв'язки з громадськістю), Курт Майхснер (KM, продажі)", "Extern: Ansgar Wolf (AW, Hausverwaltung)": "Зовнішній учасник: Ансгар Вольф (AW, управління будівлею)", "Protokollantin: Beate Richter (BR)": "Протокол веде: Беате Ріхтер (BR)", "2. Personal": "2. Персонал", "3. Kundenbindung, Rabattaktion": "3. Утримання клієнтів, знижкова акція", "4. Vorbereitungen der Messe": "4. Підготовка до ярмарку", "5. Neujahrsfeier": "5. Новорічне свято", "LW begrüßt alle Teilnehmer und eröffnet die heutige Besprechung. Herr Dr. Baumann aus der Qualitätssicherung lässt sich entschuldigen, da er in dieser Woche auf einer Dienstreise ist. Das Protokoll des Meetings vom 14. November wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.": "LW вітає всіх учасників і відкриває сьогоднішню нараду. Д-р Бауман із забезпечення якості просить вибачити його відсутність, бо цього тижня він у відрядженні. Протокол наради від 14 листопада одноголосно затверджено підняттям рук без змін і доповнень.", "TOP 2 Personal": "Пункт 2. Персонал", "Die Kundenbetreuung ist aktuell unterbesetzt, weil viele Kollegen krank sind. Auch in der Personalabteilung herrscht ein hoher Krankenstand. Krankmeldungen aus allen Abteilungen sollen deshalb vorübergehend direkt an JM gesendet werden.": "Служба підтримки клієнтів зараз недоукомплектована, бо багато колег хворіють. І у відділі кадрів високий рівень захворюваності. Тому лікарняні з усіх відділів тимчасово слід надсилати безпосередньо JM.", "Urlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden. Aufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden machen, die möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten. Sollte dies aufgrund des hohen Arbeitspensums nicht möglich sein, können die Überstunden auch in das nächste Jahr übertragen werden.": "Заяви на відпустку зараз можуть затверджувати лише в разі нагальних особистих справ. Через високий рівень захворюваності деяким колегам останніми місяцями довелося відпрацювати особливо багато понаднормових, які бажано скоротити до кінця календарного року. Якщо через велике робоче навантаження це неможливо, понаднормові можна перенести й на наступний рік.", "Herr Wortmann aus dem Verkauf geht am 1. Februar des nächsten Jahres in den Ruhestand. Sein Nachfolger wird KM, den Herr Wortmann ab sofort einarbeitet. Im Rahmen der Neujahrsfeier wird unser langjähriger Mitarbeiter verabschiedet. Wir möchten ihm zum Abschied eine Freude machen. Ideen hierzu bitte an JM , die anschließend das Geld einsammeln und das Geschenk besorgen wird.": "Пан Вортман із продажів 1 лютого наступного року виходить на пенсію. Його наступником стане KM, якого пан Вортман із цього моменту вводить у курс справ. На новорічному святі ми попрощаємося з нашим багаторічним працівником. Ми хочемо на прощання його порадувати. Ідеї щодо цього, будь ласка, надсилайте JM, яка потім збере гроші й купить подарунок.", "Zum 1. Dezember beginnen drei neue Mitarbeiter in der Produktion, da die Verkaufszahlen stark gestiegen sind.": "З 1 грудня у виробництві починають працювати троє нових працівників, бо продажі значно зросли.", "TOP 3 Kundenbindung, Rabattaktion": "Пункт 3. Утримання клієнтів, знижкова акція", "KM hat erfahren, dass der Wettbewerber Lutz GmbH für das Frühjahr eine Rabattaktion plant. RL schlägt vor, ebenfalls eine Kampagne zur Kundenbindung zu entwickeln. KM hat hierfür bereits einen ersten Entwurf für ein Konzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren. Wer Interesse hat, an diesem Brainstorming teilzunehmen, soll sich bis zum Ende der Woche bei KM melden.": "KM дізнався, що конкурент Lutz GmbH планує на весну знижкову акцію. RL пропонує теж розробити кампанію з утримання клієнтів. KM уже підготував для цього перший проєкт концепції й представляє його. Він пропонує обговорити концепцію у вужчому колі. Хто хоче взяти участь у цьому брейнстормі, має до кінця тижня повідомити KM.", "TOP 4 Vorbereitungen der Messe": "Пункт 4. Підготовка до ярмарку", "Im nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen, die vom 20.-": "Наступного року наша фірма вперше візьме участь у весняному ярмарку в Дрездені, який відбудеться з 20", "24. April stattfindet. MB aus der Marketingabteilung berichtet, dass bereits der Standplatz gebucht und der Messebauer beauftragt ist. Interessierte können sich die Standgestaltung im Büro von MB ansehen. Auch die Broschüren zu unserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden. Abschließend bittet MB JM, externes Standpersonal und Hotelzimmer für die Mitarbeiter zu buchen, die auf die Messe gehen.": "по 24 квітня. MB з відділу маркетингу повідомляє, що місце для стенда вже заброньоване, а забудовнику стендів доручено роботу. Охочі можуть подивитися дизайн стенда в офісі MB. Брошури про нашу участь у ярмарку теж уже друкуються, і їх можна буде розіслати клієнтам на 2-му календарному тижні. Наприкінці MB просить JM забронювати зовнішній персонал для стенда та готельні номери для працівників, які їдуть на ярмарок.", "TOP 5 Neujahrsfeier": "Пункт 5. Новорічне свято", "JM berichtet, dass am 7. Januar die Neujahrsfeier im Restaurant „Zum Schwan\" stattfindet. Die Einladungen und Menüvorschläge werden verschickt. Alle Mitarbeiter sollen bis zum 15. Dezember Bescheid sagen, mit wie vielen Personen sie teilnehmen und was sie essen möchten. Die Geschäftsführung hat auch eine kleine Überraschung für die Mitarbeiter an diesem Abend geplant.": "JM повідомляє, що 7 січня новорічне свято відбудеться в ресторані «Zum Schwan». Запрошення і пропозиції меню розсилаються. Усі працівники мають до 15 грудня повідомити, зі скількома особами прийдуть і що хочуть їсти. Керівництво також запланувало на цей вечір невеликий сюрприз для працівників.", "AW informiert über Renovierungsarbeiten im ersten Stock, die für die nächste Woche geplant sind. Die Firma Buntschuh wird die Wände in der Teeküche Montag und Dienstag nächster Woche streichen. Da die Küche dafür komplett ausgeräumt werden muss, werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände wie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen. Ansonsten werden diese durch AW entsorgt.": "AW інформує про ремонтні роботи на другому поверсі, заплановані на наступний тиждень. Фірма Buntschuh у понеділок і вівторок наступного тижня фарбуватиме стіни на кухні для персоналу. Оскільки для цього кухню треба повністю звільнити, працівників просять скористатися нагодою й до четверга забрати особисті речі, наприклад власні чашки, ланчбокси тощо. Інакше AW їх утилізує.", "Bei der Sitzung wird": "На засіданні", "das Protokoll der letzten Besprechung geändert.": "змінюють протокол останньої наради.", "die Tagesordnung genehmigt.": "затверджують порядок денний.", "über Personalthemen gesprochen.": "говорять про кадрові питання.", "Aufgrund des hohen Krankenstands": "Через високий рівень захворюваності", "bleibt die Arbeit teilweise unerledigt.": "частина роботи залишається невиконаною.", "müssen die Überstunden im kommenden Jahr abgebaut werden. / müssen die Überstunden ins kommende Jahr mitgenommen werden.": "понаднормові доведеться скорочувати наступного року. / понаднормові доведеться перенести на наступний рік.", "gibt es eine Urlaubssperre.": "діє заборона на відпустки.", "KM": "KM", "ist Wettbewerber der Firma.": "— конкурент фірми.", "möchte sein Konzept besprechen.": "хоче обговорити свою концепцію.", "plant eine Rabattaktion im Frühling.": "планує знижкову акцію навесні.", "besucht die Frühjahrsmesse regelmäßig.": "регулярно бере участь у весняному ярмарку.", "braucht Hilfe bei der Standgestaltung.": "потребує допомоги з дизайном стенда.", "lässt gerade Broschüren drucken.": "зараз друкує брошури.", "Persönliche Gegenstände": "Особисті речі", "können nicht in der Küche bleiben.": "не можуть залишатися на кухні.", "sollen am Donnerstag mitgenommen werden.": "треба забрати в четвер.", "sollen weggeworfen werden.": "треба викинути.", "Einige Mitarbeiter machen Überstunden,": "Деякі працівники працюють понаднормово,", "da andere Urlaub machen.": "бо інші у відпустці.", "obwohl sie krank sind.": "хоча вони хворі.", "weil viele Kollegen krank sind.": "бо багато колег хворіють.", "Protokoll 15.04.2003, 14:00-16:00 Uhr": "Протокол 15.04.2003, 14:00–16:00", "Tagungsraum: 256, Ort: Geschwister-Scholl-Platz 12, 10738 Berlin": "Зал засідань: 256, місце: Geschwister-Scholl-Platz 12, 10738 Berlin", "Anwesende: Petra Kramer (PK, Geschäftsleitung), Yvonne Schmidt (YS, Assistenz der Geschäftsleitung) Thorsten Klein (TK, Leitung Einkauf), Sonja Kühl (SK, Leitung Finanzen), Jenny Mitschke (JM, Leitung Marketing), Ilkay Ergün (IE, Leitung Produktion), Johannes Schön (JS, Leitung Personal)": "Присутні: Петра Крамер (PK, керівництво), Івонн Шмідт (YS, асистентка керівництва), Торстен Кляйн (TK, керівник закупівель), Соня Кюль (SK, керівниця фінансів), Дженні Мічке (JM, керівниця маркетингу), Ількай Ергюн (IE, керівник виробництва), Йоганнес Шен (JS, керівник кадрів)", "Gast: Jonas Braun (Deutsches Rotes Kreuz) Sitzungsleitung: Johannes Schön Protokollantin: Yvonne Schmidt": "Гість: Йонас Браун (Німецький Червоний Хрест). Головує: Йоганнес Шен. Протокол веде: Івонн Шмідт", "1. Begrüßung und Genehmigung des Protokolls der letzten Sitzung": "1. Привітання і затвердження протоколу останнього засідання", "2. Neue Werbemaßnahmen": "2. Нові рекламні заходи", "3. Beschwerden über schlecht geputzte Büros": "3. Скарги на погано прибрані офіси", "4. Fortbildung der Ersthelfer": "4. Навчання осіб, відповідальних за першу допомогу", "5. Einführung eines Jobtickets": "5. Запровадження проїзного для працівників (Jobticket)", "TOP 1 Begrüßung und Genehmigung des Protokolls der letzten Sitzung": "Пункт 1. Привітання і затвердження протоколу останнього засідання", "JS begrüßt alle Anwesenden und stellt den Gast Jonas Braun vom Deutschen Roten Kreuz vor. Weiterhin bittet er um die Genehmigung des Protokolls der letzten Sitzung. SK merkt an, dass das Datum des diesjährigen Sommerfests falsch im letzten Protokoll festgehalten wurde. Dieses findet am 19.07. statt. Die Änderung wird aufgenommen, ansonsten wird das Protokoll genehmigt.": "JS вітає всіх присутніх і представляє гостя — Йонаса Брауна з Німецького Червоного Хреста. Далі він просить затвердити протокол останнього засідання. SK зауважує, що дату цьогорічного літнього свята в останньому протоколі записано неправильно. Воно відбудеться 19.07. Зміну вносять, в іншому протокол затверджено.", "TOP 2 Neue Werbemaßnahmen": "Пункт 2. Нові рекламні заходи", "JM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder zu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen sind. Um langfristige Lösungen zu finden, wurde eine Marktanalyse in Auftrag gegeben. Bevor die Ergebnisse vorliegen, sollen aber bereits erste Maßnahmen ergriffen werden. Ein IT-Mitarbeiter erarbeitet zurzeit ein Konzept, um die Homepage der Firma etwas moderner und benutzerfreundlicher zu gestalten. Außerdem sollte man unsere Homepage möglichst auf der ersten Seite in der Suchmaschine finden können. Diese Maßnahmen wären relativ schnell und kostengünstig umsetzbar. Auch die Präsenz in den sozialen Medien soll weiter ausgebaut werden, um die jüngere Zielgruppe noch besser zu erreichen. JM schlägt in diesem Zusammenhang vor, kurze, unterhaltsame Werbevideos zu drehen. Für deren Produktion wurde ein Filmteam angefragt, das auf dem Markt sehr erfolgreich, aber auch sehr teuer ist. PK beauftragt JM, bis zur nächsten Sitzung noch andere, günstigere Filmteams über Produktion zu prüfen.": "JM повідомляє, що відділ маркетингу розробив нову рекламну стратегію, щоб знову покращити показники продажів. На минулому засіданні SK повідомила, що з січня цього року вони постійно падають. Щоб знайти довгострокові рішення, замовили аналіз ринку. Але ще до появи результатів слід ужити перших заходів. Один ІТ-працівник зараз розробляє концепцію, як зробити сайт фірми трохи сучаснішим і зручнішим для користувачів. Крім того, наш сайт бажано мати на першій сторінці пошуковика. Ці заходи можна було б упровадити відносно швидко й недорого. Також слід далі розширювати присутність у соцмережах, щоб ще краще охопити молодшу цільову аудиторію. У зв'язку з цим JM пропонує зняти короткі розважальні рекламні відео. Для їх виробництва звернулися до знімальної групи, яка дуже успішна на ринку, але й дуже дорога. PK доручає JM до наступного засідання перевірити інші, дешевші знімальні групи.", "TOP 3 Beschwerden über schlecht geputzte Büros": "Пункт 3. Скарги на погано прибрані офіси", "Seit der Zusammenarbeit mit der neuen Reinigungsfirma beschweren sich viele Kollegen aus verschiedenen Abteilungen darüber, dass die tägliche Reinigung der Büros unzureichend ausgeführt wird. Kritikpunkte sind schmutzige Tische, unregelmäßig geleerte Mülleimer und unordentlich gesaugte Fußböden. Dazu kommt, dass die Reinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten bis 8.30 Uhr abgeschlossen sein sollten. JS soll Kontakt zur Reinigungsfirma aufnehmen, um das Problem zu besprechen. Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt.": "Відколи почалася співпраця з новою клінінговою фірмою, багато колег з різних відділів скаржаться, що щоденне прибирання офісів виконується незадовільно. Скаржаться на брудні столи, нерегулярно спорожнені смітники й недбало пропилососені підлоги. До того ж прибиральники ще на місці, коли працівники приходять близько 9-ї, хоча прибирання мало б закінчуватися до 8:30. JS має зв'язатися з клінінговою фірмою, щоб обговорити проблему. Якщо змін не буде, договір розірвуть без попередження.", "TOP 4 Fortbildung der Ersthelfer Unsere Ersthelfer müssen regelmäßig Fortbildungen besuchen. Dafür konnten wir Jonas Braun vom Deutschen Roten Kreuz als Kursleiter gewinnen, der zusammen mit JS aus der Personalabteilung Samstag, den 10.06. als Termin festgelegt hat. Das Training dauert neun Stunden. Es wird bei uns im Haus stattfinden und als Arbeitszeit angerechnet. Die Teamleiter sollen möglichst bald klären, ob die bisherigen Ersthelfer diese Funktion weiter übernehmen möchten oder ob es neue Interessenten gibt. Jonas Braun weist allerdings darauf hin, dass die Teilnehmerzahl auf acht Personen beschränkt ist. Die interessierten Mitarbeiter müssen sich bis zum 15.05. in der Personalabteilung anmelden.": "Пункт 4. Навчання осіб, відповідальних за першу допомогу. Наші відповідальні за першу допомогу мають регулярно проходити навчання. Для цього нам вдалося запросити як керівника курсу Йонаса Брауна з Німецького Червоного Хреста, який разом із JS з відділу кадрів призначив дату — суботу, 10.06. Тренінг триває дев'ять годин. Він відбудеться у нас на підприємстві і зараховується як робочий час. Керівники команд мають якнайшвидше з'ясувати, чи хочуть нинішні відповідальні за першу допомогу й далі виконувати цю функцію, чи є нові охочі. Йонас Браун, однак, зауважує, що кількість учасників обмежена вісьмома особами. Зацікавлені працівники мають зареєструватися у відділі кадрів до 15.05.", "TOP 5 Einführung eines Jobtickets": "Пункт 5. Запровадження проїзного для працівників", "PK teilt mit, dass aufgrund der schwierigen Parksituation mehr Mitarbeiter dazu animiert werden sollen, öffentliche Verkehrsmittel zu nutzen. Aus diesem Grund wird sich die Firma an den Fahrtkosten der Beschäftigten in Form von Jobtickets beteiligen. Das bedeutet, dass Mitarbeiter ab dem 01.07. zu ihrer Monatskarte einen Zuschuss von 50 Prozent, maximal aber 60 Euro erhalten.": "PK повідомляє, що через складну ситуацію з паркуванням більше працівників слід заохотити користуватися громадським транспортом. Тому фірма братиме участь у транспортних витратах працівників у формі проїзних Jobticket. Це означає, що з 01.07. працівники отримуватимуть до свого місячного проїзного доплату 50 відсотків, але не більше 60 євро.", "Antragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.": "Бланки заяв можна отримати в JS. Він також відповість на запитання.", "TK berichtet, dass sich die Lieferzeiten unseres Zulieferers wieder normalisiert haben. Die Ursache der Verzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde. JS teilt mit, dass von den vier neu eingestellten Mitarbeitern einer die Probezeit nicht beendet hat und seit dem 01.04. nicht mehr in der Firma tätig ist.": "TK повідомляє, що строки постачання нашого постачальника знову нормалізувалися. Причиною затримок був страйк працівників у фірмі-партнері в Литві, який, утім, уже врегульовано. JS повідомляє, що з чотирьох нових працівників один не пройшов випробувального терміну і з 01.04. більше не працює на фірмі.", "Die neue Werbestrategie": "Нова рекламна стратегія", "beinhaltet ein Video über die Produktionsabläufe.": "містить відео про виробничі процеси.", "ist wegen der schlechten Verkaufszahlen notwendig.": "потрібна через погані показники продажів.", "lässt sich sehr schnell und kostengünstig umsetzen.": "можна втілити дуже швидко й недорого.", "Die Reinigungsfirma": "Клінінгова фірма", "hält sich nicht an die vereinbarten Putzzeiten.": "не дотримується узгодженого часу прибирання.", "putzt die Büros der Firma nicht regelmäßig.": "прибирає офіси фірми нерегулярно.", "wird den Vertrag demnächst kündigen.": "незабаром розірве договір.", "Die Fortbildung für Ersthelfer": "Навчання для відповідальних за першу допомогу", "ist nur mit begrenzter Teilnehmerzahl möglich.": "можливе лише з обмеженою кількістю учасників.", "müssen die Teilnehmer nur einmal absolvieren.": "учасники мають пройти лише один раз.", "wird beim Deutschen Roten Kreuz veranstaltet.": "проводиться в Німецькому Червоному Хресті.", "Das Jobticket": "Проїзний Jobticket", "soll zu 60 Prozent finanziert werden.": "має фінансуватися на 60 відсотків.", "kann in der Personalabteilung beantragt werden.": "можна оформити у відділі кадрів.", "wird ab nächsten Monat eingeführt.": "запровадять з наступного місяця.", "Der Streik in Litauen": "Страйк у Литві", "dauert immer noch an.": "досі триває.", "fand landesweit statt.": "відбувався по всій країні.", "führte zu Lieferproblemen.": "призвів до проблем з постачанням.", "Protokoll 05.02.20XX, 14.00 - 16.00 Uhr": "Протокол 05.02.20XX, 14:00–16:00", "Sitzungsraum: 239, Ort: Hauptstraße 23, 25421 Pinneberg": "Зал засідань: 239, місце: Hauptstraße 23, 25421 Pinneberg", "Anwesende: Michael Müller (MM, Stellvertreter Geschäftsleitung), Katrin Wagner (KW, Leitung Personal), Henry Smith (HS, Leitung Produktion), Tomás Rodrgiuez (TR, Leitung Vertrieb), Manuela Hinz (MH, Leitung": "Присутні: Міхаель Мюллер (MM, заступник керівництва), Катрін Вагнер (KW, керівниця кадрів), Генрі Сміт (HS, керівник виробництва), Томас Родрігес (TR, керівник збуту), Мануела Гінц (MH, керівниця", "Qualitätsmanagement), Karl Lehmann (KL, Leitung Finanzen), Sabine Kurz (SK, Hausverwaltung) Sitzungsleitung: Michael Müller": "управління якістю), Карл Леман (KL, керівник фінансів), Сабіне Курц (SK, управління будівлею). Головує: Міхаель Мюллер", "Protokollantin: Katrin Wagner": "Протокол веде: Катрін Вагнер", "2. Probleme bei der Warenauslieferung": "2. Проблеми з доставкою товарів", "3. Berichte": "3. Звіти", "4. Sanierung der Kantine": "4. Ремонт їдальні", "5. Neue Krankmeldungsregelung": "5. Нові правила щодо лікарняних", "MM heißt alle Anwesenden zur heutigen Besprechung willkommen und bittet um die Genehmigung des Protokolls der letzten Sitzung. Per Handzeichen wird das Protokoll der Sitzung vom 08.01. ohne weitere Änderungen und Ergänzungen einstimmig genehmigt. Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen und bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen. Das wird einstimmig angenommen.": "MM вітає всіх присутніх на сьогоднішній нараді й просить затвердити протокол останнього засідання. Протокол засідання від 08.01. одноголосно затверджено підняттям рук без змін і доповнень. Через інші зобов'язання KW мусить піти із засідання раніше і просить розглянути пункт 5 сьогоднішнього порядку денного першочергово. Це одноголосно ухвалено.", "TOP 2 Probleme bei der Warenauslieferung": "Пункт 2. Проблеми з доставкою товарів", "TR teilt mit, dass sich immer wieder Kunden über den Zustand unserer gelieferten Waren beschwert haben. Auf dem Transportweg kommt es wohl immer wieder zu Beschädigungen der Verpackungen, sodass die Ware teilweise gar nicht oder nur zu stark reduzierten Preisen an den Endkunden verkauft werden kann. Man habe mit der Spedition schon öfter über diese Problematik gesprochen. Diese sieht das Problem jedoch bei uns und ist der Ansicht, dass die Schäden durch minderwertiges Verpackungsmaterial entstehen und nicht durch den Transport. MH und HS haben das Verpackungsmaterial überprüft und weisen den Vorwurf vehement zurück. Nachdem das Problem bis heute nicht gelöst werden konnte, macht MH den Vorschlag, dass unsere Firma die Lieferungen in Zukunft selbst übernimmt. Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses soll zur übernächsten Sitzung in zwei Monaten vorliegen.": "TR повідомляє, що клієнти раз у раз скаржилися на стан доставлених нами товарів. Під час транспортування, схоже, постійно пошкоджується упаковка, тож товар частково взагалі не можна продати кінцевому покупцеві або лише за значно зниженою ціною. З транспортною компанією вже не раз говорили про цю проблему. Проте вона вважає, що проблема в нас і що пошкодження виникають через неякісний пакувальний матеріал, а не через транспортування. MH і HS перевірили пакувальний матеріал і рішуче відкидають закид. Оскільки проблему досі не вирішено, MH пропонує, щоб надалі наша фірма сама займалася доставкою. Для цього KL і TR разом розроблять концепцію фінансування. Вона має бути готова до позанаступного засідання через два місяці.", "TOP 3 Berichte": "Пункт 3. Звіти", "SH berichtet, dass durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass für den Moment behoben werden konnte, und dankt der Personalabteilung für die prompte und unbürokratische Lösung des Problems. Er regt an, um die Unterbesetzung in der Produktion dauerhaft zu lösen, einige Zeitarbeitskräfte festzustellen. Insbesondere Herr Ahmed Hassani und Frau Ina Zurek sind HS durch Ihre Zuverlässigkeit und schnelle Auffassungsgabe positiv aufgefallen.": "HS повідомляє, що завдяки найму десяти тимчасових працівників на конвеєрі 3 і 4 кадрову нестачу поки що вдалося усунути, і дякує відділу кадрів за швидке й небюрократичне вирішення проблеми. Щоб назавжди розв'язати проблему нестачі персоналу у виробництві, він пропонує взяти деяких тимчасових працівників на постійну роботу. Особливо пан Ахмед Гассані та пані Іна Зурек позитивно запам'яталися HS своєю надійністю і швидкою кмітливістю.", "TOP 4 Sanierung der Kantine": "Пункт 4. Ремонт їдальні", "KS macht darauf aufmerksam, dass die Küche ab dem kommenden Montag saniert wird und die Kantine infolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird. Alle Abteilungsleiter sollen ihre Teams daran erinnern, sich selbst Verpflegung mitzubringen oder alternativ das Bistro „Suppenkasper“ in der Sonnenstraße zu nutzen. Die Essensmarken der Firma gelten während der Kantinenschließung auch dort in der Mittagszeit von 12.00 bis 14.00 Uhr.": "SK звертає увагу, що з наступного понеділка кухню ремонтуватимуть, тож їдальня, ймовірно, буде закрита шість–вісім тижнів. Усі керівники відділів мають нагадати своїм командам приносити їжу з собою або натомість ходити в бістро «Suppenkasper» на Sonnenstraße. Під час закриття їдальні талони на харчування від фірми діють і там в обідній час з 12:00 до 14:00.", "TOP 5 Neue Krankmeldungsregelung (vorgezogener TOP)": "Пункт 5. Нові правила щодо лікарняних (перенесений наперед пункт)", "Die Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon ab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen. Die bisherige Regelung ab dem dritten WK berichtet, dass diese Entscheidung in der Belegschaft für großen Unmut sorgt. Sie bittet alle Abteilungsleiter ein weiteres Mal, den Sinn dieser Maßnahme zu erläutern. In der nächsten Sitzung soll das Thema noch einmal behandelt werden. Man hofft auf eine breite Akzeptanz.": "На останніх загальних зборах працівників керівництво оголосило, що надалі працівникам потрібна буде довідка від лікаря вже з першого дня хвороби. (Досі правило діяло з третього дня.) KW повідомляє, що це рішення викликає в колективі велике невдоволення. Вона ще раз просить усіх керівників відділів пояснити сенс цього заходу. На наступному засіданні тему розглянуть ще раз. Сподіваються на широке схвалення.", "MM teilt mit, dass ab dem kommenden Monat für die Autofahrer mehr Parkplätze zur Verfügung stehen. Diese entstehen neben dem Eingang C. Alle Mitarbeiterinnen und Mitarbeiter sollen in einer Rundmail darüber informiert werden und wer Interesse hat, kann in der Personalabteilung einen kostenlosen Stellplatz beantragen.": "MM повідомляє, що з наступного місяця для водіїв буде більше паркомісць. Вони з'являться біля входу C. Усіх працівниць і працівників мають повідомити про це розсилкою, а хто зацікавлений, може подати у відділ кадрів заяву на безкоштовне паркомісце.", "Frau Wagner": "Пані Вагнер", "bittet um Änderungen des Protokolls vom 08.01.": "просить внести зміни до протоколу від 08.01.", "hat heute noch einen anderen wichtigen Termin.": "має сьогодні ще одну важливу зустріч.", "schlägt einen zusätzlichen Tagesordnungspunkt vor.": "пропонує додатковий пункт порядку денного.", "Die Geschäftsleitung möchte, dass": "Керівництво хоче, щоб", "das Thema Krankmeldung nicht mehr besprochen wird.": "тему лікарняних більше не обговорювали.", "man bei Krankheit spätestens am dritten Tag zum Arzt geht.": "у разі хвороби до лікаря йшли щонайпізніше на третій день.", "sich Mitarbeiter bei Krankheit sofort krankschreiben lassen.": "у разі хвороби працівники одразу брали лікарняний.", "Karl Lehmann soll": "Карл Леман має", "besseres Verpackungsmaterial einkaufen.": "закупити кращий пакувальний матеріал.", "einen Finanzierungsplan erstellen.": "скласти план фінансування.", "Kontakt mit der Spedition aufnehmen.": "зв'язатися з транспортною компанією.", "In der Produktionsabteilung": "У виробничому відділі", "gibt es derzeit genügend Mitarbeiter.": "зараз достатньо працівників.", "will man alle Zeitarbeiter fest anstellen.": "хочуть узяти всіх тимчасових працівників на постійну роботу.", "wurden zwei neue Mitarbeiter fest eingestellt.": "двох нових працівників узяли на постійну роботу.", "In der Kantine": "У їдальні", "bekommt man in den kommenden Wochen kein Essen.": "найближчими тижнями не можна буде поїсти.", "kann man ab Montag von 12 bis 14 Uhr zu Mittag essen.": "з понеділка можна обідати з 12 до 14 години.", "sollten die Essensmarken abgeschafft werden.": "мали б скасувати талони на харчування.", "Protokoll 27.08.20XX, 10.00 bis 11.30 Uhr bis 11.30 Uhr": "Протокол 27.08.20XX, 10:00–11:30", "Konferenzraum Rhein-Main, Am Wegesrand 12, 63345 Frankfurt": "Конференц-зал «Rhein-Main», Am Wegesrand 12, 63345 Frankfurt", "Anwesende: Thomas Köhler (TK, Werkstatt). Brigitte Turner (ВТ, Personal), Gerd Schneider (GS, Buchhaltung), Hilde Bruhns (HB, Buchhaltung)": "Присутні: Томас Кьолер (TK, майстерня), Бригітте Тернер (BT, кадри), Герд Шнайдер (GS, бухгалтерія), Гільде Брунс (HB, бухгалтерія)", "Entschuldigt: Kari Muster (KM, Lager) Sitzungsleitung: Gerd Schneider": "Відсутня з поважної причини: Карі Мустер (KM, склад). Головує: Герд Шнайдер", "Protokollführung: Thomas Köhler": "Протокол веде: Томас Кьолер", "1. Begrüßung und Eröffnung der Sitzung": "1. Привітання і відкриття засідання", "2. Erste-Hilfe-Kurs": "2. Курс першої допомоги", "3. Homeoffice": "3. Хоумофіс", "4. Personelle Engpässe Buchhaltung": "4. Нестача персоналу в бухгалтерії", "5. Betriebsausflug": "5. Корпоративна екскурсія", "TOP 1 Begrüßung und Eröffnung der Sitzung": "Пункт 1. Привітання і відкриття засідання", "GS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1. August in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.": "GS відкриває засідання, вітає всіх присутніх і представляє колегам Гільде Брунс, яка з 1 серпня у відділі бухгалтерії відповідає за виплату зарплат тощо.", "TOP 2 Erste-Hilfe-Kurs": "Пункт 2. Курс першої допомоги", "TK berichtet, dass es vor Kurzem zu einem Unfall in der Werkstatt gekommen ist, bei dem ein Kollege am Arm verletzt wurde und stark geblutet hat. Obwohl regelmäßig Sicherheitsunterweisungen, für die Mitarbeitenden im Lager und in der Werkstatt stattfinden, reagierte nur ein Kollege ruhig und besonnen und war in der Lage, den Verletzten zu versorgen und dann Hilfe zu holen. Die anderen wussten nicht, was sie tun sollten. Auch in der Marketingabteilung gab es eine Situation, in der einer Kollegin wohl wegen der Hitze schwindlig wurde und ein Krankenwagen gerufen werden musste, da niemand von den Mitarbeiter*innen helfen konnte.": "TK повідомляє, що нещодавно в майстерні стався нещасний випадок: колега поранив руку і сильно кровоточив. Хоча для працівників складу й майстерні регулярно проводять інструктажі з безпеки, лише один колега відреагував спокійно й розважливо і зміг надати пораненому допомогу, а потім покликати підмогу. Інші не знали, що робити. І у відділі маркетингу була ситуація, коли колезі, мабуть через спеку, запаморочилося в голові, і довелося викликати швидку, бо ніхто з працівників не зміг допомогти.", "TK schlägt deshalb vor, einen Erste-Hilfe-Kurs im Unternehmen zu organisieren, an dem alle interessierten Angestellten teilnehmen können. TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig einen solchen Kurs an zwei Freitagsterminen zu buchen.": "Тому TK пропонує організувати на підприємстві курс першої допомоги, в якому зможуть узяти участь усі зацікавлені працівники. TK уже поговорив із Червоним Хрестом. Там можна було б найближчим часом забронювати такий курс на дві п'ятниці.", "TOP 3 Homeoffice": "Пункт 3. Хоумофіс", "ВТ stellt dar, dass immer wieder Mitarbeiter*innen den Wunsch an sie herantragen, den einen oder anderen Tag in der Woche von zu Hause aus zu arbeiten, wenn sie Aufgaben zu erledigen haben, die eine Anwesenheit im Büro nicht unbedingt erforderlich machen.": "BT розповідає, що працівники раз у раз звертаються до неї з бажанням працювати один-два дні на тиждень з дому, коли мають завдання, які не обов'язково вимагають присутності в офісі.", "BT steht diesem Wunsch offen gegenüber. Durch diese Möglichkeit könnten die Mitarbeiter*innen die Zeit für den Arbeitsweg sparen und sich ihre Arbeitszeit flexibler einteilen. Das würde sicher erheblich zur Mitarbeiterzufriedenheit beitragen. Den Mitarbeiter*innen, die im Homeoffice arbeiten, müssten firmeneigene Laptop, Diensthandys zur Verfügung gestellt werden. Da aber bereits einige mobile Geräte im Unternehmen vorhanden sind, würde das keine signifikanten Mehrkosten bedeuten. Sollte sich das Arbeitsmodell „Homeoffice” bewähren, könnte für die Kolleg*innen die regelmäßig von zu Hause aus arbeiten, ein VPN-Tunnel eingerichtet werden, durch den sie sicheren Zugang zu den Daten auf dem Firmenserver erhalten würden.": "BT ставиться до цього бажання відкрито. Завдяки такій можливості працівники могли б заощаджувати час на дорогу і гнучкіше розподіляти робочий час. Це напевно значно підвищило б задоволеність працівників. Працівникам у хоумофісі треба було б надати службові ноутбуки та телефони. Але оскільки на підприємстві вже є певна кількість мобільних пристроїв, це не означало б значних додаткових витрат. Якщо модель роботи «хоумофіс» себе виправдає, для колег, які регулярно працюють з дому, можна було б налаштувати VPN-тунель, через який вони отримали б безпечний доступ до даних на сервері фірми.", "ВТ bittet bis Mitte der nächsten Woche um Rückmeldungen, was die einzelnen Abteilungsleiter*innen davon halten, bevor sie den Vorschlag der Geschäftsführung vorlegt.": "BT просить до середини наступного тижня дати відгук, що думають про це окремі керівники відділів, перш ніж вона представить пропозицію керівництву.", "TOP 4 Personelle Engpässe in der Buchhaltung": "Пункт 4. Нестача персоналу в бухгалтерії", "GS teilt mit, dass die Buchhaltung zur Zeit trotz der Neueinstellung von Frau Bruhns personell unterbesetzt ist.": "GS повідомляє, що бухгалтерія зараз недоукомплектована, попри прийняття на роботу пані Брунс.", "Das Arbeitsaufkommen ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen. Im Moment ist auch noch eine Kollegin krank, sodass das verbleibende Kolleg*innen viele Überstunden machen müssen, um die Arbeit zu schaffen. Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.": "Нинішні троє працівників відділу вже не справляються з обсягом роботи. До того ж зараз одна колега хворіє, тож решта мусить працювати багато понаднормово, щоб устигати. Він планує найняти ще одну працівницю або працівника.", "TOP 5 Betriebsausflug": "Пункт 5. Корпоративна екскурсія", "HB arbeitet im diesjährigen Team für die Organisation des Betriebsausflugs mit, um so gleich einige Kolleg*innen kennenzulernen. Sie berichtet, dass der Ausflug am 1. Oktober stattfindet. Alle Mitarbeiter*innen treffen sich morgens um 9.00 Uhr vor dem Haupteingang der Firma. Dort werden sie von einem Bus abgeholt und zum Kastell Saalburg gefahren.": "HB долучилася до цьогорічної команди з організації корпоративної екскурсії, щоб одразу познайомитися з кількома колегами. Вона повідомляє, що екскурсія відбудеться 1 жовтня. Усі працівники збираються о 9:00 ранку перед головним входом фірми. Звідти їх забере автобус і відвезе до фортеці Заальбург.", "Vom Parkplatz am Fuße der Burg aus ist eine kleine Wanderung geplant. Am Ziel wartet eine Überraschung. Für das leibliche Wohl ist gesorgt. Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.": "Від парковки біля підніжжя фортеці запланована невелика піша прогулянка. На фініші чекає сюрприз. Про їжу й напої подбали. Повернення до фірми заплановане на 19:00 того ж дня.", "Entfällt. Keiner der Anwesenden hat noch Punkte zu besprechen.": "Не розглядається. Ніхто з присутніх більше не має питань для обговорення.", "Frau Bruhns": "Пані Брунс", "arbeitet seit einigen Wochen in der Buchhaltung.": "кілька тижнів працює в бухгалтерії.", "bezahlt die Gehälter der Mitarbeiter*innen.": "виплачує зарплати працівникам.", "nimmt bald ihre Tätigkeit auf.": "незабаром почне працювати.", "Der Erste-Hilfe-Kurs": "Курс першої допомоги", "findet jeden Freitag statt.": "відбувається щоп'ятниці.", "ist für alle Mitarbeiter* innen verpflichtet.": "обов'язковий для всіх працівників.", "wird vom Roten Kreuz durchgeführt.": "проводить Червоний Хрест.", "Homeoffice": "Хоумофіс", "erfordert die Anschaffung neuer Arbeitsgeräte.": "вимагає закупівлі нового робочого обладнання.", "verringert die Arbeitszeit der Mitarbeitenden.": "зменшує робочий час працівників.", "wird von vielen Mitarbeitenden gewünscht.": "бажаний для багатьох працівників.", "In der Abteilung Buchhaltung": "У відділі бухгалтерії", "gibt es zu viele Beschäftigte.": "забагато працівників.", "sind viele Kolleg*innen erkrankt.": "багато колег хворіють.", "soll eine Stelle ausgeschrieben werden.": "мають оголосити вакансію.", "Der Betriebsausflug wird": "Корпоративну екскурсію", "für den ganzen Tag geplant.": "планують на цілий день.", "jedes Jahr von den gleichen Personen organisiert.": "щороку організовують ті самі люди.", "zum besseren Kennenlernen der Kolleg*innen genutzt.": "використовують, щоб краще познайомитися з колегами.", "Protokoll 15.01.20XX, 10.00 bis 11.30 Uhr Sitzungsraum 205, Ort: Hauptstraße 27, 99099 Erfurt": "Протокол 15.01.20XX, 10:00–11:30. Зал засідань 205, місце: Hauptstraße 27, 99099 Erfurt", "Anwesende: Jakob Müller (JM, Geschäftsleitung), Friedrich Döring (FD, Vertrieb), Karl Altmann (KA, Buchhaltung und Finanzen), Peter Bischoff (PB, Produktion), Karsten Hinz (KH, Logistik), Jana Bartsch ( JB, Personal), Beate Fritsch (BF, Marketing), Jonas Stoll ( JS, IT-Abteilung).": "Присутні: Якоб Мюллер (JM, керівництво), Фрідріх Дерінг (FD, збут), Карл Альтман (KA, бухгалтерія і фінанси), Петер Бішофф (PB, виробництво), Карстен Гінц (KH, логістика), Яна Барч (JB, кадри), Беате Фріч (BF, маркетинг), Йонас Штолль (JS, ІТ-відділ).", "Sitzungsleitung: Jakob Müller": "Головує: Якоб Мюллер", "Protokollant: Jonas Stoll Tagesordnungspunkte:": "Протокол веде: Йонас Штолль. Порядок денний:", "1. Begrüßung und Tagesordnung 2. Kosteneinsparungen": "1. Привітання і порядок денний; 2. Економія витрат", "3. Lagebericht Produktion": "3. Звіт про стан виробництва", "4. Kündigung des Betriebsarztes": "4. Звільнення заводського лікаря", "5. Betriebliche Altersvorsorge": "5. Корпоративне пенсійне забезпечення", "TOP 1 Begrüßung und Tagesordnung": "Пункт 1. Привітання і порядок денний", "JM heißt die Kolleg*innen zur heutigen Besprechung herzlich willkommen und bestätigt die Anwesenheit aller eingeladenen Teilnehmer*innen. Danach erkundigt JM sich, ob noch zusätzliche Themen protokollarisch aufgenommen werden sollen. Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.": "JM щиро вітає колег на сьогоднішній нараді й підтверджує присутність усіх запрошених учасників. Потім JM запитує, чи треба внести до протоколу ще якісь додаткові теми. Коментарів немає, тож порядок денний вважається затвердженим.", "TOP 2 Kosteneinsparungen": "Пункт 2. Економія витрат", "Wie JM darstellt, hat sich der Markt im Vergleich zum Vorjahr stark verändert. In diesem Zusammenhang müssen deshalb Kostenstrukturen neu überdacht werden. Es wird vorgeschlagen, die administrativen Kosten zu senken, da es hier Einsparungspotential gibt. Im Vorfeld zu dieser Besprechung wurde JB bereits von der Geschäftsleitung beauftragt, eine exakte Kostenübersicht zu erstellen und Vorschläge zur Kostenreduzierung vorzulegen. JB legt dar, dass die in der Firmenzentrale eingehenden Anrufe auf ein externes Call- Center umgeleitet werden könnten. Verschiedene Kostenvoranschläge wurden hierfür auch schon eingeholt. Die Firma tele-info scheint unseren Ansprüchen am besten gerecht zu werden. Deshalb sollten Vertragsverhandlungen aufgenommen und zeitgleich Schulungspläne für die Call-Center-Mitarbeiter*innen ausgearbeitet werden, um ihnen die Organisationsstruktur des Unternehmens so schnell wie möglich näherzubringen, damit die Arbeit ohne Verzögerung aufgenommen werden kann. Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler eingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die Gästebetreuung übernehmen. JM stimmt den Vorschlägen zu und bittet um Umsetzung der weiteren Schritte.": "Як розповідає JM, ринок порівняно з минулим роком сильно змінився. У зв'язку з цим структуру витрат треба переглянути. Пропонується знизити адміністративні витрати, бо тут є потенціал для економії. Ще до цієї наради керівництво доручило JB скласти точний огляд витрат і подати пропозиції щодо їх скорочення. JB пояснює, що дзвінки, які надходять до головного офісу фірми, можна було б переадресувати на зовнішній кол-центр. Для цього вже отримано кілька кошторисів. Фірма tele-info, схоже, найкраще відповідає нашим вимогам. Тому слід почати переговори про договір і водночас розробити плани навчання для працівників кол-центру, щоб якнайшвидше ознайомити їх з організаційною структурою підприємства і щоб робота почалася без затримок. Завдяки зекономленому так часу на рецепції тамтешніх працівників можна буде використовувати гнучкіше, і вони зможуть, наприклад, додатково взяти на себе важливу для підприємства конференц-зону та обслуговування гостей. JM погоджується з пропозиціями і просить виконати подальші кроки.", "TOP 3 Lagebericht Produktion PB merkt an, dass auch in seiner Abteilung eine Kostenreduzierung möglich wäre, indem unausgewogene Lagerungen von Material und Rohstoffen vermieden werden. Das Lagerungsmanagement ist optimierbar, d.h., dass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten führen. Im Fall von Überbeständen muss neue Lagerfläche geschaffen werden und im Fall von Unterbeständen kann es zu kurzfristigen Produktionsausfällen kommen. JM beauftragt PB , sich umgehend zusammen mit KH mit dieser Thematik auseinanderzusetzen und zur nächsten Sitzung konkrete Zahlen und Vorschläge vorzulegen.": "Пункт 3. Звіт про стан виробництва. PB зауважує, що і в його відділі можна скоротити витрати, якщо уникати незбалансованого зберігання матеріалів і сировини. Управління складськими запасами можна оптимізувати, тобто треба уникати як завеликих, так і замалих запасів, бо вони призводять до зайвих витрат. У разі надлишку запасів доводиться створювати нові складські площі, а в разі нестачі можливі короткочасні простої виробництва. JM доручає PB негайно разом із KH зайнятися цим питанням і до наступного засідання подати конкретні цифри й пропозиції.", "TOP 4 Kündigung des Betriebsarztes": "Пункт 4. Звільнення заводського лікаря", "Mit Bedauern teilt die Geschäftsleitung mit, dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine eigene Praxis eröffnen will. Aus diesem Grund hat sich die Firma entschlossen, die Ersthelferausbildung zu forcieren, damit bei kleineren Verletzungen, die im Produktionsablauf immer wieder auftreten können, sofort eingegriffen werden kann. Ärztliche Unterstützung bekommen wir ab nächstem Jahr von der Allgemeinärztlichen Praxis Dr. Mertens. Die Kontaktdaten werden bekannt gegeben.": "Керівництво з жалем повідомляє, що наш заводський лікар залишає фірму наприкінці року, бо хоче відкрити власну практику. Тому фірма вирішила активізувати підготовку осіб, відповідальних за першу допомогу, щоб у разі дрібних травм, які можуть траплятися у виробничому процесі, одразу можна було втрутитися. Медичну підтримку з наступного року нам надаватиме практика загальної медицини д-ра Мертенса. Контактні дані повідомлять.", "TOP 5 Betriebliche Altersvorsorge": "Пункт 5. Корпоративне пенсійне забезпечення", "Seit einem Jahr bietet die Firma den Mitarbeiter*innen an, in eine betriebliche Zusatzrente zu investieren. Bisher wird dieses Angebot aber nur von wenigen Kolleg*innen genutzt. Deshalb werden erneut alle Abteilungsleiter*innen darauf hingewiesen, in ihren Abteilungen über diese Möglichkeit der Altersvorsorge aufzuklären. Interessierte Mitarbeiter*innen können in der Personalabteilung genauere Informationen erhalten. Zusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man sich aber anmelden muss.": "Уже рік фірма пропонує працівникам інвестувати в корпоративну додаткову пенсію. Проте досі цією пропозицією користуються лише кілька колег. Тому всім керівникам відділів ще раз нагадують роз'яснити у своїх відділах цю можливість пенсійного забезпечення. Зацікавлені працівники можуть отримати докладнішу інформацію у відділі кадрів. Крім того, страхова компанія щочетверга проводить окремі консультаційні години, на які, однак, треба записуватися.", "TOP 6 Sonstiges Die Mitarbeiter*innen werden gebeten, im Intranet abzustimmen, ob die Firma in diesem Jahr für alle Kolleg*innen entweder einen eintägigen Betriebsausflug oder ein Sommerfest organisieren soll. Für den Betriebsausflug könnten dann auch gleich Vorschläge unterbreitet werden. Die Abstimmung muss bis zum 31.03 erfolgen, damit für das 0rganisationskomitee noch ausreichend Zeit für die Planung bleibt.": "Пункт 6. Різне. Працівників просять проголосувати в інтранеті, чи має фірма цього року організувати для всіх колег одноденну корпоративну екскурсію, чи літнє свято. Для екскурсії можна одразу ж подавати пропозиції. Проголосувати треба до 31.03., щоб в організаційного комітету залишилося достатньо часу на планування.", "Bei der Besprechung": "На нараді", "müssen weitere Themen besprochen werden.": "треба обговорити ще інші теми.", "sind alle Mitarbeiter*innen des Unternehmens anwesend.": "присутні всі працівники підприємства.", "wird die Tagesordnung angenommen.": "ухвалюють порядок денний.", "Um Kosten zu sparen,": "Щоб заощадити кошти,", "sollen einige Empfangsmitarbeiter*innen in ein Call-Center wechseln.": "деякі працівники рецепції мають перейти в кол-центр.", "werden die Aufgaben der Mitarbeitenden am Empfang neu festgelegt.": "по-новому визначать завдання працівників рецепції.", "wird der Empfang demnächst geschlossen.": "рецепцію незабаром закриють.", "Der Lagerbestand muss": "Складські запаси треба", "an die Produktion angepasst werden.": "узгодити з виробництвом.", "dauerhaft ausgebaut werden.": "постійно збільшувати.", "kurzfristig reduziert werden.": "найближчим часом скоротити.", "Der Betriebsarzt wird": "Заводський лікар", "mit Dr. Mertens zusammenarbeiten.": "співпрацюватиме з д-ром Мертенсом.", "zukünftig selbstständig arbeiten.": "надалі працюватиме самостійно.", "zum Jahresende entlassen.": "буде звільнений наприкінці року.", "Die betriebliche Altersvorsorge": "Корпоративне пенсійне забезпечення", "kann bei einem vereinbarten Termin besprochen werden.": "можна обговорити на призначеній зустрічі.", "nehmen viele Mitarbeiter*innen an.": "обирають багато працівників.", "wird neu in der Fima eingeführt.": "на фірмі запроваджують уперше.", "Sitzungsraum: 112, Ort: Ludwigstr. 23, 79342 Herbolzen": "Зал засідань: 112, місце: Ludwigstr. 23, 79342 Herbolzen", "Anwesende: Jan Schneider (JS, Geschäftsleitung), Sabine Faust (SF, Leiterin Marketing), Paul Mayer (PM, Leiter Produktion), Tim Janzen (TJ, Leiter Vertrieb), Chiara Reich (CR, Leiterin IT), Simon Zitzmann (SZ, Leiter Personal), Mona Seil(MS, Leiterin Controlling)": "Присутні: Ян Шнайдер (JS, керівництво), Сабіне Фауст (SF, керівниця маркетингу), Пауль Маєр (PM, керівник виробництва), Тім Янцен (TJ, керівник збуту), К'яра Райх (CR, керівниця ІТ), Симон Цітцман (SZ, керівник кадрів), Мона Зайль (MS, керівниця контролінгу)", "Sitzungsleitung: Jan Schneider, Protokollant: Simon Zitzmann": "Головує: Ян Шнайдер, протокол веде: Симон Цітцман", "1. Begrüßung und Genehmigung der Tagesordnungspunkte": "1. Привітання і затвердження порядку денного", "2. Marketingmaßnahmen": "2. Маркетингові заходи", "4. Erweiterte Überstundenregelung": "4. Розширені правила щодо понаднормових", "5. Einführung Jobticket": "5. Запровадження проїзного Jobticket", "JS begrüßt die Abteilungsleitungen zur heutigen Sitzung, die daraufhin pünktlich eröffnet wird. Anschließend bittet er um die Genehmigung der Tagesordnungspunkte. Nach Handzeichen wird die Tagesordnung ohne Ergänzungen und Änderungen einstimmig genehmigt. Als nächster Besprechungstermin wird der 25.06. vor der großen Sommerpause einstimmig festgelegt.": "JS вітає керівників відділів на сьогоднішньому засіданні, яке після цього вчасно відкривається. Потім він просить затвердити порядок денний. Підняттям рук порядок денний одноголосно затверджено без доповнень і змін. Дату наступної наради одноголосно призначено на 25.06., перед великою літньою перервою.", "TOP 2 Marketingmaßnahmen": "Пункт 2. Маркетингові заходи", "Nach dem im letzten Quartal von MS und TJ festgestellten Absatzrückgang wurden bereits auf der letzten Sitzung neue Verkaufsstrategien beschlossen. Hierzu wurde von der Geschäftsleitung ein Budget von 350.000 Euro freigegeben. SF berichtet, dass schon im Vorfeld neue Zielgruppen beleuchtet wurden, insbesondere die Gruppe der Berufseinsteiger und Hochschulabsolventen, also die Altersgruppe 17 bis 25 Jahre. Im Vergleich dazu lag der Fokus bisher auf Verbraucher im Alter von 30 bis 50 Jahren.": "Після спаду продажів, який MS і TJ виявили в останньому кварталі, ще на минулому засіданні ухвалили нові стратегії продажу. Для цього керівництво виділило бюджет 350 000 євро. SF повідомляє, що ще заздалегідь проаналізували нові цільові групи, зокрема тих, хто починає кар'єру, і випускників вишів, тобто вікову групу від 17 до 25 років. Для порівняння: досі фокус був на споживачах віком від 30 до 50 років.", "Zunächst wurde eine Social-Media-Agenturbeauftragt, um gezielt neue Endverbraucher anzusprechen. Hierzu liegen auch schon erste Ergebnisse vor, die zeigen, dass das Interesse die Aufmerksamkeit um 38% gestiegen sind. Infolgedessen stieg der Umsatz um 18 % im Vergleich zum Vorjahr. JS zeigt sich mit dieser ersten Entwicklung zufrieden und erwartet einen weiteren positiven Trend. Für das nächste Quartal ist geplant, positive Kundenreaktionen im Internet hochzuladen. SF betont, dass gerade in diesem Bereich die Zukunft liegt und regelmäßige Neuerungen erwartet werden können. Deshalb wird sie in den kommenden Sitzungen regelmäßig neue Konzepte präsentieren.": "Спершу найняли агенцію соцмереж, щоб цілеспрямовано звертатися до нових кінцевих споживачів. Уже є перші результати, які показують, що інтерес і увага зросли на 38%. Внаслідок цього оборот зріс на 18% порівняно з минулим роком. JS задоволений цим першим розвитком і очікує подальшої позитивної тенденції. На наступний квартал планується викладати в інтернет позитивні відгуки клієнтів. SF наголошує, що саме в цій сфері майбутнє і можна очікувати регулярних нововведень. Тому на наступних засіданнях вона регулярно представлятиме нові концепції.", "SZ berichtet darüber, dass die Mitarbeitenden in der Produktion seit dem Einbau der neuen Maschinen gehäuft über eine enorme Lärmbelastung klagen würden. Hier bestehe dringender Handlungsbedarf, da im anderen Fall eine Überprüfung durch die Behörden erfolgen konnte. PM wird mit der Herstellerfirma dieser Anlagen Kontakt aufnehmen, um dieses Problem zu klären. Bis zur Lösung sollten Gehörschützer benutzt werden.": "SZ повідомляє, що відколи встановили нові машини, працівники виробництва дедалі частіше скаржаться на величезне шумове навантаження. Тут є нагальна потреба діяти, бо інакше може відбутися перевірка з боку органів влади. PM зв'яжеться з фірмою-виробником цих установок, щоб з'ясувати проблему. До її вирішення слід користуватися засобами захисту слуху.", "TOP 4 Erweiterte Überstundenregelung": "Пункт 4. Розширені правила щодо понаднормових", "JS teilt einen Vorschlag der Geschäftsleitung hinsichtlich einer erweiterten Überstundenregelung mit. Aufgrund einer sich ständig ändernden Auftragslage kommt es vor, dass den Mitarbeitenden immer mehr Überstunden zugemutet werden. Die bisherige Regelung, dass bis zehn Stunden Mehrarbeit im Monat bezahlt werden, bleibt bestehen. Die Stunden darüber hinaus werden weiterhin als Freizeitausgleich gewährt. Neu kommt hinzu, dass ab dem kommenden Jahr für jeweils 100 geleistete Überstunden jährlich ein Urlaubstag zusätzlich gegeben wird. SZ wird diese Maßnahme in der nächsten Betriebsratssitzung zur Prüfung und Genehmigung vorlegen.": "JS повідомляє про пропозицію керівництва щодо розширених правил для понаднормових. Через постійно змінну ситуацію із замовленнями трапляється, що від працівників вимагають дедалі більше понаднормових. Чинне правило, за яким оплачується до десяти годин додаткової роботи на місяць, залишається в силі. Години понад це й надалі компенсують вільним часом. Нове: з наступного року за кожні 100 відпрацьованих понаднормових годин на рік надаватимуть один додатковий день відпустки. SZ представить цей захід на наступному засіданні виробничої ради для перевірки й затвердження.", "TOP 5 Einführung Jobticket": "Пункт 5. Запровадження проїзного Jobticket", "Da in der Vergangenheit die Situation auf unseren Firmenparkplätzen sehr angespannt war, nahm die Firma Kontakt zum örtlichen öffentlichen Personennahverkehr auf, um die Einführung von Jobtickets für die Mitarbeitenden möglich zu machen. Viele Mitarbeitende hatten zuvor diesen Wunsch geäußert. SZ teilt mit, dass die Verhandlungen kurz vor dem Abschluss stehen. Wer Interesse an diesem günstigen Ticket hat, sollte sich per Mail oder persönlich in der Personalabteilung dafür anmelden. Die Abteilungsleiter übernehmen es, Ihre Abteilungen zu informieren.": "Оскільки раніше ситуація на паркінгах фірми була дуже напруженою, фірма зв'язалася з місцевим громадським транспортом, щоб уможливити запровадження проїзних Jobticket для працівників. Багато працівників і раніше висловлювали таке бажання. SZ повідомляє, що переговори близькі до завершення. Хто зацікавлений у цьому вигідному квитку, має зареєструватися поштою або особисто у відділі кадрів. Керівники відділів беруть на себе інформування своїх відділів.", "TOP 6 Unser Unternehmen und das Fitnesscenter fit und fun, das sich in der unmittelbaren Nähe unserer Firma befindet, haben gemeinsam ein Angebot für unsere Mitarbeiter erarbeitet. Wenn man seine Betriebszugehörigkeit nachweist, kann man einen Vertrag zu besonders günstigen Konditionen abschließen. SZ schlägt vor, man könnte dort zu einem späteren Zeitpunkt sogar ein Sportfest für die Abteilungen durchführen. Diesen Vorschlag begrüßt JS.": "Пункт 6. Наше підприємство та фітнес-центр «fit und fun», що розташований зовсім поруч із нашою фірмою, спільно розробили пропозицію для наших працівників. Якщо підтвердити, що працюєш на підприємстві, можна укласти договір на особливо вигідних умовах. SZ пропонує згодом навіть провести там спортивне свято для відділів. JS схвалює цю пропозицію.", "Die Besprechung": "Нарада", "beginnt zur festgelegten Uhrzeit.": "починається у встановлений час.", "soll auf den 25.06. verlegt werden.": "має бути перенесена на 25.06.", "wird durch Änderungen ergänzt.": "доповнюється змінами.", "Die Umsatzsteigerung": "Зростання обороту", "beträgt 350.000 Euro.": "становить 350 000 євро.", "liegt bei 38 %.": "становить 38%.", "wird sich fortsetzen.": "продовжиться.", "Die Überstundenregelung": "Правило щодо понаднормових", "bleibt genauso bestehen.": "залишається без змін.", "erhält eine Ergänzung.": "отримує доповнення.", "gilt ab 100 Überstunden.": "діє з 100 понаднормових годин.", "ist eine preislich unattraktive Variante.": "— невигідний за ціною варіант.", "können die Mitarbeiter beim ÖPNV kaufen.": "працівники можуть купити в громадському транспорті.", "soll den Arbeitsweg stressfreier machen.": "має зробити дорогу на роботу менш напруженою.", "Sportliche Aktivitäten": "Спортивні заходи", "finden in dem Unternehmen statt.": "відбуваються на підприємстві.", "sollen in den Abteilungen stattfinden.": "мають проводитися у відділах.", "werden von der Firma gefördert.": "фірма підтримує.", "Protokoll 19. Februar 20XX, 10.00-11.45 Uhr": "Протокол 19 лютого 20XX, 10:00–11:45", "Konferenzraum 7, Ort: Neuburger Allee 28, 87341 Ballhausen": "Конференц-зал 7, місце: Neuburger Allee 28, 87341 Ballhausen", "Anwesende: Maria Loppinet (ML, Geschäftsführung), Lukas Meier (LM, Leitung Einkauf), Magda Nauner (MN, Leitung Personal), Gert Schrader (GS, Leitung Produktion), Peter Schuldt (PS, Leitung Verkauf), Katja Stevens (KS, Leitung Qualitätskontrolle), Volha Schäfer (VS, Leitung Finanzen)": "Присутні: Марія Лоппіне (ML, керівництво), Лукас Маєр (LM, керівник закупівель), Магда Наунер (MN, керівниця кадрів), Герт Шрадер (GS, керівник виробництва), Петер Шульдт (PS, керівник продажів), Катя Стівенс (KS, керівниця контролю якості), Вольга Шефер (VS, керівниця фінансів)", "Gast: Wanda Lubic (WL, ITBeauftragte),": "Гостя: Ванда Любич (WL, уповноважена з ІТ),", "Sitzungsleitung: Magda Nauner": "Головує: Магда Наунер", "Protokollantin: Volha Schäfer": "Протокол веде: Вольга Шефер", "2. Stand des Projekts ,,Fertigungsanlage\"": "2. Стан проєкту «Виробнича лінія»", "4. Neue Mitarbeiterinnen und Mitarbeiter": "4. Нові працівниці й працівники", "5. Update der Software": "5. Оновлення програмного забезпечення", "MN begrüßt Frau Loppinet und alle Leiterinnen und Leiter zur heutigen Sitzung. Sie bittet um Genehmigung des Protokolls der letzten Sitzung. Nach Handzeichen wird das Protokoll der Sitzung vom 15.01. ohne weitere Änderungen und Ergänzungen.": "MN вітає пані Лоппіне та всіх керівниць і керівників на сьогоднішньому засіданні. Вона просить затвердити протокол останнього засідання. Підняттям рук протокол засідання від 15.01. [затверджено] без змін і доповнень.", "TOP 2 Stand des Projekts „Fertigungsanlage\"": "Пункт 2. Стан проєкту «Виробнича лінія»", "LM gibt einen Überblick zum Projekt „Fertigungsanlage\". Er berichtet über den Auftrag an eine Firma aus Italien, die bereits ähnliche Anlagen hergestellt und aufgebaut hat. Die italienische Firma kommt nächsten Monat, um sich vor Ort ein Bild von unseren Werkshallen II und IV zu machen, wo die Anlage stehen soll. Der genaue Termin steht noch nicht fest. Wenn Werkshalle II oder IV als geeignet erscheint, wird unmittelbar mit der Herstellung der Fertigungsanlage in Italien begonnen.": "LM робить огляд проєкту «Виробнича лінія». Він розповідає про замовлення італійській фірмі, яка вже виготовляла й монтувала подібні установки. Італійська фірма приїде наступного місяця, щоб на місці оглянути наші цехи II і IV, де має стояти установка. Точна дата ще не визначена. Якщо цех II або IV виявиться придатним, виготовлення лінії в Італії почнуть одразу.", "Die Montage der Anlage ist dann einige Monate später. Wie geplant soll die neue Fertigungsanlage im folgenden Frühjahr betriebsbereit sein. Sollte keine der beiden Werkshallen für den Aufbau der Fertigungsanlage groß genug sein, müssten wir zuerst eine komplett neue Werkshalle auf dem südlichen Werksgelände errichten lassen. Dadurch könnte sich die Inbetriebnahme einer neuen Fertigungsanlage um mindestens 8 bis 9 Monate verschieben.": "Монтаж установки відбудеться через кілька місяців після цього. Як заплановано, нова виробнича лінія має бути готова до роботи наступної весни. Якщо жоден із двох цехів не буде достатньо великим для монтажу лінії, нам доведеться спершу збудувати цілком новий цех на південній частині території заводу. Через це введення нової лінії в експлуатацію може затриматися щонайменше на 8–9 місяців.", "GS berichtet über die ohne große Probleme laufende Produktion der Metallkästen und Metallgehäuse, die sehr nachgefragt sind. Bei noch größerer Nachfrage nach Metallgehäusen könnte jedoch die derzeitige Fertigungsanlage nicht ausreichen. GS freut sich daher über die Planung einer neuen Fertigungsanlage. PS legt neue Verkaufszahlen vor, die im letzten Quartal 20 Prozent über dem vergleichbaren Quartal des Vorjahrs liegen. Besonders die Metallgehäuse für den Hochbau zeigen sehr gute Verkaufszahlen. PS erwähnt hier einen großen Auftrag aus Kasachstan, der für das hohe Auftragsvolumen ausschlaggebend ist.": "GS розповідає про виробництво металевих ящиків і металевих корпусів, яке йде без великих проблем і на які великий попит. Однак за ще більшого попиту на металеві корпуси нинішньої виробничої лінії може не вистачити. Тому GS радіє плануванню нової лінії. PS представляє нові показники продажів, які в останньому кварталі на 20 відсотків вищі, ніж у відповідному кварталі минулого року. Особливо добрі продажі показують металеві корпуси для висотного будівництва. PS згадує тут велике замовлення з Казахстану, яке є вирішальним для високого обсягу замовлень.", "TOP 4 Neue Mitarbeiterinnen und Mitarbeiter": "Пункт 4. Нові працівниці й працівники", "MN nennt die Namen von fünf neuen Mitarbeiterinnen und Mitarbeitern, drei Frauen und zwei Männern, die ab dem 1. des Monats im Betrieb in Vollzeit tätig sind.": "MN називає імена п'яти нових працівників — трьох жінок і двох чоловіків, які з 1-го числа місяця працюють на підприємстві повний день.", "TOP 5 Update der Software": "Пункт 5. Оновлення програмного забезпечення", "WL spielt am kommenden Freitag ab 19 Uhr ein Software-Update auf unser Computersystem. Daher darf am Freitag ab 19 Uhr niemand am Computer arbeiten. Die leicht überarbeitete Software hat einige Neuerungen. Allen Mitarbeiterinnen und Mitarbeitern werden diese Neuerungen in einem halbtägigen InfoWorkshop demonstriert. Es wird zeitversetzte Workshops geben. Die Termine dafür werden noch bekannt gegeben.": "Наступної п'ятниці з 19:00 WL встановлює оновлення програмного забезпечення на нашу комп'ютерну систему. Тому в п'ятницю з 19:00 ніхто не може працювати за комп'ютером. Трохи доопрацьоване програмне забезпечення має кілька нововведень. Усім працівницям і працівникам ці нововведення продемонструють на інформаційному воркшопі тривалістю пів дня. Воркшопи проходитимуть у різний час. Дати повідомлять пізніше.", "ML berichtet über den Stand der Planung eines Sommerfests, das etwas größer als in den vergangenen Jahren sein soll. Alle wichtigen Kunden und großen Lieferanten werden eingeladen. ML bittet alle Leiterinnen und Leiter, sich den 31. Juli freizuhalten. Der Ort steht auch schon fest. ML möchte ihn aber noch nicht nennen. Es soll eine Überraschung für alle sein, da der 31. Juli auch ihr 60. Geburtstag ist, den sie mit allen feiern möchte.": "ML розповідає про стан планування літнього свята, яке має бути трохи більшим, ніж у попередні роки. Запросять усіх важливих клієнтів і великих постачальників. ML просить усіх керівниць і керівників залишити вільним 31 липня. Місце теж уже визначене. Але ML поки не хоче його називати. Це має бути сюрпризом для всіх, бо 31 липня також її 60-й день народження, який вона хоче відсвяткувати з усіма.", "Das Protokoll": "Протокол", "der letzten Sitzung ist nach Überarbeitung genehmigt.": "останнього засідання затверджено після доопрацювання.", "nennt die Teilnehmer der Januar-Sitzung.": "називає учасників січневого засідання.", "wird heute von Frau Schäfer geschrieben.": "сьогодні пише пані Шефер.", "Die neue Fertigungsanlage": "Нова виробнича лінія", "kommt in die Werkshalle IV.": "буде в цеху IV.", "steht in einem Neubau." рсонал працюватиме в нас три години. Якщо вам для прибирання наших приміщень потрібно менше узгодженого часу, вам слід було повідомити нас про це, щоб ми змінили договір.", "Ich bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten Arbeitsstunden.": "Прошу негайно надати пояснення і, звісно, привести рахунок у відповідність до фактично відпрацьованих годин.", "Mit freundlichen Grüßen": "З повагою", "Theo Lassner": "Theo Lassner", "Sehr geehrter Herr Lassner,": "Шановний пане Ласснер,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Heute wurde mit unseren Mitarbeitern gesprochen und herausgefunden, dass der Grund dafür war, dass unser Dienstfahrzeug in Inspektion war. Deswegen mussten die Mitarbeiter 15 Minuten früher die Arbeit verlassen, um die öffentlichen Verkehrsmittel nicht zu verpassen. Wir möchten Ihnen versichern, dass sich diese Situation nicht wiederholen wird. Natürlich möchten wir Sie als treuen Kunden behalten, deswegen bieten wir Ihnen einen Rabatt auf die nächste Rechnung in Höhe von 20% an.": "щиро дякуємо за ваш учорашній відгук. Ми дуже шкодуємо про завдані незручності й просимо вибачення. Сьогодні ми поговорили з нашими працівниками й з'ясували, що причиною було те, що наш службовий автомобіль був на техогляді. Тому працівники мусили йти з роботи на 15 хвилин раніше, щоб не пропустити громадський транспорт. Запевняємо вас, що ця ситуація не повториться. Звісно, ми хочемо зберегти вас як постійного клієнта, тому пропонуємо вам знижку 20% на наступний рахунок.", "Wir freuen uns weiterhin auf eine Zusammenarbeit.": "Сподіваємося на подальшу співпрацю.", "Friederike Baumann": "Friederike Baumann", "Grund erklären (mit den Mitarbeitern gesprochen)": "Пояснити причину (поговорили з працівниками)", "Zusichern, dass so etwas nie wieder vorkommt": "Пообіцяти, що таке більше ніколи не повториться", "20 % Rabatt auf die nä
