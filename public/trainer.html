аді.", "Danke!": "Дякую!", "Elias Philips": "Elias Philips", "Sehr geehrter Herr Phillips,": "Шановний пане Філіпс,", "vergangene Woche habe ich bei Ihnen 15 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen.": "минулого тижня я замовила у вас 15 настільних ламп моделі TS 13 150 07 для наших нових офісних приміщень. Мені пообіцяли по телефону, що лампи доставлять ще цього тижня, але вже п'ятниця пообіді, а їх, на жаль, досі немає.", "Das ist sehr ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen.": "Це дуже прикро, бо на вихідних ми завершуємо ремонт і потім повністю заново облаштовуємо офіси. До цього, звісно, належать і лампи, бо в понеділок ми хочемо відновити роботу офісу в повністю придатних приміщеннях.", "Ich habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern könnte.": "Я вже кілька разів намагалася додзвонитися до вас і залишала повідомлення на автовідповідачі, але мені, на жаль, не передзвонили. Тим часом я знайшла постачальника, який міг би терміново доставити нам інші настільні лампи.", "Wenn Ihre Lampen also bis Montagmittag, 12:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort!": "Отже, якщо ваші лампи не надійдуть до нас до понеділка 12:00, я скасую замовлення у вас. Прошу швидко відповісти!", "Betta Lutz": "Betta Lutz", "Webseite": "Вебсайт", "Herr Stiller": "Пан Штіллер", "ist mit dem Entwurf der Agentur nicht einverstanden.": "не згоден з макетом агенції.", "möchte, dass Frau Spindler sich einen Entwurf ansieht.": "хоче, щоб пані Шпіндлер подивилася на один макет.", "möchte wissen, wer den Entwurf überarbeiten kann.": "хоче знати, хто може доопрацювати макет.", "Die Agentur sagt, dass sie": "Агенція каже, що вона", "Änderungen nur gegen Aufpreis macht .": "вносить зміни лише за додаткову плату.", "keine Fehler gemacht hat.": "не зробила жодних помилок.", "keine Vorgaben von Herrn Stiller hatte.": "не мала жодних вимог від пана Штіллера.", "Hallo Frau Holsten,": "Добрий день, пані Гольстен,", "ich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die verbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das fünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele Korrekturen waren nicht vereinbart!": "сьогодні в обід я отримала лист, що нижче. Переплутані імена — наша помилка, і ми її виправимо. Будь ласка, підтвердьте це клієнтові. Але більше справді нічого не вийде. Це вже вп'яте він просить про правки, хоча ми завжди дотримувалися вимог. Стільки правок не було домовлено!", "Wenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra. Bitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben.": "Якщо нам ще й це робити, то лише за додаткову оплату. Я розраховую на 200 (300) € додатково. Будь ласка, повідомте йому це й отримайте від нього згоду.", "Danke und viele Grüße": "Дякую і всього найкращого", "Jutta Spindler": "Jutta Spindler", "Sehr geehrte Frau Spindler,": "Шановна пані Шпіндлер,", "vielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:": "щиро дякую за ваш макет нашого нового сайту фірми. Я переглянув його разом із командою, і ми помітили, що ваша агенція, на жаль, у двох місцях не виконала вимог:", "Zum einen hatten wir besprochen, dass das Farbschema grau orange (grün blau) sein sollte. Da statt Grau Blau (Grün Grau) gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett.": "по-перше, ми домовлялися, що колірна схема буде сіро-помаранчева (зелено-синя). Оскільки замість сірого обрали синій (замість зеленого — сірий), думаю, сталося непорозуміння. По-друге, на сторінці з контактними особами переплутано імена кількох працівників. У вкладенні ще раз надсилаю вам список імен із відповідними фотографіями. Чи могли б ви виправити ці два пункти до початку наступного тижня? Буду вдячний за коротку відповідь.", "Franz Stiller": "Franz Stiller", "Sehr geehrter Herr Stiller,": "Шановний пане Штіллер,", "vielen Dank für Ihre Rückmeldung von heute. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Außerdem möchte ich Ihnen versichern, dass wir den Fehler im Nahmen bis Ende dieser Woche korrigieren werden. Bitte beachten Sie, dass das blau orange (grau blau) Farbschema in unserem Vertrag vereinbart ist. Zudem ist das schon die fünfte Bitte um Korrektur. So viele Korrekturen waren nicht vereinbart. Deswegen kostet jede weitere Korrektur 200 (300) €. Wenn Sie mit dieser Lösung einverstanden sind, geben Sie mir bitte Bescheid.": "щиро дякуємо за ваш сьогоднішній відгук. Ми дуже шкодуємо про завдані незручності й просимо вибачення. Крім того, хочу запевнити вас, що помилку в іменах ми виправимо до кінця цього тижня. Зверніть, будь ласка, увагу, що синьо-помаранчеву (сіро-синю) колірну схему погоджено в нашому договорі. До того ж це вже п'яте прохання про правки. Стільки правок не було домовлено. Тому кожна наступна правка коштує 200 (300) €. Якщо ви згодні з таким рішенням, будь ласка, повідомте мене.", "Vielen Dank für Ihr Verständnis.": "Щиро дякуємо за розуміння.", "Monika Holsten": "Monika Holsten", "Vertauschte Namen: unser Fehler, wird korrigiert": "Переплутані імена: наша помилка, виправимо", "Farbschema entspricht den Vorgaben / Vertrag": "Колірна схема відповідає вимогам / договору", "Schon die fünfte Korrektur: weitere nur gegen Aufpreis (200 / 300 €)": "Це вже п'ята правка: наступні лише за доплату (200 / 300 €)", "Um Zustimmung (Okay) des Kunden bitten": "Попросити згоди клієнта", "Spülmaschine": "Посудомийна машина", "Der Kunde": "Клієнт", "fordert eine neue Spülmaschine.": "вимагає нову посудомийну машину.", "hat einen Wasserschaden in der Küche.": "має пошкодження водою на кухні.", "beschwert sich über die Reparaturarbeiten.": "скаржиться на ремонтні роботи.", "Die Firma Küchenbedarf soll": "Фірма Küchenbedarf має", "die Reparatur der Spülmaschine in Rechnung stellen.": "виставити рахунок за ремонт посудомийної машини.", "innerhalb von zwei Tagen die Spülmaschine reparieren.": "протягом двох днів відремонтувати посудомийну машину.", "das Parkett in der Teeküche umgehend ersetzen.": "негайно замінити паркет на кухні для персоналу.", "Hallo Frau Retterstein,": "Добрий день, пані Реттерштайн,", "ich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat. Organisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und schreiben Sie Herrn Krüger.": "я щойно отримала лист, що нижче, від великого клієнта, який поскаржився. Будь ласка, якнайшвидше організуйте техніка, який огляне посудомийну машину, і напишіть панові Крюгеру.", "Entschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, dass wir seine Forderungen in seiner E-Mail prüfen werden.": "Будь ласка, вибачтеся за незручності й пообіцяйте йому, що ми розглянемо вимоги з його листа.", "Teilen Sie Herrn Krüger aber bitte vorsorglich mit, dass die Reparatur eventuell nicht sofort durchgeführt werden kann, falls wir Ersatzteile bestellen müssen.": "Але про всяк випадок повідомте пана Крюгера, що ремонт, можливо, не вдасться зробити одразу, якщо нам доведеться замовляти запчастини.", "Dorothee Sturm": "Dorothee Sturm", "Sehr geehrte Frau Sturm,": "Шановна пані Штурм,", "vor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.": "тиждень тому ми купили у вас посудомийну машину для нашої кухні для персоналу. Її дуже швидко доставили й одразу встановили. Але, на жаль, сьогодні мушу вам повідомити, що вона вже несправна. Під час миття витекла вода, і тепер наш паркет пошкоджений.", "Ich bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen.": "Прошу негайно надіслати нам техніка, який відремонтує пристрій. Посудомийна машина потрібна нам щонайпізніше післязавтра, бо в нас велика нарада виїзних працівників і доведеться пригощати багато людей.", "Außerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.": "Крім того, нам доведеться замінити частину паркету. Рахунок за це ми виставимо вам.", "Bitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank!": "Будь ласка, якнайшвидше надішліть мені пропозицію дати ремонту та підтвердження, що ви покриєте витрати. Щиро дякую!", "Claudio Krüger": "Claudio Krüger", "Sehr geehrter Herr Krüger,": "Шановний пане Крюгер,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Unserer Techniker könnte am kommenden Montag 27.05.2024 um 8:00 Uhr kommen, um die Spülmaschine und das beschädigten Parkett zu überprüfen. Bitte teilen Sie uns mit, ob der Termin stattfinden kann. Beachten Sie, dass falls wir Ersatzteile für die Reparatur bestellen müssen, keine umgehende Reparatur möglich ist. Detaillierte Information können wir Ihnen nach der Überprüfung geben. Wir danken Ihnen für Ihr Verständnis.": "щиро дякуємо за ваш учорашній відгук. Ми дуже шкодуємо про завдані незручності й просимо вибачення. наш технік міг би прийти наступного понеділка, 27.05.2024, о 8:00, щоб оглянути посудомийну машину і пошкоджений паркет. Будь ласка, повідомте нас, чи підходить вам цей час. Зверніть увагу: якщо для ремонту доведеться замовляти запчастини, негайний ремонт неможливий. Докладнішу інформацію ми зможемо надати після огляду. Дякуємо вам за розуміння.", "Anika Retterstein": "Anika Retterstein", "Für die Unannehmlichkeiten entschuldigen": "Вибачитися за незручності", "Termin für einen Techniker vorschlagen": "Запропонувати дату візиту техніка", "Forderungen (Parkett) werden geprüft": "Вимоги (паркет) буде розглянуто", "Hinweis: Reparatur evtl. nicht sofort, falls Ersatzteile bestellt werden müssen": "Попередити: ремонт, можливо, не одразу, якщо треба замовляти запчастини", "Umzug": "Переїзд", "Herr Zaun beschwert sich über": "Пан Цаун скаржиться на", "die Mitarbeiter der Firma.": "працівників фірми.", "die Qualität von Produkten.": "якість продукції.", "eine ausbleibende Lieferung.": "недоставлений товар.", "Herr Zaun": "Пан Цаун", "ist nach Hanau gezogen.": "переїхав до Ганау.", "musste seinen Umzug verschieben.": "мусив перенести свій переїзд.", "verlangt Schadensersatz.": "вимагає відшкодування збитків.", "Beim Umzug": "Під час переїзду", "haben vier Möbelpacker gearbeitet.": "працювали четверо вантажників.", "kam es zu Verzögerungen.": "сталися затримки.", "wurden nicht alle Möbel transportiert.": "перевезли не всі меблі.", "Herr Lozano": "Пан Лосано", "Hallo Frau Kühne,": "Добрий день, пані Кюне,", "bitte schauen Sie sich mal die unten stehende E-Mail an.": "будь ласка, подивіться лист, що нижче.", "Da ist wohl was schiefgegangen. Bitte schreiben Sie Herrn Zaun / Lozano und erklären Sie ihm, warum es zu den Fehlern gekommen ist. Sagen Sie ihm zu, dass am Mittwochmorgen pünktlich zwei Männer da sein werden, die alles fertig machen.": "Схоже, щось пішло не так. Будь ласка, напишіть панові Цауну / Лосано і поясніть йому, чому сталися помилки. Пообіцяйте йому, що в середу вранці вчасно прийдуть двоє чоловіків, які все завершать.", "Natürlich übernehmen wir auch die Verantwortung für die entstandenen Schäden.": "Звісно, ми також беремо на себе відповідальність за завдані збитки.", "Die Firma hat uns das erste Mal gebucht und ich würde ungern einen negativen Eindruck hinterlassen. Ich verlasse mich auf Sie.": "Ця фірма замовила нас уперше, і я не хотіла б залишити негативне враження. Я на вас покладаюся.", "Frieda Börne / Sophia Prince": "Frieda Börne / Sophia Prince", "Sehr geehrte Frau Börne, / Prince": "Шановна пані Берне / Прінс,", "am Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.": "на вихідних наш офіс за допомогою вашого підприємства переїхав з Ганау до Франкфурта. На жаль, ми були зовсім не задоволені вашим сервісом.", "Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.": "Ваші працівники запізнилися на пів години і прийшли лише втрьох, а не вчотирьох, як домовлялися. Тому весь переїзд, звісно, тривав довше, ніж планували, і деякі роботи ще не завершені: ще не всі меблі зібрані, тому ми досі не змогли розкласти свої речі.", "Bitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt.": "Тому, будь ласка, надішліть нам у середу вранці ще двох людей, які зберуть меблі. Крім того, розбилися скляні панелі, а кілька шаф подряпані. Я виходжу з того, що ваша фірма покриє ці витрати.", "Thomas Zaun / Matteo Lozano": "Thomas Zaun / Matteo Lozano", "Sehr geehrter Herr Zaun, / Lozano": "Шановний пане Цаун / Лосано,", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Der Grund dafür war, dass unsere Mitarbeiter auf dem Weg zu Ihnen eine kleine Autopanne hatten. Außerdem hatten sich einige Mitarbeiter in der letzten Woche krank gemeldet, was zu Personalmangel führte. Wir möchten Ihnen versichern, dass diese Situation sich nicht wiederholen wird. Zudem werden zwei unserer Mitarbeiter am Mittwochmorgen pünktlich bei Ihnen sein. Natürlich möchten wir Sie als Kunden zufriedenstellen, deswegen übernehmen wir die Kosten für die beschädigten Möbel.": "щиро дякуємо за ваш учорашній відгук. Ми дуже шкодуємо про завдані незручності й просимо вибачення. причиною було те, що дорогою до вас у наших працівників сталася невелика поломка автомобіля. Крім того, минулого тижня кілька працівників узяли лікарняний, що призвело до нестачі персоналу. Запевняємо вас, що ця ситуація не повториться. Крім того, двоє наших працівників будуть у вас у середу вранці вчасно. Звісно, ми хочемо, щоб ви були задоволені як клієнт, тому покриємо витрати за пошкоджені меблі.", "Monika Kühne": "Monika Kühne", "Erklären, warum es zu den Fehlern gekommen ist": "Пояснити, чому сталися помилки", "Mittwochmorgen kommen pünktlich zwei Männer für den Aufbau": "У середу вранці вчасно прийдуть двоє чоловіків для збирання меблів", "Verantwortung für die Schäden übernehmen": "Взяти на себе відповідальність за збитки", "Positiven Eindruck hinterlassen (Kunde bucht zum ersten Mal)": "Залишити позитивне враження (клієнт замовив уперше)", "Der Drucker": "Принтер", "(тест №150321, 150301)": "(тест №150321, 150301)", "Das Gerät": "Пристрій", "ist erst seit Kurzem im Einsatz.": "використовується лише нещодавно.", "muss noch mal überprüft werden.": "треба ще раз перевірити.", "wurde immer richtig bedient.": "завжди використовували правильно.", "Die Firma Copyprofi": "Фірма Copyprofi", "besteht auf der Bezahlung der Rechnungen.": "наполягає на оплаті рахунків.", "repariert den Kopierer noch einmal kostenfrei.": "ще раз безкоштовно відремонтує копір.", "tauscht das Gerät schnellstmöglich aus.": "якнайшвидше замінить пристрій.", "Beim Gerät": "З пристроєм", "handelt sich um ein älteres Modell.": "— ідеться про стару модель.", "kommt es häufig zu Papierstaus.": "часто трапляється застрягання паперу.", "wurde es nur einmal überprüft.": "перевіряли лише один раз.", "Herr Schmidt": "Пан Шмідт", "verlangt die Lieferung eines neuen Geräts.": "вимагає доставити новий пристрій.", "möchte weitere Technikertermine vereinbaren.": "хоче домовитися про інші візити техніка.", "akzeptiert die bisherigen Rechnungen.": "погоджується з попередніми рахунками.", "schau dir mal die Mail von der Firma Mova an. Laut unserem Techniker lag der Fehler erneut an der falschen Bedienung des Geräts. Antworte Herrn Schmidt bitte und weise ihn höflich daraufhin, dass die Lösung des Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter* innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben die Angelegenheit der Mova GmbH.": "подивися лист від фірми Mova. За словами нашого техніка, помилка знову сталася через неправильне користування пристроєм. Будь ласка, відповідай панові Шмідту і ввічливо вкажи йому, що розв'язання проблеми не належить до нашої відповідальності. Технік охоче ще раз прийде на фірму і безкоштовно проінструктує працівників, як користуватися пристроєм. Витрати на перевірку пристрою залишаються справою Mova GmbH.", "Viele Grüße": "Всього найкращого", "Sibyl Aichele": "Sibyl Aichele", "Sehr geehrte Frau Aichele,": "Шановна пані Айхеле,", "vorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.": "позавчора один із ваших працівників утретє за два тижні перевіряв наш майже новий друкарсько-копіювальний пристрій марки Lexios, бо в ньому раз у раз застрягав папір. Учора знову з'явилося повідомлення про помилку, внаслідок чого ми не змогли вчасно подати документи. Через це ми пропустили дуже важливий для нас тендер. Від вимоги відшкодування збитків ми поки що утримуємося, але вимагаємо негайно доставити нам за ваш рахунок інший пристрій. Адже тут однозначно технічна несправність, за яку ми не несемо відповідальності. Рахунки за три попередні виїзди техніка ми, звісно, не оплачуватимемо.", "Ich erwarte Ihre umgehende Rückmeldung.": "Чекаю на вашу негайну відповідь.", "Benno Schmidt": "Benno Schmidt", "Sehr geehrter Herr Schmidt,": "Шановний пане Шмідт,", "bezugnehmend auf Ihre Beschwerde entschuldigen wir uns für die Unannehmlichkeiten. Es tut uns leid, dass ein Fehler im Drucker aufgetreten ist. Nach Rücksprache mit unserem Techniker wurde festgestellt, dass die Fehler auf eine fehlerhafte Bedienung des Geräts zurückzuführen sind. Wir möchten Sie daher höflich darauf hinweisen, dass die Lösung dieses Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter*innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben bei Ihnen.": "щодо вашої скарги — просимо вибачення за незручності. Нам шкода, що в принтері сталася несправність. Після консультації з нашим техніком встановлено, що помилки спричинені неправильним користуванням пристроєм. Тому ми хочемо ввічливо звернути вашу увагу, що розв'язання цієї проблеми не належить до нашої відповідальності. Технік охоче ще раз прийде на фірму і безкоштовно проінструктує працівників, як користуватися пристроєм. Витрати на перевірку пристрою залишаються за вами.", "Wir hoffen, dass Sie trotz des Vorfalls auch weiterhin unser treuer Kunde bleiben.": "Сподіваємося, що попри цей випадок ви й надалі залишитеся нашим постійним клієнтом.", "Sehr geehrte/r Frau/Herr …,": "Шановна пані / шановний пане …,", "vielen Dank für Ihre E-Mail. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten, die Ihnen entstanden sind. Wir möchten Ihnen mitteilen, dass unsere Firma nur dann Verantwortung übernimmt, wenn die Drucker technische Probleme mit internen Teilen haben. Bei den letzten drei Einsätzen unseres Technikers zur Reparatur Ihres Geräts haben wir festgestellt, dass das Problem nicht auf technische Gründe zurückzuführen ist. Vielmehr funktioniert Ihr Gerät aufgrund falscher Einstellungen nicht ordnungsgemäß, was auf unsachgemäße Nutzung des Geräts zurückzuführen ist. Aus diesem Grund möchten wir Ihnen mitteilen, dass wir dieses Mal einen Techniker kostenfrei zu Ihnen schicken werden, aber Sie die Rechnungen für die letzten drei Einsätze bezahlen müssen. Wenn Sie weitere Fragen oder Anregungen haben, können Sie sich jederzeit an uns wenden. Vielen Dank für Ihr Verständnis.": "щиро дякуємо за ваш лист. Щиро просимо вибачення за незручності, яких ви зазнали. Хочемо повідомити, що наша фірма бере на себе відповідальність лише тоді, коли принтери мають технічні проблеми з внутрішніми деталями. Під час останніх трьох виїздів нашого техніка для ремонту вашого пристрою ми встановили, що проблема не має технічних причин. Радше ваш пристрій працює неналежно через неправильні налаштування, що пов'язано з неправильним користуванням ним. Тому хочемо повідомити, що цього разу ми безкоштовно надішлемо до вас техніка, але рахунки за останні три виїзди вам доведеться оплатити. Якщо у вас є інші запитання чи пропозиції, ви можете будь-коли звернутися до нас. Щиро дякуємо за розуміння.", "Höflich: Fehler lag an falscher Bedienung, nicht in unserer Verantwortung": "Ввічливо: помилка через неправильне користування, це не наша відповідальність", "Techniker kommt noch einmal und weist kostenfrei ein": "Технік прийде ще раз і безкоштовно проведе інструктаж", "Kosten für die Überprüfung trägt der Kunde": "Витрати на перевірку несе клієнт", "(Новый вариант от 01.2025)": "(Новий варіант від 01.2025)", "Guten Morgen,": "Доброго ранку,", "Vor einer Stunde erhielt ich diese E-Mail von der Cavone GmbH.": "годину тому я отримав цей лист від Cavone GmbH.", "Nach Angaben unseres Technikers lag der Fehler wiederum bei der Cavone GmbH. Bitte antworten Sie Frau Zeller und weisen Sie höflich darauf hin, dass es nicht in unserer Verantwortung liegt, das Problem zu lösen.": "За словами нашого техніка, помилка знову була на боці Cavone GmbH. Будь ласка, дайте відповідь пані Целлер і ввічливо вкажіть, що розв'язання проблеми не належить до нашої відповідальності.", "Der Techniker kommt gerne wieder ins Unternehmen und führt die Mitarbeiter kostenlos durch den Prozess.": "Технік охоче знову прийде на підприємство і безкоштовно проведе працівників через увесь процес.", "Bitte teilen Sie ihr außerdem mit, dass die Kosten für die Untersuchung des Geräts weiterhin von ihrem Unternehmen, der Cavone GmbH, getragen werden.": "Також, будь ласка, повідомте їй, що витрати на огляд пристрою й надалі несе її підприємство, Cavone GmbH.", "Paco Brenner": "Paco Brenner", "Sehr geehrter Herr Brenner,": "Шановний пане Бреннер,", "vor drei Tagen hat einer Ihrer Mitarbeiter das neue ABC-Druck-, Kopier- und Faxgerät inspiziert.": "три дні тому один із ваших працівників оглянув новий друкарсько-копіювально-факсовий пристрій ABC.", "Dies war das zweite Mal innerhalb einer Woche, dass beim Versenden eines Faxes ein Fehlerzeichen auftrat.": "Це вже вдруге за тиждень під час надсилання факсу з'являвся знак помилки.", "Leider kam gestern wieder eine Fehlermeldung, und wir sollten einige wichtige Unterlagen zum Treffen per Fax verschicken. Wir konnten diese jedoch nicht rechtzeitig versenden. Deshalb haben wir einen für uns sehr wichtigen Deal verloren. Wir sehen derzeit von Schadensersatzansprüchen ab, bitten Sie jedoch, uns umgehend und auf Ihre Kosten ein anderes Gerät zuzusenden.": "На жаль, учора знову з'явилося повідомлення про помилку, а ми мали надіслати факсом кілька важливих документів до зустрічі. Однак ми не змогли надіслати їх вчасно. Через це ми втратили дуже важливу для нас угоду. Поки що ми не висуваємо вимог про відшкодування збитків, але просимо негайно надіслати нам за ваш рахунок інший пристрій.", "Offensichtlich handelt es sich hierbei um einen technischen Fehler, für den wir keine Verantwortung übernehmen.": "Очевидно, тут ідеться про технічну несправність, за яку ми не несемо відповідальності.", "Selbstverständlich übernehmen wir auch keine Rechnungen für vorangegangene technische Arbeiten.": "Звісно, ми також не оплачуватимемо рахунки за попередні технічні роботи.", "Ich hoffe, dass wir schnellstmöglich eine Antwort von Ihnen erhalten.": "Сподіваюся якнайшвидше отримати від вас відповідь.", "Vala Zeller": "Vala Zeller", "Sehr geehrte Frau Zeller,": "Шановна пані Целлер,", "vielen Dank für Ihre E-Mail und die Schilderung des Sachverhalts. Nach eingehender Prüfung des Problems durch unseren Techniker liegt die Ursache des Fehlers nicht in unserem Verantwortungsbereich, sondern bei der Cavone GmbH. Daher können wir Ihrem Wunsch nach einem kostenlosen Austausch des Geräts nicht entsprechen. Dennoch möchten wir Ihnen entgegenkommen und bieten an, dass unser Techniker gerne bereit ist, Ihr Unternehmen erneut zu besuchen und Ihre Mitarbeiter kostenlos durch den Prozess zu führen, um mögliche Fehlerquellen auszuschließen und eine reibungslose Nutzung des Geräts sicherzustellen. Bitte beachten Sie zudem, dass die Kosten für die Untersuchung des Geräts gemäß unseren Vereinbarungen weiterhin von der Cavone GmbH zu tragen sind. Wir hoffen auf Ihr Verständnis und stehen Ihnen bei weiteren Fragen oder Anliegen jederzeit gerne zur Verfügung.": "щиро дякуємо за ваш лист і опис ситуації. Після ретельної перевірки проблеми нашим техніком причина помилки лежить не в межах нашої відповідальності, а на боці Cavone GmbH. Тому ми не можемо задовольнити ваше прохання про безкоштовну заміну пристрою. Проте ми хочемо піти вам назустріч і пропонуємо, щоб наш технік знову відвідав ваше підприємство і безкоштовно провів ваших працівників через увесь процес, щоб виключити можливі джерела помилок і забезпечити безперебійну роботу пристрою. Крім того, зверніть увагу, що згідно з нашими домовленостями витрати на огляд пристрою й надалі несе Cavone GmbH. Сподіваємося на ваше розуміння і завжди охоче допоможемо з іншими питаннями чи проханнями.", "Höflich: Fehler liegt nicht in unserer Verantwortung": "Ввічливо: помилка не належить до нашої відповідальності", "Techniker kommt wieder und führt die Mitarbeiter kostenlos ein": "Технік прийде знову і безкоштовно проведе інструктаж для працівників", "Kosten für die Untersuchung trägt weiterhin der Kunde": "Витрати на огляд і далі несе клієнт", "Die falsche Rechnung": "Неправильний рахунок", "hat falsche Waren vom Lieferanten erhalten.": "отримав від постачальника не той товар.", "meldet eine unvollständige Sendung.": "повідомляє про неповну поставку.", "weist auf falsche Posten in der Zahlungsaufforderung hin.": "вказує на неправильні позиції в рахунку до оплати.", "Die Rechnung": "Рахунок", "hat 100 Pinsel nicht aufgeführt.": "не містить 100 пензлів.", "ist ohne Preisnachlass ausgestellt worden.": "виставлено без знижки.", "wurde an einen falschen Adressaten geschickt.": "надіслано не тому адресатові.", "ich habe heute die unten stehende E-Mail erhalten. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Die Firma \"Meier\" ist ein langjähriger Kunde von uns. Wir können es uns nicht leisten, ihn zu verlieren. Schreiben Sie ihm bitte von unserem Computerproblem und wie wir es gelöst haben. Natürlich bekommt er den Rabatt wie gewohnt.": "сьогодні я отримала лист, що нижче. Будь ласка, займіться цим і ввічливо дайте відповідь клієнтові. Фірма «Meier» — наш давній клієнт. Ми не можемо дозволити собі його втратити. Будь ласка, напишіть йому про нашу проблему з комп'ютером і про те, як ми її розв'язали. Звісно, він отримує знижку, як зазвичай.", "Vielen Dank.": "Щиро дякую.", "Anna Hoffner": "Anna Hoffner", "Sehr geehrte Frau Hoffner,": "Шановна пані Гоффнер,", "wir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen.": "ми отримали вашу поставку і цілком задоволені всіма товарами. На жаль, мушу звернути вашу увагу, що в рахунку є деякі розбіжності: по-перше, замість 100 штук пензлів розміру M нараховано 200 штук. Крім того, нараховано 20 банок червоної фарби. Але ми замовляли й отримали зелену фарбу, яка дешевша. Просимо це виправити. Також ми були здивовані, що в цьому рахунку не надано нашої звичайної знижки 10%. Мабуть, це недогляд.", "Wir bitten um Berichtigung der Rechnung und erneute Zusendung.": "Просимо виправити рахунок і надіслати його знову.", "Karl Schmidt": "Karl Schmidt", "Sehr geehrter Herr Friedrien,": "Шановний пане Фрідрін,", "vielen Dank für Ihre E-Mail und Ihre Geduld. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten und die Unstimmigkeiten auf Ihrer Rechnung. Leider gab es ein Computerproblem, welches die fehlerhafte Berechnung verursacht hat. Dieses Problem wurde mittlerweile behoben.": "щиро дякуємо за ваш лист і терпіння. Щиро просимо вибачення за незручності та розбіжності у вашому рахунку. На жаль, сталася проблема з комп'ютером, яка спричинила неправильний розрахунок. Цю проблему тим часом усунуто.", "Selbstverständlich haben wir Ihren Auftrag überprüft und die erforderlichen Korrekturen vorgenommen. Die korrekte Anzahl der Pinsel sowie die von Ihnen bestellte grüne Farbe wurden in der neuen Rechnung entsprechend angepasst. Auch Ihr üblicher Rabatt von 10 % wurde nun berücksichtigt.": "Звісно, ми перевірили ваше замовлення і внесли необхідні виправлення. Правильну кількість пензлів, а також замовлену вами зелену фарбу відповідно скориговано в новому рахунку. Вашу звичайну знижку 10% тепер теж враховано.", "Wir haben eine neue, korrigierte Rechnung an Sie gesendet. Bei weiteren Fragen oder Anliegen stehen wir Ihnen jederzeit gerne zur Verfügung. Wir schätzen Ihre langjährige Partnerschaft und freuen uns auf die weitere Zusammenarbeit mit Ihnen.": "Ми надіслали вам новий, виправлений рахунок. З інших питань чи прохань ми завжди охоче вам допоможемо. Ми цінуємо наше багаторічне партнерство і раді подальшій співпраці з вами.", "Höflich entschuldigen": "Ввічливо вибачитися", "Computerproblem erklären und wie es gelöst wurde": "Пояснити проблему з комп'ютером і як її розв'язали", "Korrigierte Rechnung zusenden": "Надіслати виправлений рахунок", "Rabatt wie gewohnt gewähren (10 %)": "Надати знижку, як зазвичай (10%)", "Der Kunde Joachim Schmidt": "Клієнт Йоахім Шмідт", "ist ein neuer Kunde.": "— новий клієнт.", "ist mit der gelieferten Ware zufrieden.": "задоволений доставленим товаром.", "braucht keine neue Rechnung.": "не потребує нового рахунку.", "Die Malerbedarffirma": "Фірма товарів для малярів", "gewährt Herrn Schmidt zum ersten Mal Rabatt.": "уперше надає панові Шмідту знижку.", "gewährt immer bei Herrn Schmidt einen Rabatt in Höhe 5%.": "завжди надає панові Шмідту знижку 5%.", "hatte Computerprobleme, die zu Fehlern in der Rechnung führte.": "мала проблеми з комп'ютерами, які призвели до помилок у рахунку.", "ich habe gestern die unten stehende Mail erhalten. Bitte kümmere dich darum und antworte dem Kunden höflich. Die Firma Lacke und Farben ist ein langjähriger, guter Kunde. Wir können es uns nicht leisten, ihn zu verlieren. Du kannst ihm ruhig von unseren Computerproblemen berichten und wie wir sie gelöst haben. Selbstverständlich kriegt er den Rabatt wie immer.": "учора я отримала лист, що нижче. Будь ласка, займися цим і ввічливо відповідай клієнтові. Фірма «Lacke und Farben» — давній, добрий клієнт. Ми не можемо дозволити собі його втратити. Можеш спокійно розповісти йому про наші проблеми з комп'ютерами і про те, як ми їх розв'язали. Звісно, він отримує знижку, як завжди.", "Vielen Dank und liebe Grüße": "Щиро дякую і всього найкращого", "Sonja": "Sonja", "Sehr geehrte Frau Klein,": "Шановна пані Кляйн,", "wir haben Ihre Lieferung wie gewohnt zu unserer vollsten Zufriedenheit erhalten. Alle Artikel entsprechen absolut unseren Vorstellungen.": "ми, як завжди, отримали вашу поставку й цілком нею задоволені. Усі товари повністю відповідають нашим очікуванням.", "Leider muss ich Sie darauf hinweisen, dass in der beigelegten Rechnung einige Unstimmigkeiten aufgetreten sind. Zunächst wurden statt der 100 Stück Pinsel Größe S 200 Stück berechnet. Außerdem wurden 50 Töpfe rote Farbe aufgeführt. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten das zu korrigieren. Ferner waren wir verwundert, dass uns der übliche Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Dies ist wahrscheinlich ein Versehen.": "На жаль, мушу звернути вашу увагу, що в доданому рахунку виявилися деякі розбіжності. По-перше, замість 100 штук пензлів розміру S нараховано 200 штук. Крім того, зазначено 50 банок червоної фарби. Але ми замовляли й отримали зелену фарбу, яка дешевша. Просимо це виправити. Також ми були здивовані, що в цьому рахунку нам не надали звичайної знижки 10%. Мабуть, це недогляд.", "Joachim Schmidt": "Joachim Schmidt", "Computerprobleme erklären und wie sie gelöst wurden": "Пояснити проблеми з комп'ютерами і як їх розв'язали", "Rabatt wie immer gewähren (10 %)": "Надати знижку, як завжди (10%)", "Die Lieferung": "Поставка", "Verzögerung bei der Lieferung 100 T-Shirts": "Затримка поставки 100 футболок", "wir möchten uns für die Verzögerung bei der Lieferung Ihrer 100 T-Shirts entschuldigen. Wir haben Ihre Bestellung erhalten und Ihre Zahlung wurde erfolgreich abgewickelt, aber es gab unerwartete Verzögerungen beim Versand. Wir arbeiten daran das Problem so schnell wie möglich zu lösen und werden Sie über den Fortschritt auf dem Laufenden halten. Bitte überprüfen Sie auch Ihre Lieferadresse und Versandmethode, um sicherzustellen, dass sie korrekt sind und dass Ihre T-Shirts so bald wie möglich zu Ihnen geliefert werden.": "ми хочемо вибачитися за затримку поставки ваших 100 футболок. Ми отримали ваше замовлення, і ваш платіж успішно оброблено, але під час відправлення виникли неочікувані затримки. Ми працюємо над тим, щоб якнайшвидше розв'язати проблему, і повідомлятимемо вас про хід справ. Будь ласка, також перевірте вашу адресу доставки і спосіб відправлення, щоб переконатися, що вони правильні і футболки доставлять вам якнайшвидше.", "Wir haben verstanden, dass Sie einen Rabatt wünschen, aber unser Unternehmen ist bestrebt, unseren Kunden eine hochwertige Dienstleistung und Produkte anzubieten. Anstatt eines Rabatts, würden wir Ihnen gerne die Versandkosten erstatten oder Ihnen einen Gutschein für zukünftige Einkäufe anbieten. Wir hoffen, dass diese Lösung Ihre Zufriedenheit sicherstellen wird.": "Ми зрозуміли, що ви бажаєте знижку, але наше підприємство прагне пропонувати клієнтам якісні послуги й продукцію. Замість знижки ми охоче відшкодуємо вам витрати на доставку або запропонуємо ваучер на майбутні покупки. Сподіваємося, що це рішення вас задовольнить.", "Falls Sie weitere Fragen oder Bedenken haben, stehen wir Ihnen gerne zu Verfügung.": "Якщо у вас є інші запитання чи сумніви, ми охоче допоможемо.", "Für die Verzögerung entschuldigen": "Вибачитися за затримку", "Grund der Verzögerung nennen": "Назвати причину затримки", "Statt Rabatt eine Alternative anbieten (Versandkosten / Gutschein)": "Замість знижки запропонувати альтернативу (витрати на доставку / ваучер)", "Die mangelhafte Lieferung": "Неякісна поставка", "Herr Schramm": "Пан Шрамм", "bemängelt Qualität und Menge der Lieferung.": "має претензії до якості й кількості поставки.", "fand die gesamte Lieferung beschädigt vor.": "отримав усю поставку пошкодженою.", "verlangt wegen der Lieferungsverzögerung einen Rabatt.": "вимагає знижку через затримку поставки.", "Die Nachlieferung": "Допоставку", "bezahlt der Kunde.": "оплачує клієнт.", "kommt im Sommer.": "буде влітку.", "umfasst 50 T-Shirts.": "становитиме 50 футболок.", "mich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Entschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60% ist unverschämt. Bieten Sie ihm eine andere Lösung an. Die Nachlieferung der T-Shirts ist leider wegen unserer Mitarbeitersituation erst bis zum 12.05. möglich. Erklären Sie den Grund.": "до мене надійшов лист, що нижче. Будь ласка, займіться цим і ввічливо дайте відповідь клієнтові. Вибачтеся за забруднений товар. Вимога знижки 60% — це нахабство. Запропонуйте йому інше рішення. Допоставка футболок, на жаль, через ситуацію з персоналом можлива лише до 12.05. Поясніть причину.", "Vielen Dank": "Щиро дякую", "Siegfried Mayer": "Siegfried Mayer", "Teamleiter": "керівник команди", "Sehr geehrter Herr Mayer,": "Шановний пане Маєр,", "leider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen zwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den regulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60% für angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche Nachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige Vorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung.": "на жаль, мусимо повідомити, що ваша поставка нас не задовольнила. Маємо дві претензії. По-перше, упаковки штанів (розміри M і L) пошкодили під час транспортування, тож вміст забруднений. У такому стані ми в жодному разі не можемо пустити товар у звичайний продаж, а можемо запропонувати лише зі знижкою. Тому вважаємо доречною знижку 60%. Крім того, повідомляємо, що з футболок із принтом замість оплачених 100 штук доставлено лише половину. Через початок літнього сезону просимо якнайшвидше допоставити відсутню кількість за ваш рахунок щонайпізніше до 10.05. Сподіваємося, що подібних випадків у майбутньому вдасться уникнути, і просимо оперативно все владнати.", "Matthias Schramm": "Matthias Schramm", "Sehr geehrter Herr Schramm,": "Шановний пане Шрамм,", "vielen Dank für Ihre E-Mail, in der Sie uns darüber informieren, dass Sie mit der gelieferten Ware nicht zufrieden sind. Wir entschuldigen uns für die verschmutzten Hosen, können Ihnen aber keinen Preisnachlass in Höhe von 60 Prozent geben. Bitte schicken Sie uns die Hosen zurück. Wir werden Ihnen die Hosen in Größe M und L erneut in einwandfreier Qualität schicken. Aufgrund eines hohen Krankenstandes in unserer Firma ist die Nachlieferung der T-Shirts erst zum 12.05. möglich. Ich hoffe, dass Sie damit einverstanden sind. Bitte lassen Sie uns wissen, ob Sie mit unserem Vorschlag einverstanden sind.": "щиро дякуємо за ваш лист, у якому ви повідомляєте, що незадоволені доставленим товаром. Просимо вибачення за забруднені штани, але не можемо надати вам знижку 60 відсотків. Будь ласка, надішліть нам штани назад. Ми знову надішлемо вам штани розмірів M і L в бездоганній якості. Через високий рівень захворюваності на нашій фірмі допоставка футболок можлива лише до 12.05. Сподіваюся, ви з цим погодитеся. Будь ласка, повідомте нам, чи згодні ви з нашою пропозицією.", "vielen Dank für Ihre E-Mail und für die Hinweise zu unserer letzten Lieferung. Wir bedauern die Unannehmlichkeiten und entschuldigen uns für die verschmutzten Waren sowie die unvollständige Lieferung.": "щиро дякуємо за ваш лист і за зауваження щодо нашої останньої поставки. Ми шкодуємо про незручності й просимо вибачення за забруднений товар і неповну поставку.", "Zu den beschädigten Hosen bieten wir Ihnen einen Preisnachlass von 20 % an. Alternativ können Sie uns die Artikel zurücksenden, und wir liefern Ersatz. Der von Ihnen vorgeschlagene Nachlass von 60 % ist leider nicht möglich.": "Щодо пошкоджених штанів пропонуємо вам знижку 20%. Як альтернатива, ви можете повернути нам ці товари, і ми доставимо заміну. Запропонована вами знижка 60%, на жаль, неможлива.", "Die fehlenden T-Shirts werden wir schnellstmöglich nachliefern, jedoch ist dies aufgrund unserer aktuellen Personalsituation erst bis zum 12.05. realisierbar. Die zusätzlichen Versandkosten übernehmen selbstverständlich wir. Wir entschuldigen uns nochmals und danken Ihnen für Ihr Verständnis. Sollten Sie weitere Fragen haben, stehen wir Ihnen gerne zur Verfügung.": "Відсутні футболки ми допоставимо якнайшвидше, але через нинішню ситуацію з персоналом це можливо лише до 12.05. Додаткові витрати на доставку ми, звісно, беремо на себе. Ще раз просимо вибачення і дякуємо за розуміння. Якщо у вас є інші запитання, ми охоче допоможемо.", "Für die verschmutzte Ware entschuldigen": "Вибачитися за забруднений товар", "60 % Rabatt ablehnen und eine andere Lösung anbieten": "Відхилити знижку 60% і запропонувати інше рішення", "Nachlieferung erst bis 12.05. möglich": "Допоставка можлива лише до 12.05.", "Grund nennen: Mitarbeitersituation": "Назвати причину: ситуація з персоналом", "Pflanzenlieferung": "Поставка рослин", "Der Lieferant hat": "Постачальник", "die Dekoration passend zum Thema ausgewählt.": "дібрав декор відповідно до теми.", "die falsche Blumenauswahl getroffen.": "зробив неправильний вибір квітів.", "Ersatzsträuße aus der Region bestellt.": "замовив букети на заміну з регіону.", "Der Veranstalter musste": "Організатор мусив", "an einen Aussteller Blumen liefern.": "доставити квіти одному з експонентів.", "auf die Beschwerden der Besucher reagieren.": "реагувати на скарги відвідувачів.", "den Umweltpreis ohne Blumen überreichen.": "вручити екологічну премію без квітів.", "die folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los?": "учора до мене надійшов такий лист. Що ж там сталося?", "Bitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir schätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit, was wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten.": "Будь ласка, ввічливо дайте відповідь клієнтці й запропонуйте варіанти нашої подальшої співпраці. Ми цінуємо пані Тальгайм як давню клієнтку і тому не хочемо її втратити. Також, будь ласка, повідомте їй, що ми пропонуємо як компенсацію за завдані незручності.", "Vielen Dank und viele Grüße": "Щиро дякую і всього найкращого", "Michael Herrmann": "Michael Herrmann", "Sehr geehrter Herr Herrmann,": "Шановний пане Германн,", "leider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung.": "на жаль, мусимо повідомити, що ваш вибір рослин і квітів для нашого останнього заходу був зовсім недоречним. Як ви знаєте, тема нашої виставки минулого тижня була: «Сталий розвиток та екологічність у садівництві — локально й регіонально». А ви розмістили біля входу екзотичні рослини, привезені з далеких країн, що, зрозуміло, викликало скарги відвідувачів. Крім того, ми хотіли вручити цьогорічну екологічну премію разом із букетами квітів. Але в них були орхідеї. Як це поєднується з темою «регіонально»? Тому в цій ситуації ми вирішили терміново придбати букети на заміну в одного з експонентів. Просимо вас відшкодувати ці додаткові витрати. Таких випадків у майбутньому треба за будь-яких обставин уникати. Чекаємо на ваші пропозиції і будь-коли готові до розмови.", "Gabi Talheim": "Gabi Talheim", "Sehr geehrte Frau Talheim,": "Шановна пані Тальгайм,", "wir bedanken uns für Ihre E-Mail sowie für den Hinweis auf unser Versehen beziehungsweise darauf, dass Sie statt der bestellten regionalen Blumen Orchideen erhalten haben. Im Namen des ganzen Teams entschuldigen wir uns für die entstandenen Unannehmlichkeiten. Der Grund der falschen Lieferung liegt darin, dass die Artikelnummern während des Bestellprozesses verwechselt wurden. Dadurch haben wir exotische Blumen zukommen lassen, die nicht für das Thema Ihrer Ausstellung geeignet waren. Bezüglich der Situation, dass Sie umgehend eine Ersatzlösung über einen anderen Lieferanten finden mussten, werden wir selbstverständlich die dadurch entstandenen Kosten übernehmen. Darüber hinaus gewähren wir Ihnen einen Preisnachlass von 15% auf die nächste Bestellung. Alternativ kann ein Gutschein für zusätzliche Leistungen angeboten werden. Bitte lassen Sie uns wissen, welche Lösung Sie bevorzugen. Wir würden uns freuen, Sie weiterhin zu unseren zufriedenen Kunden zählen zu dürfen.": "дякуємо за ваш лист, а також за те, що вказали на наш недогляд, а саме на те, що замість замовлених регіональних квітів ви отримали орхідеї. Від імені всієї команди просимо вибачення за завдані незручності. Причина неправильної поставки в тому, що під час оформлення замовлення переплутали артикули. Через це ми надіслали екзотичні квіти, які не підходили до теми вашої виставки. Щодо того, що вам довелося терміново шукати заміну в іншого постачальника, — ми, звісно, покриємо витрати, які через це виникли. Крім того, надаємо вам знижку 15% на наступне замовлення. Як альтернатива, можемо запропонувати ваучер на додаткові послуги. Будь ласка, повідомте нам, якому рішенню ви надаєте перевагу. Ми були б раді й надалі бачити вас серед наших задоволених клієнтів.", "Höflich antworten und Grund der falschen Lieferung erklären": "Ввічливо відповісти й пояснити причину неправильної поставки", "Vorschläge für die weitere Zusammenarbeit machen": "Запропонувати варіанти подальшої співпраці", "Entschädigung anbieten (z. B. Kosten übernehmen, Rabatt)": "Запропонувати компенсацію (напр., покрити витрати, знижка)", "Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter": "Вітальна папка для нових працівниць і працівників", "Tagesordnungspunkte": "Порядок денний", "Wenn man jung ist, sollte man sein Leben doch erst einmal genießen. Über Alter": "Коли ти молодий, треба спершу насолоджуватися життям. Про старість", "Wenn eine Frau schwanger ist, kann sie, soweit es der Gesundheitszustand zulässt, bis sechs Wochen vor der Geburt arbeiten. Dann beginnt der Mutterschutz. Dieser gilt auch noch für": "Якщо жінка вагітна, вона може, наскільки дозволяє стан здоров’я, працювати до шести тижнів перед пологами. Тоді починається декретна відпустка (Mutterschutz). Вона діє ще й", "Während der Schwangerschaft darf ein Arbeitgeber die Mitarbeiterin nicht nach": "Під час вагітності роботодавець не може залучати працівницю до роботи після", "Welche Anzeige passt?": "Яке оголошення підходить?", "Forumsbeiträge": "Дописи на форумі", "Antworten": "Відповіді", "Protokoll": "Протокол", "Beschwerde": "Скарга"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('dtbL:'+k); return v==null? d : JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem('dtbL:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UA = JSON.parse(document.getElementById('ua').textContent);
const ckey = s => String(s??'').replace(/[\x00-\x1f]/g,'').trim();
const tr = s => UA[ckey(s)] || '';
const uaP = (s, cls='') => { const t = tr(s); return t ? `<p class="ua ${cls}" lang="uk">${esc(t)}</p>` : ''; };
const uaB = (t, cls='') => t ? `<span class="ua ua-block ${cls}" lang="uk">${esc(t)}</span>` : '';
function t3Title(t){
  const m = String(t).match(/^(.*?),?\s+vor\.?\s+(\d+)\s+(Stunden?|Minuten?)\b\s*(.*)$/);
  if (!m) return tr(t);
  let out = `${m[1]}, ${m[2]} ${/^Min/.test(m[3]) ? 'хв' : 'год.'} тому`;
  if (m[4]) { const x = tr(m[4]); if (x) out += ' ' + x; }
  return out;
}
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const TABS = [
  {id:'t1', label:'Teil 1', pts:'1–5', key:'teil1', info:'Zuordnung: Welche Anzeige passt zu welcher Person? 5 × 3 Punkte. Jede Anzeige nur einmal, drei bleiben übrig.'},
  {id:'t2', label:'Teil 2', pts:'6–9', key:'teil2', info:'Willkommensmappe: Richtig/Falsch und Multiple Choice (Text 1: Aufgaben 6–7, Text 2: Aufgaben 8–9). 4 × 3 Punkte.'},
  {id:'t3', label:'Teil 3', pts:'10–13', key:'teil3', info:'Forum: Welche Antwort passt zu welchem Beitrag? Wenn keine passt: X. 4 × 3 Punkte.'},
  {id:'t4', label:'Teil 4', pts:'14–18', key:'teil4', info:'Protokoll: Multiple Choice zu den Tagesordnungspunkten. 5 × 3 Punkte.'},
  {id:'b', label:'Beschwerde', pts:'19–21', key:'beschwerde', info:'Lesen und Schreiben: zwei Fragen zu den E-Mails (2 × 3 Punkte), dann Aufgabe 21 — Antwort an den Kunden schreiben (20 Minuten zusammen).'},
  {id:'exam', label:'Пробний тест', pts:'60', key:null, info:''}
];

let state = { tab: store.get('tab','t1'), sel: store.get('sel', {}), set: {} };

function renderTabs(){
  const nav = document.getElementById('tabs'); nav.innerHTML='';
  TABS.forEach(t => {
    const b = el(`<button role="tab" aria-selected="${state.tab===t.id}">${esc(t.label)}<span class="pts">${esc(t.pts)}</span></button>`);
    b.onclick = () => { state.tab=t.id; store.set('tab',t.id); render(); window.scrollTo({top:0}); };
    nav.appendChild(b);
  });
}

function chipLabel(v, tabId){
  let main = 'В' + v.num;
  let sub = [];
  if (tabId==='t2') sub.push(v.topic);
  if (tabId==='t4' || tabId==='b') sub.push(v.theme);
  if (v.ver) sub.push(v.ver);
  if (v.test) sub.push('тест ' + v.test);
  return {main, sub: sub.filter(Boolean).join(' · ')};
}

// ---------- question model: each "unit" = list of items {qid, kind, answer, src, unsure, ...}
function bestKey(v, si){ return 'best:'+v.id+':'+(si||0); }

function render(){
  renderTabs();
  const app = document.getElementById('app'); app.innerHTML='';
  const tab = TABS.find(t=>t.id===state.tab);
  if (tab.id==='exam'){ renderExam(app); return; }
  const list = D[tab.key];
  app.appendChild(el(`<p class="intro">${esc(tab.info)}</p>`));
  const vs = el('<div class="variants"></div>');
  let lastGroup = null;
  list.forEach((v,i) => {
    if (tab.id==='t2' && v.text!==lastGroup){ lastGroup=v.text; vs.appendChild(el(`<div class="groupLabel">${v.text==='Text 1'?'Text 1 · Aufgaben 6–7':'Text 2 · Aufgaben 8–9'}</div>`)); }
    const {main, sub} = chipLabel(v, tab.id);
    const best = store.get(bestKey(v,0), null);
    const c = el(`<button class="chip" aria-pressed="${(state.sel[tab.id]??0)===i}"><b>${esc(main)}</b>${sub?`<span class="v">${esc(sub)}</span>`:''}${best?`<span class="best">${best.r}/${best.n}</span>`:''}</button>`);
    c.onclick = () => { state.sel[tab.id]=i; store.set('sel',state.sel); render(); };
    vs.appendChild(c);
  });
  app.appendChild(vs);
  const v = list[state.sel[tab.id]??0] || list[0];
  app.appendChild(renderTask(tab.id, v, {}));
}

// ---------- reading renderers
function readingT1(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>Welche Anzeige passt?</h2>${uaP('Welche Anzeige passt?','ua-h')}`;
  if (v.note) h += `<p class="meta">${esc(v.note)}</p>`;
  v.options.forEach(o => { const t1=tr(o.title), t2=tr(o.body); h += `<div class="opt"><span class="k">${o.k})</span><span class="t">${esc(o.title)}</span><p>${esc(o.body)}</p>${(t1||t2)?`<p class="ua" lang="uk"><b>${esc(t1)}</b> ${esc(t2)}</p>`:''}</div>`; });
  return h;
}
function readingT3(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>Forumsbeiträge</h2>${uaP('Forumsbeiträge','ua-h')}`;
  if (v.note) h += `<p class="meta">${esc(v.note)}</p>`;
  v.persons.forEach(p => { h += `<div class="persona"><p><b>${p.n}.</b> <strong>${esc(p.name)}</strong></p><p>${esc(p.body)}</p>${uaP(p.body)}</div>`; });
  h += `<h3>Antworten</h3>${uaP('Antworten','ua-h')}`;
  v.options.forEach(o => { const t1=t3Title(o.title), t2=tr(o.body); h += `<div class="opt"><span class="k">${o.k})</span><span class="t">${esc(o.title)}</span><p>${esc(o.body)}</p>${(t1||t2)?`<p class="ua" lang="uk"><b>${esc(t1)}</b><br>${esc(t2)}</p>`:''}${o.old_body?`<div class="old">Старий варіант: ${esc(o.old_body)}</div>${uaP(o.old_body)}`:''}</div>`; });
  return h;
}
function paraHTML(p){
  if (/^TOP\s*\d+/.test(p) && p.length < 90) return `<h3>${esc(p)}</h3>`;
  if (/^TOP\s*\d+/.test(p)) { const m = p.match(/^(TOP\s*\d+\s+(?:[A-ZÄÖÜ„"][^\s]*\s?){1,6}?)(?=[A-ZÄÖÜ]{1,3}\s|Unser|Die |Der |Da |Seit |Wie |Mit |Im |Aufgrund|Zu den|Unsere)/); if (m) return `<h3>${esc(m[1].trim())}</h3><p>${esc(p.slice(m[1].length))}</p>`; return `<p><strong>${esc(p)}</strong></p>`; }
  if (/^(Teilnehmende|Anwesende|Sitzungsleitung|Protokoll|Entschuldigt|Extern|Gast|Nicht Anwesende|Besprechungsraum|Sitzungsraum|Tagungsraum|Konferenzraum|Zentrale|Abteilung \d|Ort:)/.test(p)) return `<p class="meta">${esc(p)}</p>`;
  return `<p>${esc(p)}</p>`;
}
function readingText(v, kind){
  let h = `<div class="kicker">${kind==='t2'?'Lesen Teil 2 · ':''}${esc(v.title)}</div>`;
  if (kind==='t2') h += `<p class="meta">Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter</p>${uaP('Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter')}`;
  const topic = v.topic || (kind==='t4'?'Protokoll':'');
  h += `<h2>${esc(topic)}</h2>${uaP(topic,'ua-h')}`;
  let agenda = [];
  const flush = () => { if (agenda.length){ h += `<ol class="agenda">${agenda.map(a=>`<li>${esc(a.replace(/^\d\.\s*/,''))}${uaB(tr(a).replace(/^\d\.\s*/,''))}</li>`).join('')}</ol>`; agenda=[]; } };
  v.paras.forEach(p => {
    if (kind==='t4' && /^\d\.\s/.test(p)) { agenda.push(p); return; }
    flush();
    if (/^Tagesordnungspunkte/.test(p)) { h += `<h3>Tagesordnungspunkte</h3>${uaP('Tagesordnungspunkte','ua-h')}`; return; }
    h += paraHTML(p) + uaP(p);
  });
  flush();
  return h;
}
const ROLE = {boss:'Interne E-Mail · Auftrag', complaint:'E-Mail des Kunden · Beschwerde', answer:'Musterantwort'};
const ROLE_UA = {boss:'внутрішній лист · доручення', complaint:'лист клієнта · скарга', answer:'зразок відповіді'};
function mailHTML(m){
  const sigUA = [tr(m.close), ...m.sign.map(x => tr(x) || x)].filter(Boolean).join(' · ');
  return `<div class="mail"><div class="mh"><span>${ROLE[m.role]} <span class="ua" lang="uk">— ${ROLE_UA[m.role]}</span></span></div><div class="mb">${m.lines.map(l=>`<p>${esc(l)}</p>${uaP(l)}`).join('')}${m.close?`<p class="sig">${esc(m.close)}${m.sign.length?'<br>'+m.sign.map(esc).join('<br>'):''}</p>${sigUA?`<p class="ua" lang="uk">${esc(sigUA)}</p>`:''}`:''}</div></div>`;
}
function readingB(v){
  let h = `<div class="kicker">${esc(v.title)}</div><h2>${esc(v.theme || 'Beschwerde')}</h2>${uaP(v.theme || 'Beschwerde','ua-h')}`;
  v.sub.filter(s=>s!==v.theme).forEach(s=> h += `<p class="meta">${esc(s)}</p>${/[a-zäöü]/i.test(s) && !/^[(Н]/.test(s) ? uaP(s) : ''}`);
  v.mails.filter(m=>m.role!=='answer').forEach(m => h += mailHTML(m));
  if (!v.mails.some(m=>m.role!=='answer')) h += `<p class="meta">Для цього варіанта в джерелі є лише тема та зразок відповіді.</p>`;
  return h;
}

// ---------- answer sheet
function itemsOf(tabId, v, si){
  if (tabId==='t1') return v.persons.map(p => ({n:p.n, kind:'match', prompt:p.text, keys:v.options.map(o=>o.k), answer:p.answer, src:'src'}));
  if (tabId==='t3') return v.persons.map(p => ({n:p.n, kind:'match', prompt:p.name, keys:[...v.options.map(o=>o.k),'x'], answer:p.answer, src:'src'}));
  const set = v.sets[si] || {questions:[]};
  return set.questions.map(q => ({n:q.n, kind:q.type==='rf'?'rf':'mc', prompt:q.prompt, options:q.options, answer:q.answer, src:q.src, unsure:q.unsure}));
}

function renderTask(tabId, v, opts){
  const box = el('<section class="task"></section>');
  const reading = el('<article class="reading"></article>');
  reading.innerHTML = tabId==='t1'?readingT1(v): tabId==='t3'?readingT3(v): tabId==='b'?readingB(v): readingText(v, tabId);
  box.appendChild(reading);
  const sheet = el('<aside class="sheet" aria-label="Antwortbogen"></aside>');
  box.appendChild(sheet);
  const sets = (tabId==='t1'||tabId==='t3') ? [{label:''}] : v.sets;
  const sk = v.id;
  let si = Math.min(state.set[sk]??0, Math.max(0, sets.length-1));
  const hooks = {
    showUA: () => box.classList.add('show-ua'),
    hideUA: () => box.classList.remove('show-ua'),
    toggleUA: () => box.classList.toggle('show-ua')
  };
  const draw = () => {
    box.classList.remove('show-ua');
    sheet.innerHTML = '';
    sheet.appendChild(el(`<h3>Antwortbogen</h3>`));
    if (sets.length>1){
      const st = el('<div class="setTabs"></div>');
      sets.forEach((s,i)=>{ const b = el(`<button aria-pressed="${i===si}">${esc(setLabel(s,i))}</button>`); b.onclick=()=>{si=i; state.set[sk]=i; draw();}; st.appendChild(b); });
      sheet.appendChild(st);
    }
    if (!sets.length){
      sheet.appendChild(el('<p class="fb" style="padding:0">Для цього варіанта питань 19–20 немає — тренуйте письмо (Aufgabe 21) нижче.</p>'));
      const bt = el('<button class="btn quiet">Показати переклад</button>');
      bt.onclick = () => { const on = hooks.toggleUA(); bt.textContent = on ? 'Сховати переклад' : 'Показати переклад'; };
      sheet.appendChild(bt);
    }
    else {
      const items = itemsOf(tabId, v, si);
      sheet.appendChild(quiz(items, v, si, tabId, null, hooks));
    }
  };
  draw();
  if (tabId==='b') box.appendChild(writing(v));
  return box;
}
function setLabel(s,i){
  const l = (s.label||'').replace(/[-–]\s*100%/,'').trim();
  return l ? l : (i===0?'Основна версія':'Версія '+(i+1));
}

function quiz(items, v, si, tabId, examHook, hooks){
  hooks = hooks || {};
  const wrap = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
  const picks = {};
  let checked = false;
  const rows = items.map(it => {
    const q = el(`<div class="q"><div class="qh"><span class="qn">${it.n}</span><span class="qp">${esc(it.prompt)}</span></div>${tr(it.prompt)?`<p class="ua qua" lang="uk">${esc(tr(it.prompt))}</p>`:''}</div>`);
    let ctrls = [];
    if (it.kind==='match' || it.kind==='rf'){
      const keys = it.kind==='rf' ? [['r','richtig'],['f','falsch']] : it.keys.map(k=>[k, k==='x'?'X':k]);
      const bubs = el('<div class="bubs"></div>');
      keys.forEach(([k,lab]) => {
        const b = el(`<button class="bub ${it.kind==='rf'?'wide':''}" aria-pressed="false" aria-label="${it.n}: ${lab}">${esc(lab)}</button>`);
        b.onclick = () => { if (checked) return; picks[it.n]=k; ctrls.forEach(c=>c.b.setAttribute('aria-pressed', c.k===k)); if (examHook) examHook(); };
        bubs.appendChild(b); ctrls.push({k,b});
      });
      q.appendChild(bubs);
    } else {
      const list = el('<div class="mcopts"></div>');
      it.options.forEach(o => {
        const b = el(`<button class="mcopt" aria-pressed="false"><span class="dot">${esc(o.k)}</span><span>${esc(o.text)}${uaB(tr(o.text))}</span></button>`);
        b.onclick = () => { if (checked) return; picks[it.n]=o.k; ctrls.forEach(c=>c.b.setAttribute('aria-pressed', c.k===o.k)); if (examHook) examHook(); };
        list.appendChild(b); ctrls.push({k:o.k,b});
      });
      q.appendChild(list);
    }
    const fb = el('<div class="fb" hidden></div>'); q.appendChild(fb);
    wrap.appendChild(q);
    return {it, ctrls, fb};
  });
  const scoreBox = el('<div class="score" hidden></div>');
  const act = el('<div class="actions"></div>');
  const bCheck = el('<button class="btn">Перевірити</button>');
  const bShow = el('<button class="btn ghost">Показати відповіді</button>');
  const bReset = el('<button class="btn quiet">Скинути</button>');
  const bUA = el('<button class="btn quiet" hidden>Сховати переклад</button>');
  bUA.onclick = () => { const on = hooks.toggleUA ? hooks.toggleUA() : false; bUA.textContent = on ? 'Сховати переклад' : 'Показати переклад'; };
  const grade = (reveal) => {
    checked = true; let r = 0;
    rows.forEach(({it,ctrls,fb}) => {
      const p = picks[it.n];
      if (p===it.answer) r++;
      ctrls.forEach(c => {
        c.b.classList.remove('right','wrongpick','solution');
        if (c.k===it.answer && p===it.answer) c.b.classList.add('right');
        else if (c.k===p) c.b.classList.add('wrongpick');
        if (c.k===it.answer && p!==it.answer) c.b.classList.add('solution');
      });
      const lab = it.kind==='rf' ? (it.answer==='r'?'richtig':'falsch') : (it.answer==='x'?'X':it.answer);
      fb.hidden = false;
      fb.innerHTML = (p===it.answer ? '✓ правильно' : (p? '✗ правильна відповідь: <b>'+esc(lab)+'</b>' : 'без відповіді · правильна: <b>'+esc(lab)+'</b>'))
        + (it.src==='claude' ? '<span class="tag" title="У джерелі відповідь не позначена — визначено за текстом">ключ за текстом</span>' : '')
        + (it.unsure ? '<span class="tag warn">неоднозначно</span>' : '');
    });
    const n = rows.length;
    scoreBox.hidden = false;
    scoreBox.innerHTML = `<span class="big">${r}/${n}</span><span class="pts">${r*3} з ${n*3} балів</span>`;
    if (!reveal && !examHook){
      const k = bestKey(v, si); const prev = store.get(k, null);
      if (!prev || r > prev.r) store.set(k, {r, n});
    }
    if (!examHook && hooks.showUA){ hooks.showUA(); bUA.hidden = false; bUA.textContent = 'Сховати переклад'; }
    return r;
  };
  bCheck.onclick = () => grade(false);
  bShow.onclick = () => grade(true);
  bReset.onclick = () => {
    checked = false; Object.keys(picks).forEach(k=>delete picks[k]);
    rows.forEach(({ctrls,fb}) => { fb.hidden = true; ctrls.forEach(c => { c.b.setAttribute('aria-pressed','false'); c.b.classList.remove('right','wrongpick','solution'); }); });
    scoreBox.hidden = true;
    bUA.hidden = true; if (hooks.hideUA) hooks.hideUA();
  };
  if (!examHook){ act.append(bCheck, bShow, bReset, bUA); wrap.append(scoreBox, act, el('<p class="ua-note">Український переклад усього завдання показано під кожним абзацом. Переклад зроблено Claude — звіряйтеся з німецьким оригіналом.</p>')); }
  if (tabId!=='t1' && tabId!=='t3' && !examHook) wrap.appendChild(el('<p class="legend">«ключ за текстом» — у джерелі відповідь не була позначена, її визначено за змістом тексту.</p>'));
  wrap._grade = grade; wrap._count = () => rows.length; wrap._answered = () => Object.keys(picks).length;
  return wrap;
}

const PHRASES = [
  'Vielen Dank für Ihre E-Mail, in der Sie uns auf … hinweisen.',
  'Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung.',
  'Der Grund dafür ist, dass … / Lassen Sie mich kurz erklären, was passiert ist.',
  'Wir möchten Ihnen versichern, dass sich diese Situation nicht wiederholen wird.',
  'Als Entschädigung bieten wir Ihnen … an. / Wir möchten Ihnen Folgendes vorschlagen: …',
  'Bitte teilen Sie uns mit, ob Sie mit dieser Lösung einverstanden sind.',
  'Wir freuen uns auf die weitere Zusammenarbeit. Mit freundlichen Grüßen'
];
const PHRASES_UA = [
  'Щиро дякуємо за ваш лист, у якому ви звертаєте нашу увагу на …',
  'Ми дуже шкодуємо про завдані незручності й просимо вибачення.',
  'Причина в тому, що … / Дозвольте коротко пояснити, що сталося.',
  'Запевняємо вас, що ця ситуація не повториться.',
  'Як компенсацію ми пропонуємо вам … / Ми хотіли б запропонувати вам таке: …',
  'Будь ласка, повідомте нам, чи згодні ви з таким рішенням.',
  'Сподіваємося на подальшу співпрацю. З повагою'
];
function writing(v){
  const box = el('<article class="reading write" style="grid-column:1/-1"></article>');
  box.appendChild(el(`<div><div class="kicker">Aufgabe 21 · 7 Punkte</div><h2>Schreiben Sie eine E-Mail an den Kunden</h2><p class="ua ua-h" lang="uk">Напишіть електронного листа клієнтові</p><p class="meta">Відповідайте від імені співробітника, якому адресовано внутрішній лист. Зверніться до клієнта, виконайте всі пункти доручення, пишіть ввічливо (ca. 80–100 Wörter).</p></div>`));
  const ta = el(`<textarea id="w-${v.id}" placeholder="Sehr geehrte/r …,&#10;&#10;vielen Dank für Ihre E-Mail …"></textarea>`);
  ta.value = store.get('draft:'+v.id, '');
  const wc = el('<div class="wc"></div>');
  const upd = () => { const n = (ta.value.trim().match(/\S+/g)||[]).length; wc.textContent = n + ' Wörter'; store.set('draft:'+v.id, ta.value); };
  ta.addEventListener('input', upd); upd();
  const grid = el('<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:20px;align-items:start"></div>');
  const left = el('<div style="display:flex;flex-direction:column;gap:6px;min-width:0"></div>'); left.append(ta, wc);
  const right = el('<div style="display:flex;flex-direction:column;gap:14px;min-width:0"></div>');
  if (v.check && v.check.length){
    const cl = el('<div><h3 style="margin:0 0 6px">Що має бути в листі</h3><ul class="check"></ul></div>');
    const done = store.get('chk:'+v.id, {});
    v.check.forEach((c,i) => {
      const li = el(`<li><label><input type="checkbox" id="c-${v.id}-${i}" ${done[i]?'checked':''}><span>${esc(c)}${uaB(tr(c))}</span></label></li>`);
      li.querySelector('input').onchange = (e) => { done[i]=e.target.checked; store.set('chk:'+v.id, done); };
      cl.querySelector('ul').appendChild(li);
    });
    right.appendChild(cl);
  }
  right.appendChild(el(`<div class="phr"><h3 style="margin:0">Redemittel</h3><ul>${PHRASES.map((p,i)=>`<li>${esc(p)}${uaB(PHRASES_UA[i])}</li>`).join('')}</ul></div>`));
  grid.append(left, right);
  if (window.matchMedia('(max-width:700px)').matches) grid.style.gridTemplateColumns = 'minmax(0,1fr)';
  box.appendChild(grid);
  const answers = v.mails.filter(m=>m.role==='answer');
  answers.forEach((m,i) => {
    const d = el(`<details class="model"><summary>Показати зразок відповіді${answers.length>1?' '+(i+1):''}</summary></details>`);
    d.appendChild(el(mailHTML(m)));
    box.appendChild(d);
  });
  (v.extra||[]).forEach(x => { const m = x.match(/https?:\/\/\S+/); if (m) box.appendChild(el(`<p class="meta">Ще один варіант відповіді: <a href="${esc(m[0])}" target="_blank" rel="noopener">${esc(m[0])}</a></p>`)); });
  return box;
}

// ---------- mock exam
let exam = null, timerId = null;
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function newExam(){
  const t2a = D.teil2.filter(v=>v.text==='Text 1'), t2b = D.teil2.filter(v=>v.text==='Text 2');
  const bq = D.beschwerde.filter(v=>v.sets.length);
  const pickSet = v => Math.floor(Math.random()*v.sets.length);
  const t2av = pick(t2a), t2bv = pick(t2b), t4v = pick(D.teil4), bv = pick(bq);
  exam = { parts: [
    {tab:'t1', v:pick(D.teil1), si:0, title:'Teil 1 · Aufgaben 1–5'},
    {tab:'t2', v:t2av, si:pickFull(t2av,[6,7]), title:'Teil 2 · Text 1 · Aufgaben 6–7'},
    {tab:'t2', v:t2bv, si:pickFull(t2bv,[8,9]), title:'Teil 2 · Text 2 · Aufgaben 8–9'},
    {tab:'t3', v:pick(D.teil3), si:0, title:'Teil 3 · Aufgaben 10–13'},
    {tab:'t4', v:t4v, si:0, title:'Teil 4 · Aufgaben 14–18'},
    {tab:'b', v:bv, si:pickSet(bv), title:'Lesen und Schreiben · Aufgaben 19–20'}
  ], end: Date.now() + 65*60*1000, done:false };
}
function pickFull(v, need){
  const ok = v.sets.map((s,i)=>[i, need.every(n=>s.questions.some(q=>q.n===n))]).filter(x=>x[1]).map(x=>x[0]);
  return ok.length ? pick(ok) : 0;
}
function renderExam(app){
  if (timerId) { clearInterval(timerId); timerId=null; }
  app.appendChild(el(`<p class="intro">Випадкова збірка: по одному варіанту з кожної частини — 20 завдань × 3 бали = 60 балів. На іспиті: Lesen 45 хв + Lesen und Schreiben 20 хв (разом із листом). Таймер — 65 хвилин.</p>`));
  if (!exam){
    const start = el('<div class="exam-head"><div><b>Готові?</b><div class="phr">Відповіді перевіряються наприкінці.</div></div><button class="btn">Почати пробний тест</button></div>');
    start.querySelector('button').onclick = () => { newExam(); render(); };
    app.appendChild(start); return;
  }
  const head = el(`<div class="exam-head"><div><div class="phr">Залишилось часу</div><div class="timer" id="timer">65:00</div></div><div class="phr" id="progress"></div><div class="actions"><button class="btn" id="finish">Завершити й перевірити</button><button class="btn quiet" id="restart">Нова збірка</button></div></div>`);
  app.appendChild(head);
  const quizzes = [];
  const updProg = () => { const a = quizzes.reduce((s,q)=>s+q._answered(),0), n = quizzes.reduce((s,q)=>s+q._count(),0); document.getElementById('progress').textContent = `Відповіді: ${a} / ${n}`; };
  exam.parts.forEach(p => {
    const sec = el(`<section class="exam-part"><h2>${esc(p.title)}</h2><p class="hint">${esc(p.v.title)}</p></section>`);
    const task = el('<div class="task"></div>');
    const reading = el('<article class="reading"></article>');
    reading.innerHTML = p.tab==='t1'?readingT1(p.v): p.tab==='t3'?readingT3(p.v): p.tab==='b'?readingB(p.v): readingText(p.v, p.tab);
    const sheet = el('<aside class="sheet"><h3>Antwortbogen</h3></aside>');
    let items = itemsOf(p.tab, p.v, p.si);
    if (p.tab==='t2'){ const need = p.v.text==='Text 1'?[6,7]:[8,9]; items = items.filter(i=>need.includes(i.n)); }
    const qz = quiz(items, p.v, p.si, p.tab, updProg);
    quizzes.push(qz); sheet.appendChild(qz);
    task.append(reading, sheet); sec.appendChild(task);
    if (p.tab==='b') sec.appendChild(writing(p.v));
    app.appendChild(sec);
  });
  updProg();
  const result = el('<div class="exam-head" hidden id="result"></div>');
  app.appendChild(result);
  const finish = () => {
    if (exam.done) return; exam.done = true;
    let r = 0, n = 0; quizzes.forEach(q => { r += q._grade(false); n += q._count(); });
    result.hidden = false;
    result.innerHTML = `<div><div class="phr">Результат (без листа, Aufgabe 21 оцінюється окремо)</div><div class="timer">${r}/${n} · ${r*3} балів</div></div>`;
    head.querySelector('#finish').disabled = true;
    clearInterval(timerId); timerId=null;
    result.scrollIntoView({behavior:'smooth', block:'center'});
  };
  head.querySelector('#finish').onclick = finish;
  head.querySelector('#restart').onclick = () => { exam = null; render(); };
  const tick = () => {
    const t = document.getElementById('timer'); if (!t) { clearInterval(timerId); return; }
    const left = Math.max(0, exam.end - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    t.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    t.classList.toggle('low', left < 5*60000);
    if (left===0) finish();
  };
  if (exam.done){ head.querySelector('#finish').disabled = true; }
  else { tick(); timerId = setInterval(tick, 1000); }
}

render();
