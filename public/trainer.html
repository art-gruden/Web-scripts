", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Agentur sagt, dass sie", "options": [{"k": "a", "text": "Änderungen nur gegen Aufpreis macht ."}, {"k": "b", "text": "keine Fehler gemacht hat."}, {"k": "c", "text": "keine Vorgaben von Herrn Stiller hatte."}], "answer": "a", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo Frau Holsten,", "ich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die verbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das fünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele Korrekturen waren nicht vereinbart!", "Wenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra. Bitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben."], "close": "Danke und viele Grüße", "sign": ["Jutta Spindler"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Spindler,", "vielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:", "Zum einen hatten wir besprochen, dass das Farbschema grau orange (grün blau) sein sollte. Da statt Grau Blau (Grün Grau) gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen einiger Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett."], "close": "Mit freundlichen Grüßen", "sign": ["Franz Stiller"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Stiller,", "vielen Dank für Ihre Rückmeldung von heute. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Außerdem möchte ich Ihnen versichern, dass wir den Fehler im Nahmen bis Ende dieser Woche korrigieren werden. Bitte beachten Sie, dass das blau orange (grau blau) Farbschema in unserem Vertrag vereinbart ist. Zudem ist das schon die fünfte Bitte um Korrektur. So viele Korrekturen waren nicht vereinbart. Deswegen kostet jede weitere Korrektur 200 (300) €. Wenn Sie mit dieser Lösung einverstanden sind, geben Sie mir bitte Bescheid.", "Vielen Dank für Ihr Verständnis."], "close": "Mit freundlichen Grüßen", "sign": ["Monika Holsten"]}], "extra": [], "check": ["Vertauschte Namen: unser Fehler, wird korrigiert", "Farbschema entspricht den Vorgaben / Vertrag", "Schon die fünfte Korrektur: weitere nur gegen Aufpreis (200 / 300 €)", "Um Zustimmung (Okay) des Kunden bitten"], "num": "3", "ver": "", "test": "", "theme": "Webseite"}, {"id": "b-70-4", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 4) – 100%", "sub": ["Spülmaschine"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Der Kunde", "options": [{"k": "a", "text": "fordert eine neue Spülmaschine."}, {"k": "b", "text": "hat einen Wasserschaden in der Küche."}, {"k": "c", "text": "beschwert sich über die Reparaturarbeiten."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Firma Küchenbedarf soll", "options": [{"k": "a", "text": "die Reparatur der Spülmaschine in Rechnung stellen."}, {"k": "b", "text": "innerhalb von zwei Tagen die Spülmaschine reparieren."}, {"k": "c", "text": "das Parkett in der Teeküche umgehend ersetzen."}], "answer": "b", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo Frau Retterstein,", "ich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat. Organisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und schreiben Sie Herrn Krüger.", "Entschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, d sign": ["Frieda Börne / Sophia Prince"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Börne, / Prince", "am Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden.", "Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.", "Bitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt."], "close": "Mit freundlichen Grüßen", "sign": ["Thomas Zaun / Matteo Lozano"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Zaun, / Lozano", "vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Der Grund dafür war, dass unsere Mitarbeiter auf dem Weg zu Ihnen eine kleine Autopanne hatten. Außerdem hatten sich einige Mitarbeiter in der letzten Woche krank gemeldet, was zu Personalmangel führte. Wir möchten Ihnen versichern, dass diese Situation sich nicht wiederholen wird. Zudem werden zwei unserer Mitarbeiter am Mittwochmorgen pünktlich bei Ihnen sein. Natürlich möchten wir Sie als Kunden zufriedenstellen, deswegen übernehmen wir die Kosten für die beschädigten Möbel.", "Wir freuen uns weiterhin auf eine Zusammenarbeit."], "close": "Mit freundlichen Grüßen", "sign": ["Monika Kühne"]}], "extra": [], "check": ["Erklären, warum es zu den Fehlern gekommen ist", "Mittwochmorgen kommen pünktlich zwei Männer für den Aufbau", "Verantwortung für die Schäden übernehmen", "Positiven Eindruck hinterlassen (Kunde bucht zum ersten Mal)"], "num": "5", "ver": "", "test": "", "theme": "Umzug"}, {"id": "b-72-6", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 6) – 100%", "sub": ["(тест №150321, 150301)", "Der Drucker"], "sets": [{"label": "Варіант питань 1", "questions": [{"n": 19, "type": "mc", "prompt": "Das Gerät", "options": [{"k": "a", "text": "ist erst seit Kurzem im Einsatz."}, {"k": "b", "text": "muss noch mal überprüft werden."}, {"k": "c", "text": "wurde immer richtig bedient."}], "answer": "a", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Firma Copyprofi", "options": [{"k": "a", "text": "besteht auf der Bezahlung der Rechnungen."}, {"k": "b", "text": "repariert den Kopierer noch einmal kostenfrei."}, {"k": "c", "text": "tauscht das Gerät schnellstmöglich aus."}], "answer": "a", "src": "claude"}]}, {"label": "Варіант питань 2", "questions": [{"n": 19, "type": "mc", "prompt": "Beim Gerät", "options": [{"k": "a", "text": "handelt sich um ein älteres Modell."}, {"k": "b", "text": "kommt es häufig zu Papierstaus."}, {"k": "c", "text": "wurde es nur einmal überprüft."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Herr Schmidt", "options": [{"k": "a", "text": "verlangt die Lieferung eines neuen Geräts."}, {"k": "b", "text": "möchte weitere Technikertermine vereinbaren."}, {"k": "c", "text": "akzeptiert die bisherigen Rechnungen."}], "answer": "a", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "schau dir mal die Mail von der Firma Mova an. Laut unserem Techniker lag der Fehler erneut an der falschen Bedienung des Geräts. Antworte Herrn Schmidt bitte und weise ihn höflich daraufhin, dass die Lösung des Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter* innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben die Angelegenheit der Mova GmbH."], "close": "Viele Grüße", "sign": ["Sibyl Aichele"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Aichele,", "vorgestern wurde von einem Ihrer Mitarbeiter unser fast neues Druck- und Kopiergerät der Marke Lexios zum dritten Mal innerhalb von zwei Wochen geprüft, da bei diesem immer wieder Papierstaus aufgetreten sind. Gestern kam es schon wieder zu einer Fehlermeldung, was zur Folge hatte, dass wir Unterlagen nicht fristgerecht einreichen konnten. Aus diesem Grund haben wir eine für uns sehr wichtige Ausschreibung verpasst. Von einer Schadensersatzforderung sehen wir vorerst ab, wir fordern Sie aber auf, uns umgehend auf Ihre Kosten ein anderes Gerät zu liefern. Es handelt sich hier nämlich eindeutig um einen technischen Fehler, den wir nicht zu verantworten haben. Die Rechnungen für die drei vorangegangenen Technikereinsätze werden wir natürlich nicht bezahlen.", "Ich erwarte Ihre umgehende Rückmeldung."], "close": "Mit freundlichen Grüßen", "sign": ["Benno Schmidt"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Schmidt,", "bezugnehmend auf Ihre Beschwerde entschuldigen wir uns für die Unannehmlichkeiten. Es tut uns leid, dass ein Fehler im Drucker aufgetreten ist. Nach Rücksprache mit unserem Techniker wurde festgestellt, dass die Fehler auf eine fehlerhafte Bedienung des Geräts zurückzuführen sind. Wir möchten Sie daher höflich darauf hinweisen, dass die Lösung dieses Problems nicht in unserer Verantwortung liegt. Gerne kommt noch einmal ein Techniker in die Firma und weist die Mitarbeiter*innen kostenfrei in die Bedienung ein. Die Kosten für die Überprüfung des Geräts bleiben bei Ihnen.", "Wir hoffen, dass Sie trotz des Vorfalls auch weiterhin unser treuer Kunde bleiben."], "close": "Mit freundlichen Grüßen", "sign": []}, {"role": "answer", "lines": ["Sehr geehrte/r Frau/Herr …,", "vielen Dank für Ihre E-Mail. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten, die Ihnen entstanden sind. Wir möchten Ihnen mitteilen, dass unsere Firma nur dann Verantwortung übernimmt, wenn die Drucker technische Probleme mit internen Teilen haben. Bei den letzten drei Einsätzen unseres Technikers zur Reparatur Ihres Geräts haben wir festgestellt, dass das Problem nicht auf technische Gründe zurückzuführen ist. Vielmehr funktioniert Ihr Gerät aufgrund falscher Einstellungen nicht ordnungsgemäß, was auf unsachgemäße Nutzung des Geräts zurückzuführen ist. Aus diesem Grund möchten wir Ihnen mitteilen, dass wir dieses Mal einen Techniker kostenfrei zu Ihnen schicken werden, aber Sie die Rechnungen für die letzten drei Einsätze bezahlen müssen. Wenn Sie weitere Fragen oder Anregungen haben, können Sie sich jederzeit an uns wenden. Vielen Dank für Ihr Verständnis."], "close": "Mit freundlichen Grüßen", "sign": []}], "extra": [], "check": ["Höflich: Fehler lag an falscher Bedienung, nicht in unserer Verantwortung", "Techniker kommt noch einmal und weist kostenfrei ein", "Kosten für die Überprüfung trägt der Kunde"], "num": "6", "ver": "", "test": "", "theme": "Der Drucker"}, {"id": "b-73-7", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 6)", "sub": ["(Новый вариант от 01.2025)"], "sets": [], "mails": [{"role": "boss", "lines": ["Guten Morgen,", "Vor einer Stunde erhielt ich diese E-Mail von der Cavone GmbH.", "Nach Angaben unseres Technikers lag der Fehler wiederum bei der Cavone GmbH. Bitte antworten Sie Frau Zeller und weisen Sie höflich darauf hin, dass es nicht in unserer Verantwortung liegt, das Problem zu lösen.", "Der Techniker kommt gerne wieder ins Unternehmen und führt die Mitarbeiter kostenlos durch den Prozess.", "Bitte teilen Sie ihr außerdem mit, dass die Kosten für die Untersuchung des Geräts weiterhin von ihrem Unternehmen, der Cavone GmbH, getragen werden."], "close": "Danke und viele Grüße", "sign": ["Paco Brenner"]}, {"role": "complaint", "lines": ["Sehr geehrter Herr Brenner,", "vor drei Tagen hat einer Ihrer Mitarbeiter das neue ABC-Druck-, Kopier- und Faxgerät inspiziert.", "Dies war das zweite Mal innerhalb einer Woche, dass beim Versenden eines Faxes ein Fehlerzeichen auftrat.", "Leider kam gestern wieder eine Fehlermeldung, und wir sollten einige wichtige Unterlagen zum Treffen per Fax verschicken. Wir konnten diese jedoch nicht rechtzeitig versenden. Deshalb haben wir einen für uns sehr wichtigen Deal verloren. Wir sehen derzeit von Schadensersatzansprüchen ab, bitten Sie jedoch, uns umgehend und auf Ihre Kosten ein anderes Gerät zuzusenden.", "Offensichtlich handelt es sich hierbei um einen technischen Fehler, für den wir keine Verantwortung übernehmen.", "Selbstverständlich übernehmen wir auch keine Rechnungen für vorangegangene technische Arbeiten.", "Ich hoffe, dass wir schnellstmöglich eine Antwort von Ihnen erhalten."], "close": "Mit freundlichen Grüßen", "sign": ["Vala Zeller"]}, {"role": "answer", "lines": ["Sehr geehrte Frau Zeller,", "vielen Dank für Ihre E-Mail und die Schilderung des Sachverhalts. Nach eingehender Prüfung des Problems durch unseren Techniker liegt die Ursache des Fehlers nicht in unserem Verantwortungsbereich, sondern bei der Cavone GmbH. Daher können wir Ihrem Wunsch nach einem kostenlosen Austausch des Geräts nicht entsprechen. Dennoch möchten wir Ihnen entgegenkommen und bieten an, dass unser Techniker gerne bereit ist, Ihr Unternehmen erneut zu besuchen und Ihre Mitarbeiter kostenlos durch den Prozess zu führen, um mögliche Fehlerquellen auszuschließen und eine reibungslose Nutzung des Geräts sicherzustellen. Bitte beachten Sie zudem, dass die Kosten für die Untersuchung des Geräts gemäß unseren Vereinbarungen weiterhin von der Cavone GmbH zu tragen sind. Wir hoffen auf Ihr Verständnis und stehen Ihnen bei weiteren Fragen oder Anliegen jederzeit gerne zur Verfügung."], "close": "Mit freundlichen Grüßen", "sign": []}], "extra": [], "check": ["Höflich: Fehler liegt nicht in unserer Verantwortung", "Techniker kommt wieder und führt die Mitarbeiter kostenlos ein", "Kosten für die Untersuchung trägt weiterhin der Kunde"], "num": "6", "ver": "01.2025", "test": "", "theme": "Der Drucker"}, {"id": "b-74-8", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 7)(тест №140321, 140301)", "sub": ["Die falsche Rechnung"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Herr Schmidt", "options": [{"k": "a", "text": "hat falsche Waren vom Lieferanten erhalten."}, {"k": "b", "text": "meldet eine unvollständige Sendung."}, {"k": "c", "text": "weist auf falsche Posten in der Zahlungsaufforderung hin."}], "answer": "c", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Rechnung", "options": [{"k": "a", "text": "hat 100 Pinsel nicht aufgeführt."}, {"k": "b", "text": "ist ohne Preisnachlass ausgestellt worden."}, {"k": "c", "text": "wurde an einen falschen Adressaten geschickt."}], "answer": "b", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "ich habe heute die unten stehende E-Mail erhalten. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Die Firma \"Meier\" ist ein langjähriger Kunde von uns. Wir können es uns nicht leisten, ihn zu verlieren. Schreiben Sie ihm bitte von unserem Computerproblem und wie wir es gelöst haben. Natürlich bekommt er den Rabatt wie gewohnt."], "close": "Vielen Dank.", "sign": ["Anna Hoffner"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Hoffner,", "wir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen.", "Wir bitten um Berichtigung der Rechnung und erneute Zusendung."], "close": "Mit freundlichen Grüßen", "sign": ["Karl Schmidt"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Friedrien,", "vielen Dank für Ihre E-Mail den höflich. Die Firma Lacke und Farben ist ein langjähriger, guter Kunde. Wir können es uns nicht leisten, ihn zu verlieren. Du kannst ihm ruhig von unseren Computerproblemen berichten und wie wir sie gelöst haben. Selbstverständlich kriegt er den Rabatt wie immer."], "close": "Vielen Dank und liebe Grüße", "sign": ["Sonja"]}, {"role": "complaint", "lines": ["Sehr geehrte Frau Klein,", "wir haben Ihre Lieferung wie gewohnt zu unserer vollsten Zufriedenheit erhalten. Alle Artikel entsprechen absolut unseren Vorstellungen.", "Leider muss ich Sie darauf hinweisen, dass in der beigelegten Rechnung einige Unstimmigkeiten aufgetreten sind. Zunächst wurden statt der 100 Stück Pinsel Größe S 200 Stück berechnet. Außerdem wurden 50 Töpfe rote Farbe aufgeführt. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten das zu korrigieren. Ferner waren wir verwundert, dass uns der übliche Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Dies ist wahrscheinlich ein Versehen.", "Wir bitten um Berichtigung der Rechnung und erneute Zusendung."], "close": "Mit freundlichen Grüßen", "sign": ["Joachim Schmidt"]}], "extra": [], "check": ["Höflich entschuldigen", "Computerprobleme erklären und wie sie gelöst wurden", "Korrigierte Rechnung zusenden", "Rabatt wie immer gewähren (10 %)"], "num": "7", "ver": "в.2", "test": "140321", "theme": "Die falsche Rechnung"}, {"id": "b-75-10", "title": "Lesen und Schreiben Teil Beschwerde (вариант № 8)", "sub": ["Die Lieferung", "Verzögerung bei der Lieferung 100 T-Shirts"], "sets": [], "mails": [{"role": "answer", "lines": ["Sehr geehrte/r Frau/Herr …,", "wir möchten uns für die Verzögerung bei der Lieferung Ihrer 100 T-Shirts entschuldigen. Wir haben Ihre Bestellung erhalten und Ihre Zahlung wurde erfolgreich abgewickelt, aber es gab unerwartete Verzögerungen beim Versand. Wir arbeiten daran das Problem so schnell wie möglich zu lösen und werden Sie über den Fortschritt auf dem Laufenden halten. Bitte überprüfen Sie auch Ihre Lieferadresse und Versandmethode, um sicherzustellen, dass sie korrekt sind und dass Ihre T-Shirts so bald wie möglich zu Ihnen geliefert werden.", "Wir haben verstanden, dass Sie einen Rabatt wünschen, aber unser Unternehmen ist bestrebt, unseren Kunden eine hochwertige Dienstleistung und Produkte anzubieten. Anstatt eines Rabatts, würden wir Ihnen gerne die Versandkosten erstatten oder Ihnen einen Gutschein für zukünftige Einkäufe anbieten. Wir hoffen, dass diese Lösung Ihre Zufriedenheit sicherstellen wird.", "Falls Sie weitere Fragen oder Bedenken haben, stehen wir Ihnen gerne zu Verfügung."], "close": "Mit freundlichen Grüßen", "sign": []}], "extra": [], "check": ["Für die Verzögerung entschuldigen", "Grund der Verzögerung nennen", "Statt Rabatt eine Alternative anbieten (Versandkosten / Gutschein)"], "num": "8", "ver": "", "test": "", "theme": "Die Lieferung"}, {"id": "b-76-11", "title": "Lesen und Schreiben Beschwerde (новый вариант №8) (№ 160201, 160221) – 100%", "sub": ["Die mangelhafte Lieferung"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Herr Schramm", "options": [{"k": "a", "text": "bemängelt Qualität und Menge der Lieferung."}, {"k": "b", "text": "fand die gesamte Lieferung beschädigt vor."}, {"k": "c", "text": "verlangt wegen der Lieferungsverzögerung einen Rabatt."}], "answer": "a", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Die Nachlieferung", "options": [{"k": "a", "text": "bezahlt der Kunde."}, {"k": "b", "text": "kommt im Sommer."}, {"k": "c", "text": "umfasst 50 T-Shirts."}], "answer": "c", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "mich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Entschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60% ist unverschämt. Bieten Sie ihm eine andere Lösung an. Die Nachlieferung der T-Shirts ist leider wegen unserer Mitarbeitersituation erst bis zum 12.05. möglich. Erklären Sie den Grund."], "close": "Vielen Dank", "sign": ["Siegfried Mayer", "Teamleiter"]}, {"role": "complaint", "lines": ["Sehr geehrter Herr Mayer,", "leider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen zwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den regulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60% für angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche Nachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige Vorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung."], "close": "Mit freundlichen Grüßen", "sign": ["Matthias Schramm"]}, {"role": "answer", "lines": ["Sehr geehrter Herr Schramm,", "vielen Dank für Ihre E-Mail, in der Sie uns darüber informieren, dass Sie mit der gelieferten Ware nicht zufrieden sind. Wir entschuldigen uns für die verschmutzten Hosen, können Ihnen aber keinen Preisnachlass in Höhe von 60 Prozent geben. Bitte schicken Sie uns die Hosen zurück. Wir werden Ihnen die Hosen in Größe M und L erneut in einwandfreier Qualität schicken. Aufgrund eines hohen Krankenstandes in unserer Firma ist die Nachlieferung der T-Shirts erst zum 12.05. möglich. Ich hoffe, dass Sie damit einverstanden sind. Bitte lassen Sie uns wissen, ob Sie mit unserem Vorschlag einverstanden sind."], "close": "Mit freundlichen Grüßen", "sign": []}, {"role": "answer", "lines": ["Sehr geehrter Herr Schramm,", "vielen Dank für Ihre E-Mail und für die Hinweise zu unserer letzten Lieferung. Wir bedauern die Unannehmlichkeiten und entschuldigen uns für die verschmutzten Waren sowie die unvollständige Lieferung.", "Zu den beschädigten Hosen bieten wir Ihnen einen Preisnachlass von 20 % an. Alternativ können Sie uns die Artikel zurücksenden, und wir liefern Ersatz. Der von Ihnen vorgeschlagene Nachlass von 60 % ist leider nicht möglich.", "Die fehlenden T-Shirts werden wir schnellstmöglich nachliefern, jedoch ist dies aufgrund unserer aktuellen Personalsituation erst bis zum 12.05. realisierbar. Die zusätzlichen Versandkosten übernehmen selbstverständlich wir. Wir entschuldigen uns nochmals und danken Ihnen für Ihr Verständnis. Sollten Sie weitere Fragen haben, stehen wir Ihnen gerne zur Verfügung."], "close": "Mit freundlichen Grüßen", "sign": []}], "extra": [], "check": ["Für die verschmutzte Ware entschuldigen", "60 % Rabatt ablehnen und eine andere Lösung anbieten", "Nachlieferung erst bis 12.05. möglich", "Grund nennen: Mitarbeitersituation"], "num": "8", "ver": "нова", "test": "", "theme": "Die mangelhafte Lieferung"}, {"id": "b-77-12", "title": "Lesen und Schreiben Beschwerde (вариант № 9)", "sub": ["Pflanzenlieferung"], "sets": [{"label": "", "questions": [{"n": 19, "type": "mc", "prompt": "Der Lieferant hat", "options": [{"k": "a", "text": "die Dekoration passend zum Thema ausgewählt."}, {"k": "b", "text": "die falsche Blumenauswahl getroffen."}, {"k": "c", "text": "Ersatzsträuße aus der Region bestellt."}], "answer": "b", "src": "claude"}, {"n": 20, "type": "mc", "prompt": "Der Veranstalter musste", "options": [{"k": "a", "text": "an einen Aussteller Blumen liefern."}, {"k": "b", "text": "auf die Beschwerden der Besucher reagieren."}, {"k": "c", "text": "den Umweltpreis ohne Blumen überreichen."}], "answer": "b", "src": "claude"}]}], "mails": [{"role": "boss", "lines": ["Hallo,", "die folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los?", "Bitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir schätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit, was wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten."], "close": "Vielen Dank und viele Grüße", "sign": ["Michael Herrmann", "Teamleiter"]}, {"role": "complaint", "lines": ["Sehr geehrter Herr Herrmann,", "leider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung."], "close": "Mit freundlichen Grüßen", "sign": ["Gabi Talheim"]}, {"role": "answer", "lines": ["Sehr geehrte Frau Talheim,", "wir bedanken uns für Ihre E-Mail sowie für den Hinweis auf unser Versehen beziehungsweise darauf, dass Sie statt der bestellten regionalen Blumen Orchideen erhalten haben. Im Namen des ganzen Teams entschuldigen wir uns für die entstandenen Unannehmlichkeiten. Der Grund der falschen Lieferung liegt darin, dass die Artikelnummern während des Bestellprozesses verwechselt wurden. Dadurch haben wir exotische Blumen zukommen lassen, die nicht für das Thema Ihrer Ausstellung geeignet waren. Bezüglich der Situation, dass Sie umgehend eine Ersatzlösung über einen anderen Lieferanten finden mussten, werden wi
