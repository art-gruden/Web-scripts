  revealed: new Set(),
  checked: new Set(),
  done: new Set(store.get('done',[])),
  q: ''
};
if(state.idx>=DATA.length) state.idx=0;

const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const who = i=> i%2===0?'A':'B';
const hintOf = t=>{const w=t.split(' ');return w.slice(0,3).join(' ')+(w.length>3?' …':'')};

function renderList(){
  const q=state.q.trim().toLowerCase();
  const html=DATA.map((s,i)=>{
    if(q){const hay=(s.title+' '+s.desc+' '+s.points.join(' ')).toLowerCase(); if(!hay.includes(q)) return '';}
    return `<button class="item${i===state.idx?' on':''}" data-i="${i}"><span class="num">${s.n}</span><span>${esc(s.title)}</span>${state.done.has(s.n)?'<span class="done">✓</span>':''}</button>`;
  }).join('');
  $('#list').innerHTML=html||'<div class="muted" style="padding:10px;font-size:14px">Нічого не знайдено</div>';
  $('#progress').textContent=`Пройдено: ${state.done.size} / ${DATA.length}`;
}

function renderSit(){
  const s=DATA[state.idx];
  $('#sitCard').innerHTML=`
    <div class="sit-top"><span class="badge">Situation ${s.n}</span><div class="row-sp"></div>
      <button class="icon-btn" id="prevSit">←</button>
      <button class="icon-btn" id="nextSit">→</button>
      <button class="icon-btn" id="doneBtn">${state.done.has(s.n)?'✓ Пройдено':'Позначити як пройдене'}</button>
    </div>
    <h2 class="sit-title">${esc(s.title)}</h2>
    <p class="desc">${esc(s.desc)}</p>
    <p class="task">Aufgabe: Überlegen Sie zusammen mit Ihrer Gesprächspartnerin / Ihrem Gesprächspartner, wie Sie in dieser Situation angemessen reagieren.</p>
    <ul class="points">${s.points.map((p,i)=>`<li class="pt${state.checked.has(i)?' check':''}" data-p="${i}"><span class="n">${i+1}</span><span class="t">${esc(p)}</span></li>`).join('')}</ul>
    <div class="pts-note">Натисніть на пункт, коли ви його обговорили.</div>`;
  $('#prevSit').onclick=()=>go(state.idx-1);
  $('#nextSit').onclick=()=>go(state.idx+1);
  $('#doneBtn').onclick=()=>{state.done.has(s.n)?state.done.delete(s.n):state.done.add(s.n);store.set('done',[...state.done]);renderSit();renderList();};
  document.querySelectorAll('.pt').forEach(el=>el.onclick=()=>{const i=+el.dataset.p;state.checked.has(i)?state.checked.delete(i):state.checked.add(i);el.classList.toggle('check')});
}

function renderMode(){
  document.querySelectorAll('#modeTabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
  if(state.mode==='roles') renderRoles();
  else if(state.mode==='free') renderFree();
  else renderRead();
}

function lineHTML(t,i,opts){
  const w=who(i);
  const hid = opts.hideable && (state.hide==='both'||state.hide===w) && !state.revealed.has(i);
  const cls=['ln',w];
  if(opts.step){ if(i===state.pos) cls.push('cur'); if(i>state.pos) cls.push('future'); }
  const body = hid
    ? `<div class="hidden-txt">${state.hint?`<span class="hint">${esc(hintOf(t))}</span>`:'<i>скажіть своїми словами…</i>'}</div><button class="reveal" data-r="${i}">показати</button>`
    : esc(t);
  return `<div class="${cls.join(' ')}"><div class="who">${w}</div><div class="bub">${body}</div></div>`;
}

function renderRoles(){
  const s=DATA[state.idx], T=s.turns;
  const seg=(val,label)=>`<button data-hide="${val}" class="${state.hide===val?'on':''}">${label}</button>`;
  const cur=T[state.pos]; const w=who(state.pos);
  $('#modeBody').innerHTML=`
    <p class="help">Один — <b style="color:var(--a)">A</b>, інший — <b style="color:var(--b)">B</b>. Сховайте свої репліки й говоріть з підказкою; репліку партнера читає партнер.</p>
    <div class="ctrl" style="margin-top:12px">
      <span class="lbl">Сховати:</span>
      <div class="tabs" id="hideTabs">${seg('none','нічого')}${seg('A','A')}${seg('B','B')}${seg('both','обидва')}</div>
      <label class="lbl"><input type="checkbox" id="hintCb" ${state.hint?'checked':''}> підказка (перші слова)</label>
      <label class="lbl"><input type="checkbox" id="stepCb" ${state.step?'checked':''}> по одній репліці</label>
    </div>
    <div class="dlg">${T.map((t,i)=>lineHTML(t,i,{hideable:true,step:state.step})).join('')}</div>
    ${state.step?`<div class="stepbar">
      <button class="btn" id="back" ${state.pos===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="fwd">${state.pos>=T.length-1?'Ще раз ↺':'Далі →'}</button>
      <span class="speaker-now"><span class="dot" style="background:var(--${w.toLowerCase()})"></span>Зараз говорить ${w} · ${state.pos+1}/${T.length}</span>
      <div class="row-sp"></div>
      <button class="btn" id="swap">⇄ Помінятись ролями</button>
      <span class="kbd">пробіл / → далі · ← назад</span>
    </div>`:`<div class="stepbar"><button class="btn" id="swap">⇄ Помінятись ролями</button></div>`}`;
  document.querySelectorAll('#hideTabs button').forEach(b=>b.onclick=()=>{state.hide=b.dataset.hide;store.set('hide',state.hide);state.revealed.clear();renderRoles();});
  $('#hintCb').onchange=e=>{state.hint=e.target.checked;store.set('hint',state.hint);renderRoles();};
  $('#stepCb').onchange=e=>{state.step=e.target.checked;store.set('stepMode',state.step);renderRoles();};
  document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{state.revealed.add(+b.dataset.r);renderRoles();});
  $('#swap').onclick=()=>{state.hide={A:'B',B:'A'}[state.hide]||state.hide;store.set('hide',state.hide);state.pos=0;state.revealed.clear();renderRoles();};
  if(state.step){
    $('#back').onclick=()=>stepMove(-1);
    $('#fwd').onclick=()=>stepMove(1);
    const c=document.querySelector('.ln.cur'); if(c && c.getBoundingClientRect().bottom>innerHeight) c.scrollIntoView({block:'center',behavior:'smooth'});
  }
}
function stepMove(d){
  const n=DATA[state.idx].turns.length;
  if(d>0 && state.pos>=n-1){state.pos=0;state.revealed.clear();}
  else state.pos=Math.max(0,Math.min(n-1,state.pos+d));
  renderRoles();
}

let timer={left:300,total:300,run:false,id:null,turn:'A'};
function fmt(s){return String(Math.floor(s/60)).padStart(1,'0')+':'+String(s%60).padStart(2,'0')}
function renderFree(){
  const s=DATA[state.idx];
  $('#modeBody').innerHTML=`
    <p class="help">Імітація іспиту: без тексту, тільки пункти вгорі. Розмовляйте по черзі, відмічайте обговорені пункти, в кінці — домовтесь про план.</p>
    <div class="free">
      <div class="tbox">
        <h3>Таймер</h3>
        <div class="timer" id="tval">${fmt(timer.left)}</div>
        <div class="turnbtn">
          <button class="btn primary" id="tstart">${timer.run?'Пауза':'Старт'}</button>
          <button class="btn" id="treset">Скинути</button>
        </div>
        <div class="ctrl" style="margin-top:10px"><span class="lbl">Тривалість:</span>
          <div class="tabs" id="dur">${[3,5,8].map(m=>`<button data-m="${m}" class="${timer.total===m*60?'on':''}">${m} хв</button>`).join('')}</div>
        </div>
        <div class="turn-ind" id="turnInd"></div>
        <div class="turnbtn"><button class="btn" id="turnSwitch">⇄ Передати слово</button></div>
      </div>
      <div class="tbox steps-hint">
        <h3>Структура розмови</h3>
        <ol>
          <li><b>Почати:</b> Hast du schon gehört? Wir haben ein Problem mit …</li>
          <li><b>Пройти пункти</b> по черзі: запитати → запропонувати → відреагувати.</li>
          <li><b>Реагувати</b> на партнера: Gute Idee, aber … / Da hast du recht.</li>
          <li><b>Довгостроково:</b> Wie können wir das in Zukunft vermeiden?</li>
          <li><b>Завершити й розподілити:</b> Ich kümmere mich um …, und du …</li>
        </ol>
        <p class="help" style="margin-top:12px">Пунктів у цій ситуації: <b>${s.points.length}</b>. Мета — кожен сказав щось по кожному пункту.</p>
      </div>
    </div>`;
  const ind=()=>{const w=timer.turn;$('#turnInd').style.background=`var(--${w.toLowerCase()}-soft)`;$('#turnInd').style.color=`var(--${w.toLowerCase()})`;$('#turnInd').textContent=`Говорить ${w}`;};
  ind();
  $('#tstart').onclick=()=>{timer.run?stopT():startT();renderFree();};
  $('#treset').onclick=()=>{stopT();timer.left=timer.total;renderFree();};
  $('#turnSwitch').onclick=()=>{timer.turn=timer.turn==='A'?'B':'A';ind();};
  document.querySelectorAll('#dur button').forEach(b=>b.onclick=()=>{stopT();timer.total=timer.left=+b.dataset.m*60;renderFree();});
  paintT();
}
function paintT(){const el=$('#tval');if(!el)return;el.textContent=fmt(timer.left);el.classList.toggle('warn',timer.left<=30);}
function startT(){if(timer.left<=0)timer.left=timer.total;timer.run=true;timer.id=setInterval(()=>{timer.left--;paintT();if(timer.left<=0){stopT();const b=$('#tstart');if(b)b.textContent='Старт';const el=$('#tval');if(el)el.textContent='Час!';}},1000);}
function stopT(){timer.run=false;clearInterval(timer.id);}

function renderRead(){
  const s=DATA[state.idx];
  $('#modeBody').innerHTML=`<p class="help">Повний зразок діалогу. Прочитайте вголос ролями, потім поміняйтесь.</p>
    <div class="dlg">${s.turns.map((t,i)=>lineHTML(t,i,{hideable:false,step:false})).join('')}</div>`;
}

function renderRM(){
  $('#rm').innerHTML=RM.map(([h,items])=>`<div><h4>${h}</h4><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
}

function go(i){
  state.idx=(i+DATA.length)%DATA.length; store.set('idx',state.idx);
  state.pos=0; state.revealed.clear(); state.checked.clear();
  stopT(); timer.left=timer.total; timer.turn='A';
  renderAll();
  if(innerWidth<=860) $('#side').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){renderList();renderSit();renderMode();}

$('#list').onclick=e=>{const b=e.target.closest('.item');if(b)go(+b.dataset.i)};
$('#q').oninput=e=>{state.q=e.target.value;renderList()};
$('#randomBtn').onclick=()=>{let r;do{r=Math.floor(Math.random()*DATA.length)}while(r===state.idx&&DATA.length>1);go(r)};
$('#toggleList').onclick=()=>$('#side').classList.toggle('open');
document.querySelectorAll('#modeTabs button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;store.set('mode',state.mode);renderMode()});
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme)};
(()=>{const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t})();
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(state.mode==='roles'&&state.step){
    if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();stepMove(1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();stepMove(-1)}
  }
});
renderRM(); renderAll();
</script>
</body>
</html>
