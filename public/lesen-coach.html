ndern auch» ↔ «neben … auch» — типичная перефразировка.","trap":"a: «durchschnittlich gut besucht» — средне, а не «очень много». c: организовали EB, MH, LN и VT — четыре человека.","opts":[["a","hatte sehr viele Besucher."],["b","wurde nicht nur von Eltern und Kindern besucht."],["c","wurde von einer Kollegin organisiert."]],"type":"mc","evr":[[14,111,206]]},{"n":18,"prompt":"Der Jour Fixe findet","ans":"b","keys":["Jour","Raum"],"syn":[["in einem neuen Raum","im EG im Raum „Elefant“","в новом помещении = в комнате «Elefant» на первом этаже",[[19,114,137]]]],"tip":"Последний вопрос — почти всегда последний пункт (TOP 6). Проверьте дату и место.","trap":"a: следующая встреча — 15.10., это середина, а не начало октября. c: о регулярности «каждую первую среду» ничего не сказано.","opts":[["a","Anfang Oktober statt."],["b","in einem neuen Raum statt."],["c","jeden ersten Mittwoch im Monat statt."]],"type":"mc","evr":[[19,64,143]]}]},"ls":{"blocks":[["p","Hallo,"],["p","unten stehende E-Mail erreichte mich heute Morgen. Bitte kümmern Sie sich darum und antworten Sie der Kundin höflich. Herr und Frau Loibl sind seit vielen Jahren Stammgäste in unserem Haus und ich möchte sie auf keinen Fall als Gäste verlieren. Sie können Frau Loibl ruhig den Grund für die aktuellen Probleme nennen. Ganz wichtig: Bitte schreiben Sie ihr auch, wie wir diese Probleme zukünftig lösen werden."],["sig","Vielen Dank und beste Grüße\nPeter Birmer\nLeitung Serviceteam"],["p","Sehr geehrter Herr Birmer,"],["p","seit 15 Jahren machen mein Mann und ich jeden Sommer Urlaub im schönen Südtirol. Wir haben uns über all die Jahre immer wieder für Ihr Hotel entschieden, weil uns die familiäre Atmosphäre und der freundliche Service in Ihrem Haus immer sehr gefallen haben."],["p","Allerdings mussten wir bei unserem letzten Aufenthalt im August feststellen, dass das Personal leider nicht mehr so freundlich und höflich war wie bisher. Auch der Service im Restaurant war wesentlich schlechter. Wir mussten oft lange Wartezeiten in Kauf nehmen und das Servicepersonal, das leider auch häufig gewechselt hat, war unhöflich und gestresst."],["p","Wir hoffen sehr, dass die Situation so bald wie möglich wieder besser wird und wir in Zukunft mit einem einwandfreien Service rechnen können. Sie verstehen sicherlich, dass wir als langjährige Stammgäste aufmerksam und höflich behandelt werden möchten."],["sig","Mit freundlichen Grüßen\nAnnemarie Loibl"]],"lay":{"intro":"Ihre Teamleitung leitet Ihnen die E-Mail von einem Kunden weiter und bittet Sie zu antworten.","mails":[{"role":"boss","meta":[["Erhalten","heute, 8:45 Uhr"],["Von","Peter Birmer"],["Betreff","FW: Mängel im Service"]],"bl":[0,1,2]},{"role":"client","meta":[["Erhalten","gestern, 19:35 Uhr"],["Von","Annemarie Loibl"],["An","Peter Birmer"],["Betreff","Mängel im Service"]],"bl":[3,4,5,6,7]}]},"qs":[{"n":19,"prompt":"Frau Loibl ist unzufrieden und","ans":"c","keys":["unzufrieden","besser"],"syn":[["wünscht sich","Wir hoffen sehr","желает = очень надеемся",[[6,0,15]]],["schnell wieder besser","so bald wie möglich wieder besser","быстро снова лучше = как можно скорее снова лучше",[[6,36,69]]]],"tip":"Чего клиент ХОЧЕТ — обычно в конце письма (Wir hoffen / Bitte sorgen Sie …).","trap":"a: она не грозит сменить отель. b: про возвращение старого персонала ни слова — только что персонал часто менялся.","opts":[["a","möchte nach 15 Jahren zum ersten Mal in einem anderen Hotel Urlaub machen."],["b","wünscht sich das Personal zurück, das sie und ihr Mann noch von früher kennen."],["c","wünscht sich, dass der Service im Hotel schnell wieder besser wird."]],"type":"mc","evr":[[6,0,74]]},{"n":20,"prompt":"Die Probleme","ans":"c","keys":["Probleme","Sommer"],"syn":[["zum ersten Mal aufgetreten","nicht mehr so … wie bisher","появились впервые = уже не так, как раньше",[[5,102,115],[5,143,153]]],["letzten Sommer","bei unserem letzten Aufenthalt im August","прошлым летом = в последний приезд в августе",[[5,23,63]]]],"tip":"«nicht mehr … wie bisher» означает: раньше было хорошо, проблема новая.","trap":"a: 15 лет всё нравилось. b: не только ресторан — «AUCH der Service im Restaurant», т.е. и персонал в целом.","opts":[["a","bestehen seit vielen Jahren."],["b","betreffen nur den Service im Restaurant."],["c","sind letzten Sommer zum ersten Mal aufgetreten."]],"type":"mc","evr":[[5,0,154]]}]}}}];

    const cls = [], at = [];

    const n = +bub.dataset.q, s = st();
    s.a[n] = s.a[n] === bub.dataset.v ? undefined : bub.dataset.v;
    if (s.a[n] === undefined) delete s.a[n];
    UI.active = n; save(); render(); if (s.c) renderHeader(); return;
  }
  const act = tgt.closest('[data-act]');
  if (act) {
    const a = act.dataset.act, n = +act.dataset.q;
    if (a !== 'reset' && a !== 'clearhl') UI.confirm = null;
    if (a === 'next' || a === 'prev') { jump(n, +act.dataset.k, a === 'next' ? 1 : -1); return; }
    if (a === 'hint') { hintKeys(n); return; }
    if (a === 'check') {
      const s = st(); s.c = 1; save();
      const wrong = part().qs.find(q => s.a[q.n] !== q.ans);
      UI.active = (wrong || part().qs[0]).n; UI.nav = [-1, -1]; UI.flash = null;
      renderAll(); $('#rail').scrollTop = 0; if (innerWidth <= 900) scrollToEl($('#rail .phead'));
      return;
    }
    if (a === 'uncheck') { st().c = 0; save(); renderAll(); return; }
    if (a === 'reset') {
      if (UI.confirm !== 'reset') { UI.confirm = 'reset'; renderRail(); setTimeout(() => { if (UI.confirm === 'reset') { UI.confirm = null; renderRail(); } }, 4000); return; }
      UI.confirm = null; S.d[S.cur.t][S.cur.p] = {a: {}, k: {}, h: {}, c: 0}; UI.active = null; save(); renderAll(); toast('Часть сброшена'); return;
    }
    if (a === 'clearhl') {
      if (UI.confirm !== 'hl') { UI.confirm = 'hl'; renderReading(); setTimeout(() => { if (UI.confirm === 'hl') { UI.confirm = null; renderReading(); } }, 4000); return; }
      UI.confirm = null; st().h = {}; save(); renderReading(); toast('Выделения стёрты'); return;
    }
    if (a === 'ev') { UI.flash = null; setActive(n); const el = $('#reading .evs'); scrollToEl(el); pulse(el); return; }
    if (a === 'syn') { UI.active = n; UI.nav = [-1, -1]; UI.flash = {n, i: +act.dataset.i}; render(); const el = $('#reading .fls'); scrollToEl(el); pulse(el); return; }
    if (a === 'totext') { const el = $('#reading .hs1') || $('#reading .hs2') || $('#reading'); scrollToEl(el); return; }
    if (a === 'toq') { const el = document.getElementById('q' + UI.active); if (el) el.scrollIntoView({block: 'start', behavior: reduce ? 'auto' : 'smooth'}); return; }
  }
  const card = tgt.closest('[data-card]'); if (card && !tgt.closest('button')) { setActive(+card.dataset.card); return; }
  const hl = tgt.closest('#reading [data-h]');
  if (hl && getSelection().isCollapsed) {
    const [b, i] = hl.dataset.h.split(':').map(Number);
    UI.pop = {mode: 'edit', b, i}; showPop(hl.getBoundingClientRect());
  }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.strat')) { S.strat = e.target.open ? 1 : 0; save(); } }, true);

/* ---------- highlighter ---------- */
function offIn(el, node, o) { const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, o); return r.toString().length; }
function selRanges() {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0), rd = $('#reading');
  if (!rd.contains(r.commonAncestorContainer)) return null;
  const out = [];
  rd.querySelectorAll('[data-b]').forEach(el => {
    if (!r.intersectsNode(el)) return;
    const len = el.textContent.length;
    let s = 0, e = len;
    if (el.contains(r.startContainer)) s = offIn(el, r.startContainer, r.startOffset);
    if (el.contains(r.endContainer)) e = offIn(el, r.endContainer, r.endOffset);
    if (e > s) out.push([+el.dataset.b, s, e]);
  });
  return out.length ? out : null;
}
function subtract(arr, s, e) {
  const out = [];
  arr.forEach(r => {
    if (r[1] <= s || r[0] >= e) { out.push(r); return; }
    if (r[0] < s) out.push([r[0], s, r[2]]);
    if (r[1] > e) out.push([e, r[1], r[2]]);
  });
  return out;
}
function applyMark(ranges, c) {
  const h = st().h, P = part();
  ranges.forEach(([b, s, e]) => {
    const t = P.blocks[b][1];
    while (s < e && /\s/.test(t[s])) s++;
    while (e > s && /\s/.test(t[e - 1])) e--;
    if (e <= s) return;
    let arr = subtract(h[b] || [], s, e);
    if (c) arr.push([s, e, c]);
    arr.sort((x, y) => x[0] - y[0]);
    if (arr.length) h[b] = arr; else delete h[b];
  });
  save(); renderReading();
}
const pop = $('#pop');
function showPop(rect) {
  pop.hidden = false;
  const w = pop.offsetWidth, hgt = pop.offsetHeight;
  let top = rect.bottom + 8;
  if (top + hgt > innerHeight - 70) top = Math.max(8, rect.top - hgt - 8);
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(8, Math.min(innerWidth - w - 8, left));
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
}
function hidePop() { pop.hidden = true; UI.pop = null; }
function checkSel() {
  const r = selRanges();
  if (!r) { if (UI.pop && UI.pop.mode === 'sel') hidePop(); return; }
  UI.pop = {mode: 'sel', ranges: r};
  const rects = getSelection().getRangeAt(0).getClientRects();
  const last = rects[rects.length - 1] || getSelection().getRangeAt(0).getBoundingClientRect();
  showPop(last);
}
pop.addEventListener('pointerdown', e => e.preventDefault());
pop.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !UI.pop) return;
  const c = b.dataset.c;
  if (UI.pop.mode === 'sel') { applyMark(UI.pop.ranges, c); try { getSelection().removeAllRanges(); } catch (er) {} }
  else {
    const h = st().h, arr = h[UI.pop.b] || [];
    if (arr[UI.pop.i]) { if (c) arr[UI.pop.i][2] = c; else arr.splice(UI.pop.i, 1); }
    if (!arr.length) delete h[UI.pop.b];
    save(); renderReading();
  }
  hidePop();
});
document.addEventListener('pointerup', e => { if (e.target.closest('#reading')) setTimeout(checkSel, 0); });
document.addEventListener('keyup', e => { if (e.shiftKey) setTimeout(checkSel, 0); if (e.key === 'Escape') hidePop(); });
let selT;
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(() => { if (matchMedia('(pointer: coarse)').matches) checkSel(); }, 350); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#pop') && !e.target.closest('#reading [data-h]')) { if (UI.pop && UI.pop.mode === 'edit') hidePop(); else if (!e.target.closest('#reading')) hidePop(); } });
window.addEventListener('scroll', () => { if (UI.pop && UI.pop.mode === 'edit') hidePop(); }, {passive: true});

/* ---------- header height ---------- */
const hdr = $('#hdr');
function setHdr() { const sticky = getComputedStyle(hdr).position === 'sticky'; document.documentElement.style.setProperty('--hdr', (sticky ? hdr.offsetHeight : 0) + 'px'); }
try { new ResizeObserver(setHdr).observe(hdr); } catch (e) {}
addEventListener('resize', setHdr);
setHdr();

/* ---------- boot ---------- */
(function boot() {
  const h = fromHash();
  if (h) S.cur = {t: h[0], p: h[1]};
  if (!DATA.find(x => x.id === S.cur.t)) S.cur = {t: DATA[0].id, p: 't1'};
  const fresh = !Object.keys(S.d).length;
  UI.active = part().qs[0].n;
  if (fresh) {
    // very first visit: task 1 opens with the coach's two words already marked, as a worked example
    const q = part().qs[0], toks = qTokens(q), k = [null, null];
    q.keys.forEach((w, j) => { const i = toks.indexOf(w); if (i >= 0) k[j] = {w, i}; });
    st().k[q.n] = k; save();
  }
  renderAll();
  if (fresh) toast('Пример: в задании 1 уже отмечены два слова — они подсвечены в тексте.');
})();
</script>
